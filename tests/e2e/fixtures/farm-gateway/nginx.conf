# The compose stack's farm gateway (#262) — `docs/SECURITY_MODEL.md` § 7.6's proxy, for one
# compose network.
#
# What it does is what that section requires of any proxy in front of `ouroboros-rest`, and
# nothing else:
#
#   * **terminates TLS** with the certificate 10-farm-certs.sh made, because the agent speaks
#     `https://` and `wss://` only;
#   * **asks for a client certificate and forwards it** in `X-Ouro-Client-Cert`, because a
#     proxy that terminates TLS has already consumed the runner's certificate, and unless it
#     passes one on, mTLS is decoration — `rest` refuses the agent with
#     `401 farm_client_certificate_required`, which is the refusal working;
#   * **strips that header from whatever arrives**, which `proxy_set_header` does by
#     construction: it *replaces* the inbound field, and with no certificate presented the
#     variable is empty and nginx passes no such header at all;
#   * **passes the WebSocket upgrade through** for the agent gateway, with an idle timeout that
#     outlasts the ten-second heartbeat by a wide margin.
#
# `optional_no_ca`, not `optional`: nginx is asked to prove the peer *holds the key* for the
# certificate it presents — which the handshake does — and not to judge who signed it. It
# cannot: a runner's certificate is signed by its **workspace's** farm CA, which
# `ouroboros-rest` makes the first time a workspace enrols a runner, long after this file was
# read. The judgement is `RunnerIdentityService`'s, in-process, against the right workspace's
# CA, its serial ledger and its revocations — the same code path a production deployment runs.
#
# Only the four paths a runner machine uses are proxied. The product UI and the rest of the API
# are not this listener's business, and a gateway that forwarded everything would be a second,
# TLS-fronted door onto a development stack for no reason.

worker_processes 1;

events {}

http {
  access_log off;

  # Docker's embedded DNS. With the upstream in a variable, nginx resolves `rest` when a request
  # arrives instead of once at start — so a `rest` container that is recreated, and comes back
  # at another address, is still reachable without restarting this one.
  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 443 ssl;
    server_name farm-gateway;

    ssl_certificate     /etc/farm-gateway/server.pem;
    ssl_certificate_key /etc/farm-gateway/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    ssl_verify_client optional_no_ca;

    set $rest http://rest:4000;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Ouro-Client-Cert $ssl_client_escaped_cert;

    # The Dockerfile's healthcheck: answered here, over this certificate.
    location = /healthz {
      return 200 "ok\n";
    }

    # The installer, with this deployment's address filled in by `rest`.
    location = /install.sh {
      proxy_pass $rest;
    }

    # The release's binaries and its SHA256SUMS.
    location /runner/ {
      proxy_pass $rest;
    }

    # The agent gateway (AH.3, #251). Exact match, so it wins over the prefix below.
    location = /api/v1/farm/agent {
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host              $host;
      proxy_set_header   X-Forwarded-Proto https;
      proxy_set_header   X-Ouro-Client-Cert $ssl_client_escaped_cert;
      proxy_read_timeout 120s;
      proxy_pass $rest;
    }

    # Enrolment and renewal (AH.2, #250).
    location /api/v1/farm/registrations {
      proxy_pass $rest;
    }

    # A build job's artifact upload (AT.2, #330): HTTPS beside the socket, never on it. Three
    # things differ from the routes above, and a real deployment's proxy needs the same three —
    # HOSTING.md says so. The body is the job's artifacts, so nginx's 1 MiB default would refuse
    # every real upload: the cap is the control plane's per-job cap (256 MiB by default) and a
    # little for the multipart framing. It is streamed to REST as it arrives rather than
    # buffered to disk first, which is what lets REST checksum it as it passes. And the answer
    # comes after the whole body is stored and parsed, so the read timeout is minutes.
    location ~ ^/api/v1/farm/jobs/[0-9a-f-]+/artifacts$ {
      client_max_body_size    300m;
      proxy_request_buffering off;
      proxy_read_timeout      900s;
      proxy_pass $rest;
    }

    location / {
      return 404;
    }
  }
}
