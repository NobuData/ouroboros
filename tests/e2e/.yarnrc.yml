# Yarn 4 configuration for the e2e suite (docs/CONVENTIONS.md § 3).
#
# This directory keeps its own configuration and its own lockfile for the same reason
# ouroboros-web does: it is not a workspace. It runs on its own pipeline — nightly and on
# demand, against a compose stack — and putting it in the root roster would put it in the
# task graph, where `yarn test` would then need Docker to pass.

# node_modules rather than Plug'n'Play, matching the root: Playwright resolves its browser
# runners and its TypeScript transform from a real node_modules tree.
nodeLinker: node-modules
