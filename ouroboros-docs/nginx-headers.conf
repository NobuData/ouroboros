# Security headers, on every answer (`always`, so errors carry them too). Included in each
# location rather than set on the server, because nginx drops a server's add_header lines
# from any location that adds one of its own — and every location here sets Cache-Control.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# The Content-Security-Policy, written at image build from the built pages by
# scripts/gen-csp.ts — it carries the theme script's hash, which only the build knows.
include /etc/nginx/ouroboros/csp.conf;
