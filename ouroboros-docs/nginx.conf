# The documentation site's server (DD.1, roadmap decision D8). The image copies this over
# nginx-unprivileged's /etc/nginx/conf.d/default.conf. It serves the static build Docusaurus
# writes into /usr/share/nginx/html, as the image's non-root user, on 8080.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects keep the path only: behind a proxy, this server's own host and port are not the
    # address a reader used.
    absolute_redirect off;
    server_tokens off;
    charset utf-8;

    # text/html is always compressed once gzip is on; these are the other text types the build has.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/xml image/svg+xml;

    # Docusaurus writes its own not-found page. It is served with status 404, never 200.
    error_page 404 /404.html;

    # Liveness, for the image's HEALTHCHECK and an orchestrator. It reads nothing from disk.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/ouroboros/headers.conf;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # Every file under /assets/ carries a content hash in its name, so a changed file is a new
    # URL and an old one can be kept forever.
    location /assets/ {
        include /etc/nginx/ouroboros/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/ouroboros/headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # The site's addresses have no trailing slash. /cli/ is sent to /cli rather than answered
    # from the directory cli/, which has no index.html and would be a 403.
    location ~ ^(?<slashless>/.+)/$ {
        include /etc/nginx/ouroboros/headers.conf;
        return 301 $slashless$is_args$args;
    }

    # Pages. With trailingSlash: false a page is <path>.html, and a section with sub-pages is
    # also a directory of the same name: /cli is cli.html and cli/ holds cli/runner.html. So
    # $uri.html is tried before $uri/ — the other order would match the directory, which has no
    # index.html, and answer 403. $uri/ still serves / itself from index.html. HTML is
    # revalidated on every visit, so a new deployment is seen at once.
    location / {
        include /etc/nginx/ouroboros/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
