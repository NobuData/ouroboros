# ouroboros-rest — the *internal* API specification: what `ouroboros-engine` may call.
#
# A second document rather than a second section of openapi.yaml, and the separation is the
# point. That one describes the browser's boundary: every path under `/api`, session-
# authenticated, CORS-configured, and the file `ouroboros-ui` generates its client from. This
# one describes the two paths a worker inside the network calls, authenticated by the #51
# shared secret and reachable from no browser at all. Merging them would put engine-facing
# operations into the UI's generated client — `docs/ARCHITECTURE.md` § 8's first invariant
# written as a hole rather than as a boundary.
#
# Edit this file, then run `yarn openapi` to re-render openapi.internal.json beside it.
# `yarn test` refuses a pair that has drifted apart, a version that disagrees with
# package.json, an internal route the application serves that this document does not
# describe, and one this document promises that the application does not serve
# (src/openapi/openapi.spec.ts).
#
# **It is not served.** openapi.yaml is published at /api/openapi.{json,yaml} because its
# reader is a client generator on somebody's laptop; this document's reader is AF.1 (#234),
# AF.2 (#235) and `ouroboros-engine`'s client stub, all of which read it out of the
# repository. A route publishing it would be one more path on a surface whose whole argument
# is that it has two.

openapi: 3.1.0

info:
  title: ouroboros-rest (internal)
  version: "0.37.2"
  summary: What ouroboros-engine may ask the control plane for — and what it is never given.
  description: |-
    The **engine-facing** surface of
    [Ouroboros](https://github.com/NobuData/ouroboros)' communications layer. Two
    operations, one caller, and one idea holding both of them together — roadmap decision
    **P3**, [#224](https://github.com/NobuData/ouroboros/issues/224):

    > **A worker never holds a provider credential.**

    Mockup 07's page subline promises something weaker — *"keys never leave the control
    plane — workers only ever see short-lived tokens"* — and this document is where the
    first clause is made literal and the second is **improved on**. There is no token. A
    fifteen-minute credential is still a credential: it genuinely reaches the worker,
    revocation is bounded only by its TTL, and the audit surface widens to every process
    that ever held one. It is also, for most LLM providers, fiction — almost none support
    deriving short-lived scoped keys, so such a token would in practice be a full API key
    with a timer bolted on by us.

    So the two operations divide the world:

    | Operation | For | Hands over |
    |---|---|---|
    | `POST /internal/llm/invoke` | every **cloud** provider | nothing — the control plane makes the call and streams back the answer |
    | `POST /internal/credentials/lease` | **local** providers only | an address, TTL-bounded and audited |

    The exception is narrow and is not a compromise. An engine worker calling an Ollama
    daemon on the same box gains nothing from proxying its traffic through this service,
    because there is no key on that path to protect — so it is told the address and nothing
    else, and a lease naming a cloud provider is a `403` by policy, enforced here rather
    than trusted to the caller.

    **What is built and what is specified.** The lease is implemented. The proxy is
    *specified* by this document and implemented by AF.2
    ([#235](https://github.com/NobuData/ouroboros/issues/235)); calling it today answers
    `501` with `code: "invocation_not_implemented"`, deliberately rather than `404`, so an
    executor being written against this contract can tell *the path is right and the other
    half is not built yet* from *I have the URL wrong*. The contract exists first because
    AF.1 ([#234](https://github.com/NobuData/ouroboros/issues/234)) has to choose an
    executor **against** it — a decision recorded afterwards is a description of whatever
    got built.

    **Authentication is the #51 pattern, in the other direction.** Every operation requires
    `X-Ouro-Internal-Key`, carrying `OURO_ENGINE_SHARED_SECRET` — the same header and the
    same variable `ouroboros-rest` sends when *it* calls the engine
    ([#51](https://github.com/NobuData/ouroboros/issues/51)). The comparison is constant
    time, a missing header takes the same path as a wrong one, and the rejection is one
    constant body: `401` with `code: "unauthenticated"` and nothing else. A session cookie
    is not accepted here, whoever it belongs to.

    **These paths are outside `/api`, and unversioned.** `/api` is the browser's boundary;
    the only caller of these two is deployed alongside this service and upgraded with it, so
    a version in the path would be one nobody could ever be on a different side of. That is
    the same argument `/health/live` and `ouroboros-engine`'s `/healthz` are written under.

    **Every error has the shape every other error in this system has** — `{code, message,
    details}`, `docs/ARCHITECTURE.md` § 5.3 — so a worker parses one envelope whether it
    was refused at the boundary or inside a handler.

    **The naming convention changes at this boundary, once.** This service writes
    `camelCase` in its contracts and `ouroboros-engine` writes `snake_case` in its own; each
    side translates in exactly one file — `src/modules/engine/engine.contract.ts` here,
    `ouroboros_engine/control_plane/contract.py` there — so no code on either side carries
    the other's spelling.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Ouroboros
    url: https://github.com/NobuData/ouroboros

servers:
  - url: http://localhost:4000
    description: |-
      `yarn dev`. In a deployment this is the address the engine resolves the control plane
      at — `http://rest:4000` inside the compose network — which is never the address a
      browser uses.

# Applied to every operation, and there is no `security: []` anywhere in this document.
# That is the difference between this surface and the public one: there, a handful of routes
# are deliberately open; here, an open route would be a worker endpoint reachable by anything
# that can route a packet to the port.
security:
  - ouroInternalKey: []

tags:
  - name: credentials
    description: |-
      **What a worker is given, and what it is not.**

      One operation, and its shape is the argument. A lease carries an address, a run, a
      workspace and two timestamps — there is no field for a secret, which is how *no secret
      is ever returned* is enforced by the type rather than by a test that inspects a payload
      and hopes it looked everywhere. A lint rule
      (`src/modules/internal/no-secret-responses.mjs`) refuses one added later.

      A lease is **not a bearer token.** Possessing one grants nothing that knowing the
      address would not, which is why nothing stores it and there is no way to revoke one.
      What the TTL bounds is how long a worker should keep believing the answer before asking
      again — real staleness, not theatrical security. Calling a fifteen-minute expiry on a
      hostname a security control is the kind of claim `docs/SECURITY_MODEL.md`
      ([#226](https://github.com/NobuData/ouroboros/issues/226)) exists to keep out of the
      product.

  - name: invocation
    description: |-
      **The proxy — specified here, implemented by AF.2
      ([#235](https://github.com/NobuData/ouroboros/issues/235)).**

      The worker sends the call it wants made and the run it is making it for; the control
      plane resolves the target, unwraps the credential inside one request scope, walks the
      resolved chain and streams back what the provider said. The key never crosses back.

      One choke point rather than a policy in every worker is what makes AB.1's
      ([#207](https://github.com/NobuData/ouroboros/issues/207)) semantics implementable at
      all: the per-hop error taxonomy, the floor that a chain may not degrade past, the
      per-run cost cap, and usage capture attributed to the hop that actually served the
      request. Each of those is a field or an event kind below, named here so that an
      executor which ignored one can be found to have ignored it.

  - name: runs
    description: |-
      **The run ingestion contract — AP.1
      ([#303](https://github.com/NobuData/ouroboros/issues/303)), decision **R2**.**

      One internal contract every executor reports through: stages, transcript events, file
      and commit reports, resource deltas. The simulated-run driver (AP.5,
      [#307](https://github.com/NobuData/ouroboros/issues/307)) calls it today and real
      execution (AR.1, [#315](https://github.com/NobuData/ouroboros/issues/315)) calls it
      tomorrow, and that is the point of it existing before either: the Run Console is
      end-to-end real from the start, and v2 changes who is calling and nothing else.

      **There is exactly one of these, deliberately.** DASH-J.3
      ([#91](https://github.com/NobuData/ouroboros/issues/91)) defined an engine→read-model
      ingestion bridge and left it unbuilt; its scope is delivered here. A second, richer
      bridge beside it would fork the read-model and leave two writers disagreeing about a
      run's state.

      **Three rules hold across all six operations.**

      1. **Every write is idempotency-keyed.** Replaying a key returns the original result —
         not an error, because an executor retries when it did not hear the answer and being
         told *"you already sent that"* leaves it where it was. The same *values*, field for
         field: the answer is stored as `jsonb`, which sorts an object's keys, so a replay's
         field order is PostgreSQL's rather than the first answer's. A key presented with a
         *different* body is refused with `idempotency_key_reused`.
      2. **The server owns the ordering.** Transcript entries carry the executor's own
         monotonic `hint`; the server assigns the authoritative dense `seq` and **refuses**
         a batch that does not continue the accepted order rather than silently reordering
         it. Renumbering a sequence the console pages by would change a transcript under a
         reader's cursor.
      3. **The workspace is resolved, never claimed.** No body carries an organization: a run
         resolves one from the ticket it is opened for, and every later report resolves one
         from the run. Likewise `simulated` — decision **R4**'s watermark follows the
         *principal*, which on this channel is the secret the caller presented, so there is
         no field in which it could be claimed or cleared.

  - name: controls
    description: |-
      **The control queue's executor half — AP.4
      ([#306](https://github.com/NobuData/ouroboros/issues/306)), decision **R6**.**

      *Pause loop*, *Abort run* and the steering box are rows on a durable queue, because the
      moment somebody needs *Abort* is the moment the executor is busy or wedged, which is when
      a synchronous call fails. An executor **fetches** what is pending for its run (the fetch is
      the delivery), applies it, and **acknowledges** each control with the effect it had.
      A control nobody acknowledges before its `expiresAt` is expired, and the console says so.

      **What each kind means, and every executor honours it:**

      * **`pause`**: stop at the next safe boundary (between tool calls, or between stages),
        never mid-write. Acknowledge once the loop has actually stopped.
      * **`resume`**: continue a paused loop from where it stopped.
      * **`abort`**: terminate the run and **preserve its branch**. Nothing is reverted or
        deleted. The acknowledgment closes the run as `canceled`.
      * **`steer`**: append `payload` to the **current attempt's** context and keep going.
        **Do not pause.** Acknowledge with the attempt it landed on (`attempt: 2` gives
        *"steering applied to attempt 2"*), so the person who typed it knows it reached the
        attempt they were watching. `remember` is for the knowledge pipeline, not the executor.

      Apply fetched controls in the order given, which is oldest first. Poll at the executor's
      own safe points: a fetch that finds nothing is cheap.

paths:
  /internal/credentials/lease:
    post:
      tags: [credentials]
      summary: Lease a local provider's address for one run
      description: |-
        Tell a worker where a **local** provider is, for the duration of one run.

        Three refusals, in this order, and the order is part of the contract:

        1. **`403 provider_not_leasable`** — the provider is one whose credentials never
           leave the control plane. Applied before anything is looked up, so no
           configuration and no state can produce a grant. `anthropic`, `copilot` and
           `cursor` are refused here; use `POST /internal/llm/invoke` instead.
        2. **`404 local_provider_not_configured`** — a leasable kind this deployment has not
           been told the address of. An absence, not a decision: an operator fixes it by
           setting `OURO_LOCAL_PROVIDER_URLS`. A worker should not retry.
        3. **`404 run_not_found`** — no such run, so there is nothing to scope the lease to.

        The workspace a grant is audited against is **resolved from the run**, never taken
        from the request: a worker naming its own workspace would be a worker choosing which
        one to be audited against. Every grant writes a `credential.lease_granted` event
        carrying the lease, the run, the workspace, the provider and the address — never
        secret material, because on this path there is none.

        `200` rather than `201`: nothing is created, nothing is stored, and there is no URL
        to `GET` afterwards.
      operationId: leaseLocalProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeaseRequest"
            example:
              provider: ollama
              run: 4d2a8b31-7c65-4e0a-9f38-1b6c2d5e7a94
      responses:
        "200":
          description: |-
            The lease. An address and nothing else — inspect the payload: there is no field
            in which a credential could arrive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lease"
              example:
                id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                provider: ollama
                run: 4d2a8b31-7c65-4e0a-9f38-1b6c2d5e7a94
                organizationId: aBcD1234eFgH5678iJkL9012mNoP3456
                baseUrl: http://localhost:11434
                grantedAt: 2026-08-22T18:04:11.000Z
                expiresAt: 2026-08-22T18:19:11.000Z
                ttlSeconds: 900
        "401":
          description: |-
            No `X-Ouro-Internal-Key`, or the wrong one. One constant body: `code:
            "unauthenticated"`, a bare message and empty `details`, whichever it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Unauthorized.
                details: {}
        "403":
          description: |-
            `provider_not_leasable` — a cloud provider's credentials never leave the control
            plane. This is policy, not state: no configuration makes it a `200`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: provider_not_leasable
                message: This provider is reached through the invocation proxy; its credentials never leave the control plane. Call POST /internal/llm/invoke instead.
                details:
                  provider: anthropic
        "404":
          description: |-
            `local_provider_not_configured` — this deployment declares no provider of that
            kind — or `run_not_found`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: local_provider_not_configured
                message: This deployment has no local provider of that kind. Set OURO_LOCAL_PROVIDER_URLS to declare one.
                details:
                  provider: openai_compatible
        "422":
          description: |-
            `validation_failed` — `provider` is not one of the five kinds, `run` is not a
            uuid, or the body carries a field this operation does not define. `details` has
            one entry per field refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: validation_failed
                message: The request body is not valid.
                details:
                  provider:
                    [
                      "provider must be one of the following values: ollama, openai_compatible, anthropic, copilot, cursor",
                    ]

  /internal/llm/invoke:
    post:
      tags: [invocation]
      summary: Ask the control plane to make a model call (specified — AF.2 implements it)
      description: |-
        Make a model call on the worker's behalf and stream the answer back.

        **Not implemented.** This operation is specified by AD.3
        ([#224](https://github.com/NobuData/ouroboros/issues/224)) and implemented by AF.2
        ([#235](https://github.com/NobuData/ouroboros/issues/235)); it answers `501
        invocation_not_implemented` today. The `200` below is the contract AF.2 is being
        built against, and it is described here rather than after the fact because AF.1
        ([#234](https://github.com/NobuData/ouroboros/issues/234)) has to choose between a
        custom executor and LiteLLM-as-executor *against a written contract*.

        **The target is `connection` or `alias`, exactly one.** A connection is a concrete
        provider connection and means *this provider and no other*. An alias means *whatever
        routing resolves it to*, which is an ordered chain with a floor and a cap — resolved
        by Z.1 ([#194](https://github.com/NobuData/ouroboros/issues/194)) **on this side** of
        the boundary, so that a worker cannot send a chain other than the one routing chose.

        **`payload` is opaque and passes through.** The adapters own the per-provider shape;
        this service brokers the call and does not read the prompt.

        **The answer is always a stream** — `application/x-ndjson`, one event per line — even
        when the provider did not stream. Two response shapes would be two code paths, and
        the non-streaming one would be the one that quietly stopped emitting usage. NDJSON
        rather than SSE because the reader is a worker process, not a browser: reconnection
        and event ids buy nothing here and cost a framing layer on both sides.

        **Every AB.1 ([#207](https://github.com/NobuData/ouroboros/issues/207)) semantic has
        a name in this contract** — `floorHopIndex`, `costCapCents`, the `usage` event, the
        `hop` event and the error codes with their per-hop rules. They are hooks: this
        document says what they mean, AF.1 decides how they are implemented, AF.2 implements
        them.
      operationId: invokeModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
            example:
              alias: reasoning-primary
              payload:
                messages:
                  - role: user
                    content: Summarise the failing test output.
                maxTokens: 1024
              runCtx:
                run: 4d2a8b31-7c65-4e0a-9f38-1b6c2d5e7a94
                stage: analyse
                floorHopIndex: 2
                costCapCents: 500
                resolutionVersion: r1
      responses:
        "200":
          description: |-
            The stream. One JSON object per line, terminated by a `done` or an `error` event.

            **Specified, not yet answered** — see the operation description and the `501`
            below.
          content:
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/InvokeEvent"
        "401":
          description: |-
            No `X-Ouro-Internal-Key`, or the wrong one. Checked before anything else, so an
            unauthenticated caller learns nothing about what this path will one day do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Unauthorized.
                details: {}
        "501":
          description: |-
            `invocation_not_implemented` — the contract is published and AF.2
            ([#235](https://github.com/NobuData/ouroboros/issues/235)) is what makes it
            answer. Deliberately not a `404`, which is what a caller with the wrong path
            gets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: invocation_not_implemented
                message: "The invocation proxy is specified and not yet implemented. It lands with AF.2 (issue #235); this route exists so the contract can be built against."
                details: {}

  /internal/runs:
    post:
      tags: [runs]
      summary: Open a run
      description: |-
        Open a run for a canonical ticket, pinned to one published workflow version.

        **The workspace comes from the ticket.** The body names a ticket source and a
        `external_key`; the ticket's own workspace is what everything else is validated
        against — the repository must belong to it, and the workflow version must be
        published in it. A worker naming its own workspace would be a worker choosing whose
        runs to open.

        **`loop_seq` is allocated by the database**, per workspace, under its own lock — the
        *Loop #1847* counter. It is in the answer because it is the number a person reads and
        the caller cannot compute.

        **`simulated` is in the answer and not in the request.** It follows the principal:
        a caller holding `OURO_RUN_SIMULATOR_SECRET` opens simulated runs and a caller
        holding `OURO_ENGINE_SHARED_SECRET` opens real ones. V046 freezes the flag once the
        run has written a transcript, so there is no later moment at which it could be
        corrected — which is why it can never be a claim.

        `201`, because this is the one operation on the surface that creates a resource with
        an identity.
      operationId: openRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenRunRequest"
            example:
              idempotencyKey: sim-482-open
              ticket:
                source: 8f14e45f-ceea-467a-9f0a-4a1c7c3b2d55
                externalKey: "#482"
              repository: 5eed0003-0000-4000-8000-000000000001
              workflow:
                tag: standard-fix
                version: 14
              model: claude-fable-5
              branchName: loop/482-canbus-flake
              mergeStrategy: squash
      responses:
        "201":
          description: The run, with the `loop_seq` the database allocated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunOpened"
              example:
                id: 5eed0009-0000-4000-8000-000000000482
                loopSeq: 1847
                organizationId: aBcD1234eFgH5678iJkL9012mNoP3456
                issueNumber: 482
                issueTitle: Fix flaky CAN-bus telemetry test
                workflowTag: standard-fix
                workflowVersionPin: 14
                branchName: loop/482-canbus-flake
                mergeStrategy: squash
                model: claude-fable-5
                simulated: true
                status: coding
                startedAt: 2026-09-22T14:25:01.000Z
        "401":
          description: |-
            No `X-Ouro-Internal-Key`, or a value matching neither principal. One constant
            body, whichever it was.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Unauthorized.
                details: {}
        "404":
          description: |-
            `ticket_not_found` — the canonical mirror holds no ticket with that key in that
            source — or `repository_not_found`, or `workflow_pin_not_found` when no such
            version is published in the ticket's workspace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: ticket_not_found
                message: No such ticket in that source. A run is opened for a ticket the intake has mirrored.
                details:
                  source: 8f14e45f-ceea-467a-9f0a-4a1c7c3b2d55
                  externalKey: "#482"
        "409":
          description: |-
            `ticket_ambiguous` — that key names more than one ticket in that source —
            `ticket_not_numbered` — the source's identifiers are not numbers and
            `runs.issue_number` is — `workflow_pin_unreadable`, or `idempotency_key_reused`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: idempotency_key_reused
                message: That idempotency key has already answered a different request. A key names one submission; use a fresh one, or re-send the submission it named.
                details:
                  operation: run.create
                  idempotencyKey: sim-482-open
        "422":
          description: |-
            `validation_failed` — a field is missing or the wrong shape, or the body carries
            one this operation does not define. `details` has one entry per field refused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: validation_failed
                message: The request body is not valid.
                details:
                  model: ["model must be shorter than or equal to 200 characters"]

  /internal/runs/{id}/stage-transitions:
    post:
      tags: [runs]
      summary: Move one stage attempt
      description: |-
        Move one attempt of one stage, validated against the AO.1 state machine and the
        pinned workflow's attempt limits.

        ```
             ┌────────────────────────────────── skipped
             │
        (absent) ─▶ pending ─▶ active ─▶ succeeded
             │          │         └────▶ failed
             └──────────┴─▶ active
        ```

        A move outside that machine is `stage_transition_invalid`, and `details` carries the
        stage, the attempt, where the row stands and where the request tried to take it —
        which is the whole of what an executor needs to tell *"I lost a response"* from *"I
        have a bug"*.

        **The label, the position and the limits come from the pin**, snapshotted onto the
        row. An attempt past `limits.max_retries + 1` is `attempt_limit_exceeded`; a stage
        the pinned document does not name is `stage_not_in_pin`.

        **There is no `note` field, and there cannot be one.** V045 makes `run_stages.note` a
        generated column over the attempt and the three `returnedFrom` columns, so the
        sentence *"attempt 1 failed tests — loop returned from gate ↺"* is **composed** by
        the database from the recorded transition. What this operation accepts is the
        transition; the note comes back in the answer.
      operationId: transitionRunStage
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StageTransitionRequest"
            example:
              idempotencyKey: sim-482-implement-2-start
              stageKey: implement
              status: active
              attempt: 2
              at: 2026-09-22T14:32:56.000Z
              returnedFrom:
                stageKey: checks-green
                kind: gate
                reason: failed_tests
      responses:
        "200":
          description: Where the stage stands afterwards, with the note the database composed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageTransition"
              example:
                runStageId: 5eed002a-0000-4000-8000-000000000004
                stageKey: implement
                stageLabel: Implement
                position: 4
                attempt: 2
                maxAttempts: 3
                tokenBudget: 400000
                status: active
                note: attempt 1 failed tests — loop returned from gate ↺
                startedAt: 2026-09-22T14:32:56.000Z
                finishedAt: null
                returnedFrom:
                  stageKey: checks-green
                  kind: gate
                  reason: failed_tests
        "401":
          description: No `X-Ouro-Internal-Key`, or a value matching neither principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Unauthorized.
                details: {}
        "404":
          description: |-
            `run_not_found`, or `workflow_pin_not_found` when the version this run pinned is
            no longer published — a run can still be *read* under a deleted workflow, because
            everything already written is a snapshot, but it cannot take a new one.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: run_not_found
                message: No such run. A report is made against the run it is about.
                details:
                  run: 5eed0009-0000-4000-8000-000000000999
        "409":
          description: |-
            `stage_transition_invalid` — the machine forbids the move — `attempt_limit_exceeded`,
            `stage_not_in_pin`, `stage_return_not_a_retry`, or `idempotency_key_reused`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: stage_transition_invalid
                message: A stage attempt cannot move from pending to succeeded.
                details:
                  stageKey: implement
                  attempt: 1
                  from: pending
                  to: succeeded
        "422":
          description: |-
            `validation_failed` — `id` is not a uuid, a field is the wrong shape, or the body
            carries one this operation does not define. Sending `note` lands here, by design.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: validation_failed
                message: The request body is not valid.
                details:
                  note: ["property note should not exist"]

  /internal/runs/{id}/events:
    post:
      tags: [runs]
      summary: Append a batch to the transcript
      description: |-
        Append typed transcript entries — decision **R3**'s flight recorder.

        **Ordering.** Every entry carries the executor's own monotonic `hint`. Within a batch
        they must strictly increase, and the first must exceed what the run has already
        accepted; otherwise the batch is refused with `events_out_of_order` carrying both
        numbers. Nothing is reordered and nothing is partially applied.

        **Sequencing is the server's.** `run_events.seq` is allocated densely by the store,
        which is what the console's `?after=` paging depends on, and it is returned as
        `firstSeq`/`lastSeq`. A caller-chosen sequence would have gaps wherever a cap refused
        an entry.

        **Caps.** A run's transcript is bounded in entries and in bytes. Past a cap an entry
        is refused **whole** — half an event is not an event — and the first refusal writes an
        elision marker that records every later one. `stored` is then lower than `submitted`
        and `elided` is `true`; once `true` it stays `true`, so a caller that sees it knows
        further posting is pointless rather than merely lossy.

        **`simulated` is not a field here either.** The store raises every entry's flag to the
        run's own, so a simulated run cannot write an unmarked line.
      operationId: appendRunEvents
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestEventsRequest"
            example:
              idempotencyKey: sim-482-batch-7
              events:
                - hint: 21
                  actor: gate
                  ts: 2026-09-22T14:32:48.000Z
                  stageKey: checks-green
                  attempt: 1
                  body: 2 of 3 required checks failed — returning to Implement
                - hint: 22
                  actor: model
                  ts: 2026-09-22T14:33:02.000Z
                  stageKey: implement
                  attempt: 2
                  modelId: claude-fable-5
                  body: The flake is a k_fifo ordering assumption in the ISR fast path.
      responses:
        "200":
          description: What the transcript did with the batch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsAppended"
              example:
                submitted: 2
                stored: 2
                firstSeq: 8
                lastSeq: 9
                hint: 22
                elided: false
        "401":
          description: No `X-Ouro-Internal-Key`, or a value matching neither principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Unauthorized.
                details: {}
        "404":
          description: "`run_not_found` — there is nothing to append to."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: run_not_found
                message: No such run. A report is made against the run it is about.
                details:
                  run: 5eed0009-0000-4000-8000-000000000999
        "409":
          description: |-
            `events_out_of_order` — this batch does not continue the accepted order — or
            `idempotency_key_reused`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: events_out_of_order
                message: "This run's transcript has accepted ordering hint 22, and this batch opens at 20. Batches are not reordered: re-send from the next hint."
                details:
                  accepted: 22
                  offered: 20
        "422":
          description: |-
            `validation_failed` — `id` is not a uuid, the batch is empty or too large, or an
            entry is the wrong shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: validation_failed
                message: The request body is not valid.
                details:
                  events: ["events must contain at least 1 elements"]

  /internal/runs/{id}/files:
    put:
      tags: [runs]
      summary: Report the change-set, and trigger the guardrails
      description: |-
        Report the run's change-set **as it stands**, and judge it.

        **A `PUT`, and the verb is the semantics.** The reported set replaces the stored one:
        a file's counts are its state against the run's base, not the delta since the last
        report, and a file the run reverted leaves the change-set rather than lingering at
        `+0 −0`. An ingestion path that added instead of replacing would produce counts that
        climb for ever.

        **Every report triggers guardrail evaluation** (AP.3,
        [#305](https://github.com/NobuData/ouroboros/issues/305)) and carries its own
        `changeSetSeq`, so re-evaluation history reads as a sequence rather than as a pile.
        A report naming **no files** is not a change-set: it allocates no number and
        schedules no checks, and `guardrailChecks` is `0`.

        The four checks — `allowed_paths`, `ci_config`, `secrets`, `review_required` — are
        judged against the run's pinned policy inside the report's own transaction, and the
        answer names the ones that failed. A failure sets `needsHuman`; it does **not** stop the
        stage or move the run's status — enforcement is AR.1
        ([#315](https://github.com/NobuData/ouroboros/issues/315)).

        **Send `hunks` to have the content scanned.** The secrets check reads each file's added
        hunk lines with the embedded ruleset (`v3`) and records a path, a line and a rule id —
        never the matched text. Hunks are read in memory and stored nowhere. A report whose
        files carry no hunks is judged `not_applicable` for secrets rather than clean.
      operationId: reportRunFiles
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportFilesRequest"
            example:
              idempotencyKey: sim-482-changeset-3
              files:
                - path: drivers/can/telemetry_buf.c
                  status: modified
                  additions: 38
                  deletions: 12
                  hunks:
                    - newStart: 40
                      lines:
                        - kind: ctx
                          text: "/* telemetry frame path */"
                        - kind: del
                          text: "static struct k_fifo tel_fifo;"
                        - kind: add
                          text: "K_MSGQ_DEFINE(tel_msgq, sizeof(struct tel_frame), 32, 4);"
                - path: tests/telemetry/test_frame_order.c
                  status: added
                  additions: 21
      responses:
        "200":
          description: The report's number, the change-set totals, and what judging it produced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeSet"
              example:
                changeSetSeq: 3
                files: 2
                additions: 59
                deletions: 12
                guardrailChecks: 4
                guardrailFailures: []
                needsHuman: false
        "401":
          description: No `X-Ouro-Internal-Key`, or a value matching neither principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Unauthorized.
                details: {}
        "404":
          description: "`run_not_found` — there is no change-set to replace."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: run_not_found
                message: No such run. A report is made against the run it is about.
                details:
                  run: 5eed0009-0000-4000-8000-000000000999
        "409":
          description: "`idempotency_key_reused` — that key has already answered a different report."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: idempotency_key_reused
                message: That idempotency key has already answered a different request. A key names one submission; use a fresh one, or re-send the submission it named.
                details:
                  operation: run.files
                  idempotencyKey: sim-482-changeset-3
        "422":
          description: |-
            `validation_failed` — `id` is not a uuid, a path is absolute or contains a `..`
            segment, or an entry is the wrong shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: validation_failed
                message: The request body is not valid.
                details:
                  files: ["path must be relative and must not contain a .. segment"]

  /internal/runs/{id}/commits:
    post:
      tags: [runs]
      summary: Append commits
      description: |-
        Append the commits a run has made, oldest first.

        **Sha-idempotent as well as key-idempotent**, and the two are different guarantees.
        The sha key makes a re-reported commit a no-op *whatever request it arrives in*; the
        idempotency key makes a re-sent request a no-op *whatever commits it names*. An
        executor reporting an overlapping range under a fresh key gets the first, and the
        answer says how much of its range was already known.

        **`committedAt` is git's clock and is required.** The gap between it and the moment
        the report landed is ingestion lag, and it is legible only because nothing defaults
        one to the other.
      operationId: reportRunCommits
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCommitsRequest"
            example:
              idempotencyKey: sim-482-commits-2
              commits:
                - sha: a41c9e2
                  message: "can: replace telemetry k_fifo with k_msgq + frame seq"
                  committedAt: 2026-09-22T14:30:12.000Z
                - sha: 7f03b8d
                  message: "can: assign frame seq in ISR before enqueue"
                  committedAt: 2026-09-22T14:34:47.000Z
      responses:
        "200":
          description: How many were new, how many were already recorded, and where the sequence stands.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommitsAppended"
              example:
                submitted: 2
                appended: 1
                duplicates: 1
                lastSeq: 2
        "401":
          description: No `X-Ouro-Internal-Key`, or a value matching neither principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Unauthorized.
                details: {}
        "404":
          description: "`run_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: run_not_found
                message: No such run. A report is made against the run it is about.
                details:
                  run: 5eed0009-0000-4000-8000-000000000999
        "409":
          description: "`idempotency_key_reused`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: idempotency_key_reused
                message: That idempotency key has already answered a different request. A key names one submission; use a fresh one, or re-send the submission it named.
                details:
                  operation: run.commits
                  idempotencyKey: sim-482-commits-2
        "422":
          description: |-
            `validation_failed` — `id` is not a uuid, a sha is not 7 to 40 lower-case hex
            characters, or a message is blank.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: validation_failed
                message: The request body is not valid.
                details:
                  commits: ["sha must be 7 to 40 lower-case hex characters"]

  /internal/runs/{id}/resources:
    post:
      tags: [runs]
      summary: Attribute spend, and take or release a build-farm reservation
      description: |-
        Report what a run has spent and what it holds — decision **R8**, which is explicit
        that the console computes from the systems that already own these numbers rather than
        from new counters.

        **Spend lands in `token_usage`**, attributed to the run and to the run's workspace, so
        mockup 10's Resources card and mockup 02's daily total are sums over the same rows.
        `costCents` is a **decimal string**, because `numeric(14,4)` does not round-trip
        through a double and a tenth of a cent lost per call is a bill that drifts. Omitting
        it is *unpriced* — decisions **M7** and **N10**'s count-only case — and a run whose
        every row is unpriced answers `costCents: null` rather than `"0"`.

        **The reservation has three states**, which is why `reservedBuildJob` is meaningful as
        `null`: a uuid takes a job, `null` releases the one held, and *absent* says nothing.
        Absent has to be the quiet case, because a run posts spend far more often than it
        changes which job it holds.

        Both halves are optional. A report carrying neither is a read of the run's totals,
        which costs nothing to answer.
      operationId: reportRunResources
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportResourcesRequest"
            example:
              idempotencyKey: sim-482-spend-5
              spend:
                provider: anthropic
                model: claude-fable-5
                tokensIn: 48120
                tokensOut: 9044
                costCents: "31.5000"
                taskKind: implement
                latencyMs: 8120
              reservedBuildJob: 5eed0008-0000-4000-8000-000000000483
      responses:
        "200":
          description: What the run has spent in total, and what it now holds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcesReported"
              example:
                tokensIn: 164000
                tokensOut: 48000
                costCents: "114.0000"
                unpricedEvents: 0
                reservedBuildJobId: 5eed0008-0000-4000-8000-000000000483
        "401":
          description: No `X-Ouro-Internal-Key`, or a value matching neither principal.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: unauthenticated
                message: Unauthorized.
                details: {}
        "404":
          description: |-
            `run_not_found`, or `build_job_not_found` when the job named is not one of the
            run's workspace — absent rather than forbidden, which is what V047's composite
            foreign key says too.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: build_job_not_found
                message: No such build job in this workspace. A run reserves a job of its own workspace.
                details:
                  buildJob: 5eed0008-0000-4000-8000-000000000999
        "409":
          description: "`idempotency_key_reused`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: idempotency_key_reused
                message: That idempotency key has already answered a different request. A key names one submission; use a fresh one, or re-send the submission it named.
                details:
                  operation: run.resources
                  idempotencyKey: sim-482-spend-5
        "422":
          description: |-
            `validation_failed` — `id` is not a uuid, `costCents` is not a non-negative
            decimal with at most four decimal places, or a field is the wrong shape.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: validation_failed
                message: The request body is not valid.
                details:
                  spend: ["costCents must be a non-negative decimal with at most four decimal places"]

  /internal/runs/{id}/controls/fetch:
    post:
      tags: [controls]
      summary: Claim a run's pending controls
      description: |-
        Hand over every control waiting for this run and mark each `delivered`. Claiming *is*
        delivery, which is why this is a `POST`: a `GET` that changed state would be a read a
        proxy could replay.

        Elapsed controls are expired first and never handed over. Two fetches for one run claim
        each control once. The steer text is included here and nowhere else on the executor's
        side.
      operationId: fetchRunControls
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: The claimed controls, oldest first. Empty when nothing was waiting.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ControlsFetched"
              example:
                controls:
                  - id: c0000000-0000-4000-8000-000000000001
                    kind: steer
                    payload: prefer a fix inside the ISR; do not touch the test timeouts
                    remember: false
                    requestedAt: "2026-09-22T14:04:40.000Z"
                    expiresAt: "2026-09-22T14:09:40.000Z"
        "401":
          description: "`unauthenticated` — no `X-Ouro-Internal-Key`, or a value matching neither principal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`run_not_found`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: "`validation_failed` — `id` is not a uuid."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "`internal_error` — the service itself failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /internal/runs/{id}/controls/{controlId}/ack:
    post:
      tags: [controls]
      summary: Acknowledge a control with the effect it had
      description: |-
        Say what was done with a delivered control. `effect` is recorded in the executor's own
        words; without it the kind's default sentence is recorded (`paused`, `resumed`,
        `aborted — branch preserved`, or `steering applied to attempt N` when `attempt` is
        given).

        **An acknowledged abort closes the run as `canceled`**, and leaves its branch alone.
        Nothing else here changes the run's status.

        **A control that is not `delivered` is a `409`**, with its state in `details.state`, so
        an executor can decide: `acked` is a lost response it can stop retrying, `expired` means
        it answered too late, and `pending` means it never fetched the control.
      operationId: ackRunControl
      parameters:
        - $ref: "#/components/parameters/RunId"
        - name: controlId
          in: path
          required: true
          description: "`run_controls.id`, as the fetch handed it over."
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AckControlRequest"
            example:
              attempt: 2
      responses:
        "200":
          description: The control, acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckedControl"
              example:
                id: c0000000-0000-4000-8000-000000000001
                runId: 5eed0009-0000-4000-8000-000000000482
                kind: steer
                state: acked
                requestedBy: 5eed0001-0000-4000-8000-00000000000a
                requestedAt: "2026-09-22T14:04:40.000Z"
                deliveredAt: "2026-09-22T14:04:43.000Z"
                ackedAt: "2026-09-22T14:04:51.000Z"
                expiresAt: "2026-09-22T14:09:40.000Z"
                detail: steering applied to attempt 2
                hasPayload: true
                remember: false
        "401":
          description: "`unauthenticated` — no `X-Ouro-Internal-Key`, or a value matching neither principal."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "`run_not_found`, or `control_not_found` when the control is not this run's."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: control_not_found
                message: No such control on this run.
                details:
                  runId: 5eed0009-0000-4000-8000-000000000482
                  controlId: c0000000-0000-4000-8000-000000000999
        "409":
          description: "`control_not_delivered` — the control is not waiting for an acknowledgment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: control_not_delivered
                message: This control is expired, so there is nothing to acknowledge.
                details:
                  controlId: c0000000-0000-4000-8000-000000000001
                  state: expired
        "422":
          description: |-
            `validation_failed` — an id is not a uuid, `effect` is blank, padded or longer than
            1024 characters, or `attempt` is not a whole number from 1.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: "`internal_error` — the service itself failed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  parameters:
    RunId:
      name: id
      in: path
      required: true
      description: |-
        The run every report but the first is addressed to — `runs.id`.

        Validated as a uuid by the same pipe that validates the body, so a malformed one is
        `422 validation_failed` rather than a `400`: an executor should not have to branch on
        two statuses for *"your request is the wrong shape"*.
      schema:
        type: string
        format: uuid
      example: 5eed0009-0000-4000-8000-000000000482

  securitySchemes:
    ouroInternalKey:
      type: apiKey
      in: header
      name: X-Ouro-Internal-Key
      description: |-
        The shared secret both sides read from `OURO_ENGINE_SHARED_SECRET`
        ([#51](https://github.com/NobuData/ouroboros/issues/51)). It is a **deployment**
        credential, not a caller's: it says *this request came from inside*, and says nothing
        about who or what sent it. Compared in constant time; a missing header and a wrong
        one are the same answer.

        The same header `ouroboros-rest` sends when it calls `ouroboros-engine`, so a stack
        where the two values disagree fails in both directions at once — which is the failure
        an operator can actually find.

  schemas:
    Error:
      type: object
      title: Error
      description: |-
        The body of **every** error on this surface — the same shape the public API and
        `ouroboros-engine` answer with (`docs/ARCHITECTURE.md` § 5.3), so a worker parses one
        envelope whether it was refused at the boundary or inside a handler.
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: Stable, machine-readable, and the thing to branch on.
          examples:
            [
              unauthenticated,
              provider_not_leasable,
              local_provider_not_configured,
              run_not_found,
              invocation_not_implemented,
              validation_failed,
            ]
        message:
          type: string
          description: |-
            Written for a person. It never names anything about the service's own internals,
            and a rejection at the boundary is one constant sentence whatever earned it.
          examples: [Unauthorized.]
        details:
          type: object
          description: |-
            Whatever is specific to this failure — the provider that was refused, the run that
            was not found, the field messages of a `422`. Always present, empty rather than
            absent, so a client reading `details.provider` never has to check `details` first.
          additionalProperties: true
          examples:
            - provider: anthropic
            - {}

    ProviderKind:
      type: string
      title: ProviderKind
      description: |-
        A provider kind — AC.1's ([#216](https://github.com/NobuData/ouroboros/issues/216))
        registry keys, spelled as `ouroboros-db` writes them in
        `model_prices.match_provider_kind`.

        `ollama` and `openai_compatible` are **leasable**: both are reached without a
        credential, which is what makes an address worth handing over. The other three are
        **proxied**: there is nothing useful to lease, because the part that matters is the
        key.

        `openai_compatible` is leasable with a caveat worth reading, because the same adapter
        fronts a vLLM on somebody's own GPU **and** `api.openai.com`. Nothing at the level of
        a kind can tell those apart — local-ness is a property of the *connection* — so a
        lease for it still fails unless the deployment has declared where that provider is.
        The operator's declaration is the connection-level statement, made once at deployment
        level until Y.1 ([#189](https://github.com/NobuData/ouroboros/issues/189)) makes it a
        row.
      enum: [ollama, openai_compatible, anthropic, copilot, cursor]

    LeaseRequest:
      type: object
      title: LeaseRequest
      description: |-
        What a worker asks for: a provider kind, and the run it is working on.

        A *kind* rather than a connection id, because there are no connections yet — Y.1
        ([#189](https://github.com/NobuData/ouroboros/issues/189)) brings them. Cloud kinds
        are accepted **by the validator** and refused by the policy with `403`, deliberately:
        a `422` would say *there is no such provider* about a provider the product supports.
      additionalProperties: false
      required: [provider, run]
      properties:
        provider:
          $ref: "#/components/schemas/ProviderKind"
        run:
          type: string
          format: uuid
          description: |-
            The run this work belongs to — `runs.id`. What *scoped* means: the workspace the
            grant is audited against is resolved from it.
          example: 4d2a8b31-7c65-4e0a-9f38-1b6c2d5e7a94

    Lease:
      type: object
      title: Lease
      description: |-
        A granted lease. **Every field is an identifier, an address or a timestamp** — there
        is nowhere for a secret to be, which is the acceptance criterion *no secret, verified
        by payload inspection* expressed as a shape rather than as a test.

        `baseUrl` and no `host`: publishing both would be publishing one fact twice, in two
        spellings that can disagree, where the lossier one is the one a client would have to
        reassemble a URL from.
      additionalProperties: false
      required: [id, provider, run, organizationId, baseUrl, grantedAt, expiresAt, ttlSeconds]
      properties:
        id:
          type: string
          format: uuid
          description: This grant's id — the same value the `credential.lease_granted` event carries.
        provider:
          $ref: "#/components/schemas/ProviderKind"
        run:
          type: string
          format: uuid
          description: The run it is scoped to, echoed so an answer can be matched to its request.
        organizationId:
          type: string
          description: |-
            The workspace that run belongs to, resolved rather than supplied. Published
            because the worker has to attribute what it does next — usage, telemetry — to the
            same workspace this grant was audited against.
        baseUrl:
          type: string
          format: uri
          description: Where the provider is. The whole of what is handed over.
          example: http://localhost:11434
        grantedAt:
          type: string
          format: date-time
          description: When the grant happened.
        expiresAt:
          type: string
          format: date-time
          description: When the worker should ask again.
        ttlSeconds:
          type: integer
          description: |-
            How long that is — 900. It bounds **staleness**, not exposure: a lease carries no
            secret, so there is nothing an expiry could revoke.
          example: 900

    RunContext:
      type: object
      title: RunContext
      description: |-
        The run a call is made for — *per-run scoping*, as a shape. Everything about a call
        that is not the call: whose work it is, where it sits in a chain, and the two limits
        that may stop it.

        The worker supplies what it knows; the control plane is the authority on the rest. A
        cap a worker sent that is looser than the workspace's is not the cap that applies.
      additionalProperties: false
      required: [run]
      properties:
        run:
          type: string
          format: uuid
          description: |-
            The run — `runs.id`. Required: a call that belongs to no run cannot be
            attributed.
        hop:
          type: integer
          minimum: 0
          description: |-
            Which hop of the resolved chain this is, zero-based. Normally absent: walking the
            chain is the control plane's job, not the worker's.
        stage:
          type: string
          description: |-
            The workflow stage — `runs.stage_label`. Telemetry rather than policy: AB.2
            ([#208](https://github.com/NobuData/ouroboros/issues/208)) is what makes *which
            stage was running* the thing that renders a spike legible.
        floorHopIndex:
          type: integer
          minimum: 0
          description: |-
            The hop index below which the chain may not degrade — AB.1's floor, and mockup
            06's *"never silently below the floor you set"*. Exhausting the chain down to it
            fails the run with `floor_exhausted` rather than using a hop beneath it.
        costCapCents:
          type: integer
          minimum: 0
          description: |-
            The per-run spend ceiling, in cents. Checked pre-flight **and** while running: a
            single streamed response can cross a cap it was under when it started.
        resolutionVersion:
          type: string
          description: |-
            Which resolution this call was planned against — Z.1's `resolution_version`. It
            crosses the boundary so that a call planned under one resolution and executed
            after a rebind is recognisable as such.
        vote:
          type: boolean
          description: |-
            Is this a vote rather than the primary call? `add_vote` escalation is a real
            invocation with its own usage, and marking it is what keeps a vote's tokens from
            inflating what the primary call cost.

    InvokeRequest:
      type: object
      title: InvokeRequest
      description: |-
        What the worker is asking the control plane to do. Exactly one of `connection` or
        `alias`; the credential is not among the fields, because the worker does not have one.
      additionalProperties: false
      required: [payload, runCtx]
      properties:
        connection:
          type: string
          format: uuid
          description: |-
            A concrete provider connection — `provider_connections.id` (Y.1). *This provider*:
            no chain, no fallback, no floor.
        alias:
          type: string
          description: |-
            A routing alias — `model_aliases.alias` (Y.1). *Whatever routing resolves this
            to*, which is an ordered chain with a floor and a cap.
        payload:
          type: object
          description: |-
            The model call itself, in the adapter's own vocabulary. Opaque: nothing in this
            service reads it, which is also why nothing in this service can log it.
          additionalProperties: true
        runCtx:
          $ref: "#/components/schemas/RunContext"
      oneOf:
        - required: [connection]
        - required: [alias]

    InvokeEvent:
      title: InvokeEvent
      description: |-
        One line of the streamed answer. Five kinds, and between them they carry everything
        AB.1 requires an executor to report: what the model said, what it cost, what each hop
        did, and how it ended.

        A stream ends with exactly one terminal event — `done` or `error`.
      oneOf:
        - $ref: "#/components/schemas/InvokeDeltaEvent"
        - $ref: "#/components/schemas/InvokeUsageEvent"
        - $ref: "#/components/schemas/InvokeHopEvent"
        - $ref: "#/components/schemas/InvokeErrorEvent"
        - $ref: "#/components/schemas/InvokeDoneEvent"
      discriminator:
        propertyName: kind

    InvokeErrorCode:
      type: string
      title: InvokeErrorCode
      description: |-
        The per-hop error taxonomy — AB.1's rules, named, with the behaviour each one implies.
        #235's first acceptance criterion is that an executor's failover matches *what
        routing's explanation promised the user*, so the mapping lives in the contract both
        sides read rather than inside whichever module walks the chain.

        | Code | What it is | What the executor does |
        |---|---|---|
        | `provider_unavailable` | 5xx or a timeout | advances to the next hop |
        | `provider_rate_limited` | 429 or a provider throttle | backs off, then advances |
        | `provider_auth_failed` | the credential was refused | does **not** retry; marks the provider in error |
        | `request_invalid` | a 4xx that is not auth | aborts — the next hop would refuse it too |
        | `floor_exhausted` | the chain reached its floor | aborts with the floor reason |
        | `cost_cap_exceeded` | the run's cap is spent | aborts, naming the cap |
        | `chain_exhausted` | every hop failed, no floor to stop at | aborts |
      enum:
        - provider_unavailable
        - provider_rate_limited
        - provider_auth_failed
        - request_invalid
        - floor_exhausted
        - cost_cap_exceeded
        - chain_exhausted

    InvokeDeltaEvent:
      type: object
      title: InvokeDeltaEvent
      description: A streamed fragment of the model's answer.
      additionalProperties: false
      required: [kind, hop, text]
      properties:
        kind:
          const: delta
        hop:
          type: integer
          minimum: 0
          description: Which hop produced it — a chain that failed over says so in the stream.
        text:
          type: string
          description: The fragment, exactly as the provider sent it.

    InvokeUsageEvent:
      type: object
      title: InvokeUsageEvent
      description: |-
        What one hop cost — the row `token_usage`
        ([#66](https://github.com/NobuData/ouroboros/issues/66)) gets. Emitted **per hop**,
        including a hop that failed partway, attributed to the model and provider that
        actually served it: a fallback hop's tokens attributed to the primary is every spend
        number in the product subtly wrong in a way nobody notices for months.
      additionalProperties: false
      required: [kind, hop, connection, model, inputTokens, outputTokens, costCents]
      properties:
        kind:
          const: usage
        hop:
          type: integer
          minimum: 0
        connection:
          type: string
          format: uuid
          description: The provider connection that served it.
        model:
          type: string
          description: The model as the provider names it.
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        costCents:
          type: [number, "null"]
          description: |-
            What it cost, or `null` when nothing prices it. `null` rather than `0` — the
            honesty rule CH.3 ([#586](https://github.com/NobuData/ouroboros/issues/586))
            already enforces: a local model's tokens are *unpriced*, which is a different
            statement from *free*, and a zero here is spend nobody incurred appearing in an
            aggregate.

    InvokeHopEvent:
      type: object
      title: InvokeHopEvent
      description: |-
        A hop finished, one way or another — the telemetry AB.2
        ([#208](https://github.com/NobuData/ouroboros/issues/208)) aggregates. Emitted for
        every hop *attempted*, so a chain that failed over twice produces three of them and a
        reader can see the failover the routing explanation promised.
      additionalProperties: false
      required: [kind, hop, connection, outcome, latencyMs]
      properties:
        kind:
          const: hop
        hop:
          type: integer
          minimum: 0
        connection:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [ok, failed_over, aborted]
        code:
          $ref: "#/components/schemas/InvokeErrorCode"
        latencyMs:
          type: integer
          minimum: 0
          description: How long the attempt took — AB.2's latency input.

    InvokeErrorEvent:
      type: object
      title: InvokeErrorEvent
      description: The invocation failed. Terminal — no further events follow.
      additionalProperties: false
      required: [kind, code, message]
      properties:
        kind:
          const: error
        hop:
          type: integer
          minimum: 0
          description: Which hop was in flight, when one was.
        code:
          $ref: "#/components/schemas/InvokeErrorCode"
        message:
          type: string
          description: |-
            A sentence for a person. Never a provider's own error text: those are not this
            API's contract and have carried tokens before now.

    InvokeDoneEvent:
      type: object
      title: InvokeDoneEvent
      description: The invocation completed. Terminal — no further events follow.
      additionalProperties: false
      required: [kind, hop, finishReason]
      properties:
        kind:
          const: done
        hop:
          type: integer
          minimum: 0
          description: Which hop served the answer — the one the run should be attributed to.
        finishReason:
          type: string
          description: Why generation stopped, in the provider's own vocabulary.
          examples: [stop, length, tool_use]

    IdempotencyKey:
      type: string
      title: IdempotencyKey
      description: |-
        The caller's name for one submission.

        Required on every write this surface publishes, unlike a run control's, which the
        database defaults: a control may legitimately be a one-off somebody pressed, and an
        executor's report is always a thing that can be redelivered. A report that arrived
        without a name is one nothing can recognise on its second delivery.
      minLength: 1
      maxLength: 128
      pattern: "^\\S(.*\\S)?$"
      examples: [sim-482-open, 018f2b1c-6c4a-7b3e-9d21-4f0a5e6c7b88]

    RunStageStatus:
      type: string
      title: RunStageStatus
      description: |-
        Where one attempt at one stage is — `run_stages.status` (V045).

        Three of the five are the stepper's node treatments: `pending` is ○, `active` is ●,
        `succeeded` is ✓. `failed` and `skipped` are the two it does not draw.
      enum: [pending, active, succeeded, failed, skipped]

    RunStageReturnKind:
      type: string
      title: RunStageReturnKind
      description: |-
        What kind of node a loop edge left from, in the DSL's vocabulary with `flow` resolved
        into `gate` and `decision` (§4.4) — the word a return note prints.
      enum: [trigger, llm, infra, gate, decision, term]

    RunStageReturnReason:
      type: string
      title: RunStageReturnReason
      description: |-
        How the previous attempt ended — `run_stages.return_reason` (V045).

        Closed, and closed for a reason a widening has to respect: the generated `note`
        column maps each word to a phrase, and a word with no phrase would compose a sentence
        with a hole in it.
      enum:
        [failed_tests, failed_build, failed_checks, failed_review, gate_rejected, budget_exhausted, timed_out, errored]

    RunEventActor:
      type: string
      title: RunEventActor
      description: |-
        Who is speaking in one transcript entry — the chip mockup 10 draws (V046, decision
        **R3**).
      enum: [plan, tool, model, gate, user, system]

    RunFileStatus:
      type: string
      title: RunFileStatus
      description: |-
        What happened to one file of a change-set — git's own four words (V047).

        An `added` file removes nothing and a `deleted` one adds nothing; the database refuses
        the other combinations.
      enum: [added, modified, deleted, renamed]

    RunMergeStrategy:
      type: string
      title: RunMergeStrategy
      description: |-
        How the pinned terminal merges — the Changes card's *will squash on merge* tag. The
        method, not the switch: the DSL spells the switch `auto-squash` and the *auto* is the
        node.
      enum: [squash, merge, rebase]

    TicketReference:
      type: object
      title: TicketReference
      description: |-
        Which canonical ticket a run is opened for — and, by resolution, which workspace.

        Named by **source and display key** rather than by row id, which is the linkage AP.1
        specifies. `external_key` is deliberately not unique across sources (V030: *"two
        sources may hold the same key, and the acceptance criterion requires it"*), so the
        pair is what identifies one; a key matching twice inside one source is
        `ticket_ambiguous` rather than a row picked by sorting.
      additionalProperties: false
      required: [source, externalKey]
      properties:
        source:
          type: string
          format: uuid
          description: "`ticket_sources.id` — and the row the run's workspace is resolved from."
        externalKey:
          type: string
          minLength: 1
          maxLength: 128
          description: "`tickets.external_key` — the display form: `#482`, `PROJ-142`, `ENG-123`."

    WorkflowPin:
      type: object
      title: WorkflowPin
      description: |-
        Which workflow version a run pins — the `standard-fix v14` of the console's head,
        composed from the two halves rather than stored as a string.

        A **snapshot**, on V008's decision **F8**: the workflow can be republished, renamed or
        deleted, and a closed run must still answer for what it actually ran under.
      additionalProperties: false
      required: [tag, version]
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 64
          description: "`workflows.slug`."
        version:
          type: integer
          minimum: 1
          maximum: 1000000
          description: |-
            `workflow_versions.version`. Required: every stage fact this contract later
            derives — the label, the position, the attempt limit, the token budget — comes
            from this document.

    OpenRunRequest:
      type: object
      title: OpenRunRequest
      description: |-
        What opening a run takes.

        No `organizationId` — the workspace is the ticket's — and no `simulated`, which
        follows the principal. Both absences are the contract rather than an oversight.
      additionalProperties: false
      required: [idempotencyKey, ticket, repository, workflow, model]
      properties:
        idempotencyKey:
          $ref: "#/components/schemas/IdempotencyKey"
        ticket:
          $ref: "#/components/schemas/TicketReference"
        repository:
          type: string
          format: uuid
          description: |-
            `github_repos.id` — the repository the branch lives in. Validated against the
            ticket's workspace, so a mistyped id is `repository_not_found` rather than a run
            attached to somebody else's repository.
        workflow:
          $ref: "#/components/schemas/WorkflowPin"
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: "`runs.model` — what mockup 02's row renders."
        branchName:
          type: string
          maxLength: 255
          pattern: "^\\S(.*\\S)?$"
          description: The branch the loop works on. Absent until the run has one.
        mergeStrategy:
          $ref: "#/components/schemas/RunMergeStrategy"

    RunOpened:
      type: object
      title: RunOpened
      description: The run that was opened.
      additionalProperties: false
      required:
        [id, loopSeq, organizationId, issueNumber, issueTitle, workflowTag, workflowVersionPin, branchName, mergeStrategy, model, simulated, status, startedAt]
      properties:
        id:
          type: string
          format: uuid
          description: "`runs.id`, which every later report is addressed to."
        loopSeq:
          type: integer
          minimum: 1
          description: |-
            The *Loop #1847* counter — allocated by the database, per workspace, under its own
            lock. In the answer because it is the number a person reads and the caller cannot
            compute.
        organizationId:
          type: string
          description: |-
            The workspace the run belongs to, resolved from the ticket. Published because the
            caller has to attribute what it does next to the same one, and deriving it a
            second way would be two answers to one question.
        issueNumber:
          type: integer
          minimum: 1
          description: "`runs.issue_number`, from the ticket's own identifier."
        issueTitle:
          type: string
          description: "`runs.issue_title`, frozen at the moment the run opened."
        workflowTag:
          type: string
        workflowVersionPin:
          type: integer
          minimum: 1
        branchName:
          type: [string, "null"]
        mergeStrategy:
          oneOf:
            - $ref: "#/components/schemas/RunMergeStrategy"
            - type: "null"
        model:
          type: string
        simulated:
          type: boolean
          description: |-
            Decision **R4**'s watermark. Echoed **because the caller did not send it**: it
            follows the principal, so this is the service telling a simulator that its run is
            marked as one — and telling an executor that its run is not.
        status:
          type: string
          description: "`runs.status` at creation — `coding`, the first of V008's six."
        startedAt:
          type: string
          format: date-time

    StageReturn:
      type: object
      title: StageReturn
      description: |-
        Where a loop edge brought a run back from — the three facts V045 composes a note out
        of.

        All three or none, which is why they are one object rather than three optional fields:
        two of the three would be a shape the contract publishes and the database refuses.
      additionalProperties: false
      required: [stageKey, kind, reason]
      properties:
        stageKey:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: The DSL node id the loop edge left from — `checks-green`.
        kind:
          $ref: "#/components/schemas/RunStageReturnKind"
        reason:
          $ref: "#/components/schemas/RunStageReturnReason"

    StageTransitionRequest:
      type: object
      title: StageTransitionRequest
      description: |-
        One move of one stage attempt.

        **No `note`.** The sentence is composed by the database from `returnedFrom` and the
        attempt; sending one is `422`, because the column is `GENERATED ALWAYS … STORED` and
        PostgreSQL refuses any statement that supplies a value.
      additionalProperties: false
      required: [idempotencyKey, stageKey, status]
      properties:
        idempotencyKey:
          $ref: "#/components/schemas/IdempotencyKey"
        stageKey:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
          description: The DSL node id, resolved against the run's pin for its label, position and limits.
        status:
          $ref: "#/components/schemas/RunStageStatus"
        attempt:
          type: integer
          minimum: 1
          maximum: 11
          description: |-
            The `2` of *attempt 2/3*. Absent means *the attempt that exists* — 1 for a stage
            with no rows, the highest one otherwise — so a retry is the one case a caller has
            to name.
        at:
          type: string
          format: date-time
          description: |-
            When it happened, by the executor's clock. The server's `now()` when absent; sent
            because a stepper whose durations were measured from when the report *arrived*
            would attribute network time to the stage.
        returnedFrom:
          $ref: "#/components/schemas/StageReturn"

    StageTransition:
      type: object
      title: StageTransition
      description: Where the stage stands after the transition.
      additionalProperties: false
      required:
        [runStageId, stageKey, stageLabel, position, attempt, maxAttempts, tokenBudget, status, note, startedAt, finishedAt, returnedFrom]
      properties:
        runStageId:
          type: string
          format: uuid
        stageKey:
          type: string
        stageLabel:
          type: string
          description: The node's title as the pin had it — a snapshot, not a live read.
        position:
          type: integer
          minimum: 1
        attempt:
          type: integer
          minimum: 1
        maxAttempts:
          type: [integer, "null"]
          description: The `3` of *attempt 2/3*, or `null` for a stage type carrying no limits.
        tokenBudget:
          type: [integer, "null"]
        status:
          $ref: "#/components/schemas/RunStageStatus"
        note:
          type: [string, "null"]
          description: |-
            The stepper's warn note, read back from the generated column — so a caller can see
            what the database wrote and nothing on the service's side ever writes a sentence.
        startedAt:
          type: [string, "null"]
          format: date-time
        finishedAt:
          type: [string, "null"]
          format: date-time
        returnedFrom:
          oneOf:
            - $ref: "#/components/schemas/StageReturn"
            - type: "null"

    IngestEvent:
      type: object
      title: IngestEvent
      description: |-
        One transcript entry, as an executor reports it.

        No `seq` and no `simulated`: the store allocates the first densely and raises the
        second to the run's own.
      additionalProperties: false
      required: [hint, actor]
      properties:
        hint:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: |-
            The executor's own ordering number. Monotonic within a run, strictly increasing
            within a batch, checked and **not adopted**.
        actor:
          $ref: "#/components/schemas/RunEventActor"
        ts:
          type: string
          format: date-time
        stageKey:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$"
        attempt:
          type: integer
          minimum: 1
          maximum: 11
        toolTag:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]([a-z0-9_]*[a-z0-9])?$"
          description: The tool, for a `tool` entry. The store refuses it on any other actor.
        modelId:
          type: string
          maxLength: 200
          description: |-
            Which model said it. Required on a `model` entry, together with a stage and an
            attempt — decision **R4**: the transcript never carries model output without its
            provenance.
        body:
          type: string
          minLength: 1
          maxLength: 20000
        payload:
          type: object
          additionalProperties: true
          description: |-
            The structure — diff hunks, a progress fraction, a tool result. Left open here and
            constrained by the store, which types a `hunks` key to `{kind, text}` with `kind`
            in `ctx | del | add` and says nothing about the rest. An entry must carry a `body`
            or a `payload`; an entry that said nothing would be a line with nothing on it.

    IngestEventsRequest:
      type: object
      title: IngestEventsRequest
      description: One batch of transcript entries, in the executor's own order.
      additionalProperties: false
      required: [idempotencyKey, events]
      properties:
        idempotencyKey:
          $ref: "#/components/schemas/IdempotencyKey"
        events:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/IngestEvent"

    EventsAppended:
      type: object
      title: EventsAppended
      description: |-
        What the transcript did with the batch — counts and sequence numbers, never the
        entries back. The caller sent those; what it cannot know is what the store allocated.
      additionalProperties: false
      required: [submitted, stored, firstSeq, lastSeq, hint, elided]
      properties:
        submitted:
          type: integer
          minimum: 1
        stored:
          type: integer
          minimum: 0
          description: |-
            Lower than `submitted` when a cap refused some. An entry is refused **whole**, so
            this is a count of entries and never of bytes.
        firstSeq:
          type: [integer, "null"]
          description: The first dense `seq` allocated, or `null` when nothing was stored.
        lastSeq:
          type: [integer, "null"]
        hint:
          type: integer
          minimum: 0
          description: The ordering hint this run now stands at.
        elided:
          type: boolean
          description: |-
            Whether a cap has elided this transcript. Terminal: once a cap has refused an
            entry it refuses every later one, so `true` means further posting is pointless
            rather than merely lossy.

    IngestFile:
      type: object
      title: IngestFile
      description: |-
        One file of a change-set, as it stands **against the run's base** — not the delta
        since the last report.
      additionalProperties: false
      required: [path, status]
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 1024
          description: |-
            Relative to the repository root, with no `..` segment — the allowed-paths guardrail
            matches globs against this value, and a path that could climb out of the tree is a
            path a glob cannot reason about.
        status:
          $ref: "#/components/schemas/RunFileStatus"
        additions:
          type: integer
          minimum: 0
          maximum: 10000000
          description: Lines added against the base. 0 when absent, which is what a `deleted` file must have.
        deletions:
          type: integer
          minimum: 0
          maximum: 10000000
        hunks:
          type: array
          maxItems: 200
          description: |-
            The file's diff against the run's base, as hunks — what the secrets guardrail scans
            (AP.3, [#305](https://github.com/NobuData/ouroboros/issues/305)). Only `add` lines
            are scanned. Read in memory and stored nowhere. Optional: a file without hunks is
            not scanned, and a report with none at all is `not_applicable` for secrets.
          items:
            $ref: "#/components/schemas/IngestHunk"

    IngestHunk:
      type: object
      title: IngestHunk
      description: One hunk of a file's diff — `@@ -a,b +newStart,d @@` and its lines.
      additionalProperties: false
      required: [newStart, lines]
      properties:
        newStart:
          type: integer
          minimum: 0
          maximum: 100000000
          description: |-
            The new-file line the hunk's first line sits at. `ctx` and `add` lines advance it and
            `del` lines do not, so a finding's `line` is the line an editor opens at. `0` is git's
            value for a deleted file's hunk.
        lines:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/IngestHunkLine"

    IngestHunkLine:
      type: object
      title: IngestHunkLine
      description: One diff line, in the transcript's three kinds.
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          enum: [ctx, del, add]
        text:
          type: string
          maxLength: 20000
          description: The line without its diff marker. May be empty.

    ReportFilesRequest:
      type: object
      title: ReportFilesRequest
      description: |-
        The **whole** change-set, not the delta. An empty list means the run has changed
        nothing, and triggers no evaluation.
      additionalProperties: false
      required: [idempotencyKey, files]
      properties:
        idempotencyKey:
          $ref: "#/components/schemas/IdempotencyKey"
        files:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/IngestFile"

    ChangeSet:
      type: object
      title: ChangeSet
      description: The change-set as it now stands, and what judging it produced.
      additionalProperties: false
      required:
        [changeSetSeq, files, additions, deletions, guardrailChecks, guardrailFailures, needsHuman]
      properties:
        changeSetSeq:
          type: integer
          minimum: 0
          description: |-
            Which report this was, from 1 — the number this report's guardrail verdicts carry.
            Unchanged, and `0` on a run that has never reported one, when the report named no
            files.
        files:
          type: integer
          minimum: 0
        additions:
          type: integer
          minimum: 0
        deletions:
          type: integer
          minimum: 0
        guardrailChecks:
          type: integer
          minimum: 0
          description: |-
            How many checks this report evaluated. `0` for a report with no files — the
            acceptance criterion *"a run with no file changes triggers none"* stated in the
            answer rather than only in the table.
        guardrailFailures:
          type: array
          description: |-
            The checks this report failed, in the card's order. The evidence is not echoed — it
            lives in `guardrail_evaluations`, as a path, a line and a rule id.
          items:
            type: string
            enum: [allowed_paths, ci_config, secrets, review_required]
        needsHuman:
          type: boolean
          description: |-
            Whether a failing check flags this run for a person. Evaluation, not enforcement:
            the run's status is not moved and no stage is stopped (AR.1,
            [#315](https://github.com/NobuData/ouroboros/issues/315)).

    IngestCommit:
      type: object
      title: IngestCommit
      description: One commit a run has made.
      additionalProperties: false
      required: [sha, message, committedAt]
      properties:
        sha:
          type: string
          pattern: "^[0-9a-f]{7,40}$"
          description: The object name, abbreviated or whole — and the key a re-report collides on.
        message:
          type: string
          minLength: 1
          maxLength: 8192
        committedAt:
          type: string
          format: date-time
          description: |-
            Git's clock. Required and deliberately not defaulted to the report's arrival: the
            gap between the two is ingestion lag, and a default would close it with a fiction.

    ReportCommitsRequest:
      type: object
      title: ReportCommitsRequest
      description: Commits to append, oldest first.
      additionalProperties: false
      required: [idempotencyKey, commits]
      properties:
        idempotencyKey:
          $ref: "#/components/schemas/IdempotencyKey"
        commits:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/IngestCommit"

    CommitsAppended:
      type: object
      title: CommitsAppended
      description: What the commit list did with the report.
      additionalProperties: false
      required: [submitted, appended, duplicates, lastSeq]
      properties:
        submitted:
          type: integer
          minimum: 1
        appended:
          type: integer
          minimum: 0
        duplicates:
          type: integer
          minimum: 0
          description: |-
            How many were already recorded. Worth returning because it is a different
            guarantee from the idempotency key's: a caller re-sending an overlapping range
            sees exactly how much of it was already known.
        lastSeq:
          type: [integer, "null"]

    TokenSpend:
      type: object
      title: TokenSpend
      description: One attributed spend, as `token_usage` stores it.
      additionalProperties: false
      required: [provider, model, tokensIn, tokensOut]
      properties:
        provider:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]+([._-][a-z0-9]+)*$"
        model:
          type: string
          minLength: 1
          maxLength: 200
          description: The model id, not an alias — the ledger records what actually answered.
        tokensIn:
          type: integer
          minimum: 0
          maximum: 1000000000
        tokensOut:
          type: integer
          minimum: 0
          maximum: 1000000000
        costCents:
          type: string
          pattern: "^\\d{1,10}(\\.\\d{1,4})?$"
          description: |-
            Cents to four decimal places, as a **string**: `numeric(14,4)` does not round-trip
            through a double. Absent is *unpriced*, which is a first-class answer rather than a
            zero.
        taskKind:
          type: string
          maxLength: 64
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
        latencyMs:
          type: integer
          minimum: 0
          maximum: 86400000
        occurredAt:
          type: string
          format: date-time

    ReportResourcesRequest:
      type: object
      title: ReportResourcesRequest
      description: |-
        A spend, a reservation, or both. `reservedBuildJob` has three states: a uuid takes a
        job, `null` releases the one held, and *absent* says nothing.
      additionalProperties: false
      required: [idempotencyKey]
      properties:
        idempotencyKey:
          $ref: "#/components/schemas/IdempotencyKey"
        spend:
          $ref: "#/components/schemas/TokenSpend"
        reservedBuildJob:
          type: [string, "null"]
          format: uuid
          description: "`build_jobs.id` to hold, `null` to release. Must be a job of the run's workspace."

    ResourcesReported:
      type: object
      title: ResourcesReported
      description: What the run has spent in total, and what it now holds.
      additionalProperties: false
      required: [tokensIn, tokensOut, costCents, unpricedEvents, reservedBuildJobId]
      properties:
        tokensIn:
          type: integer
          minimum: 0
        tokensOut:
          type: integer
          minimum: 0
        costCents:
          type: [string, "null"]
          description: |-
            Cents as a decimal string, or `null` when every attributed row is unpriced — the
            count-only case. `null` rather than `"0"`, which would say the run cost nothing
            about a run whose model simply has no price in the catalog.
        unpricedEvents:
          type: integer
          minimum: 0
          description: How many attributed rows carry no price — what makes the `null` above legible.
        reservedBuildJobId:
          type: [string, "null"]
          format: uuid

    ControlsFetched:
      type: object
      title: ControlsFetched
      description: The controls an executor now holds (#306).
      additionalProperties: false
      required: [controls]
      properties:
        controls:
          type: array
          description: Oldest first, which is the order to apply them in.
          items:
            $ref: "#/components/schemas/PendingControl"

    PendingControl:
      type: object
      title: PendingControl
      additionalProperties: false
      required: [id, kind, payload, remember, requestedAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [pause, resume, abort, steer]
        payload:
          type: [string, "null"]
          description: The steering text, and null for every other kind.
        remember:
          type: boolean
          description: The steer's *remember this* flag. For the knowledge pipeline, not the executor.
        requestedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: After this instant an acknowledgment is refused with `control_not_delivered`.

    AckControlRequest:
      type: object
      title: AckControlRequest
      additionalProperties: false
      properties:
        effect:
          type: string
          minLength: 1
          maxLength: 1024
          description: What the executor did, in its own words, trimmed. Optional.
        attempt:
          type: integer
          minimum: 1
          maximum: 1000
          description: The attempt a steer was applied to. Used only when `effect` is absent.

    AckedControl:
      type: object
      title: AckedControl
      description: A control as it stands after an acknowledgment — the same shape the console reads.
      additionalProperties: false
      required: [id, runId, kind, state, requestedBy, requestedAt, deliveredAt, ackedAt, expiresAt, detail, hasPayload, remember]
      properties:
        id:
          type: string
          format: uuid
        runId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [pause, resume, abort, steer]
        state:
          type: string
          enum: [pending, delivered, acked, expired, rejected]
        requestedBy:
          type: [string, "null"]
        requestedAt:
          type: string
          format: date-time
        deliveredAt:
          type: [string, "null"]
          format: date-time
        ackedAt:
          type: [string, "null"]
          format: date-time
        expiresAt:
          type: string
          format: date-time
        detail:
          type: [string, "null"]
        hasPayload:
          type: boolean
        remember:
          type: boolean
