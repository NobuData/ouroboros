# ouroboros-rest — the API specification, and the thing that is true.
#
# This file is authoritative. The service does not generate a document from its
# decorators; it loads this one and serves it verbatim (src/openapi/specification.ts), so
# what the UI's client is generated from and what the process answers with are the same
# bytes.
#
# Edit this file, then run `yarn openapi` to re-render openapi.json beside it — that is
# the copy the process reads and the copy openapi-typescript wants. `yarn test` refuses a
# pair that has drifted apart, a version that disagrees with package.json, a route the
# application serves that this document does not describe, and a response body whose
# fields this document does not list (src/openapi/openapi.spec.ts).

openapi: 3.1.0

info:
  title: ouroboros-rest
  version: "0.7.0"
  summary: The public API of Ouroboros — the only boundary between the browser and everything behind it.
  description: |-
    The **communications layer** of
    [Ouroboros](https://github.com/NobuData/ouroboros): the one service a browser talks
    to. It owns authentication, sessions, tenant-context resolution, the tenancy API and
    the gateway to `ouroboros-engine` — and it is the only module that reaches
    `ouroboros-db` or the engine, which is what keeps tenancy enforcement in a single
    auditable place.

    Every path sits under `/api/v1`. The version is in the URI because that is what a
    generated client, an address bar and a log line can all carry without negotiation,
    and a controller opts *out* of v1 rather than into it — so a route cannot be
    published unversioned by omission.

    Two paths are deliberately *not* under `/api/v1`: `/health/live` and `/health/ready`.
    They are read by infrastructure with no notion of an API version — a container's
    `HEALTHCHECK`, a compose healthcheck, an orchestrator's probe — and each of those is
    configured once and must keep working when a version is added or retired, which is the
    same reason `ouroboros-engine`'s liveness route is `/healthz` rather than
    `/v0/healthz`. They are described here anyway, because this document describes
    everything the service serves.

    **Every error has one shape** — `{code, message, details}`, from every operation below
    and from `ouroboros-engine` behind it (`docs/ARCHITECTURE.md` § 5.3). `code` is stable
    and machine-readable and is what a client branches on; `message` is written for a
    person; `details` carries what is specific to the failure, which for a `422` is one
    entry per field that was refused. A constraint the database enforces is answered in the
    same envelope rather than leaking through it: a duplicate domain is a `409` with
    `code: "domain_taken"`, never a PostgreSQL error string.

    **Lists are paginated the same way** — `?limit=&offset=`, answering
    `{items, total, limit, offset}`. The window is echoed back so a client that sent
    neither can still compute the next page, and `total` is always counted so a page count
    can be rendered.

    What is described below is the whole of the surface today: the heartbeat the scaffold
    ([#27](https://github.com/NobuData/ouroboros/issues/27)) landed, the probes
    ([#29](https://github.com/NobuData/ouroboros/issues/29)), the tenancy API
    ([#31](https://github.com/NobuData/ouroboros/issues/31)) and sign-in
    ([#33](https://github.com/NobuData/ouroboros/issues/33)). The engine gateway
    ([#35](https://github.com/NobuData/ouroboros/issues/35)) arrives as operations written
    here and code that answers them.

    **Everything below requires a session** except the five operations that carry
    `security: []` — the two halves of sign-in, sign-out, and the three routes whose reader
    is not a browser at all. A request without one is a `401` with
    `code: "unauthenticated"`, and that is one answer covering every way a session can fail:
    absent, expired, forged, or naming a person who no longer exists.

    **Every request also operates in one workspace**
    ([#32](https://github.com/NobuData/ouroboros/issues/32)). It is named by the
    `{tenantId}` in the path, or by the `X-Ouro-Tenant` header on the operations that have
    none, or inferred when the caller belongs to exactly one. A workspace the caller is not
    a member of answers **`404`, never `403`** — a `403` would confirm that an identifier
    names something real — and a member whose role is too low gets the one `403` this API
    does answer, because by then the workspace is no secret from them.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Ouroboros
    url: https://github.com/NobuData/ouroboros

servers:
  - url: http://localhost:4000
    description: |-
      `yarn dev`, which binds the loopback interface only — a development machine does
      not answer to the network it is on. In a deployment the origin is whatever fronts
      the service and the port comes from `PORT`; `4000` is the development default from
      `docs/CONVENTIONS.md` § 4's port map.

# Applied to every operation, so a route is unauthenticated only where it says
# `security: []` — the same polarity the code has, where the session guard is global and a
# handler opts out with `@Public()`. A contract that listed the *protected* routes instead
# would be one forgotten line away from publishing a tenancy endpoint as open, and the
# forgetting would be silent in both places at once.
security:
  - ouroSession: []

tags:
  - name: service
    description: |-
      Identity and liveness — what answers before any contract does: the heartbeat, and the
      two probes a container platform reads to decide whether to restart this process and
      whether to send it traffic.

  - name: auth
    description: |-
      Signing in, and finding out who is signed in. Sign-in is GitHub's authorization code
      flow: a browser is navigated to `/api/v1/auth/github`, authorizes on github.com, and
      returns to a callback that lands an `HttpOnly` session cookie.

      **Everything else in this document requires that cookie.** The three routes that do
      not are the two halves of sign-in and sign-out — one has no session yet and the other
      is disposing of one that may already have expired — along with the heartbeat and the
      two probes, whose readers hold no session and could not be given one.

      The session is a signed, stateless cookie: no server-side store, and so no revocation
      before it ages out. Signing out clears the browser's copy; a copy taken beforehand
      stays valid for the remainder of its seven days. That is the MVP trade, and the
      revocable design is recorded with
      [#38](https://github.com/NobuData/ouroboros/issues/38).

  - name: tenants
    description: |-
      Isolated customer workspaces — the root of everything else. A tenant has a slug that
      appears in URLs and command arguments, a display name, and a lifecycle: `active`,
      `suspended`, or the `deleted` that is a soft-delete marker rather than a removal.

      **A workspace you are not a member of answers `404`, not `403`**
      ([#32](https://github.com/NobuData/ouroboros/issues/32)). A `403` would confirm that
      an identifier names something real, which is the whole of what somebody enumerating
      identifiers is trying to learn — so "no such workspace" and "not yours" are one
      answer. `GET /api/v1/tenants` is scoped the same way: it lists the workspaces *you*
      belong to, never the installation's.

      Creating one makes you its `owner`, in the same transaction. Before the rule above
      that was harmless; with it, a workspace with no members would be one nobody — its
      creator included — could ever reach again.

      There is deliberately no `DELETE`. A hard delete takes a tenant's domains, members,
      organisations and repositories with it — every foreign key in the schema cascades —
      and that is not an operation an HTTP verb should put one click away.

  - name: domains
    description: |-
      The email domains that resolve a tenant at sign-in. One tenant may present several;
      at most one of them is the primary the product displays back, and zero is legal for a
      tenant part-way through setting itself up.

      A domain is globally unique: it names exactly one tenant, so a second tenant claiming
      it is a `409` with `code: "domain_taken"`.

  - name: members
    description: |-
      Who belongs to a tenant, and what they may do there — `owner`, `admin`, `member` or
      `viewer`. A member is addressed by the *person's* id, because a membership is the
      `(tenant, person)` pair rather than a row with an identity of its own.

      One rule here is enforced by this service rather than by the database, because it
      spans rows and must survive both a role change and a removal: **a tenant always keeps
      at least one owner.** Demoting or removing the last one is a `409` with
      `code: "last_owner"`.

      The roles are also what every mutation in this document is checked against: `owner`
      and `admin` may change a workspace, `member` and `viewer` may read it. A member whose
      role is too low gets a `403` with `code: "forbidden"` — the one place this API answers
      `403`, because by then the caller has already proved the workspace is no secret from
      them.

  - name: github
    description: |-
      The GitHub organisations and repositories a tenant has enabled — the boundary of where
      Ouroboros may operate. Both carry their own flag, and a repository is in scope only
      when **both** are true, so suspending an organisation preserves the per-repository
      choices underneath it.

      Both default to off. A row records that Ouroboros knows about the organisation or the
      repository; the flag records that somebody deliberately turned it on.

paths:
  /api/v1:
    get:
      tags: [service]
      summary: Heartbeat
      description: |-
        Report that the service is up, and which build is up.

        Deliberately the same three questions `ouroboros-engine`'s `/v0/status` answers,
        in the same order — *what is this*, *which build*, *how long has it been up* — so
        someone looking at both services is reading one shape rather than two. It opens
        no connection and reads no configuration: whether the service's *dependencies*
        are reachable is a readiness probe's question
        ([#29](https://github.com/NobuData/ouroboros/issues/29)), not this one's.
      operationId: readHeartbeat
      security: []
      responses:
        "200":
          description: The service is answering, and this is the build that answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Heartbeat"
              example:
                service: ouroboros-rest
                version: "0.7.0"
                status: ok
                uptimeSeconds: 3.885

  /api/v1/auth/github:
    get:
      tags: [auth]
      summary: Begin sign-in with GitHub
      description: |-
        Send the browser to GitHub to authorize, and remember the trip.

        This is a **navigation, not a call**. A person clicks "Continue with GitHub" and
        their browser follows a `302` to github.com, where they see a consent screen; a
        `fetch` from script would follow the redirect into a page it cannot render and land
        nobody anywhere. `ouroboros-ui` links to it.

        The redirect carries the client id, the scopes (`read:user` and `user:email`, and
        nothing else), an opaque `state` and a PKCE `code_challenge`. The `state` and the
        matching verifier are kept in a short-lived signed `HttpOnly` cookie —
        `ouro_oauth`, ten minutes, scoped to `/api/v1/auth` — and comparing the returned
        `state` against that cookie is what makes the callback safe from being fabricated.
      operationId: startGithubSignIn
      security: []
      responses:
        "302":
          description: |-
            Go and authorize. `Location` is on github.com and `Set-Cookie` carries the
            handshake this service will check on the way back. There is no body.
          headers:
            Location:
              description: The GitHub authorization URL, with the state and PKCE challenge.
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: |-
                `ouro_oauth`, `HttpOnly`, `SameSite=Lax`, `Path=/api/v1/auth`, ten minutes,
                and `Secure` outside development.
              schema:
                type: string
        "500":
          description: |-
            `internal_error` — the service itself failed. The message is a constant and
            `details` is empty, deliberately: the real diagnosis names a query, a host or a
            role, and it goes to the service log where only an operator reads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/github/callback:
    get:
      tags: [auth]
      summary: Finish sign-in with GitHub
      description: |-
        Where GitHub returns the browser. Verifies the handshake, exchanges the code for a
        token, reads the account's profile and verified primary address, resolves the
        person, and lands the session cookie before redirecting to `OURO_UI_URL`.

        **This URL is registered against the OAuth application**; it is not something a
        client composes. It is described here because this document describes everything
        the service serves.

        Resolving the person has three outcomes, and the middle one is why a sign-in can
        arrive already holding a membership: the GitHub identity is already known and the
        same user row is reused; or the identity is new and the *address* is one an
        invitation was sent to, in which case the identity is attached to that existing
        row; or neither is known and a person is created. The access token is used for
        those two reads and then dropped — `ouroboros.user_identities` holds no credential,
        and the schema's own tests fail if a column that looks like one ever appears.
      operationId: completeGithubSignIn
      security: []
      parameters:
        - name: code
          in: query
          required: true
          description: The authorization code GitHub issued. Opaque, and redeemable once.
          schema:
            type: string
            pattern: ^[A-Za-z0-9._~-]+$
            minLength: 1
            maxLength: 512
        - name: state
          in: query
          required: true
          description: |-
            The value this service generated before the browser left, echoed back
            unchanged. Compared against the `ouro_oauth` cookie; a mismatch is a `401`.
          schema:
            type: string
            pattern: ^[A-Za-z0-9._~-]+$
            minLength: 1
            maxLength: 512
      responses:
        "302":
          description: |-
            Signed in. `Location` is `OURO_UI_URL` and `Set-Cookie` carries two headers: the
            session, and the removal of the spent handshake. There is no body.
          headers:
            Location:
              description: "`OURO_UI_URL` — where a signed-in browser lands."
              schema:
                type: string
                format: uri
            Set-Cookie:
              description: |-
                `ouro_session`, `HttpOnly`, `SameSite=Lax`, `Path=/`, seven days, and
                `Secure` outside development — plus the expiry of `ouro_oauth`.
              schema:
                type: string
        "401":
          description: |-
            `oauth_handshake_invalid` — this callback does not match a handshake this
            service started. The cookie was absent, expired, forged, or carries a different
            `state` than the query string.

            All four are one answer on purpose. A callback an attacker composed cannot
            carry the cookie, and telling them which part was missing is telling them what
            to fix.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |-
            `validation_failed` — `code` or `state` was missing, too long, or not an opaque
            URL-safe value. `details` carries one entry per parameter, keyed by its name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502":
          description: |-
            `github_unavailable` — GitHub refused the exchange or did not answer inside ten
            seconds. Or `github_email_unavailable`, when the account authenticated and
            offered no *verified* address: an address is how a person invited to a tenant
            before their first sign-in is recognised as that person, and accepting an
            unverified one would let somebody else's address decide which account they land
            on.

            A `502` rather than a `500`, because nothing in this service is broken and
            retrying is reasonable. Nothing GitHub said is repeated in the body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |-
            `internal_error` — the service itself failed. The message is a constant and
            `details` is empty, deliberately: the real diagnosis names a query, a host or a
            role, and it goes to the service log where only an operator reads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Read the current session
      description: |-
        Who is signed in, which workspaces they belong to, and — for somebody who belongs
        to none yet — the tenant their email domain points at.

        One call rather than three, because it is what `ouroboros-ui`'s shell needs before
        it can render anything: the person for the profile menu, the memberships for the
        workspace switcher, and the suggestion for a first-run screen.

        The person is read from the database on every request rather than from the cookie,
        which is why a deleted account's outstanding session stops working immediately.
      operationId: readSession
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
              example:
                user:
                  id: 5eed0003-0000-4000-8000-000000000001
                  email: ken@acme-robotics.dev
                  displayName: Ken Suenobu
                  avatarUrl: null
                  createdAt: "2026-08-11T10:20:23.114Z"
                  updatedAt: "2026-08-11T10:20:23.114Z"
                memberships:
                  - tenantId: 9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10
                    slug: acme
                    displayName: Acme, Inc.
                    status: active
                    role: owner
                    invitedAt: "2026-08-11T10:20:23.114Z"
                    joinedAt: "2026-08-11T10:20:23.114Z"
                tenantSuggestion: null
        "401":
          description: |-
            `unauthenticated` — this request carries no session, or one this service will
            not honour. Sign in at `/api/v1/auth/github`.

            Every way a session can fail is this one answer: absent, expired, signed with a
            rotated key, forged, or naming a person who has since been deleted. A client
            cannot act differently on any of them, and distinguishing them would tell
            whoever is probing which part of their forgery was right.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |-
            `internal_error` — the service itself failed. The message is a constant and
            `details` is empty, deliberately: the real diagnosis names a query, a host or a
            role, and it goes to the service log where only an operator reads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: |-
        Remove the session cookie from the browser.

        Idempotent, and reachable without a session: requiring one would mean an *expired*
        cookie could never be cleared, because the request to remove it would be refused
        for carrying exactly the thing it was trying to remove. It answers `204` either
        way.

        A `POST` rather than a `GET`, because it changes state — a `GET` that signs you out
        is a link, an image tag or a prefetch away from signing you out.

        What it ends is the *browser's* copy. The session is a stateless signed cookie, so
        a copy taken beforehand stays valid until it ages out; revocation is recorded with
        the security baseline, [#38](https://github.com/NobuData/ouroboros/issues/38).
      operationId: signOut
      security: []
      responses:
        "204":
          description: |-
            Signed out. `Set-Cookie` removes `ouro_session`. There is no body — there is
            nothing to say.
          headers:
            Set-Cookie:
              description: "`ouro_session`, emptied, with `Max-Age=0`."
              schema:
                type: string
        "500":
          description: |-
            `internal_error` — the service itself failed. The message is a constant and
            `details` is empty, deliberately: the real diagnosis names a query, a host or a
            role, and it goes to the service log where only an operator reads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/tenants:
    get:
      tags: [tenants]
      summary: List your workspaces
      description: |-
        One page of the workspaces the signed-in person belongs to, oldest first.

        **Scoped to the caller**, never the installation's whole table: a listing that
        enumerated every workspace would be a larger existence leak than the `403` this API
        answers `404` to avoid, and it would be one request rather than a scan. Somebody who
        belongs to none gets an empty page.

        It is one of the three operations that need no active workspace, and the reason is
        circularity: this is the question a workspace switcher asks *before* it can name
        one.

        Ordered by creation time and then by id. The second term is not decoration: two
        tenants created in the same millisecond would otherwise be free to swap places
        between requests, and a paginated read could show one of them twice and the other
        never.
      operationId: listTenants
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantPage"
              example:
                items:
                  - id: 9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10
                    slug: acme
                    displayName: Acme, Inc.
                    status: active
                    createdAt: "2026-08-11T10:20:23.114Z"
                    updatedAt: "2026-08-11T10:20:23.114Z"
                total: 1
                limit: 25
                offset: 0
        "401":
          description: |-
            `unauthenticated` — this request carries no session, or one this service will
            not honour. Sign in at `/api/v1/auth/github`.

            Every way a session can fail is this one answer: absent, expired, signed with a
            rotated key, forged, or naming a person who has since been deleted. A client
            cannot act differently on any of them, and distinguishing them would tell
            whoever is probing which part of their forgery was right.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |-
            `validation_failed` — a path parameter, a query parameter or a field of the body
            was refused. `details` carries one entry per field, keyed by its path, so a form
            can render each message beside the input that produced it.

            Or `constraint_violated`, when the value was one this document's own rules admit
            and a `check` in the database does not. `details.constraint` names which. The two
            share a status because both mean the same thing to a client: the request was
            understood, and a different value can succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |-
            `internal_error` — the service itself failed. The message is a constant and
            `details` is empty, deliberately: the real diagnosis names a query, a host or a
            role, and it goes to the service log where only an operator reads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      tags: [tenants]
      summary: Create a tenant
      description: |-
        Create a tenant.

        The slug is chosen rather than derived from the display name: it appears in paths
        and command arguments and is the thing a person types, and a generator that turned
        `Acme, Inc.` into `acme-inc` would be one more rule to keep in step with the
        database's own.

        **The caller becomes its `owner`**, in the same transaction. That is not a
        convenience: a workspace with no members is one every route under it answers `404`
        to, including for the person who has just made it, so the two rows are written
        together or not at all.

        The tenant is created with no domains and no organisations. It is `active` from the
        moment it exists — the status is a lifecycle, not an approval. This operation needs
        no active workspace, because somebody creating their first belongs to none.
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantRequest"
            example:
              slug: acme
              displayName: Acme, Inc.
      responses:
        "201":
          description: The tenant, as it was stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10
                slug: acme
                displayName: Acme, Inc.
                status: active
                createdAt: "2026-08-11T10:20:23.114Z"
                updatedAt: "2026-08-11T10:20:23.114Z"
        "401":
          description: |-
            `unauthenticated` — this request carries no session, or one this service will
            not honour. Sign in at `/api/v1/auth/github`.

            Every way a session can fail is this one answer: absent, expired, signed with a
            rotated key, forged, or naming a person who has since been deleted. A client
            cannot act differently on any of them, and distinguishing them would tell
            whoever is probing which part of their forgery was right.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`slug_taken` — another tenant already has that slug."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |-
            `validation_failed` — a path parameter, a query parameter or a field of the body
            was refused. `details` carries one entry per field, keyed by its path, so a form
            can render each message beside the input that produced it.

            Or `constraint_violated`, when the value was one this document's own rules admit
            and a `check` in the database does not. `details.constraint` names which. The two
            share a status because both mean the same thing to a client: the request was
            understood, and a different value can succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |-
            `internal_error` — the service itself failed. The message is a constant and
            `details` is empty, deliberately: the real diagnosis names a query, a host or a
            role, and it goes to the service log where only an operator reads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/tenants/{tenantId}:
    get:
      tags: [tenants]
      summary: Read a tenant
      description: Read one tenant by its id.
      operationId: readTenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "200":
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
              example:
                id: 9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10
                slug: acme
