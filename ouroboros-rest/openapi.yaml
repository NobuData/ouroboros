  /health/live:
    get:
      tags: [service]
      summary: Liveness probe
      description: |-
        Report that the process is up and serving.

        Deliberately shallow — it opens no connection, reads no configuration and calls
        nothing downstream, so it cannot fail for a reason that has nothing to do with
        whether this process should be restarted. Reaching the handler at all is the answer;
        the three empty sections in the body are the shape `/health/ready` fills in.

        Its reader restarts the container when this stops answering, which is why *no*
        dependency is consulted here: a liveness probe that failed because PostgreSQL was
        down would restart every replica of a healthy service, repeatedly, while the
        database was the thing that needed attention.
      operationId: readLiveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: ok
                info: {}
                error: {}
                details: {}

  /health/ready:
    get:
      tags: [service]
      summary: Readiness probe
      description: |-
        Report whether this service's dependencies are reachable: PostgreSQL, asked
        `SELECT 1` on a connection of the probe's own, and `ouroboros-engine`, asked for the
        one route it serves without the internal key — `GET /healthz`.

        Both are asked concurrently and reported independently, so a body that says the
        database is down still says whether the engine is up. Every wait is bounded at two
        seconds, so this answers whether or not a dependency does.

        A `down` message names what was attempted and classifies why it failed. It carries
        no host, no port, no role and no driver text: this route answers without
        authentication, and the driver's own message — which is written for an operator and
        names all three — goes to the service log instead.

        Its reader takes the process out of rotation, or holds a dependent container back,
        and putting it back costs nothing. That is why this one is allowed to fail because a
        dependency is missing, and `/health/live` is not.
      operationId: readReadiness
      security: []
      responses:
        "200":
          description: Every dependency answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: ok
                info:
                  database: { status: up }
                  engine: { status: up }
                error: {}
                details:
                  database: { status: up }
                  engine: { status: up }
        "503":
          description: |-
            At least one dependency did not answer. `error` names which, and `details` still
            reports the ones that did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: error
                info:
                  engine: { status: up }
                error:
                  database:
                    status: down
                    message: SELECT 1 failed (ECONNREFUSED)
                details:
                  engine: { status: up }
                  database:
                    status: down
                    message: SELECT 1 failed (ECONNREFUSED)

components:
  # How a caller is recognised. One scheme, because there is one: the cookie the sign-in
  # flow lands.
  securitySchemes:
    ouroSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |-
        The session cookie BetterAuth issues, removed by `/api/v1/auth/logout`. `HttpOnly`,
        `SameSite=Lax`, `Path=/`, seven days, and `Secure` over HTTPS — where it is also
        named `__Secure-better-auth.session_token`, the library adding the prefix a browser
        refuses to accept over plain HTTP.

        **It replaced `ouro_session` in
        [#703](https://github.com/NobuData/ouroboros/issues/703)**, which invalidated every
        session live at the cut-over. A browser still holding the old cookie is answered
        `401` and told to drop it.

        It names a row in the `session` table — not a bearer token to be minted or pasted,
        and not a claim about who you are. `apiKey`/`cookie` is OpenAPI's nearest
        description of a cookie credential; it does not mean a client may compose one.

        A second cookie, `better-auth.session_data`, travels beside it: a signed snapshot of
        the session with a five-minute lifetime, which is what keeps an authenticated
        request from costing a database lookup. Nothing sends it deliberately and no client
        reads it.

        A browser sends it automatically. A cross-origin caller must also ask for it —
        `credentials: "include"` in `fetch` — and its origin must be listed in
        `OURO_CORS_ORIGINS`, because a credentialed cross-origin request may not be
        answered with a wildcard.

  # Every path parameter and the two query parameters the pagination convention defines.
  # Referenced rather than repeated: `tenantId` appears on fifteen operations, and fifteen
  # copies of a description is fifteen places for one of them to say something else.
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: The tenant's id.
      schema:
        type: string
        format: uuid
      example: 9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10

    DomainId:
      name: domainId
      in: path
      required: true
      description: The domain's id. It must belong to the tenant in the path.
      schema:
        type: string
        format: uuid
      example: 4d2a8b31-7c65-4e0a-9f38-1b6c2d5e7a94

    UserId:
      name: userId
      in: path
      required: true
      description: |-
        The person's id. A membership is the `(tenant, person)` pair rather than a row with
        an identity of its own, so this is what addresses one.
      schema:
        type: string
        format: uuid
      example: c7b1e2f4-5a63-4d8e-b0c9-7f2a1d3e6b85

    OrgLogin:
      name: login
      in: path
      required: true
      description: |-
        The organisation's GitHub login — the `NobuData` in github.com/NobuData, lower-cased.
        GitHub treats logins case-insensitively, so they are stored folded and one casing is
        the only one that resolves.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        minLength: 1
        maxLength: 39
      example: nobudata

    RepoName:
      name: name
      in: path
      required: true
      description: |-
        The repository's name within its organisation, without the owner prefix — the
        `ouroboros` in NobuData/ouroboros, lower-cased.
      schema:
        type: string
        pattern: ^[a-z0-9._-]+$
        minLength: 1
        maxLength: 100
      example: ouroboros

    AuthProviderId:
      name: id
      in: path
      required: true
      description: |-
        The provider's name, as BetterAuth knows it. `github` is the only one configured, so
        the callback github.com is registered against is `/api/auth/callback/github` — a
        string three places have to agree on, and only one of them is code
        (`GITHUB_CALLBACK_PATH` in `src/auth/auth.routes.ts`).
      schema:
        type: string
      example: github

    TenantHeader:
      name: X-Ouro-Tenant
      in: header
      required: false
      description: |-
        The workspace this request is operating in — its slug or its uuid.

        **An override, not the answer.** Since
        [#713](https://github.com/NobuData/ouroboros/issues/713) the workspace a request acts
        in is the session's active organization, which is server state: it is set through
        `/api/auth/organization/set-active`, it is stamped onto every new session, and no
        header can assert it. This header names a *different* workspace for one request —
        which is how a client acts outside the active one without changing it for every other
        request in flight. It is validated exactly as everything else is: a workspace the
        caller is not a member of is a `404`, the same answer one that does not exist gets.

        On the operations below it is **optional and redundant**: they already name a
        workspace in their path, which is the more specific of the two, and a header that
        names a *different* one is a `422` with `code: "tenant_mismatch"` rather than a
        silent preference for either. It is accepted here so that one client can set it on
        every request, and it is how the operations that have no workspace in their path say
        which workspace they mean.

        A caller who omits it is acting in their session's active organization. A session
        that has none — a person who belongs to no workspace, one whose workspace was
        deleted, one who was removed from it — gets a `400` with
        `code: "organization_required"` on any operation that names no workspace of its own.
        Every operation in this document names one in its path, so none of them can answer
        it today; the endpoints [#714](https://github.com/NobuData/ouroboros/issues/714)
        adds are the first that will.

        It replaces `tenant_required`, which was `422` and meant *you belong to several
        workspaces and named none*. Nothing is inferred from how many workspaces somebody
        belongs to any more: the choice is made once, at sign-in or in the picker, and lives
        on the session.
      schema:
        type: string
        minLength: 1
        maxLength: 63
      examples:
        slug:
          summary: By slug — what a person types
          value: acme
        id:
          summary: By id
          value: 9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10

    Limit:
      name: limit
      in: query
      required: false
      description: |-
        How many rows to return. The ceiling is not a suggestion: without it, a `limit` of a
        million is a client's way of asking this service to hold a table in memory, and the
        request that does it is indistinguishable from a mistake in a loop.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25

    Offset:
      name: offset
      in: query
      required: false
      description: How many rows to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

  schemas:
    Error:
      type: object
      title: Error
      description: |-
        The body of **every** error this API answers with, and the same shape
        `ouroboros-engine` uses behind it (`docs/ARCHITECTURE.md` § 5.3). A failure the
        framework produced — a path no route claims, a body the parser refused — carries it
        too, so a client has one thing to parse rather than one per layer.
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: |-
            Stable, machine-readable, and the thing to branch on. Every code this API can
            answer with is named in the description of the response that carries it.
          examples: [domain_taken, tenant_not_found, last_owner, validation_failed]
        message:
          type: string
          description: |-
            Written for a person. It may name a value the caller sent and never names
            anything about the service's own internals — no driver text, no stack, no
            constraint. A `500`'s message is a constant for exactly that reason.
          examples: [That domain belongs to another tenant.]
        details:
          type: object
          description: |-
            Whatever is specific to this failure — the field messages of a `422`, keyed by
            field path; the identifier a `404` was asked about; the constraint a generic
            conflict tripped. Always present, empty rather than absent when there is nothing
            to add, so a client reading `details.x` never has to check `details` first.
          additionalProperties: true
          examples:
            - slug: ["slug must be lower-case letters, digits and single hyphens"]
            - {}

    # -------------------------------------------------------------------------------
    # The auth family's shapes.
    #
    # They carry BetterAuth's names — `name` and `image` rather than `displayName` and
    # `avatarUrl`, `createdAt` on a membership rather than `invitedAt`/`joinedAt` —
    # because the library composes these bodies and a document that renamed the fields
    # would be describing a service that does not exist. The `/api/v1` shapes below use
    # this API's names, and the difference between the two vocabularies is one of the
    # things the two-client rule exists to keep visible.
    #
    # `additionalProperties: true` throughout, and deliberately: a library upgrade that
    # adds a field must not turn every response into a contract violation for a client
    # validating against this document. The `/api/v1` schemas are closed for the opposite
    # reason — this service composes those, so an unexpected field there is a bug.
    # -------------------------------------------------------------------------------

    SignInSocialRequest:
      type: object
      title: SignInSocialRequest
      description: Which provider to sign in with, and where to come back to.
      required: [provider]
      properties:
        provider:
          type: string
          description: |-
            The provider's id. `github` is the only one configured — see
            `src/auth/github.provider.ts`.
          examples: [github]
        callbackURL:
          type: string
          description: Where to send the browser once the handshake completes.
          examples: [http://localhost:3000/login]
        errorCallbackURL:
          type: string
          description: Where to send it when the handshake fails, instead of `/api/auth/error`.
        disableRedirect:
          type: boolean
          description: |-
            Answer with the URL only, setting no `Location` header. `ouroboros-ui` follows
            the URL itself, which is what makes the sign-in button a script's decision
            rather than a navigation the service forces.
      additionalProperties: true

    SignInSocialResponse:
      type: object
      title: SignInSocialResponse
      description: Where to send the browser to authorize.
      required: [redirect]
      properties:
        url:
          type: string
          description: The provider's authorization URL, carrying the `state` this service issued.
          examples: ["https://github.com/login/oauth/authorize?client_id=…&state=…"]
        redirect:
          type: boolean
          description: Whether a `Location` header was set beside the body.
          examples: [true]
      additionalProperties: true

    AuthUser:
      type: object
      title: AuthUser
      description: |-
        The signed-in person, as BetterAuth holds them — the `"user"` table
        ([#706](https://github.com/NobuData/ouroboros/issues/706)).

        One human is one row however many organizations they belong to. `name` and `image`
        are the library's field names; this API's own resources call the same two things
        `displayName` and `avatarUrl`.
      required: [id, email, emailVerified, name, createdAt, updatedAt]
      properties:
        id:
          type: string
          description: |-
            Stable for the person's whole life. A uuid rendered as text for everybody who
            came across in V004's back-fill, and the library's own id for anybody who signed
            in after it.
          examples: [5eed0003-0000-4000-8000-000000000001]
        email:
          type: string
          format: email
          description: |-
            Lower-cased and unique. How a person is recognised — including as the recipient
            of an invitation sent before they ever signed in — and not how they
            authenticate.
          examples: [ken@acme-robotics.dev]
        emailVerified:
          type: boolean
          description: |-
            Whether *this service* has verified the address. Not what authorises account
            linking: that needs the **provider** to call it verified, which is the stricter
            of the two — see `ACCOUNT_LINKING` in `src/auth/github.provider.ts`.
        name:
          type: string
          description: Their name on GitHub, or their login when they have set none.
          examples: [Ken Suenobu]
        image:
          description: The avatar the provider hosts, or `null` — which is what makes the UI draw a monogram.
          oneOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
      additionalProperties: true

    AuthSession:
      type: object
      title: AuthSession
      description: |-
        The session row itself. **A row, not a claim in a cookie** — which is what makes
        sign-out immediate and a deleted account's outstanding session stop working at once
        ([#703](https://github.com/NobuData/ouroboros/issues/703)).
      required: [id, userId, expiresAt, token, createdAt, updatedAt]
      properties:
        id:
          type: string
        userId:
          type: string
          description: The person this session belongs to.
        token:
          type: string
          description: |-
            The value the session cookie carries. Published because the shape has it, not
            because a client should read it: the cookie is `HttpOnly` and nothing in a
            browser can.
        expiresAt:
          type: string
          format: date-time
        activeOrganizationId:
          description: |-
            **The tenant pointer** — which organization this session is acting in, or `null`
            for somebody who has signed in and chosen nothing yet. Written by
            `POST /api/auth/organization/set-active` and by nothing a client can assert
            (decision A5).
          oneOf:
            - type: string
            - type: "null"
        ipAddress:
          oneOf:
            - type: string
            - type: "null"
        userAgent:
          oneOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true

    AuthSessionEnvelope:
      type: object
      title: AuthSessionEnvelope
      description: What `get-session` answers when there is a session to answer with.
      required: [session, user]
      properties:
        session:
          $ref: "#/components/schemas/AuthSession"
        user:
          $ref: "#/components/schemas/AuthUser"
      additionalProperties: true

    AuthSessionOrNull:
      title: AuthSessionOrNull
      description: |-
        The session, or `null` for nobody.

        `null` rather than a `401`, and that is the property a login screen is built on: it
        has to be able to ask *is anybody signed in* and get an answer rather than a
        redirect.
      oneOf:
        - $ref: "#/components/schemas/AuthSessionEnvelope"
        - type: "null"

    SignOutResponse:
      type: object
      title: SignOutResponse
      description: |-
        `{"success": true}`, whether or not there was a session to end — the removal is
        idempotent, because requiring a live session to clear an expired cookie would mean
        the cookie could never be cleared.
      required: [success]
      properties:
        success:
          type: boolean
          examples: [true]
      additionalProperties: true

    AuthOk:
      type: object
      title: AuthOk
      description: The BetterAuth handler answering for itself, and for nothing else.
      required: [ok]
      properties:
        ok:
          type: boolean
          examples: [true]
      additionalProperties: true

    AuthError:
      type: object
      title: AuthError
      description: |-
        **BetterAuth's error shape, which is not this API's envelope.** The `/api/v1` routes
        answer `{code, message, details}` from one filter; these routes are the library's
        and it composes its own failures, so a client handling both families handles two
        error shapes. That is a real cost of the two-client rule, and stating it is cheaper
        than a client discovering it.
      properties:
        message:
          type: string
          description: Written for a person.
          examples: [You are not a member of this organization]
        code:
          type: string
          description: The library's stable code, screaming case.
          examples: [YOU_ARE_NOT_A_MEMBER_OF_THIS_ORGANIZATION]
      additionalProperties: true

    MemberRole:
      type: string
      title: MemberRole
      description: |-
        What somebody may do in an organization. Three are the plugin's; `viewer` is this
        service's, added as a custom access-control role so the vocabulary
        `V002__users_membership.sql` had been storing since
        [#21](https://github.com/NobuData/ouroboros/issues/21) survived the move
        (`src/auth/organization.roles.ts`).
      enum: [owner, admin, member, viewer]
      examples: [owner]

    MemberRoleResponse:
      type: object
      title: MemberRoleResponse
      description: The role the caller holds in one organization.
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/MemberRole"
      additionalProperties: true

    Organization:
      type: object
      title: Organization
      description: |-
        A workspace — the tenancy backbone since
        [#704](https://github.com/NobuData/ouroboros/issues/704). What `V001__tenants.sql`
        called a `tenant`, holding the same ids: `V006__tenancy_extensions.sql` moved the
        rows across without remapping them ([#708](https://github.com/NobuData/ouroboros/issues/708)).
      required: [id, name, slug, createdAt]
      properties:
        id:
          type: string
          description: Stable for the organization's whole life. The slug is not; this is what to store.
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        name:
          type: string
          description: What a person calls it.
          examples: ["Acme, Inc."]
        slug:
          type: string
          description: The URL- and CLI-safe handle, unique across the installation.
          examples: [acme]
        logo:
          oneOf:
            - type: string
            - type: "null"
        metadata:
          description: |-
            `{"personal": true}` is the one key this installation writes, and it is what
            renders mockup 01 Step 2's `personal` pill. **A client cannot set it**: it is
            stripped from every creation request, so the pill can only ever be telling the
            truth.
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        createdAt:
          type: string
          format: date-time
      additionalProperties: true

    OrganizationMember:
      type: object
      title: OrganizationMember
      description: |-
        One person's membership of one organization — the `(organization, person)` pair, and
        the role they hold in it.
      required: [id, organizationId, userId, role, createdAt]
      properties:
        id:
          type: string
        organizationId:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/MemberRole"
        createdAt:
          type: string
          format: date-time
          description: |-
            When the membership came into being. The plugin keeps one timestamp where
            `tenant_members` kept two, so *invited* and *joined* are no longer separable —
            an invitation lives on the `invitation` row until it is accepted, and the member
            row is written at acceptance.
        user:
          description: The person, when the caller asked for a listing that joins them in.
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
      additionalProperties: true

    Invitation:
      type: object
      title: Invitation
      description: |-
        Somebody asked to join, at a role, before they are a member.

        **No email is sent in MVP** — the row is the whole of the operation, and
        [#724](https://github.com/NobuData/ouroboros/issues/724) is the delivery. `expiresAt`
        is already here waiting for it.
      required: [id, organizationId, email, role, status, expiresAt, inviterId]
      properties:
        id:
          type: string
        organizationId:
          type: string
        email:
          type: string
          format: email
          description: Who was invited. They need not have an account yet.
        role:
          $ref: "#/components/schemas/MemberRole"
        status:
          type: string
          enum: [pending, accepted, rejected, canceled]
          examples: [pending]
        expiresAt:
          type: string
          format: date-time
        inviterId:
          type: string
          description: Who issued it.
      additionalProperties: true

    FullOrganization:
      type: object
      title: FullOrganization
      description: |-
        One organization with its people — mockup 17's members & roles table in a single
        answer.
      required: [id, name, slug, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        logo:
          oneOf:
            - type: string
            - type: "null"
        metadata:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        createdAt:
          type: string
          format: date-time
        members:
          type: array
          items:
            $ref: "#/components/schemas/OrganizationMember"
        invitations:
          type: array
          description: The outstanding ones.
          items:
            $ref: "#/components/schemas/Invitation"
      additionalProperties: true

    FullOrganizationOrNull:
      title: FullOrganizationOrNull
      description: |-
        The organization, or `null` — which is what a session with no active organization
        gets, rather than an error. Choosing nothing yet is a state the login screen exists
        to resolve, not a failure.
      oneOf:
        - $ref: "#/components/schemas/FullOrganization"
        - type: "null"

    CreatedOrganization:
      title: CreatedOrganization
      description: |-
        The new organization, with the caller's own membership — the `owner` row created in
        the same operation, so nothing has to be read back to find out what they hold.
      allOf:
        - $ref: "#/components/schemas/Organization"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/OrganizationMember"

    CreateOrganizationRequest:
      type: object
      title: CreateOrganizationRequest
      description: A workspace to create. The caller becomes its `owner`.
      required: [name, slug]
      properties:
        name:
          type: string
          examples: ["Acme, Inc."]
        slug:
          type: string
          description: Unique across the installation; a taken one is a `400`.
          examples: [acme]
        logo:
          type: string
        metadata:
          type: object
          description: |-
            **`personal` is stripped from whatever is sent here.** See the operation's own
            description for why the one flag a client may not set is the one that renders a
            pill.
          additionalProperties: true
        keepCurrentActiveOrganization:
          type: boolean
          description: |-
            Create it without switching into it. Absent means the new organization becomes
            the session's active one, which is what somebody creating their first workspace
            wants.
      additionalProperties: true

    SetActiveOrganizationRequest:
      type: object
      title: SetActiveOrganizationRequest
      description: |-
        Which organization this session acts in. Give an id or a slug; give `null` to unset
        the pointer.
      properties:
        organizationId:
          oneOf:
            - type: string
            - type: "null"
        organizationSlug:
          type: string
      additionalProperties: true

    OrgInviteMemberRequest:
      type: object
      title: OrgInviteMemberRequest
      description: Somebody to invite, and what they will hold when they accept.
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/MemberRole"
        organizationId:
          type: string
          description: Which organization. Defaults to the session's active one.
        resend:
          type: boolean
          description: Re-issue an outstanding invitation rather than refusing a duplicate.
      additionalProperties: true

    UpdateMemberRoleRequest:
      type: object
      title: UpdateMemberRoleRequest
      description: A membership, and the role it should now hold.
      required: [memberId, role]
      properties:
        memberId:
          type: string
          description: The membership row's id — not the person's.
        role:
          $ref: "#/components/schemas/MemberRole"
        organizationId:
          type: string
          description: Which organization. Defaults to the session's active one.
      additionalProperties: true

    DiscoverResponse:
      type: object
      title: DiscoverResponse
      description: |-
        What a company domain resolves to: whether it signs in through an identity provider,
        and what to do about it.

        **The same object comes back for a domain we hold and one we have never seen.** The
        endpoint is public, so anything conditional here would be a way to ask *is this
        company a customer* — see the operation's own description. There is no organization
        name in this schema, no member count and no identifier, and that is a property of the
        contract rather than of one release's implementation.

        `ssoAvailable` is the discriminator, and the two optional-looking halves are its two
        branches: `false` means read `message`, `true` means follow `redirectUrl`. A client
        written against that reads correctly today, when the answer is always `false`, and
        goes on reading correctly when
        [#722](https://github.com/NobuData/ouroboros/issues/722) makes it sometimes `true`.
      additionalProperties: false
      required: [ssoAvailable, message]
      properties:
        ssoAvailable:
          type: boolean
          description: |-
            Whether this domain signs in through SAML or OIDC.

            **`false` in every answer this release sends**, for every domain — enterprise SSO
            is #722 and MVP signs in with GitHub (decision A7). It is in the contract now, and
            answered honestly now, so the card that reads it does not have to be rewritten
            when the other branch starts happening.
          examples: [false]
        message:
          type: string
          description: |-
            A sentence to render, always present. When `ssoAvailable` is `false` it says why;
            when it is `true` it is what the card shows while the browser is on its way.

            Required rather than optional so a client has something to display in **both**
            branches without inventing copy of its own.
          examples: ["Enterprise SSO is not configured yet — sign in with GitHub for now."]
        redirectUrl:
          type: string
          description: |-
            Where to send the browser to sign in, present only when `ssoAvailable` is `true`.

            **Never sent in this release.** It is published now because #718's sign-in card is
            written against this document today and must not need restructuring when #722
            fills it in.
          examples: ["/api/auth/sso/saml2/acme"]

    Tenant:
      type: object
      title: Tenant
      description: An isolated customer workspace — the root of everything else in the API.
      additionalProperties: false
      required: [id, slug, displayName, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Stable for the tenant's whole life. The slug is not; this is what to store.
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 63
          description: |-
            The URL- and CLI-safe handle, unique across the installation. DNS-label shaped,
            which keeps it usable if one is ever wanted as a subdomain.
          examples: [acme]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: What a human reads. Free text; it carries no machine meaning.
          examples: ["Acme, Inc."]
        status:
          type: string
          enum: [active, suspended, deleted]
          description: |-
            The lifecycle. `deleted` is a soft-delete marker: the row and everything
            cascading from it survive, so it is recoverable.
          examples: [active]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          description: Maintained by the database on every write; never accepted from a client.
          examples: ["2026-08-11T10:20:23.114Z"]

    TenantPage:
      type: object
      title: TenantPage
      description: One page of tenants.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: The rows for this window, oldest first.
          items:
            $ref: "#/components/schemas/Tenant"
        total:
          type: integer
          minimum: 0
          description: How many rows there are in total, ignoring the window.
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: The window that was applied — the default, when the request named none.
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    Domain:
      type: object
      title: Domain
      description: An email domain that resolves a tenant at sign-in.
      additionalProperties: false
      required: [id, tenantId, domain, isPrimary, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [4d2a8b31-7c65-4e0a-9f38-1b6c2d5e7a94]
        tenantId:
          type: string
          format: uuid
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        domain:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          maxLength: 253
          description: |-
            Lower-cased, and unique across the whole installation rather than within the
            tenant — a domain names exactly one tenant at sign-in.
          examples: [acme.example]
        isPrimary:
          type: boolean
          description: |-
            The domain the product displays back. At most one per tenant, and zero is legal
            for a tenant part-way through setting itself up.
          examples: [true]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]

    DomainPage:
      type: object
      title: DomainPage
      description: One page of a tenant's domains, the primary first.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
        total:
          type: integer
          minimum: 0
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    Member:
      type: object
      title: Member
      description: |-
        A person's membership of one tenant, with the person's own details alongside — one
        row of a member table.

        Flattened rather than nested, and with no id of its own: the membership *is* the
        `(tenantId, userId)` pair, which is what a `PATCH` or a `DELETE` addresses.
      additionalProperties: false
      required: [tenantId, userId, email, displayName, avatarUrl, role, invitedAt, joinedAt]
      properties:
        tenantId:
          type: string
          format: uuid
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        userId:
          type: string
          format: uuid
          examples: [c7b1e2f4-5a63-4d8e-b0c9-7f2a1d3e6b85]
        email:
          type: string
          format: email
          maxLength: 320
          description: |-
            Lower-cased and unique across the installation. How a person is recognised and
            contacted — not how they authenticate.
          examples: [ada@acme.example]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |-
            What the member list prints. For somebody who has never signed in this is the
            name their inviter gave, or the local part of their address.
          examples: [Ada Lovelace]
        avatarUrl:
          type: [string, "null"]
          maxLength: 2048
          description: |-
            An `http(s)` URL, or `null` when none is known — which is every person who has
            not signed in yet. A placeholder is the UI's decision, so none is invented here.
          examples: ["https://avatars.example/ada.png", null]
        role:
          type: string
          enum: [owner, admin, member, viewer]
          description: What this person may do in this tenant.
          examples: [owner]
        invitedAt:
          type: string
          format: date-time
          description: When the invitation was issued. Also when the membership came into being.
          examples: ["2026-08-11T10:20:23.114Z"]
        joinedAt:
          type: [string, "null"]
          format: date-time
          description: |-
            When it was accepted, or `null` while it is outstanding — a real state the member
            list renders, and what an invitation looks like until #33's sign-in exists.
          examples: ["2026-08-11T10:24:51.400Z", null]

    MemberPage:
      type: object
      title: MemberPage
      description: One page of a tenant's members, by name.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total:
          type: integer
          minimum: 0
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    Org:
      type: object
      title: Org
      description: A GitHub organisation a tenant has recorded, enabled or not.
      additionalProperties: false
      required: [id, tenantId, login, enabled, installedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [2e5f7a19-3b4c-4d6e-8f01-9a2b3c4d5e6f]
        tenantId:
          type: string
          format: uuid
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        login:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 1
          maxLength: 39
          description: Lower-cased GitHub login, unique within the tenant.
          examples: [nobudata]
        enabled:
          type: boolean
          description: |-
            Whether Ouroboros may operate in it. A row records that the organisation is
            known; this records that somebody deliberately turned it on.
          examples: [true]
        installedAt:
          type: [string, "null"]
          format: date-time
          description: |-
            When the GitHub App was installed. `null` on every row today — the installation
            flow is future product work, and a default would assert something that never
            happened.
          examples: [null]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]

    OrgPage:
      type: object
      title: OrgPage
      description: One page of a tenant's GitHub organisations, by login.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Org"
        total:
          type: integer
          minimum: 0
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    Repo:
      type: object
      title: Repo
      description: |-
        A repository within an organisation. In scope for Ouroboros only when this `enabled`
        and its organisation's are **both** true.
      additionalProperties: false
      required: [id, orgId, name, enabled, defaultBranch, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [7a3d9c21-8e4f-4b5a-9c6d-0e1f2a3b4c5d]
        orgId:
          type: string
          format: uuid
          description: |-
            The organisation it hangs from. The tenant is reachable through that, and a
            second copy of the fact here could disagree with it.
          examples: [2e5f7a19-3b4c-4d6e-8f01-9a2b3c4d5e6f]
        name:
          type: string
          pattern: ^[a-z0-9._-]+$
          minLength: 1
          maxLength: 100
          description: Lower-cased, without the owner prefix. Unique within the organisation.
          examples: [ouroboros]
        enabled:
          type: boolean
          description: Independent of the organisation's flag, so suspending one preserves this.
          examples: [true]
        defaultBranch:
          type: [string, "null"]
          maxLength: 255
          description: |-
            The branch work is cut from, or `null` until it has been discovered from GitHub.
            An enable/disable that omits it leaves it alone rather than clearing it.
          examples: [main, null]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]

    RepoPage:
      type: object
      title: RepoPage
      description: One page of an organisation's repositories, by name.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repo"
        total:
          type: integer
          minimum: 0
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    DiscoverRequest:
      type: object
      title: DiscoverRequest
      description: |-
        The body of `POST /api/v1/auth/discover` — the company domain, as a person typed it.

        **This is the one request body in this API that is normalised rather than rejected.**
        Everywhere else a value with upper case in it is refused, because what is stored
        should be what was sent; nothing is stored here, and the field is filled in by
        somebody who has just pasted `https://Acme.Ouroboros.dev/` out of their address bar.
        So the service trims it, lower-cases it, and removes the scheme, the path, the query,
        the fragment and a trailing dot — and *then* requires what is left to be a domain
        name. `  HTTPS://Acme.Ouroboros.dev/login  ` and `acme.ouroboros.dev` are the same
        request.

        What it does **not** do is guess. A port, an email address, an internal hostname with
        no dot in it — none of them are folded into something plausible; they are a `422`
        naming the field.
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 2048
          description: |-
            The company domain. `acme.ouroboros.dev` — mockup 01's own placeholder.

            No `pattern` here, deliberately: the rule applies to the *normalised* value, and a
            pattern on this field would tell a client generator to refuse `https://acme.…/`,
            which the service accepts. After normalisation the value must be a lower-case
            domain name of two or more labels and at most 253 characters — the same shape
            `CreateDomainRequest` states, because it is the same column being matched.

            The generous `maxLength` bounds what a form can post rather than what a domain may
            be; the scheme and path a person pastes are removed before the real limit applies.
          examples: [acme.ouroboros.dev]

    CreateTenantRequest:
      type: object
      title: CreateTenantRequest
      description: |-
        The body of `POST /api/v1/tenants`.

        Request schemas are closed, as the response schemas are: a property this document
        does not list is refused rather than ignored, which is what closes mass assignment
        for every route at once instead of per handler.
      additionalProperties: false
      required: [slug, displayName]
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 63
          examples: [acme]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Acme, Inc."]

    UpdateTenantRequest:
      type: object
      title: UpdateTenantRequest
      description: |-
        The body of `PATCH /api/v1/tenants/{tenantId}`. Every field optional; a body naming
        none of them is a no-op that answers with the tenant unchanged.
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 63
          examples: [acme]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          examples: [Acme Corporation]
        status:
          type: string
          enum: [active, suspended, deleted]
          examples: [suspended]

    CreateDomainRequest:
      type: object
      title: CreateDomainRequest
      description: The body of `POST /api/v1/tenants/{tenantId}/domains`.
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          maxLength: 253
          description: |-
            Lower-cased. An address with upper case in it is refused rather than folded —
            folding would mean the value stored is not the value sent, which is the beginning
            of a client that cannot predict what a `GET` returns.
          examples: [acme.example]
        isPrimary:
          type: boolean
          default: false
          description: Make this the displayed domain, demoting whichever one holds it now.
          examples: [true]

    UpdateDomainRequest:
      type: object
      title: UpdateDomainRequest
      description: |-
        The body of `PATCH /api/v1/tenants/{tenantId}/domains/{domainId}`. One field, because
        it is the only thing about a domain that can change: the domain itself is what the
        row *is*, and renaming one is adding the new and removing the old.
      additionalProperties: false
      required: [isPrimary]
      properties:
        isPrimary:
          type: boolean
          examples: [true]

    InviteMemberRequest:
      type: object
      title: InviteMemberRequest
      description: The body of `POST /api/v1/tenants/{tenantId}/members`.
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: |-
            Who to invite. Lower-cased before the lookup — the one value this API normalises
            rather than refuses, because an address is typed by a person into a form and
            `Ada@acme.example` is not a mistake worth an error message.
          examples: [grace@acme.example]
        role:
          type: string
          enum: [owner, admin, member, viewer]
          examples: [admin]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |-
            What to call them if this is the first Ouroboros has heard of them. Ignored when
            the person already exists — their own name is not an inviter's to overwrite.
            Omitted, the local part of the address is used.
          examples: [Grace Hopper]

    UpdateMemberRequest:
      type: object
      title: UpdateMemberRequest
      description: The body of `PATCH /api/v1/tenants/{tenantId}/members/{userId}`.
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, admin, member, viewer]
          examples: [admin]

    CreateOrgRequest:
      type: object
      title: CreateOrgRequest
      description: The body of `POST /api/v1/tenants/{tenantId}/orgs`.
      additionalProperties: false
      required: [login]
      properties:
        login:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 1
          maxLength: 39
          examples: [nobudata]
        enabled:
          type: boolean
          default: false
          description: |-
            Off unless asked. Anything arriving by a path nobody has thought about yet
            arrives switched off, which is the right posture for a flag whose whole job is to
            bound what an autonomous agent may touch.
          examples: [true]

    UpdateOrgRequest:
      type: object
      title: UpdateOrgRequest
      description: The body of `PATCH /api/v1/tenants/{tenantId}/orgs/{login}`.
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          examples: [false]

    UpdateRepoRequest:
      type: object
      title: UpdateRepoRequest
      description: |-
        The body of `PATCH /api/v1/tenants/{tenantId}/orgs/{login}/repos/{name}`, which is
        also how a repository is first recorded.
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          examples: [true]
        defaultBranch:
          type: string
          maxLength: 255
          description: |-
            The branch work is cut from. Left alone when omitted rather than cleared. The
            shape is an allow-list — letters, digits, dot, underscore, hyphen and slash, with
            no leading or trailing slash, no empty segment, no leading dot and no `..`
            anywhere — because the value is joined onto a filesystem path.
          examples: [main]

    EngineStatus:
      type: object
      title: EngineStatus
      description: The body of a `GET /api/v1/engine/status` response.
      additionalProperties: false
      required: [engine, version]
      properties:
        engine:
          type: string
          const: up
          description: |-
            Always `up`, and that is honest rather than redundant: every way the engine can
            fail to answer is a `502`, so a body that exists at all came from a reachable
            engine. It is a field rather than nothing so the shape can grow a second state —
            `degraded`, once there is something that could be degraded — without changing how
            a client reads the first one.
          examples: [up]
        version:
          type: string
          description: |-
            The engine build that answered, read from its package metadata. It is the
            engine's version and not this service's: the two are released independently
            (`docs/CONVENTIONS.md` § 8), and which pair is deployed together is exactly what
            this route exists to tell you.
          examples: ["0.3.0"]

    Heartbeat:
      type: object
      title: Heartbeat
      description: The body of a `GET /api/v1` response.
      additionalProperties: false
      required: [service, version, status, uptimeSeconds]
      properties:
        service:
          type: string
          const: ouroboros-rest
          description: This service's name, constant across deployments.
          examples: [ouroboros-rest]
        version:
          type: string
          description: |-
            The running build, read from this module's `package.json` — the one place a
            module's version is written down (`docs/CONVENTIONS.md` § 8), and the same
            string `info.version` above carries.
          examples: ["0.1.0"]
        status:
          type: string
          const: ok
          description: |-
            Always `ok`. Reaching this handler at all is what the field reports; a client
            reads the status code, and this is for the human who runs the request by
            hand.
          examples: [ok]
        uptimeSeconds:
          type: number
          minimum: 0
          description: |-
            Seconds since the service was constructed, to millisecond precision. Small
            and shrinking across polls means something is restarting the process — which
            is the one thing a heartbeat can tell you that a plain `200` cannot.
          examples: [3.885]

    HealthReport:
      type: object
      title: HealthReport
      description: |-
        The body of both probes — one shape, so a reader parses one thing.

        It is `@nestjs/terminus`'s report, and the three sections are the same dependencies
        seen three ways: `info` holds the ones that are up, `error` the ones that are down,
        and `details` holds all of them. All three are always present, and all three are
        empty for `/health/live`, which has no dependencies to report on.
      additionalProperties: false
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error, shutting_down]
          description: |-
            `ok` when every dependency answered, `error` when one did not — and
            `shutting_down` when the process has been told to stop, at which point it should
            neither be sent traffic nor be counted live.
          examples: [ok]
        info:
          $ref: "#/components/schemas/DependencyStatuses"
          description: The dependencies that answered.
        error:
          $ref: "#/components/schemas/DependencyStatuses"
          description: The dependencies that did not, each with a reason.
        details:
          $ref: "#/components/schemas/DependencyStatuses"
          description: Every dependency, whatever it reported.

    DependencyStatuses:
      type: object
      title: DependencyStatuses
      description: |-
        Dependencies, keyed by name. `/health/ready` reports two of them — `database` and
        `engine` — and the map is open because a dependency added later is a key added here
        rather than a new shape.
      additionalProperties:
        $ref: "#/components/schemas/DependencyStatus"
      examples:
        - database: { status: up }
          engine: { status: up }

    DependencyStatus:
      type: object
      title: DependencyStatus
      description: What one dependency reported when it was asked.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
          description: Whether this dependency answered.
          examples: [up]
        message:
          type: string
          description: |-
            Present when the status is `down`: what was attempted, and a classification of
            why it failed — `SELECT 1 failed (ECONNREFUSED)`, `GET /healthz responded 503`,
            `SELECT 1 timed out after 2000 ms`. Never a driver's own message; this route
            answers without authentication, and a driver names the host, the port and the
            role it could not reach with.
          examples: [SELECT 1 failed (ECONNREFUSED)]
