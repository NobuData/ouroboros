          description: |-
            `validation_failed` — the id is not a uuid. Malformed is the caller's mistake,
            answered before anything is read; well-formed-but-absent is the `404` above.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |-
