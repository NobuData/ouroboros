  /api/v1/tenants/{tenantId}/orgs/{login}/repos/{name}:
    patch:
      tags: [github]
      summary: Enable or disable a repository
      description: |-
        Turn a repository on or off — **and record it if this is the first Ouroboros has
        heard of it.**

        There is no `POST` for a repository, and that is why this one creates. The GitHub App
        installation flow that would discover repositories is future product work, so nothing
        exists today to have created a row for a person to then switch on; making this an
        upsert keeps "turn this repository on" a single request either way, and doing it in
        one statement keeps it correct when two people do it at once.

        `defaultBranch` is left alone when the request omits it rather than cleared: it is
        discovered from GitHub, and an enable/disable is not the thing that should forget it.
      operationId: setRepoEnabled
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/OrgLogin"
        - $ref: "#/components/parameters/RepoName"
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRepoRequest"
            example:
              enabled: true
              defaultBranch: main
      responses:
        "200":
          description: The repository, after the change — created if it was not there before.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Repo"
              example:
                id: 7a3d9c21-8e4f-4b5a-9c6d-0e1f2a3b4c5d
                orgId: 2e5f7a19-3b4c-4d6e-8f01-9a2b3c4d5e6f
                name: ouroboros
                enabled: true
                defaultBranch: main
                createdAt: "2026-08-11T10:20:23.114Z"
                updatedAt: "2026-08-11T12:11:38.220Z"
        "401":
          description: |-
            `unauthenticated` — this request carries no session, or one this service will
            not honour. Sign in through `/api/auth/sign-in/social`.

            Every way a session can fail is this one answer: absent, expired, signed with a
            rotated key, forged, or naming a person who has since been deleted. A client
            cannot act differently on any of them, and distinguishing them would tell
            whoever is probing which part of their forgery was right.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: |-
            `tenant_not_found`, or `org_not_found`. There is no `repo_not_found`: a
            repository this API has never seen is one it creates, so the only thing that can
            be missing is the organisation it would hang from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`conflict` — the repository was recorded by another request at the same moment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |-
            `forbidden` — you are a member of this workspace and your role does not permit
            this. Administering a workspace is `owner` or `admin`; `member` and `viewer` may
            read it.

            The one place this API answers `403` rather than `404`. Everywhere else, "you
            may not" would confirm that an identifier names something real — here the caller
            has already proved they are a member, so the workspace is no secret from them
            and their role is the only thing left to tell them. `details.role` is what they
            hold and `details.required` is what would have been enough.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |-
            `validation_failed` — a path parameter, a query parameter or a field of the body
            was refused. `details` carries one entry per field, keyed by its path, so a form
            can render each message beside the input that produced it.

            Or `constraint_violated`, when the value was one this document's own rules admit
            and a `check` in the database does not. `details.constraint` names which. The two
            share a status because both mean the same thing to a client: the request was

            Or `tenant_mismatch`, when the path and the `X-Ouro-Tenant` header name different
            workspaces — refused rather than resolved by precedence, so a client holding a
            stale workspace in a header cannot quietly act on another one.
            understood, and a different value can succeed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: |-
            `internal_error` — the service itself failed. The message is a constant and
            `details` is empty, deliberately: the real diagnosis names a query, a host or a
            role, and it goes to the service log where only an operator reads it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /health/live:
    get:
      tags: [service]
      summary: Liveness probe
      description: |-
        Report that the process is up and serving.

        Deliberately shallow — it opens no connection, reads no configuration and calls
        nothing downstream, so it cannot fail for a reason that has nothing to do with
        whether this process should be restarted. Reaching the handler at all is the answer;
        the three empty sections in the body are the shape `/health/ready` fills in.

        Its reader restarts the container when this stops answering, which is why *no*
        dependency is consulted here: a liveness probe that failed because PostgreSQL was
        down would restart every replica of a healthy service, repeatedly, while the
        database was the thing that needed attention.
      operationId: readLiveness
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: ok
                info: {}
                error: {}
                details: {}

  /health/ready:
    get:
      tags: [service]
      summary: Readiness probe
      description: |-
        Report whether this service's dependencies are reachable: PostgreSQL, asked
        `SELECT 1` on a connection of the probe's own, and `ouroboros-engine`, asked for the
        one route it serves without the internal key — `GET /healthz`.

        Both are asked concurrently and reported independently, so a body that says the
        database is down still says whether the engine is up. Every wait is bounded at two
        seconds, so this answers whether or not a dependency does.

        A `down` message names what was attempted and classifies why it failed. It carries
        no host, no port, no role and no driver text: this route answers without
        authentication, and the driver's own message — which is written for an operator and
        names all three — goes to the service log instead.

        Its reader takes the process out of rotation, or holds a dependent container back,
        and putting it back costs nothing. That is why this one is allowed to fail because a
        dependency is missing, and `/health/live` is not.
      operationId: readReadiness
      security: []
      responses:
        "200":
          description: Every dependency answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: ok
                info:
                  database: { status: up }
                  engine: { status: up }
                error: {}
                details:
                  database: { status: up }
                  engine: { status: up }
        "503":
          description: |-
            At least one dependency did not answer. `error` names which, and `details` still
            reports the ones that did.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReport"
              example:
                status: error
                info:
                  engine: { status: up }
                error:
                  database:
                    status: down
                    message: SELECT 1 failed (ECONNREFUSED)
                details:
                  engine: { status: up }
                  database:
                    status: down
                    message: SELECT 1 failed (ECONNREFUSED)

components:
  # How a caller is recognised. One scheme, because there is one: the cookie the sign-in
  # flow lands.
  securitySchemes:
    ouroSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: |-
        The session cookie BetterAuth issues, removed by `/api/v1/auth/logout`. `HttpOnly`,
        `SameSite=Lax`, `Path=/`, seven days, and `Secure` over HTTPS — where it is also
        named `__Secure-better-auth.session_token`, the library adding the prefix a browser
        refuses to accept over plain HTTP.

        **It replaced `ouro_session` in
        [#703](https://github.com/NobuData/ouroboros/issues/703)**, which invalidated every
        session live at the cut-over. A browser still holding the old cookie is answered
        `401` and told to drop it.

        It names a row in the `session` table — not a bearer token to be minted or pasted,
        and not a claim about who you are. `apiKey`/`cookie` is OpenAPI's nearest
        description of a cookie credential; it does not mean a client may compose one.

        A second cookie, `better-auth.session_data`, travels beside it: a signed snapshot of
        the session with a five-minute lifetime, which is what keeps an authenticated
        request from costing a database lookup. Nothing sends it deliberately and no client
        reads it.

        A browser sends it automatically. A cross-origin caller must also ask for it —
        `credentials: "include"` in `fetch` — and its origin must be listed in
        `OURO_CORS_ORIGINS`, because a credentialed cross-origin request may not be
        answered with a wildcard.

  # Every path parameter and the two query parameters the pagination convention defines.
  # Referenced rather than repeated: `tenantId` appears on fifteen operations, and fifteen
  # copies of a description is fifteen places for one of them to say something else.
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      description: The tenant's id.
      schema:
        type: string
        format: uuid
      example: 9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10

    DomainId:
      name: domainId
      in: path
      required: true
      description: The domain's id. It must belong to the tenant in the path.
      schema:
        type: string
        format: uuid
      example: 4d2a8b31-7c65-4e0a-9f38-1b6c2d5e7a94

    UserId:
      name: userId
      in: path
      required: true
      description: |-
        The person's id. A membership is the `(tenant, person)` pair rather than a row with
        an identity of its own, so this is what addresses one.
      schema:
        type: string
        format: uuid
      example: c7b1e2f4-5a63-4d8e-b0c9-7f2a1d3e6b85

    OrgLogin:
      name: login
      in: path
      required: true
      description: |-
        The organisation's GitHub login — the `NobuData` in github.com/NobuData, lower-cased.
        GitHub treats logins case-insensitively, so they are stored folded and one casing is
        the only one that resolves.
      schema:
        type: string
        pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        minLength: 1
        maxLength: 39
      example: nobudata

    RepoName:
      name: name
      in: path
      required: true
      description: |-
        The repository's name within its organisation, without the owner prefix — the
        `ouroboros` in NobuData/ouroboros, lower-cased.
      schema:
        type: string
        pattern: ^[a-z0-9._-]+$
        minLength: 1
        maxLength: 100
      example: ouroboros

    TenantHeader:
      name: X-Ouro-Tenant
      in: header
      required: false
      description: |-
        The workspace this request is operating in — its slug or its uuid.

        On the operations below it is **optional and redundant**: they already name a
        workspace in their path, which is the more specific of the two, and a header that
        names a *different* one is a `422` with `code: "tenant_mismatch"` rather than a
        silent preference for either. It is accepted here so that one client can set it on
        every request, and it is how the operations that have no workspace in their path —
        everything the epic adds after this one — say which workspace they mean.

        A caller who belongs to exactly one workspace may omit it everywhere; theirs is
        inferred. A caller who belongs to several, on an operation with no `{tenantId}`,
        gets a `422` with `code: "tenant_required"`.
      schema:
        type: string
        minLength: 1
        maxLength: 63
      examples:
        slug:
          summary: By slug — what a person types
          value: acme
        id:
          summary: By id
          value: 9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10

    Limit:
      name: limit
      in: query
      required: false
      description: |-
        How many rows to return. The ceiling is not a suggestion: without it, a `limit` of a
        million is a client's way of asking this service to hold a table in memory, and the
        request that does it is indistinguishable from a mistake in a loop.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25

    Offset:
      name: offset
      in: query
      required: false
      description: How many rows to skip.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0

  schemas:
    Error:
      type: object
      title: Error
      description: |-
        The body of **every** error this API answers with, and the same shape
        `ouroboros-engine` uses behind it (`docs/ARCHITECTURE.md` § 5.3). A failure the
        framework produced — a path no route claims, a body the parser refused — carries it
        too, so a client has one thing to parse rather than one per layer.
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: |-
            Stable, machine-readable, and the thing to branch on. Every code this API can
            answer with is named in the description of the response that carries it.
          examples: [domain_taken, tenant_not_found, last_owner, validation_failed]
        message:
          type: string
          description: |-
            Written for a person. It may name a value the caller sent and never names
            anything about the service's own internals — no driver text, no stack, no
            constraint. A `500`'s message is a constant for exactly that reason.
          examples: [That domain belongs to another tenant.]
        details:
          type: object
          description: |-
            Whatever is specific to this failure — the field messages of a `422`, keyed by
            field path; the identifier a `404` was asked about; the constraint a generic
            conflict tripped. Always present, empty rather than absent when there is nothing
            to add, so a client reading `details.x` never has to check `details` first.
          additionalProperties: true
          examples:
            - slug: ["slug must be lower-case letters, digits and single hyphens"]
            - {}

    Session:
      type: object
      title: Session
      description: |-
        Who is signed in, and everything the application shell needs before it can render:
        the person, the workspaces they may switch between, and — only when there are none —
        the workspace their email domain points at.
      additionalProperties: false
      required: [user, memberships, tenantSuggestion]
      properties:
        user:
          $ref: "#/components/schemas/SessionUser"
        memberships:
          type: array
          description: |-
            Every tenant this person belongs to, by the tenant's name and then its id.
            Empty for somebody who has signed in and been invited nowhere.
          items:
            $ref: "#/components/schemas/Membership"
        tenantSuggestion:
          description: |-
            A workspace worth asking to join, or `null`.

            Non-null only when `memberships` is empty *and* the domain of this person's
            address is one some tenant has registered. It grants nothing: matching a domain
            is not membership, and the tenant is named so a first-run screen can say "your
            organisation is already here, ask an owner to add you" rather than dropping a
            new signee into an empty product.
          oneOf:
            - $ref: "#/components/schemas/TenantSuggestion"
            - type: "null"

    SessionUser:
      type: object
      title: SessionUser
      description: |-
        The signed-in person. Global rather than tenant-scoped: one human is one row however
        many workspaces they belong to.
      additionalProperties: false
      required: [id, email, displayName, avatarUrl, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [5eed0003-0000-4000-8000-000000000001]
        email:
          type: string
          format: email
          description: |-
            Lower-cased and unique. How a person is recognised — including as the recipient
            of an invitation sent before they ever signed in — and not how they
            authenticate.
          examples: [ken@acme-robotics.dev]
        displayName:
          type: string
          minLength: 1
          description: |-
            Their name on GitHub, or their login when they have set none. Refreshed on every
            sign-in.
          examples: [Ken Suenobu]
        avatarUrl:
          description: |-
            The avatar GitHub hosts, or `null` when none is known — which is what makes the
            UI draw a monogram instead.
          oneOf:
            - type: string
              format: uri
            - type: "null"
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]

    Membership:
      type: object
      title: Membership
      description: |-
        One workspace the signed-in person belongs to, and the role they hold there.
        Flattened rather than nested, because it is one row of a workspace switcher.
      additionalProperties: false
      required: [tenantId, slug, displayName, status, role, invitedAt, joinedAt]
      properties:
        tenantId:
          type: string
          format: uuid
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          examples: [acme]
        displayName:
          type: string
          examples: ["Acme, Inc."]
        status:
          type: string
          enum: [active, suspended, deleted]
          description: The tenant's lifecycle, so a switcher can render a suspended one as such.
          examples: [active]
        role:
          type: string
          enum: [owner, admin, member, viewer]
          description: What this person may do in this tenant.
          examples: [owner]
        invitedAt:
          type: string
          format: date-time
          description: When the invitation was issued; also when the membership came into being.
          examples: ["2026-08-11T10:20:23.114Z"]
        joinedAt:
          description: |-
            When it was accepted, or `null` while the invitation is outstanding. Null is
            preserved rather than defaulted: "not joined yet" and "joined at the epoch" are
            different facts.
          oneOf:
            - type: string
              format: date-time
            - type: "null"

    TenantSuggestion:
      type: object
      title: TenantSuggestion
      description: |-
        A tenant whose registered email domain matches the signed-in person's address.
        Deliberately thin — an id, a handle and a name — because it is shown to somebody who
        is *not* a member, so the tenant's lifecycle and timestamps are none of their
        business.
      additionalProperties: false
      required: [tenantId, slug, displayName]
      properties:
        tenantId:
          type: string
          format: uuid
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          examples: [acme]
        displayName:
          type: string
          examples: ["Acme, Inc."]

    Tenant:
      type: object
      title: Tenant
      description: An isolated customer workspace — the root of everything else in the API.
      additionalProperties: false
      required: [id, slug, displayName, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          description: Stable for the tenant's whole life. The slug is not; this is what to store.
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 63
          description: |-
            The URL- and CLI-safe handle, unique across the installation. DNS-label shaped,
            which keeps it usable if one is ever wanted as a subdomain.
          examples: [acme]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: What a human reads. Free text; it carries no machine meaning.
          examples: ["Acme, Inc."]
        status:
          type: string
          enum: [active, suspended, deleted]
          description: |-
            The lifecycle. `deleted` is a soft-delete marker: the row and everything
            cascading from it survive, so it is recoverable.
          examples: [active]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          description: Maintained by the database on every write; never accepted from a client.
          examples: ["2026-08-11T10:20:23.114Z"]

    TenantPage:
      type: object
      title: TenantPage
      description: One page of tenants.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          description: The rows for this window, oldest first.
          items:
            $ref: "#/components/schemas/Tenant"
        total:
          type: integer
          minimum: 0
          description: How many rows there are in total, ignoring the window.
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: The window that was applied — the default, when the request named none.
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    Domain:
      type: object
      title: Domain
      description: An email domain that resolves a tenant at sign-in.
      additionalProperties: false
      required: [id, tenantId, domain, isPrimary, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [4d2a8b31-7c65-4e0a-9f38-1b6c2d5e7a94]
        tenantId:
          type: string
          format: uuid
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        domain:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          maxLength: 253
          description: |-
            Lower-cased, and unique across the whole installation rather than within the
            tenant — a domain names exactly one tenant at sign-in.
          examples: [acme.example]
        isPrimary:
          type: boolean
          description: |-
            The domain the product displays back. At most one per tenant, and zero is legal
            for a tenant part-way through setting itself up.
          examples: [true]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]

    DomainPage:
      type: object
      title: DomainPage
      description: One page of a tenant's domains, the primary first.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Domain"
        total:
          type: integer
          minimum: 0
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    Member:
      type: object
      title: Member
      description: |-
        A person's membership of one tenant, with the person's own details alongside — one
        row of a member table.

        Flattened rather than nested, and with no id of its own: the membership *is* the
        `(tenantId, userId)` pair, which is what a `PATCH` or a `DELETE` addresses.
      additionalProperties: false
      required: [tenantId, userId, email, displayName, avatarUrl, role, invitedAt, joinedAt]
      properties:
        tenantId:
          type: string
          format: uuid
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        userId:
          type: string
          format: uuid
          examples: [c7b1e2f4-5a63-4d8e-b0c9-7f2a1d3e6b85]
        email:
          type: string
          format: email
          maxLength: 320
          description: |-
            Lower-cased and unique across the installation. How a person is recognised and
            contacted — not how they authenticate.
          examples: [ada@acme.example]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |-
            What the member list prints. For somebody who has never signed in this is the
            name their inviter gave, or the local part of their address.
          examples: [Ada Lovelace]
        avatarUrl:
          type: [string, "null"]
          maxLength: 2048
          description: |-
            An `http(s)` URL, or `null` when none is known — which is every person who has
            not signed in yet. A placeholder is the UI's decision, so none is invented here.
          examples: ["https://avatars.example/ada.png", null]
        role:
          type: string
          enum: [owner, admin, member, viewer]
          description: What this person may do in this tenant.
          examples: [owner]
        invitedAt:
          type: string
          format: date-time
          description: When the invitation was issued. Also when the membership came into being.
          examples: ["2026-08-11T10:20:23.114Z"]
        joinedAt:
          type: [string, "null"]
          format: date-time
          description: |-
            When it was accepted, or `null` while it is outstanding — a real state the member
            list renders, and what an invitation looks like until #33's sign-in exists.
          examples: ["2026-08-11T10:24:51.400Z", null]

    MemberPage:
      type: object
      title: MemberPage
      description: One page of a tenant's members, by name.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Member"
        total:
          type: integer
          minimum: 0
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    Org:
      type: object
      title: Org
      description: A GitHub organisation a tenant has recorded, enabled or not.
      additionalProperties: false
      required: [id, tenantId, login, enabled, installedAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [2e5f7a19-3b4c-4d6e-8f01-9a2b3c4d5e6f]
        tenantId:
          type: string
          format: uuid
          examples: [9f1c0a5e-0f6d-4a1b-9d5e-2b8f3c7a4e10]
        login:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 1
          maxLength: 39
          description: Lower-cased GitHub login, unique within the tenant.
          examples: [nobudata]
        enabled:
          type: boolean
          description: |-
            Whether Ouroboros may operate in it. A row records that the organisation is
            known; this records that somebody deliberately turned it on.
          examples: [true]
        installedAt:
          type: [string, "null"]
          format: date-time
          description: |-
            When the GitHub App was installed. `null` on every row today — the installation
            flow is future product work, and a default would assert something that never
            happened.
          examples: [null]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]

    OrgPage:
      type: object
      title: OrgPage
      description: One page of a tenant's GitHub organisations, by login.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Org"
        total:
          type: integer
          minimum: 0
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    Repo:
      type: object
      title: Repo
      description: |-
        A repository within an organisation. In scope for Ouroboros only when this `enabled`
        and its organisation's are **both** true.
      additionalProperties: false
      required: [id, orgId, name, enabled, defaultBranch, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
          examples: [7a3d9c21-8e4f-4b5a-9c6d-0e1f2a3b4c5d]
        orgId:
          type: string
          format: uuid
          description: |-
            The organisation it hangs from. The tenant is reachable through that, and a
            second copy of the fact here could disagree with it.
          examples: [2e5f7a19-3b4c-4d6e-8f01-9a2b3c4d5e6f]
        name:
          type: string
          pattern: ^[a-z0-9._-]+$
          minLength: 1
          maxLength: 100
          description: Lower-cased, without the owner prefix. Unique within the organisation.
          examples: [ouroboros]
        enabled:
          type: boolean
          description: Independent of the organisation's flag, so suspending one preserves this.
          examples: [true]
        defaultBranch:
          type: [string, "null"]
          maxLength: 255
          description: |-
            The branch work is cut from, or `null` until it has been discovered from GitHub.
            An enable/disable that omits it leaves it alone rather than clearing it.
          examples: [main, null]
        createdAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]
        updatedAt:
          type: string
          format: date-time
          examples: ["2026-08-11T10:20:23.114Z"]

    RepoPage:
      type: object
      title: RepoPage
      description: One page of an organisation's repositories, by name.
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Repo"
        total:
          type: integer
          minimum: 0
          examples: [1]
        limit:
          type: integer
          minimum: 1
          maximum: 100
          examples: [25]
        offset:
          type: integer
          minimum: 0
          examples: [0]

    CreateTenantRequest:
      type: object
      title: CreateTenantRequest
      description: |-
        The body of `POST /api/v1/tenants`.

        Request schemas are closed, as the response schemas are: a property this document
        does not list is refused rather than ignored, which is what closes mass assignment
        for every route at once instead of per handler.
      additionalProperties: false
      required: [slug, displayName]
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 63
          examples: [acme]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          examples: ["Acme, Inc."]

    UpdateTenantRequest:
      type: object
      title: UpdateTenantRequest
      description: |-
        The body of `PATCH /api/v1/tenants/{tenantId}`. Every field optional; a body naming
        none of them is a no-op that answers with the tenant unchanged.
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 2
          maxLength: 63
          examples: [acme]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          examples: [Acme Corporation]
        status:
          type: string
          enum: [active, suspended, deleted]
          examples: [suspended]

    CreateDomainRequest:
      type: object
      title: CreateDomainRequest
      description: The body of `POST /api/v1/tenants/{tenantId}/domains`.
      additionalProperties: false
      required: [domain]
      properties:
        domain:
          type: string
          pattern: ^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$
          maxLength: 253
          description: |-
            Lower-cased. An address with upper case in it is refused rather than folded —
            folding would mean the value stored is not the value sent, which is the beginning
            of a client that cannot predict what a `GET` returns.
          examples: [acme.example]
        isPrimary:
          type: boolean
          default: false
          description: Make this the displayed domain, demoting whichever one holds it now.
          examples: [true]

    UpdateDomainRequest:
      type: object
      title: UpdateDomainRequest
      description: |-
        The body of `PATCH /api/v1/tenants/{tenantId}/domains/{domainId}`. One field, because
        it is the only thing about a domain that can change: the domain itself is what the
        row *is*, and renaming one is adding the new and removing the old.
      additionalProperties: false
      required: [isPrimary]
      properties:
        isPrimary:
          type: boolean
          examples: [true]

    InviteMemberRequest:
      type: object
      title: InviteMemberRequest
      description: The body of `POST /api/v1/tenants/{tenantId}/members`.
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          description: |-
            Who to invite. Lower-cased before the lookup — the one value this API normalises
            rather than refuses, because an address is typed by a person into a form and
            `Ada@acme.example` is not a mistake worth an error message.
          examples: [grace@acme.example]
        role:
          type: string
          enum: [owner, admin, member, viewer]
          examples: [admin]
        displayName:
          type: string
          minLength: 1
          maxLength: 200
          description: |-
            What to call them if this is the first Ouroboros has heard of them. Ignored when
            the person already exists — their own name is not an inviter's to overwrite.
            Omitted, the local part of the address is used.
          examples: [Grace Hopper]

    UpdateMemberRequest:
      type: object
      title: UpdateMemberRequest
      description: The body of `PATCH /api/v1/tenants/{tenantId}/members/{userId}`.
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          enum: [owner, admin, member, viewer]
          examples: [admin]

    CreateOrgRequest:
      type: object
      title: CreateOrgRequest
      description: The body of `POST /api/v1/tenants/{tenantId}/orgs`.
      additionalProperties: false
      required: [login]
      properties:
        login:
          type: string
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          minLength: 1
          maxLength: 39
          examples: [nobudata]
        enabled:
          type: boolean
          default: false
          description: |-
            Off unless asked. Anything arriving by a path nobody has thought about yet
            arrives switched off, which is the right posture for a flag whose whole job is to
            bound what an autonomous agent may touch.
          examples: [true]

    UpdateOrgRequest:
      type: object
      title: UpdateOrgRequest
      description: The body of `PATCH /api/v1/tenants/{tenantId}/orgs/{login}`.
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          examples: [false]

    UpdateRepoRequest:
      type: object
      title: UpdateRepoRequest
      description: |-
        The body of `PATCH /api/v1/tenants/{tenantId}/orgs/{login}/repos/{name}`, which is
        also how a repository is first recorded.
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
          examples: [true]
        defaultBranch:
          type: string
          maxLength: 255
          description: |-
            The branch work is cut from. Left alone when omitted rather than cleared. The
            shape is an allow-list — letters, digits, dot, underscore, hyphen and slash, with
            no leading or trailing slash, no empty segment, no leading dot and no `..`
            anywhere — because the value is joined onto a filesystem path.
          examples: [main]

    EngineStatus:
      type: object
      title: EngineStatus
      description: The body of a `GET /api/v1/engine/status` response.
      additionalProperties: false
      required: [engine, version]
      properties:
        engine:
          type: string
          const: up
          description: |-
            Always `up`, and that is honest rather than redundant: every way the engine can
            fail to answer is a `502`, so a body that exists at all came from a reachable
            engine. It is a field rather than nothing so the shape can grow a second state —
            `degraded`, once there is something that could be degraded — without changing how
            a client reads the first one.
          examples: [up]
        version:
          type: string
          description: |-
            The engine build that answered, read from its package metadata. It is the
            engine's version and not this service's: the two are released independently
            (`docs/CONVENTIONS.md` § 8), and which pair is deployed together is exactly what
            this route exists to tell you.
          examples: ["0.3.0"]

    Heartbeat:
      type: object
      title: Heartbeat
      description: The body of a `GET /api/v1` response.
      additionalProperties: false
      required: [service, version, status, uptimeSeconds]
      properties:
        service:
          type: string
          const: ouroboros-rest
          description: This service's name, constant across deployments.
          examples: [ouroboros-rest]
        version:
          type: string
          description: |-
            The running build, read from this module's `package.json` — the one place a
            module's version is written down (`docs/CONVENTIONS.md` § 8), and the same
            string `info.version` above carries.
          examples: ["0.1.0"]
        status:
          type: string
          const: ok
          description: |-
            Always `ok`. Reaching this handler at all is what the field reports; a client
            reads the status code, and this is for the human who runs the request by
            hand.
          examples: [ok]
        uptimeSeconds:
          type: number
          minimum: 0
          description: |-
            Seconds since the service was constructed, to millisecond precision. Small
            and shrinking across polls means something is restarting the process — which
            is the one thing a heartbeat can tell you that a plain `200` cannot.
          examples: [3.885]

    HealthReport:
      type: object
      title: HealthReport
      description: |-
        The body of both probes — one shape, so a reader parses one thing.

        It is `@nestjs/terminus`'s report, and the three sections are the same dependencies
        seen three ways: `info` holds the ones that are up, `error` the ones that are down,
        and `details` holds all of them. All three are always present, and all three are
        empty for `/health/live`, which has no dependencies to report on.
      additionalProperties: false
      required: [status, info, error, details]
      properties:
        status:
          type: string
          enum: [ok, error, shutting_down]
          description: |-
            `ok` when every dependency answered, `error` when one did not — and
            `shutting_down` when the process has been told to stop, at which point it should
            neither be sent traffic nor be counted live.
          examples: [ok]
        info:
          $ref: "#/components/schemas/DependencyStatuses"
          description: The dependencies that answered.
        error:
          $ref: "#/components/schemas/DependencyStatuses"
          description: The dependencies that did not, each with a reason.
        details:
          $ref: "#/components/schemas/DependencyStatuses"
          description: Every dependency, whatever it reported.

    DependencyStatuses:
      type: object
      title: DependencyStatuses
      description: |-
        Dependencies, keyed by name. `/health/ready` reports two of them — `database` and
        `engine` — and the map is open because a dependency added later is a key added here
        rather than a new shape.
      additionalProperties:
        $ref: "#/components/schemas/DependencyStatus"
      examples:
        - database: { status: up }
          engine: { status: up }

    DependencyStatus:
      type: object
      title: DependencyStatus
      description: What one dependency reported when it was asked.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [up, down]
          description: Whether this dependency answered.
          examples: [up]
        message:
          type: string
          description: |-
            Present when the status is `down`: what was attempted, and a classification of
            why it failed — `SELECT 1 failed (ECONNREFUSED)`, `GET /healthz responded 503`,
            `SELECT 1 timed out after 2000 ms`. Never a driver's own message; this route
            answers without authentication, and a driver names the host, the port and the
            role it could not reach with.
          examples: [SELECT 1 failed (ECONNREFUSED)]
