# Yarn 4 configuration for the workspace root (docs/CONVENTIONS.md § 3).
#
# This is the only .yarnrc.yml the application modules read: Yarn resolves its
# configuration from the project root, so ouroboros-ui and ouroboros-rest inherit it
# rather than each carrying a copy that could drift. ouroboros-web is deliberately not a
# workspace — it keeps its own .yarnrc.yml and its own lockfile.

# node_modules rather than Plug'n'Play. Next.js, ESLint and Vitest all resolve from a
# real node_modules tree, and the production images copy one; PnP would mean a `.pnp.cjs`
# every one of them has to be taught about for no gain.
nodeLinker: node-modules
