# Ouroboros label definitions — the source of truth for this repository's labels.
#
# Apply them to GitHub with:
#
#   scripts/sync-labels.sh --dry-run    # show what would change
#   scripts/sync-labels.sh              # create missing, update drifted
#
# Filed as issue #9. The label taxonomy is documented in
# docs/CONVENTIONS.md § 7 (Git & GitHub).
#
# Format — a top-level list; every entry is exactly these three keys, each value
# double-quoted, parsed by scripts/lib/parse-labels.awk:
#
#   - name: "<= 50 characters, unique>"
#     color: "six hex digits, no leading #"
#     description: "<= 100 characters, no double quotes"
#
# GitHub's own defaults that this repository does not use (`enhancement`,
# `duplicate`, `good first issue`, `help wanted`, `invalid`, `question`,
# `wontfix`) are deliberately absent: the sync script never deletes, so they are
# reported as extras and left alone.

# ── Release scoping ───────────────────────────────────────────────────────────
# Which release a piece of work belongs to. Every work issue carries exactly one.

- name: "mvp"
  color: "3dd6f5"                       # brand accent cyan
  description: "Targeted for the v1 / MVP release"

- name: "v2"
  color: "6f42c1"
  description: "Extended scope — after MVP"

# ── Module routing ────────────────────────────────────────────────────────────
# Which module of the monorepo the work lands in. An issue may carry several.

- name: "ui"
  color: "1d76db"
  description: "ouroboros-ui (Next.js product UI)"

- name: "rest"
  color: "0e8a16"
  description: "ouroboros-rest (NestJS communications layer)"

- name: "db"
  color: "b60205"
  description: "ouroboros-db (PostgreSQL + Flyway)"

- name: "engine"
  color: "fbca04"
  description: "ouroboros-engine (Python / FastAPI backend)"

# ── Cross-cutting ─────────────────────────────────────────────────────────────
# Concerns that belong to no single module.

- name: "infra"
  color: "5319e7"
  description: "Repo infrastructure, containers, dev environment"

- name: "design"
  color: "e99695"
  description: "Brand assets, design system, theming"

- name: "ci"
  color: "c2e0c6"
  description: "Continuous integration and automation"

- name: "epic"
  color: "d4c5f9"
  description: "Epic — parent tracking issue"

# GitHub defaults this repository does use, pinned here so a repo whose defaults
# were deleted can be rebuilt from this file alone.

- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

