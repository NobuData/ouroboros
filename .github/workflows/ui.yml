name: ouroboros-ui · ci

# Path-filtered per issue #11: this runs only when the product UI, the pipeline it
# shares with ouroboros-rest, the workspace this module resolves its dependencies
# through, or this file itself changes. A pull request that touches only another module
# never queues it.
#
# The four root files are here because #13 made this module a Yarn workspace: the
# lockfile it installs from and the manifest that lockfile answers to now live at the
# repository root, so a change to either can break this build without touching a single
# file under ouroboros-ui/.
#
# ouroboros-rest/openapi.json is here because of #43. The UI's API client is *generated*
# from that document and committed (`yarn api:sync` → app/api/schema.d.ts), so a pull
# request that renames a field there and nowhere else must still run these checks: the
# suite fails while the generated types are stale, and without this path it would never
# be queued to say so.

on:
  pull_request:
    branches: [main]
    paths:
      - "ouroboros-ui/**"
      - "ouroboros-rest/openapi.json"
      - ".github/actions/node-module/**"
      - ".github/actions/scaffold-gate/**"
      - ".github/workflows/ui.yml"
      - "package.json"
      - "yarn.lock"
      - "turbo.json"
      - ".yarnrc.yml"
  push:
    branches: [main]
    paths:
      - "ouroboros-ui/**"
      - "ouroboros-rest/openapi.json"
      - ".github/actions/node-module/**"
      - ".github/actions/scaffold-gate/**"
      - ".github/workflows/ui.yml"
      - "package.json"
      - "yarn.lock"
      - "turbo.json"
      - ".yarnrc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check name — `ci/ui`, matching `ci/rest`, `ci/engine`
  # and `ci/db`. Renaming it renames what branch protection is configured against.
  ci:
    name: ci/ui
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/node-module
        with:
          module: ouroboros-ui
          scaffolded-by: "#39"

  # ---------------------------------------------------------------------------
  # The published artefact — ouroboros-ui/Dockerfile, this module in the form something
  # other than a laptop can run: the Next.js standalone output on a runtime that carries
  # no toolchain (§ 5).
  #
  # It lives in this workflow rather than in docker-publish.yml for the reason `publish/db`
  # does: `needs: ci` is what makes the tag mean something. The image is the code the job
  # above linted, typechecked, tested and built, so a red run publishes nothing. A second
  # workflow watching the same directory would publish on its own schedule and there would
  # be no order between the two.
  # ---------------------------------------------------------------------------
  publish:
    name: publish/ui
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built on every event, including a pull request, and with no credentials in the
      # step at all: what a pull request has to answer is whether the image still builds
      # from this checkout — a broken Dockerfile is worth reporting on the change that
      # broke it rather than on the merge that publishes it. A fork's pull request has no
      # secrets, so a step that needed them could not answer that question at all.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          # The repository root, not the module: this is a Yarn workspace and the
          # lockfile it installs from lives at the root, so a context of ouroboros-ui/
          # alone could not run an immutable install. `Dockerfile.dockerignore` beside the
          # Dockerfile is what keeps this module's ignores in this module — BuildKit reads
          # it in preference to the context's own. See docs/CONVENTIONS.md § 5.
          context: .
          file: ouroboros-ui/Dockerfile
          push: false
          # A cache of its own. The default scope is one bucket shared by every image in
          # the repository, and four unrelated builds evicting each other's layers is a
          # cache that costs more than it saves.
          cache-from: type=gha,scope=ouroboros-ui
          cache-to: type=gha,mode=max,scope=ouroboros-ui

      # Everything below this line runs on a push to main or a manual dispatch, never on
      # a pull request — the same rule db.yml and docker-publish.yml apply.
      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_HOSTNAME }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The same build again, which the layer cache above makes a no-op, so what this step
      # actually does is tag and push what the previous step proved. Splitting it this way
      # is what lets the build run without credentials.
      #
      # Two tags, and the immutable one is the point: `latest` is what a deploy tracking
      # main pulls, and the commit sha is what a rollback or an audit names.
      - name: Push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ouroboros-ui/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HOSTNAME }}/ouroboros-ui:latest
            ${{ secrets.DOCKER_HOSTNAME }}/ouroboros-ui:${{ github.sha }}
          cache-from: type=gha,scope=ouroboros-ui
