name: ouroboros-docs · ci

# The documentation site (#1168). Docs rot silently unless every change that can break them
# builds them strictly, so this runs the module's own checks — lint (ESLint, Stylelint and
# markdownlint over the pages), typecheck, the Vitest suite, and the build, in which a broken
# link, Markdown link or anchor fails — whenever one of their inputs changes. A pull request
# that touches only another module never queues it.
#
# The inputs outside ouroboros-docs/ are the files the site's checks read:
#
# - docs/design/tokens.css, docs/brand/**, the mockups' two logo crops and ouroboros-ui's
#   four tab and home-screen icons are the sources of the brand copies the site keeps
#   (scripts/sync-brand.mjs, #1166). Its suite fails when a copy has drifted, so an edit to a
#   source has to run it — otherwise the drift surfaces on the next docs change instead of on
#   the change that caused it. The icons are named file by file: the rest of ouroboros-ui is
#   no input of this site.
# - .env.example, the runner's main.go and its install.sh feed the generated configuration
#   reference (#1191), the CLI flag drift check (#1203) and the docs coverage gate (#1212).
#   They are watched from the start so those checks are routed the day they land.
# - ouroboros-ui's page.tsx files are the product's routes, which the coverage gate holds to
#   docs-coverage.json (#1212): a new route without a doc page fails here, on the change that
#   added it. Only the page files are watched; the rest of the UI stays ci/ui's alone.
#
# The site is not a Yarn workspace (docs/CONVENTIONS.md § 1, limit 6): it installs from its
# own ouroboros-docs/yarn.lock, so the root workspace files are not inputs either.
#
# The checks run through the shared TypeScript pipeline, which is where the Node version is
# pinned (§ 9) — so the two actions it is made of are inputs too.

on:
  pull_request:
    branches: [main]
    paths:
      - "ouroboros-docs/**"
      - "docs/design/tokens.css"
      - "docs/brand/**"
      - "docs/mockups/assets/logo-lockup.png"
      - "docs/mockups/assets/logo-mark.png"
      - "ouroboros-ui/public/favicon.ico"
      - "ouroboros-ui/public/favicon-32-light.png"
      - "ouroboros-ui/public/favicon-32-dark.png"
      - "ouroboros-ui/public/apple-touch-icon.png"
      - ".env.example"
      - "ouroboros-runner/cmd/ouroboros-runner/main.go"
      - "ouroboros-runner/install.sh"
      - "ouroboros-ui/app/**/page.tsx"
      - ".github/actions/node-module/**"
      - ".github/actions/scaffold-gate/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "ouroboros-docs/**"
      - "docs/design/tokens.css"
      - "docs/brand/**"
      - "docs/mockups/assets/logo-lockup.png"
      - "docs/mockups/assets/logo-mark.png"
      - "ouroboros-ui/public/favicon.ico"
      - "ouroboros-ui/public/favicon-32-light.png"
      - "ouroboros-ui/public/favicon-32-dark.png"
      - "ouroboros-ui/public/apple-touch-icon.png"
      - ".env.example"
      - "ouroboros-runner/cmd/ouroboros-runner/main.go"
      - "ouroboros-runner/install.sh"
      - "ouroboros-ui/app/**/page.tsx"
      - ".github/actions/node-module/**"
      - ".github/actions/scaffold-gate/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check name — `ci/docs`, matching `ci/ui`, `ci/rest` and the
  # rest. Renaming it renames what branch protection is configured against.
  ci:
    name: ci/docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # corepack → yarn install --immutable → lint → typecheck → test → build, from inside
      # ouroboros-docs/, against its own lockfile and scripts.
      - uses: ./.github/actions/node-module
        with:
          module: ouroboros-docs
          scaffolded-by: "#1164"

      # Screenshots cannot be captured in CI, but they can be checked (#1172): every manifest
      # entry has both theme files, every <Screenshot id> on a page is in the manifest, no
      # image belongs to no entry, and D6's budgets hold. Stale captures are only reported.
      - name: Screenshot integrity
        working-directory: ouroboros-docs
        run: yarn check:screenshots

      # The configuration reference is generated from the root .env.example (#1191). A variable
      # added or reworded there without `yarn gen:config-reference` fails here, naming the fix.
      - name: Configuration reference is current
        working-directory: ouroboros-docs
        run: yarn check:config-reference

      # The CLI reference pages list their flags in front matter (#1203). A flag added to the
      # runner's usage text in main.go, or to install.sh's, without documenting it fails here.
      - name: CLI flags are documented
        working-directory: ouroboros-docs
        run: yarn check:cli-flags

      # The coverage gate (#1212): every UI route has an entry in docs-coverage.json naming
      # its page (or why it has none), every variable is in the reference and every flag on
      # its page — one command over the three, so an undocumented route fails the build that
      # added it.
      - name: Docs coverage
        working-directory: ouroboros-docs
        run: yarn check:coverage

      # A green build can still produce an image that serves nothing (#1208). So the image is
      # built here, on every event, loaded into this runner's daemon and never pushed — no
      # credential is involved, so a fork's pull request runs it too — and then run and probed:
      # /healthz, the three section roots, a deep page, a 404 and the footer's copyright line.
      # A failure here fails ci/docs, which is what publish/docs needs, so a broken image is
      # never published. The cache scope is publish/docs' own, so its build is a cache hit.
      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: ouroboros-docs
          file: ouroboros-docs/Dockerfile
          push: false
          load: true
          tags: ouroboros-docs:smoke
          cache-from: type=gha,scope=ouroboros-docs
          cache-to: type=gha,mode=max,scope=ouroboros-docs

      - name: Smoke-test the image
        working-directory: ouroboros-docs
        run: scripts/smoke-image.sh ouroboros-docs:smoke

  # ---------------------------------------------------------------------------
  # publish/docs — the documentation site's image (#1207, roadmap decision D9).
  #
  # `needs: ci` is what makes a tag mean something: the image is the checkout the job above
  # linted, typechecked, tested and built strictly, so a red ci/docs publishes nothing. The
  # whole job is skipped on a pull request — a fork's pull request has no secrets, and the
  # login below must never be reached from one — so a pull request runs ci/docs alone.
  #
  # Unlike the application images, the registry is written here: D9 names it, and the
  # documentation is published to one place. The credentials are the repository's build
  # secrets DOCKER_USERNAME and DOCKER_PASSWORD, under exactly those names.
  # ---------------------------------------------------------------------------
  publish:
    name: publish/docs
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name != 'pull_request'
    env:
      REGISTRY: registry.apiome.dev
      IMAGE: ouroboros-docs
    steps:
      - uses: actions/checkout@v4

      # The module's own version is the third tag, and the image's version label.
      - name: Read the version
        id: meta
        run: |
          version=$(node -p 'require("./ouroboros-docs/package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # `latest` is what a deployment tracking main pulls, the commit sha is what a rollback or
      # an audit names, and the version is what a reader of the site's release notes asks for.
      # DOCS_SITE_URL is a repository variable, set only when the site is served somewhere other
      # than the config's default; empty, the default is used.
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: ouroboros-docs
          file: ouroboros-docs/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          build-args: |
            DOCS_SITE_URL=${{ vars.DOCS_SITE_URL }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
            CREATED=${{ steps.meta.outputs.created }}
          # A cache of its own, as every image in the repository keeps.
          cache-from: type=gha,scope=ouroboros-docs
          cache-to: type=gha,mode=max,scope=ouroboros-docs
