name: ouroboros-engine · ci

# Path-filtered per issue #11: this runs only when the Python backend, the scaffold gate
# it shares with the TypeScript modules, or this file itself changes.

on:
  pull_request:
    branches: [main]
    paths:
      - "ouroboros-engine/**"
      - ".github/actions/scaffold-gate/**"
      - ".github/workflows/engine.yml"
  push:
    branches: [main]
    paths:
      - "ouroboros-engine/**"
      - ".github/actions/scaffold-gate/**"
      - ".github/workflows/engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Python pin for the one Python module, kept here rather than in a step so it is
  # findable — docs/CONVENTIONS.md § 3. Its TypeScript counterpart is the `node-version`
  # default in .github/actions/node-module.
  PYTHON_VERSION: "3.12"

jobs:
  # The job name is the status check name — `ci/engine`. See ui.yml.
  ci:
    name: ci/engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect the scaffold
        id: gate
        uses: ./.github/actions/scaffold-gate
        with:
          module: ouroboros-engine
          manifest: pyproject.toml
          scaffolded-by: "#50"

      # Pinned to the exact release: setup-uv publishes no floating major past v7, and a
      # `uses:` that does not resolve fails the job while it is still being set up —
      # before the gate below has a chance to skip anything.
      - name: Install uv and Python ${{ env.PYTHON_VERSION }}
        if: steps.gate.outputs.scaffolded == 'true'
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # --locked is the uv equivalent of `yarn install --immutable`: a uv.lock that has
      # drifted from pyproject.toml fails the run instead of being silently refreshed.
      - name: Install dependencies
        if: steps.gate.outputs.scaffolded == 'true'
        shell: bash
        working-directory: ouroboros-engine
        run: uv sync --locked

      - name: Lint
        if: steps.gate.outputs.scaffolded == 'true'
        shell: bash
        working-directory: ouroboros-engine
        run: uv run ruff check .

      # ruff both lints and formats (docs/CONVENTIONS.md § 6), and only the formatter
      # catches formatting — `ruff check` passes happily on unformatted code.
      - name: Format
        if: steps.gate.outputs.scaffolded == 'true'
        shell: bash
        working-directory: ouroboros-engine
        run: uv run ruff format --check .

      - name: Test
        if: steps.gate.outputs.scaffolded == 'true'
        shell: bash
        working-directory: ouroboros-engine
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # The published artefact — ouroboros-engine/Dockerfile, this module in the form
  # something other than a laptop can run: the locked virtual environment with this
  # project installed into it, on a runtime that carries no toolchain (§ 5).
  #
  # It lives in this workflow rather than in docker-publish.yml for the reason
  # `publish/db` does: `needs: ci` is what makes the tag mean something. The image is the
  # code the job above linted, format-checked and tested, so a red run publishes nothing.
  # A second workflow watching the same directory would publish on its own schedule and
  # there would be no order between the two.
  # ---------------------------------------------------------------------------
  publish:
    name: publish/engine
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built on every event, including a pull request, and with no credentials in the
      # step at all: what a pull request has to answer is whether the image still builds
      # from this checkout — a broken Dockerfile is worth reporting on the change that
      # broke it rather than on the merge that publishes it. A fork's pull request has no
      # secrets, so a step that needed them could not answer that question at all.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          # The module directory, not the repository root: nothing here installs through
          # the workspace lockfile — package.json beside pyproject.toml is a workspace
          # adapter over a uv project — so ouroboros-engine/.dockerignore is the
          # allow-list that governs the context. See docs/CONVENTIONS.md § 5.
          context: ouroboros-engine
          file: ouroboros-engine/Dockerfile
          push: false
          # A cache of its own. The default scope is one bucket shared by every image in
          # the repository, and four unrelated builds evicting each other's layers is a
          # cache that costs more than it saves.
          cache-from: type=gha,scope=ouroboros-engine
          cache-to: type=gha,mode=max,scope=ouroboros-engine

      # Everything below this line runs on a push to main or a manual dispatch, never on
      # a pull request — the same rule db.yml and docker-publish.yml apply.
      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_HOSTNAME }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The same build again, which the layer cache above makes a no-op, so what this step
      # actually does is tag and push what the previous step proved. Splitting it this way
      # is what lets the build run without credentials.
      #
      # Two tags, and the immutable one is the point: `latest` is what a deploy tracking
      # main pulls, and the commit sha is what a rollback or an audit names.
      - name: Push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ouroboros-engine
          file: ouroboros-engine/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HOSTNAME }}/ouroboros-engine:latest
            ${{ secrets.DOCKER_HOSTNAME }}/ouroboros-engine:${{ github.sha }}
          cache-from: type=gha,scope=ouroboros-engine
