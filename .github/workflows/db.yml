name: ouroboros-db · ci

# Path-filtered per issue #11. The filter is wider than `ouroboros-db/**` because the
# checks below assert the whole data tier: the migrations, the compose stack that
# applies them, and the environment template that configures both. A change to any of
# the three can break it, so a change to any of the three has to run it.
#
# The last two entries are #710's, and they are the same argument one module further out.
# The drift check compares what Flyway applied against what BetterAuth expects, and the
# expectation is decided in `ouroboros-rest/src/auth` — by which plugins are enabled — and
# in `ouroboros-rest/package.json`, which pins the library version exactly. A bump there
# touches no file under `ouroboros-db/`, so without these it would merge without the check
# that exists to catch it ever running. `yarn.lock` is deliberately *not* watched: the pin
# is exact, so the lockfile cannot move `better-auth` on its own, and watching it would
# run the whole data tier for every unrelated dependency change.

on:
  pull_request:
    branches: [main]
    paths:
      - "ouroboros-db/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/db.yml"
      - "ouroboros-rest/src/auth/**"
      - "ouroboros-rest/package.json"
  push:
    branches: [main]
    paths:
      - "ouroboros-db/**"
      - "docker-compose.yml"
      - ".env.example"
      - ".github/workflows/db.yml"
      - "ouroboros-rest/src/auth/**"
      - "ouroboros-rest/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-db-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check name — `ci/db`. See ui.yml.
  ci:
    name: ci/db
    runs-on: ubuntu-latest

    # The throwaway database the live pass migrates (#24). It is created empty for every
    # run and thrown away with the runner, which is what makes "migrate from scratch"
    # mean it: nothing here has ever seen a previous version of these migrations.
    #
    # Same image the development stack pins in docker-compose.yml, so what a pull
    # request proves is what a developer gets. The pin is repeated rather than shared
    # because the `env` context is not available to a service definition — the
    # POSTGRES_IMAGE below carries the same string for the steps, and
    # scripts/verify-ci.sh asserts all three agree.
    #
    # The healthcheck is the same one the compose file uses, and for the same reason:
    # -U/-d are named explicitly because pg_isready otherwise probes as the OS user and
    # reports ready while the database being created is still absent. GitHub gates the
    # first step on it, so no step below races initdb.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ouroboros
          POSTGRES_PASSWORD: ouroboros
          POSTGRES_DB: ouroboros
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ouroboros -d ouroboros"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4

      # Node is here for one reason: #710's drift check reads BetterAuth's own schema
      # planner out of the installed dependency, so it needs the workspace installed and
      # ouroboros-rest built. It is set up before the file-read checks rather than beside
      # the step that uses it because the tooling suite exercises the check's
      # argument handling, which is JavaScript too.
      #
      # Pinned to the same Node the TypeScript pipeline pins — scripts/verify-ci.sh
      # asserts the two agree.
      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      # --immutable fails the run when the lockfile does not match package.json, rather
      # than quietly resolving something the developer never committed — the same reason
      # .github/actions/node-module gives.
      - name: Install dependencies
        run: yarn install --immutable

      # The auth configuration that decides the expected schema is TypeScript with
      # extensionless imports, which no runtime loads directly; the drift check reads the
      # built copy. Only this module is built — the whole workspace would drag in a
      # Next.js build that nothing here reads.
      - name: Build the service whose auth configuration decides the schema
        run: yarn workspace ouroboros-rest build

      # What can be asserted without a database: migration naming (the rule Flyway's own
      # -validateMigrationNaming enforces at run time), the pinned images and
      # healthcheck gate the stack depends on, credential hygiene, and that
      # .env.example still declares every variable anything in the repo reads.
      #
      # It needs no Docker daemon and no network, so it is seconds rather than minutes,
      # and it runs first: a misnamed migration is worth reporting before a database is
      # waited on.
      - name: Migration & data-tier contract
        run: scripts/verify-dev-env.sh

      # The module's own suite: run.sh and the scripts/ wrappers over it, exercised
      # against a synthetic module with both runners stubbed out (#19). Like the check
      # above it needs no daemon and no network — the stubs record the command that
      # would have run instead of running it.
      - name: Module tooling tests
        run: scripts/run-tests.sh ouroboros-db/tests

      # -----------------------------------------------------------------------------
      # The live pass (#24) — everything above is a file read; everything below applies
      # the migrations to a real PostgreSQL and asks it what it now enforces.
      # -----------------------------------------------------------------------------

      # The parameters everything below talks to that service with, written into the
      # environment here rather than declared in a job-level `env:` block.
      #
      # That is not a style choice. `OURO_DB_*` present in the environment deliberately
      # beats ouroboros-db/.env — it is the last word in run.sh's precedence — and the
      # tooling suite two steps up is the suite that *tests* that precedence, by writing
      # .env files and asserting what Flyway would have been given. In job scope these
      # would quietly make it assert this workflow instead, and it fails outright. Set
      # here, they exist for the live pass and for nothing before it.
      #
      # They are also the development defaults run.sh falls back to on its own, so this
      # block changes nothing about which database is migrated. It is written out so the
      # workflow says which one that is.
      - name: Point the migration commands at that database
        run: |
          {
            echo "OURO_DB_HOST=localhost"
            echo "OURO_DB_PORT=5432"
            echo "OURO_DB_NAME=ouroboros"
            echo "OURO_DB_USER=ouroboros"
            echo "OURO_DB_PASSWORD=ouroboros"
            echo "OURO_DB_SCHEMA=ouroboros"
            # psql's own name for that same password. A throwaway container on a
            # throwaway runner holding the well-known development password is not a
            # secret, and keeping it out of GitHub secrets is what lets a developer
            # reproduce this job by hand.
            echo "PGPASSWORD=ouroboros"
            # The second database, migrated with the dev-seed overlay. See its step.
            echo "SEED_DB_NAME=ouroboros_seed"
            # The third, which rehearses #708's cut-over from a populated V005 state.
            echo "REHEARSAL_DB_NAME=ouroboros_rehearsal"
            # The fourth, left with an empty schema so #710's drift check can ask the
            # library to describe what it expects from nothing.
            echo "DRIFT_DB_NAME=ouroboros_drift"
            # The assertion files are plain SQL, so they need a psql — and this is the
            # one image the job has already pulled. Taking it from here rather than from
            # the runner's apt set means the client is pinned to the server's major
            # version and the step cannot break because a runner image dropped a package.
            echo "POSTGRES_IMAGE=postgres:17-alpine"
          } >> "$GITHUB_ENV"

      # `scripts/migrate` rather than a `flyway` command written out here, so CI applies
      # migrations the same way a developer does: it reads ouroboros-db/flyway.toml
      # through -workingDirectory exactly as the compose stack does, and with no `flyway`
      # on the runner's PATH it picks the pinned flyway/flyway:13-alpine image by itself.
      #
      # This is the whole point of the job. A migration that does not apply, applies out
      # of order, or contradicts one already applied fails here — on the pull request,
      # against an empty database, rather than on the next developer's laptop where the
      # schema has history in it.
      - name: Migrate a clean database
        run: ouroboros-db/scripts/migrate

      # Checksums and the naming rule, read back from the history the step above wrote.
      # It catches the one mistake `migrate` cannot: a versioned migration edited after
      # it was applied. On this database that is impossible by construction, so what it
      # really pins is the rule itself — `validate` is the command developers are told
      # to trust, and a run in which it stops working is one nobody would notice.
      - name: Validate the applied migrations
        run: ouroboros-db/scripts/validate

      # The behavioural half. `validate` compares checksums, so a `unique` on the wrong
      # columns, a cascade left off or a check that accepts what it should reject passes
      # it untouched; tests/constraints.sql creates fixtures, tries the things the
      # schema is supposed to refuse, and raises on the first rule that does not hold.
      # It runs in a transaction it rolls back, so it leaves the database as it found it.
      #
      # The transcript is kept, because one of the rules is not a refusal. V017's alias
      # validation (#221, decision P6) is deliberately a **warning** — discovery is not yet
      # universal, so an alias naming an undiscovered model is written rather than refused —
      # and nothing in SQL can catch a warning: a suite that had lost the trigger would be
      # exactly as green. The suite asserts the half it can see (the row is written); the
      # message is asserted here, in both of its branches, because *nothing has been
      # discovered yet* and *the catalog lists other models* are different states and one
      # message for both would make the first read like the second.
      - name: Assert what the schema enforces
        run: |
          docker run --rm --network=host \
            --env PGPASSWORD \
            --volume "$PWD/ouroboros-db/tests:/tests:ro" \
            "$POSTGRES_IMAGE" \
            psql -h "$OURO_DB_HOST" -p "$OURO_DB_PORT" -U "$OURO_DB_USER" -d "$OURO_DB_NAME" \
              -v ON_ERROR_STOP=1 -f /tests/constraints.sql \
              > "$RUNNER_TEMP/constraints.log" 2>&1 || { cat "$RUNNER_TEMP/constraints.log"; exit 1; }
          cat "$RUNNER_TEMP/constraints.log"
          for branch in 'nothing has been discovered on it yet' 'its catalog lists other models'; do
            grep -q "$branch" "$RUNNER_TEMP/constraints.log" && continue
            echo "the alias-to-unknown-model warning never fired: nothing matching \"$branch\"" >&2
            exit 1
          done

      # And the half that step cannot answer about itself (#69, and #221's own probe
      # criterion). A green constraints.sql proves the schema satisfies its assertions; it
      # does not prove the assertions are load-bearing, because a file asserting nothing
      # would be exactly as green. This drops one rule at a time — of the dashboard
      # read-model, the status and effort vocabularies, the terminal-run rule, the queue's
      # two keys and the settings key; and of the provider cards, the monthly cap's floor,
      # the discovered catalog's uniqueness, the enable switch's two states, the health
      # vocabulary and the added-by reference — and rewrites the two expressions
      # `token_usage_daily` computes its sums from, then requires the suite to go red
      # *naming the assertion that caught it*. A probe that went red for some other reason
      # would otherwise read as a probe doing its job.
      #
      # Each mutation runs against a throwaway copy of a database this step migrates for
      # itself, and is made inside a transaction that is never committed — so it touches
      # neither the database above nor the steps below. Nothing new is installed: the same
      # postgres service, the same pinned client image, the same `scripts/migrate`.
      #
      # --runner docker for the reason the step above uses that image rather than the
      # runner's own psql: the client stays pinned to the server's major version.
      - name: Assert those assertions are load-bearing
        run: ouroboros-db/tests/verify-constraint-probes.sh --runner docker

      # And the rule neither of the two steps above can reach (#581). Both of them are one
      # psql session inside one transaction, and a race needs two: CG.3's delete guard is a
      # row lock taken before a count, so what has to be proven is that a *concurrent* route
      # save waits for it — and that without the lock the same interleaving leaves the
      # service holding an answer that has already stopped being true.
      #
      # Three interleavings against a database of its own, driven through two long-lived
      # sessions; the second is the probe, and it is what would go green if the guard ever
      # stopped locking. Same runner argument as the step above.
      - name: Assert the alias reference guard holds under concurrency
        run: ouroboros-db/tests/verify-alias-reference-guard.sh --runner docker

      # ---------------------------------------------------------------------------
      # The drift check (#710). Everything above asks what the applied schema enforces;
      # this asks whether it is still the schema BetterAuth expects. Decision A3 makes
      # Flyway the only migration authority, so nothing but this notices when the library
      # starts wanting something the hand-port does not have.
      # ---------------------------------------------------------------------------

      # ouroboros-rest loads its settings from .env exactly as a developer's checkout
      # does, and the template is what a developer copies — so copying it is the same
      # act, and the check runs against the configuration the service really builds.
      # Only the database is overridden, per step below.
      - name: Configure the service the way a checkout does
        run: cp .env.example .env

      # Half one: does the schema Flyway applied still hold everything the library
      # expects? Against the database migrated above. Anything missing is a hand-port
      # that lost something, and the failure prints the DDL that closes the gap.
      #
      # The URL is built from the parameters already in the environment rather than
      # written out again, so there is one statement of which database this job uses. The
      # search_path is the load-bearing part: BetterAuth never qualifies a table name, so
      # without it the check would introspect `public`, find nothing, and report the
      # entire schema as missing.
      - name: Assert the applied schema still satisfies BetterAuth
        run: |
          export OURO_DATABASE_URL="postgresql://$OURO_DB_USER:$OURO_DB_PASSWORD@$OURO_DB_HOST:$OURO_DB_PORT/$OURO_DB_NAME?options=-c%20search_path%3D$OURO_DB_SCHEMA%2Cpublic"
          ouroboros-db/scripts/betterauth-schema.mjs --applied

      # Half two: has what the library expects changed since the snapshot was rendered?
      # This one needs an *empty* schema — the library reports what a database is missing,
      # so only an empty one draws the whole picture — which is why it gets a database of
      # its own rather than reusing any above. A `better-auth` bump that moves a column
      # fails here, and the diff is the DDL the new migration has to apply.
      - name: Assert the committed snapshot still describes what BetterAuth expects
        run: |
          docker run --rm --network=host \
            --env PGPASSWORD \
            "$POSTGRES_IMAGE" \
            createdb -h "$OURO_DB_HOST" -p "$OURO_DB_PORT" -U "$OURO_DB_USER" "$DRIFT_DB_NAME"
          docker run --rm --network=host \
            --env PGPASSWORD \
            "$POSTGRES_IMAGE" \
            psql -h "$OURO_DB_HOST" -p "$OURO_DB_PORT" -U "$OURO_DB_USER" -d "$DRIFT_DB_NAME" \
              -v ON_ERROR_STOP=1 -c "create schema $OURO_DB_SCHEMA"
          export OURO_DATABASE_URL="postgresql://$OURO_DB_USER:$OURO_DB_PASSWORD@$OURO_DB_HOST:$OURO_DB_PORT/$DRIFT_DB_NAME?options=-c%20search_path%3D$OURO_DB_SCHEMA%2Cpublic"
          ouroboros-db/scripts/betterauth-schema.mjs --check

      # The dev seed (#23) gets a database of its own, because the one above has to go
      # on proving what a production migration does: apply R__dev_seed.sql and insert
      # nothing, which is what ${ouro_dev_seed} being false in flyway.toml means. Only
      # flyway.seed.toml flips it, and only something that names it loads it.
      #
      # Migrated twice on purpose. Every assertion in tests/seed.sql says *exactly one*,
      # so a second pass before asserting is the idempotency criterion rather than a
      # wasted minute: a seed that inserted its rows again would fail the step below.
      - name: Seed a second database
        run: |
          docker run --rm --network=host \
            --env PGPASSWORD \
            "$POSTGRES_IMAGE" \
            createdb -h "$OURO_DB_HOST" -p "$OURO_DB_PORT" -U "$OURO_DB_USER" "$SEED_DB_NAME"
          # Which database the migration lands in is the only thing that changes here;
          # exported rather than set in a step `env:` so the name has one definition.
          export OURO_DB_NAME="$SEED_DB_NAME"
          ouroboros-db/scripts/migrate --config flyway.seed.toml
          ouroboros-db/scripts/migrate --config flyway.seed.toml

      # One assertion per seeded row: the demo tenant every mockup is drawn around is
      # either there, exactly once, with the ids and addresses the documentation
      # publishes, or this fails naming the row that moved.
      - name: Assert what the seed put there
        run: |
          docker run --rm --network=host \
            --env PGPASSWORD \
            --volume "$PWD/ouroboros-db/tests:/tests:ro" \
            "$POSTGRES_IMAGE" \
            psql -h "$OURO_DB_HOST" -p "$OURO_DB_PORT" -U "$OURO_DB_USER" -d "$SEED_DB_NAME" \
              -v ON_ERROR_STOP=1 -f /tests/seed.sql

      # The rehearsal (#708). V006 drops populated tables, so the two passes above —
      # both of which migrate V000 → V006 in one sweep over an empty database — never
      # see what it does to *rows*. This one does: a third database is migrated to V005
      # only, populated with the pre-migration seed's rows (plus the states the seed
      # never contained — a suspended tenant, a viewer, an un-accepted invitation), and
      # only then migrated the ordinary way, so V006 meets data. rehearsal/post.sql then
      # asserts every domain, org and repo still resolves to the same logical tenant —
      # spot values, not exit codes.
      #
      # The V005 state is built from the *versioned* migrations only, via a -locations
      # override onto a copied subset. -target=005 would not do: Flyway applies
      # repeatable migrations regardless of target, and R__dev_seed.sql now names
      # columns that only exist after V006 — it would fail to parse against a V005
      # schema even as a guarded no-op. The copies keep their names and bytes, so the
      # final ordinary migrate revalidates them against the same checksums.
      - name: Rehearse the V006 cut-over against a populated V005 database
        run: |
          docker run --rm --network=host \
            --env PGPASSWORD \
            "$POSTGRES_IMAGE" \
            createdb -h "$OURO_DB_HOST" -p "$OURO_DB_PORT" -U "$OURO_DB_USER" "$REHEARSAL_DB_NAME"
          export OURO_DB_NAME="$REHEARSAL_DB_NAME"

          # Inside migrations/, because that is the one directory run.sh mounts into the
          # Flyway container — deliberately, so nothing else on the host is visible to
          # it. The subdirectory exists only for this first migrate: it is removed
          # before the ordinary one below, which scans migrations/ recursively and
          # would otherwise find every version twice.
          mkdir ouroboros-db/migrations/rehearsal-v005
          cp ouroboros-db/migrations/V00[0-5]__*.sql ouroboros-db/migrations/rehearsal-v005/
          ouroboros-db/scripts/migrate -locations=filesystem:migrations/rehearsal-v005
          rm -r ouroboros-db/migrations/rehearsal-v005

          docker run --rm --network=host \
            --env PGPASSWORD \
            --volume "$PWD/ouroboros-db/tests:/tests:ro" \
            "$POSTGRES_IMAGE" \
            psql -h "$OURO_DB_HOST" -p "$OURO_DB_PORT" -U "$OURO_DB_USER" -d "$REHEARSAL_DB_NAME" \
              -v ON_ERROR_STOP=1 -f /tests/rehearsal/pre.sql

          ouroboros-db/scripts/migrate

          docker run --rm --network=host \
            --env PGPASSWORD \
            --volume "$PWD/ouroboros-db/tests:/tests:ro" \
            "$POSTGRES_IMAGE" \
            psql -h "$OURO_DB_HOST" -p "$OURO_DB_PORT" -U "$OURO_DB_USER" -d "$REHEARSAL_DB_NAME" \
              -v ON_ERROR_STOP=1 -f /tests/rehearsal/post.sql

  # ---------------------------------------------------------------------------
  # The published artefact — ouroboros-db/Dockerfile, which is this module in the
  # form something other than a laptop can apply: the migrations, flyway.toml, the seed
  # overlay and the entrypoint that turns OURO_DB_* into a connection, on the Flyway 13
  # image the rest of the repository already migrates with.
  #
  # `needs: ci` is the point of publishing from this workflow rather than from one of its
  # own. The image is the same SQL the job above applied to a real PostgreSQL, validated,
  # and asserted against; a tag that moved without that having passed would be a schema
  # nothing had run. So the whole of ci/db gates it, and a red run publishes nothing.
  # ---------------------------------------------------------------------------
  publish:
    name: publish/db
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built on every event, including a pull request, and with no credentials in the
      # step at all: what a pull request has to answer is whether the image still builds
      # from this checkout — a broken Dockerfile is worth reporting on the change that
      # broke it rather than on the merge that publishes it. A fork's pull request has no
      # secrets, so a step that needed them could not answer that question at all.
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          # The module directory, not the repository root: nothing here installs through
          # the workspace lockfile, so ouroboros-db/.dockerignore is the allow-list that
          # governs what may enter the context. See docs/CONVENTIONS.md § 5.
          context: ouroboros-db
          file: ouroboros-db/Dockerfile
          push: false
          # Loaded into the runner's daemon so the next step can run what was just built,
          # under a local tag that is never pushed anywhere.
          load: true
          tags: ouroboros-db:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Two properties of the artefact that a file read cannot establish, both answerable
      # without a database — the live pass above already proved the migrations apply.
      #
      # The first is the allow-list in .dockerignore: it is what keeps this module's .env
      # out of a published layer, and the same mechanism silently drops a migration if it
      # is ever narrowed. Comparing the checkout's .sql files against the image's is how
      # "the image carries this schema" stops being an assumption.
      #
      # The second is the entrypoint's refusal to guess. `localhost` inside a container is
      # the container, so an image that defaulted to it would report success against
      # nothing at all; this asserts it names the missing variable and exits non-zero.
      - name: Check what the image carries and what it refuses
        run: |
          in_checkout=$(cd ouroboros-db/migrations && ls -- *.sql)
          in_image=$(docker run --rm --entrypoint sh ouroboros-db:ci \
            -c 'cd /flyway/project/migrations && ls -- *.sql')
          if [ "$in_checkout" != "$in_image" ]; then
            printf 'the image does not carry the migrations in this checkout\n' >&2
            printf 'checkout:\n%s\nimage:\n%s\n' "$in_checkout" "$in_image" >&2
            exit 1
          fi
          printf 'the image carries every migration in this checkout\n'

          if refusal=$(docker run --rm ouroboros-db:ci 2>&1); then
            printf 'the image migrated something without being told which database\n' >&2
            exit 1
          fi
          printf '%s\n' "$refusal" | grep -q OURO_DB_HOST || {
            printf 'the image failed without naming the variable that would fix it:\n' >&2
            printf '%s\n' "$refusal" >&2
            exit 1
          }
          printf 'the image refuses to guess which database to migrate\n'

      # Everything below this line runs on a push to main or a manual dispatch, never on
      # a pull request — the same rule docker-publish.yml applies to ouroboros-web.
      - name: Log in to registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_HOSTNAME }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # The same build again, which the layer cache above makes a no-op, so what this
      # step actually does is tag and push what the previous two steps proved. Splitting
      # it this way is what lets the build run without credentials.
      #
      # Two tags, and the immutable one is the point: `latest` is what a deploy that
      # tracks main pulls, and the commit sha is what a rollback or an audit names — the
      # schema is versioned by its migrations rather than by a release number, so the
      # commit is the only identifier that says exactly which migrations are inside.
      - name: Push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ouroboros-db
          file: ouroboros-db/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HOSTNAME }}/ouroboros-db:latest
            ${{ secrets.DOCKER_HOSTNAME }}/ouroboros-db:${{ github.sha }}
          cache-from: type=gha
