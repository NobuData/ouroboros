name: ouroboros-web · build & publish

on:
  push:
    branches: [main]
    paths:
      - "ouroboros-web/**"
      - ".github/workflows/docker-publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "ouroboros-web/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Yarn build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ouroboros-web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (Yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

  docker:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs: build
    # Publish only on pushes to main (and manual runs) — PRs stop after the build job.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DOCKER_HOSTNAME }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ouroboros-web
          file: ouroboros-web/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_HOSTNAME }}/${{ secrets.DOCKER_USERNAME }}/ouroboros-web:latest
            ${{ secrets.DOCKER_HOSTNAME }}/${{ secrets.DOCKER_USERNAME }}/ouroboros-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
