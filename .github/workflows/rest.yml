name: ouroboros-rest · ci

# Path-filtered per issue #11: this runs only when the communications layer, the
# pipeline it shares with ouroboros-ui, the workspace this module resolves its
# dependencies through, or this file itself changes.
#
# The four root files are here because #13 made this module a Yarn workspace — see
# ui.yml, which carries the same set for the same reason.
#
# Three paths outside this module are here because of #37. The integration harness starts
# a PostgreSQL and applies `ouroboros-db`'s Flyway project to it, so a migration is an
# input to this module's tests as surely as its own source is: a column that moves has to
# fail here, in the suite that compares the `Database` interface against a migrated
# database, rather than in the next pull request that happens to touch a controller.
# docker-compose.yml and run.sh are here for the drift check in the *unit* suite, which
# fails when the harness's image pins or Flyway arguments stop matching the stack's.

on:
  pull_request:
    branches: [main]
    # Written out twice rather than shared with a YAML anchor: GitHub's workflow parser
    # does not resolve aliases, so an anchor here would silently filter nothing.
    paths:
      - "ouroboros-rest/**"
      - "ouroboros-db/migrations/**"
      - "ouroboros-db/flyway.toml"
      - "ouroboros-db/run.sh"
      - "docker-compose.yml"
      - ".github/actions/node-module/**"
      - ".github/actions/scaffold-gate/**"
      - ".github/workflows/rest.yml"
      - "package.json"
      - "yarn.lock"
      - "turbo.json"
      - ".yarnrc.yml"
  push:
    branches: [main]
    paths:
      - "ouroboros-rest/**"
      - "ouroboros-db/migrations/**"
      - "ouroboros-db/flyway.toml"
      - "ouroboros-db/run.sh"
      - "docker-compose.yml"
      - ".github/actions/node-module/**"
      - ".github/actions/scaffold-gate/**"
      - ".github/workflows/rest.yml"
      - "package.json"
      - "yarn.lock"
      - "turbo.json"
      - ".yarnrc.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-rest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name is the status check name — `ci/rest`. See ui.yml.
  ci:
    name: ci/rest
    runs-on: ubuntu-latest

    # No service container, and no migration step, since #37. The integration harness
    # starts `postgres:17-alpine` through Testcontainers and migrates it with the pinned
    # `flyway/flyway:11-alpine` against this checkout's `ouroboros-db/flyway.toml` — the
    # same two images and the same arguments the development stack uses, which the unit
    # suite checks against docker-compose.yml on every run.
    #
    # That is the issue's first acceptance criterion, *green locally and in CI without
    # external setup*, and it is worth more than the two steps it removes: what a developer
    # runs is now byte-for-byte what CI runs. A service container and a `migrate` step were
    # a second way to arrange a database, described in this file and nowhere else, and a
    # workflow that arranges its own world is a workflow that can drift from the one a
    # developer reproduces by hand.
    #
    # Docker is what it needs, and a GitHub-hosted Ubuntu runner has it.

    steps:
      - uses: actions/checkout@v4

      # Lint, typecheck, the unit suite and the build — none of which start anything. The
      # acceptance criterion "typecheck fails on a query against a nonexistent column"
      # (#30) is settled here, by the typecheck: `schema.spec.ts` states it as
      # `@ts-expect-error`, which fails the compile when it stops being an error.
      - uses: ./.github/actions/node-module
        with:
          module: ouroboros-rest
          scaffolded-by: "#27"

      # -----------------------------------------------------------------------------
      # The live pass (#30, on #37's harness) — everything above runs against no
      # database; everything below runs against one this step starts for itself.
      # -----------------------------------------------------------------------------

      # What a unit suite cannot answer: that a repository roundtrip works against a
      # migrated database, that the `Database` interface still names the columns Flyway
      # created, that the constraints map to the envelopes the contract promises, that the
      # role guard is really on the routes that declare it, and that shutting the
      # application down really returns its connections.
      #
      # OURO_DATABASE_URL is deliberately unset: with it, the harness would use whatever it
      # named and start nothing. Reproduce this step by running the same command.
      - name: Integration suite
        working-directory: ouroboros-rest
        run: yarn test:integration
