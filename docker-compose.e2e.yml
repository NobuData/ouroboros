# docker-compose.e2e.yml — the e2e suite's override, and nothing else's.
#
# Composed *on top of* docker-compose.yml by tests/e2e/scripts/run.sh:
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile full up
#
# It changes one service. The first two lines it sets are one decision
# (issue #647, which unparked the suite's signed-in legs):
#
#   * `NODE_ENV: test` — the image pins `production`, and production is the posture in
#     which #705's development email/password sign-in does not exist. The suite signs in
#     with the #709 seeded credentials over the same route the login form calls
#     (tests/e2e/support/session.ts), so the stack it runs against must answer on it.
#     `test` rather than `development` because that is what this stack is.
#
#   * `OURO_LISTEN_HOST: "0.0.0.0"` — outside production the service binds loopback,
#     which on a laptop is the right paranoia and inside a container is an interface
#     Docker's port publishing cannot route to. The override moves the *interface only*:
#     the sign-in gate stays NODE_ENV's and deliberately has no switch of its own
#     (ouroboros-rest/src/auth/password.provider.ts § "Where the line is drawn").
#
# Why this is not the security hole it resembles: the base file still publishes both host
# ports on 127.0.0.1 only, so the password routes this file turns on are reachable from
# the machine running the suite and from nowhere else. A deployment inherits neither line
# — this file is composed by the e2e runner and must never be handed to one.
#
# ---------------------------------------------------------------------------
# The third line, and the finding behind it (issue #206, the routing leg).
# ---------------------------------------------------------------------------
#
#   * `OURO_PROVIDER_HEALTH_INTERVAL_SECONDS: "86400"` — the sweep's nominal cadence, set
#     to the maximum the service accepts (one day, `MAX_PROVIDER_HEALTH_SECONDS`). Since
#     the *first* delay is jittered too (provider-health/cadence.ts, and it argues why),
#     this puts the first sweep between eighteen and thirty hours after boot: comfortably
#     outside the suite's ten-minute budget, and outside a `--keep` stack somebody debugs
#     against for an afternoon.
#
# **What it is for.** Z.3's sweep (#196) is real: every sixty seconds it asks each of the
# workspace's five seeded connections whether it is reachable, and *writes what it finds
# back onto the row*. The seeded connections point at addresses that exist only in the
# fixture — `ken-station.local:11434`, `10.0.4.20:8000` — and carry credentials that are
# literally the words *dev-seed-value-not-a-real-credential*. So about a minute after any
# compose stack comes up, mockup 06's health strip stops being the seed's and becomes a
# report of five failed probes, and `R__dev_seed_routing.sql`'s parity (#192) is gone.
#
# That is correct behaviour and the strip is *right* to say so. It is also fatal to a
# parity leg: with the sweep running, `specs/routing.spec.ts` asserts against a workspace
# whose health depends on how long the stack has been up, its two screenshot baselines are
# a coin flip, and — because a resolution reads the same snapshots — even *which model the
# simulator resolves to* changes underneath the rule-toggle leg. All four were observed
# failing exactly that way before this line existed.
#
# **Why the cadence rather than the fixture.** The alternative is seeding connections that
# point at something the stack really serves, which would mean inventing a fake provider
# service in compose: a fifth image, a second answer to what a provider *is*, and a strip
# that is green because a stub said so. The seed's job is to be mockup 06 as rows, and the
# honest way to hold a stack to it is to not overwrite it mid-suite.
#
# **What this therefore does not test, and where that is tested.** The sweep itself — that
# a stopped Ollama goes amber within one cycle — is Z.3's own integration coverage in
# `ouroboros-rest`, against a probe it controls. This suite asserts the other half: that
# whatever the snapshots say reaches the chip, the hop's dot and the resolution, which is
# the boundary a unit test on either side cannot see.
#
# The variable has no off value, deliberately (configuration.ts: "a strip that has stopped
# updating and a strip that honestly says unknown look different to a person, and only one
# of them is true"), and this file does not invent one — it asks for the slowest cadence an
# operator may ask for, through the same validated setting an operator would use.
#
# ---------------------------------------------------------------------------
# The fourth service, and why the paragraph above does not forbid it (issue #233, AE.7).
# ---------------------------------------------------------------------------
#
# The argument against "inventing a fake provider service in compose" is about the **seed**,
# and it is unchanged: `R__dev_seed_providers.sql` is mockup 07 as rows, its five connections
# keep their unreachable fixture addresses, and the health strip stays a report of what a real
# probe measured rather than of what a stub said. Nothing below touches any of that.
#
# What it serves is the half of AE.7 the seed cannot. A provider card only exists if the
# adapter reached something and it answered — that is the add flow's whole promise — so with
# no reachable provider anywhere in the stack the leg could assert *a bad key produces no card*
# and nothing else: no add, no rotate (a rotation is a verify-then-retire), no reveal of a
# value this deployment's vault actually sealed, and no pull, because there is no stream. The
# leg therefore connects **its own** cards to this container and deletes them again, and the
# seeded five are read and never written.
#
# It is also the *stoppable* thing the ticket's `test-connection truth` leg needs. AE.4's
# roadmap note handed AE.7 "the Playwright leg that stops the real container and pulls a real
# model"; this is that container. The model is not real, and it cannot be: the `ollama` service
# in the base file is over a gigabyte before it holds anything, a model is several more off the
# network, and the ticket's stated allowance is two and a half minutes.
#
# **It is a provider, not a mock** — it applies one authorisation rule and answers 200 or 401,
# and the adapter classifies what comes back with no knowledge of what is at the other end.
# `tests/e2e/fixtures/provider-stub/server.mjs` is the whole of it.
#
# `profiles: [full]` puts it in the same set as the three application services, so
# `--profile full up` starts it and the two verify-* scripts see it without naming it.
# It publishes nothing: `rest` reaches it over the network below, and nothing on the host
# needs to.
#
# Everything else — images, healthchecks, the shared ui/rest network namespace, the
# loopback-only port publishing — is the base file's, unrepeated here so it cannot drift.
services:
  rest:
    environment:
      NODE_ENV: test
      OURO_LISTEN_HOST: "0.0.0.0"
      OURO_PROVIDER_HEALTH_INTERVAL_SECONDS: "86400"

  provider-stub:
    build:
      context: ./tests/e2e/fixtures/provider-stub
    healthcheck:
      # busybox's wget, which the alpine base already has — the alternative is adding curl to
      # an image whose whole point is that it installs nothing.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    networks:
      - ouroboros
    profiles:
      - full
