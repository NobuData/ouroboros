# docker-compose.e2e.yml — the e2e suite's override, and nothing else's.
#
# Composed *on top of* docker-compose.yml by tests/e2e/scripts/run.sh:
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml --profile full up
#
# It changes one service. The first two lines it sets are one decision
# (issue #647, which unparked the suite's signed-in legs):
#
#   * `NODE_ENV: test` — the image pins `production`, and production is the posture in
#     which #705's development email/password sign-in does not exist. The suite signs in
#     with the #709 seeded credentials over the same route the login form calls
#     (tests/e2e/support/session.ts), so the stack it runs against must answer on it.
#     `test` rather than `development` because that is what this stack is.
#
#   * `OURO_LISTEN_HOST: "0.0.0.0"` — outside production the service binds loopback,
#     which on a laptop is the right paranoia and inside a container is an interface
#     Docker's port publishing cannot route to. The override moves the *interface only*:
#     the sign-in gate stays NODE_ENV's and deliberately has no switch of its own
#     (ouroboros-rest/src/auth/password.provider.ts § "Where the line is drawn").
#
# Why this is not the security hole it resembles: the base file still publishes both host
# ports on 127.0.0.1 only, so the password routes this file turns on are reachable from
# the machine running the suite and from nowhere else. A deployment inherits neither line
# — this file is composed by the e2e runner and must never be handed to one.
#
# ---------------------------------------------------------------------------
# The third line, and the finding behind it (issue #206, the routing leg).
# ---------------------------------------------------------------------------
#
#   * `OURO_PROVIDER_HEALTH_INTERVAL_SECONDS: "86400"` — the sweep's nominal cadence, set
#     to the maximum the service accepts (one day, `MAX_PROVIDER_HEALTH_SECONDS`). Since
#     the *first* delay is jittered too (provider-health/cadence.ts, and it argues why),
#     this puts the first sweep between eighteen and thirty hours after boot: comfortably
#     outside the suite's ten-minute budget, and outside a `--keep` stack somebody debugs
#     against for an afternoon.
#
# **What it is for.** Z.3's sweep (#196) is real: every sixty seconds it asks each of the
# workspace's five seeded connections whether it is reachable, and *writes what it finds
# back onto the row*. The seeded connections point at addresses that exist only in the
# fixture — `ken-station.local:11434`, `10.0.4.20:8000` — and carry credentials that are
# literally the words *dev-seed-value-not-a-real-credential*. So about a minute after any
# compose stack comes up, mockup 06's health strip stops being the seed's and becomes a
# report of five failed probes, and `R__dev_seed_routing.sql`'s parity (#192) is gone.
#
# That is correct behaviour and the strip is *right* to say so. It is also fatal to a
# parity leg: with the sweep running, `specs/routing.spec.ts` asserts against a workspace
# whose health depends on how long the stack has been up, its two screenshot baselines are
# a coin flip, and — because a resolution reads the same snapshots — even *which model the
# simulator resolves to* changes underneath the rule-toggle leg. All four were observed
# failing exactly that way before this line existed.
#
# **Why the cadence rather than the fixture.** The alternative is seeding connections that
# point at something the stack really serves, which would mean inventing a fake provider
# service in compose: a fifth image, a second answer to what a provider *is*, and a strip
# that is green because a stub said so. The seed's job is to be mockup 06 as rows, and the
# honest way to hold a stack to it is to not overwrite it mid-suite.
#
# **What this therefore does not test, and where that is tested.** The sweep itself — that
# a stopped Ollama goes amber within one cycle — is Z.3's own integration coverage in
# `ouroboros-rest`, against a probe it controls. This suite asserts the other half: that
# whatever the snapshots say reaches the chip, the hop's dot and the resolution, which is
# the boundary a unit test on either side cannot see.
#
# The variable has no off value, deliberately (configuration.ts: "a strip that has stopped
# updating and a strip that honestly says unknown look different to a person, and only one
# of them is true"), and this file does not invent one — it asks for the slowest cadence an
# operator may ask for, through the same validated setting an operator would use.
#
# ---------------------------------------------------------------------------
# The fourth service, and why the paragraph above does not forbid it (issue #233, AE.7).
# ---------------------------------------------------------------------------
#
# The argument against "inventing a fake provider service in compose" is about the **seed**,
# and it is unchanged: `R__dev_seed_providers.sql` is mockup 07 as rows, its five connections
# keep their unreachable fixture addresses, and the health strip stays a report of what a real
# probe measured rather than of what a stub said. Nothing below touches any of that.
#
# What it serves is the half of AE.7 the seed cannot. A provider card only exists if the
# adapter reached something and it answered — that is the add flow's whole promise — so with
# no reachable provider anywhere in the stack the leg could assert *a bad key produces no card*
# and nothing else: no add, no rotate (a rotation is a verify-then-retire), no reveal of a
# value this deployment's vault actually sealed, and no pull, because there is no stream. The
# leg therefore connects **its own** cards to this container and deletes them again, and the
# seeded five are read and never written.
#
# It is also the *stoppable* thing the ticket's `test-connection truth` leg needs. AE.4's
# roadmap note handed AE.7 "the Playwright leg that stops the real container and pulls a real
# model"; this is that container. The model is not real, and it cannot be: the `ollama` service
# in the base file is over a gigabyte before it holds anything, a model is several more off the
# network, and the ticket's stated allowance is two and a half minutes.
#
# **It is a provider, not a mock** — it applies one authorisation rule and answers 200 or 401,
# and the adapter classifies what comes back with no knowledge of what is at the other end.
# `tests/e2e/fixtures/provider-stub/server.mjs` is the whole of it.
#
# `profiles: [full]` puts it in the same set as the three application services, so
# `--profile full up` starts it and the two verify-* scripts see it without naming it.
# It publishes nothing: `rest` reaches it over the network below, and nothing on the host
# needs to.
#
# ---------------------------------------------------------------------------
# The fourth line, and the sweep it holds still (issue #121, the issues leg).
# ---------------------------------------------------------------------------
#
#   * `OURO_ESTIMATION_STALE_SECONDS: "86400"` — how long an issue may sit in `estimating`
#     before L.3's recovery sweep (`estimation.sweeper.ts`) decides nothing is estimating it
#     and queues it again. The maximum the service accepts (one day,
#     `MAX_ESTIMATION_STALE_SECONDS`), for the argument the third line makes about the health
#     sweep, at the next table over.
#
# **What it is for.** `R__dev_seed_intake.sql` writes `#483` as the mockup's `estimating…` row —
# a `sizing_status` and **no estimate**, because an answer in flight has none — and the sweep
# is right to treat a row that has said `estimating` for ten minutes as abandoned: on any
# ordinary stack it re-queues `#483`, the engine sizes it in milliseconds, and the page head
# reads *8 already sized* over a table with no `sizing…` cell on it. That is the product
# working. It is also a parity leg whose fixture depends on how long the stack has been up:
# `specs/issues.spec.ts` asserts the head's count, `#483`'s mid-flight cells and both palettes
# against the seed, and every one of those goes red about ten minutes after the seed was
# written — inside the suite's own budget on a slow runner, and always on a `--keep` stack
# somebody debugs against for an afternoon.
#
# **Why the threshold rather than the cadence.** `OURO_ESTIMATION_SWEEP_INTERVAL_SECONDS`
# would also do it, and it is left alone on purpose: the sweep still runs on its ordinary
# cadence and finds nothing, which is what a healthy service does and what its own log line
# is written for — a sweep held off entirely would be a code path this stack never exercises.
# The threshold is the one number that is *about the fixture*: it says how old a claim may be,
# and the seed's claim is allowed to be a day old because it is the mockup's, not a process's.
#
# **What this therefore does not test, and where that is tested.** That a stranded claim is
# recovered is L.3's own integration coverage in `ouroboros-rest`, against a clock it controls.
# What the issues leg holds instead is the half no unit test can see: that a press in the
# browser really moves an issue through the engine and back, and that what the pipeline wrote
# reaches the pill, the panel and the trace without a reload — which is a claim about the
# *running* pipeline, and the sweep would only ever have added a second claimant to it.
#
#
# ---------------------------------------------------------------------------
# The fifth service and the fifth line, and the leg they exist for (issue #288, AM.6).
# ---------------------------------------------------------------------------
#
#   * `OURO_GITHUB_API_BASE_URL: http://tracker-stub:8080` — where GitHub is, for this stack.
#
# **What it is for.** The planning leg's subject is a *push*: mockup 09's generator turns an
# outline into drafts and the drafts into issues in a tracker, and the only assertions worth
# making about that are reading those issues back out of the tracker — with their native
# dependencies and their epic parent — and then watching ordinary sync carry them home into the
# canonical backlog and INTAKE-M.3's queue. There is no honest way to assert any of it against a
# tracker nobody may write to, and no acceptable way to assert it against github.com: a suite
# that runs nightly and files six issues a night in somebody's repository is not a gate.
#
# So `tracker-stub` — `tests/e2e/fixtures/tracker-stub/server.mjs`, which holds issues,
# milestones, `blocked_by` relations and sub-issue links and answers GitHub's documented shapes.
# It is a tracker, not a mock, for the reason `provider-stub` is a provider and not one: nothing
# in it is told what the suite expects, and `ouroboros-rest` reaches it through the same
# provider, the same client and the same rate-limit guard it reaches github.com with. The one
# thing the deployment needs is to know where to send the request, and that is the setting — a
# parameter `github.octokit.ts` has carried for GitHub Enterprise Server since K.3 and that
# nothing could reach until this ticket gave it a variable.
#
# **Why no cadence line goes with it, unlike the three above.** Pointing the address at a
# reachable tracker does make both sync loops start really polling, and the instinct from the
# health sweep is to slow them to a day. It would be wrong here twice. It would be *visible*:
# `pollIntervalSeconds` is what mockup 09's *Tracker sync* card prints as `every 5m`, so a day
# would put `every 24h` on the page under test and in its screenshot baselines. And it is
# unnecessary: an unasked sync of this tracker is **convergent**, not destructive — the walk is
# an upsert with no reconciliation (`ticket-sources.repository.ts` § *A closed ticket this mirror
# has never seen is not stored*), the repositories are empty until the leg pushes, and after it
# pushes an extra cycle can only arrive at the state the leg was about to ask for. The health
# sweep's problem was the opposite: it *overwrote* a seeded row with a probe's finding.
#
# The leg still calls `POST /api/v1/sources/{id}/sync` and `POST /api/v1/backlog/sync` itself —
# the two routes M.4 gives a person for *sync now* — because "after this sync" is a sentence a
# test has to be able to say, not because the loops are in its way.
#
# **What this therefore does not test, and where that is tested.** That the loops run on their
# own is `ouroboros-rest`'s coverage of each scheduler, against clocks they control. What this
# suite holds instead is the half no unit test can see: that a push in a browser really reaches a
# tracker, and that what the tracker then holds is what ordinary sync brings back.
#
# `tracker-stub` publishes a host port, which `provider-stub` does not, and that is the leg's
# second requirement rather than an inconsistency: the acceptance criterion is that the pushed
# issues, their dependencies and their epic parent are *verified through the tracker API rather
# than the UI*, so the suite has to be able to ask the tracker. It is published on 127.0.0.1
# only, as every other port in the base file is.
#
# ---------------------------------------------------------------------------
# The three services this file *moves*, and the leg they exist for (issue #262, AI.7).
# ---------------------------------------------------------------------------
#
# The farm leg certifies a chain no other leg has: a **Go binary** enrols itself with a token
# copied out of the browser, opens an outbound mTLS socket, and shows up as a row. Nothing short
# of a real agent on a real machine tests that, so the stack needs a machine — and the base file
# already has one, the `runner` profile (#55's amendment): `farm-gateway`, `runner-release` and
# `runner`. They are the developer's as much as this suite's, which is why they are defined
# there and not here.
#
# What this file does is put them **in `full` as well**. Compose merges a `profiles:` list by
# appending, so each of the three is in `runner` *and* `full` under this override, and the one
# flag every script in tests/e2e already passes — `--profile full` — brings the machine up with
# the rest of the stack. `scripts/run.sh`, both verify-* scripts and `support/compose.ts`
# compose the same pair of files with the same profile and did not have to change.
#
# `rest` additionally waits for the release to be copied in. On a developer's stack that
# ordering does not matter — the release directory is read per request, and the page says *no
# release to install* until there is one — but the suite runs the moment the stack is healthy,
# and *healthy* has to include *there is an agent to install*.
#
# **No cadence line goes with them, and that is the finding of this leg.** The three sweep
# settings above hold a *seed* still. The farm's own sweep — presence, every five seconds, a
# runner silent for thirty-two is `offline` — is the thing the leg's sharpest assertion is
# *about*: kill the machine, and the row must flip because nothing is heartbeating, not because
# somebody remembered to update a status. So it runs at the product's own cadence, and the seed
# is what moved instead: `R__dev_seed_farm.sql` dates its live runners' last heartbeat a day
# *ahead*, which no sweep reaches, so mockup 08's `4/5` is still `4/5` when the parity group
# photographs it. That file argues it; there is no setting because there is nothing to set.
#
# Everything else — images, healthchecks, the shared ui/rest network namespace, the
# loopback-only port publishing — is the base file's, unrepeated here so it cannot drift.
services:
  rest:
    environment:
      NODE_ENV: test
      OURO_LISTEN_HOST: "0.0.0.0"
      OURO_PROVIDER_HEALTH_INTERVAL_SECONDS: "86400"
      OURO_ESTIMATION_STALE_SECONDS: "86400"
      OURO_GITHUB_API_BASE_URL: "http://tracker-stub:8080"
    depends_on:
      # Appended to the base file's three. See the header: healthy must include *there is a
      # release to install*.
      runner-release:
        condition: service_completed_successfully

  # The `runner` profile's three, moved into `full` too. Nothing else about them is restated.
  farm-gateway:
    profiles:
      - full

  runner-release:
    profiles:
      - full

  runner:
    profiles:
      - full

  provider-stub:
    build:
      context: ./tests/e2e/fixtures/provider-stub
    healthcheck:
      # busybox's wget, which the alpine base already has — the alternative is adding curl to
      # an image whose whole point is that it installs nothing.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    networks:
      - ouroboros
    profiles:
      - full

  tracker-stub:
    build:
      context: ./tests/e2e/fixtures/tracker-stub
    healthcheck:
      # busybox's wget, which the alpine base already has — `provider-stub`'s argument for not
      # adding curl to an image whose whole point is that it installs nothing.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
      start_interval: 1s
    ports:
      # Published, unlike `provider-stub`, because the planning leg verifies what was pushed
      # through the tracker's own API. Loopback only, as every port in the base file is.
      - "127.0.0.1:4100:8080"
    networks:
      - ouroboros
    profiles:
      - full
