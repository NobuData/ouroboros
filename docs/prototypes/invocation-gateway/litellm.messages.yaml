# LiteLLM proxy for check-messages.sh — R9's pass-through questions, not the benchmark.
#
# Two Anthropic-format models on the fake provider (upstream.mjs on :9110): one that streams,
# and one whose name makes the provider refuse with a fixed 400 body. Routing switched off as
# in litellm.config.yaml.

model_list:
  - model_name: claude-bench
    litellm_params:
      model: anthropic/claude-bench
      api_base: http://127.0.0.1:9110
      api_key: sk-ant-simulated
  - model_name: claude-refuse
    litellm_params:
      model: anthropic/claude-refuse
      api_base: http://127.0.0.1:9110
      api_key: sk-ant-simulated

router_settings:
  num_retries: 0
  disable_cooldowns: true

litellm_settings:
  num_retries: 0
  drop_params: false

general_settings:
  disable_spend_logs: true
  disable_error_logs: true
