          description: The installed set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyzerSet"
              example:
                label: deterministic analyzers v1
                analyzers:
                  - id: change_point
                    version: 1
                    kind: deterministic
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v0/analysis/runs:
    post:
      tags: [v0]
      summary: Run the analyzers over a corpus, streaming progress
      description: |-
        Dispatch one analysis run — BV.1 ([#510](https://github.com/NobuData/ouroboros/issues/510))
        over BV.2's harness ([#511](https://github.com/NobuData/ouroboros/issues/511)). The corpus
        is the bounded, snapshotted read `ouroboros-rest` assembled on the tenant's own data; it
        is analyzed here in sandboxes that cannot open a socket, and the findings come back on
        this connection. **Nothing leaves the tenant.**

        The answer is `application/x-ndjson`, one event per line, written as it happens:

        * `started` — an analyzer's sandbox is starting (only for an analyzer that runs);
        * `outcome` — its outcome, with its findings, the moment it ends: `completed`, `skipped`
          (a required source is absent from the corpus), `failed`, `timed_out`,
          `memory_exceeded` or `not_run` (the compute ceiling was already reached);
        * `report` — always last: `budget_exceeded` and the analyzers that failed.

        A stream that ends **without** a `report` was cut short, and the caller treats the run
        as failed. A run whose ceiling bound still reports the finished analyzers' outcomes and
        findings before its report — a partial run is not a failed one.
      operationId: runAnalysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
            example:
              run_id: 5eed0065-0000-4000-8000-000000000002
              compute_ceiling_seconds: 3600
              corpus:
                repo_ref: acme-robotics/helios-firmware
                window:
                  from: "2026-07-01"
                  to: "2026-07-03"
                builds:
                  - build_id: 5eed0062-0000-4000-8000-000000010001
                    day: "2026-07-01"
                    duration_seconds: 252
                  - build_id: 5eed0062-0000-4000-8000-000000010002
                    day: "2026-07-02"
                    duration_seconds: 251
                  - build_id: 5eed0062-0000-4000-8000-000000010003
                    day: "2026-07-03"
                    duration_seconds: 253
                events: []
                rig_telemetry: null
      responses:
        "200":
          description: |-
            The run, streamed. For the example: `change_point` starts, completes with no
            finding (three days are too few to segment), and the report follows.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AnalyzerStarted"
                  - $ref: "#/components/schemas/AnalyzerFinished"
                  - $ref: "#/components/schemas/AnalysisFinished"
                discriminator:
                  propertyName: event
                  mapping:
                    started: "#/components/schemas/AnalyzerStarted"
                    outcome: "#/components/schemas/AnalyzerFinished"
                    report: "#/components/schemas/AnalysisFinished"
              example: |
                {"event":"started","analyzer":"change_point","version":1}
                {"event":"outcome","outcome":{"analyzer":"change_point","version":1,"status":"completed","findings":[],"reason":null,"error":null,"elapsed_seconds":0.41}}
                {"event":"report","budget_exceeded":false,"failed":[]}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/code/blame:
    post:
      tags:
      - v0
      summary: Who last changed a line range, and how long ago
      description: 'Who last changed each line of a range (at most 500), the most recent of those changes,
        and how long the range had gone **unchanged** — *"unchanged in 14 months"*, measured to the ref''s
        own commit date so the sentence is the same whenever it is re-run. The end is clamped to the file''s
        length; a start past it is `422 code_range_outside_file`.


        Part of the **code & git mining tool** — CL.4 ([#617](https://github.com/NobuData/ouroboros/issues/617)),
        mockup 22''s *⌥ Codebase & git mining* row. `ouroboros-rest`''s `code` research adapter calls it
        with the repository, the workspace it is read for and, **for this call only**, the workspace''s
        GitHub token; the token fetches the clone and is never stored or echoed. Clones are bare mirrors
        under `OURO_ENGINE_CLONE_DIR`, one per workspace and repository, refreshed when older than `OURO_ENGINE_CLONE_REFRESH_SECONDS`;
        a ref the clone lacks forces one fetch before it is a `404`. Nothing here writes to a repository.


        Every answer names the 40-hex commit it was read at (`sha`), so the citation `ouroboros-rest` builds
        from it — `git://owner/name@sha/path#Lnn` — re-runs to the same answer.'
      operationId: codeBlame
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlameRequest'
            example:
              repository:
                workspace: a7150000-0000-4000-8000-000000000617
                slug: acme-robotics/helios-firmware
                remote: https://github.com/acme-robotics/helios-firmware.git
                token: ghs_example-installation-token
