# ouroboros-engine — the API specification, and the thing that is true.
#
# This file is authoritative. The service does not generate a document from its routes;
# it loads this one and serves it verbatim (src/ouroboros_engine/openapi.py), so what a
# catalogue holds and what the process answers with are the same bytes.
#
# Edit this file, then run `uv run openapi` to re-render openapi.json beside it — that
# is the copy the process reads and the copy a JSON-only tool wants. `uv run pytest`
# refuses a pair that has drifted apart, a version that disagrees with pyproject.toml,
# and a path or a response field that the code serves but this document does not
# describe (tests/test_openapi.py).

openapi: 3.1.0

info:
  title: ouroboros-engine
  version: 0.6.1
  summary: Internal backend for Ouroboros — executes the work ouroboros-rest brokers.
  description: |-
    The **Python backend** of [Ouroboros](https://github.com/NobuData/ouroboros): the
    service that executes the work `ouroboros-rest` brokers.

    It is **internal only**. Every request arrives from `ouroboros-rest`, inside the
    cluster, carrying a shared secret on the `X-Ouro-Internal-Key` header; a browser
    never reaches it. That is a deployment claim, so the service enforces it itself
    rather than trusting it — **every path but `/healthz` requires the key**, the
    comparison is constant time, and a request without one is refused before routing.

    A rejection is therefore one constant body whether the path exists or not: status
    codes are how a surface gets mapped from outside, and an unauthenticated caller cannot
    tell `/v0/status` from `/v0/anything-else`. Read the `401` documented on each operation
    below as the answer to *anything* unauthenticated, including paths this document does
    not list.

    **Every error has one shape** — `{code, message, details}`, the same envelope
    `ouroboros-rest` answers a browser with (`docs/ARCHITECTURE.md` § 5.3), so a failure
    crossing the gateway does not change form on the way out. `code` is stable and
    machine-readable and is what a caller branches on; `message` is written for a person
    and is a constant for anything `5xx`, because the real diagnosis names the inside of
    this process and belongs in a log; `details` carries what is specific to the failure,
    which for a `422` is one entry per field that was refused. That covers the answers no
    route produced too — a path nothing claims, a method a path does not allow, a body
    that could not be parsed.

    `/v0` is the versioned internal prefix. It is unstable by definition — it changes
    with the two services that share it, which deploy together — and a stable `/v1` is a
    later promise, not this one. A field may be added to a response and a route may be
    added to the prefix; a field that disappears, changes type or changes meaning is a
    `/v1` served alongside this one, not an edit to it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Ouroboros
    url: https://github.com/NobuData/ouroboros

servers:
  - url: http://localhost:8000
    description: |-
      `uv run dev`, which binds the loopback interface only. In a deployment the engine
      has no public origin at all: it is addressed by its service name from inside the
      cluster, and the port comes from `PORT`.

tags:
  - name: service
    description: Identity and liveness — what answers before any contract does.
  - name: v0
    description: |-
      The versioned internal contract — what `ouroboros-rest` calls, and the only surface
      it mirrors in a typed client
      ([#35](https://github.com/NobuData/ouroboros/issues/35)). `POST /v0/tasks/echo` is
      the exemplar the rest of it is written to: a closed request body, a `422` in the
      envelope when it does not validate, and the answering build named in the response.

# Applies to every operation. `/healthz` opts out with an empty requirement of its own,
# and it is the only operation that may — a container platform probes liveness before it
# has any credential to probe with.
security:
  - InternalKey: []

paths:
  /healthz:
    get:
      tags: [service]
      summary: Liveness probe
      description: |-
        Report that the process is up and serving HTTP.

        Deliberately shallow: it opens no connection, reads no configuration and calls
        nothing downstream, so it cannot fail for a reason that restarting the container
        will not fix. *Readiness* — whether the dependencies a request needs are
        reachable — is the REST layer's probe, which asks `/v0/status` with the key.
      operationId: readHealth
      # The one public path in the service. Written here and in `_PUBLIC_PATHS` in
      # main.py, and a test asserts the two lists are the same one.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
              example:
                status: ok

  /:
    get:
      tags: [service]
      summary: Identify the service
      description: |-
        Report which service and which build is answering. Carries no state, reads no
        configuration, and says nothing about health — liveness is `/healthz`.
      operationId: readRoot
      responses:
        "200":
          description: The service and its installed version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceIdentity"
              example:
                service: ouroboros-engine
                version: 0.6.1
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v0/status:
    get:
      tags: [v0]
      summary: Report version and uptime
      description: |-
        Answer the two questions that come up when the engine is suspected: *which
        version of it is this*, and *is this the same process as a minute ago*.

        `ouroboros-rest`'s readiness probe is the intended caller. A `401` here means the
        two sides hold different secrets, and REST reports that to a client as a `502` —
        never a `401`, because the internal boundary is not something a browser gets to
        probe.
      operationId: readStatus
      responses:
        "200":
          description: The running build and how long it has been running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
              example:
                service: ouroboros-engine
                version: 0.6.1
                uptime_seconds: 1234.567
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v0/tasks/echo:
    post:
      tags: [v0]
      summary: Echo a task back
      description: |-
        Accept a task and hand it straight back. The engine has no real work to do yet —
        the task registry, the queue and the worker model are
        [#54](https://github.com/NobuData/ouroboros/issues/54) — and this route exists to
        settle, with one working round trip, what every later operation would otherwise
        settle again: how a request body is described, how it is validated, what a
        refusal looks like, and where the version of the answering build is reported.

        **The request body is closed.** A property this document does not describe is
        refused rather than dropped, so a caller that misspells `payload` is told so
        instead of having the field silently ignored.

        **The echo is the request.** What comes back under `echo` is the body as the
        engine parsed it, so a caller sees what was actually understood rather than what
        it believes it sent.
      operationId: echoTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EchoRequest"
            example:
              task_kind: echo
              payload:
                note: hello from ouroboros-rest
      responses:
        "200":
          description: The task, as received, and the build that received it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoResponse"
              example:
                accepted: true
                echo:
                  task_kind: echo
                  payload:
                    note: hello from ouroboros-rest
                engine_version: 0.6.1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/estimate:
    post:
      tags: [v0]
      summary: Estimate the work in one issue
      description: |-
        Size one issue: how much work it is, how sure the estimator is, which workflow
        should run it, which model it should run on, what the work is expected to cost, and
        what any of that was reached from.

        **The response is one version of `issue_estimates`**
        ([#100](https://github.com/NobuData/ouroboros/issues/100)) field for field, so the
        caller persists an answer rather than translating one. The five columns with no
        field here are the persister's: the row's id, the issue it belongs to, its version,
        when it was written, and `trace.sized_at`. An estimator does not know which issue
        row it was called for, cannot know which version its answer will become, and must
        not be the thing that decides when the answer was written.

        **The caller supplies the vocabularies.** `context.workflow_tags` and
        `context.model_defaults` are what the installation has, and `suggested_workflow`
        and `routed_model` are always drawn from them — roadmap decisions **K5** and
        **K6**. This service holds no list of workflow tags and no list of models, so it
        cannot invent one; an estimator that names something outside the offer is a `500`
        here rather than a value that reaches a row.

        **`trace.estimator` is required** — decision **K10**, enforced at this boundary and
        not only by the database's `not null`. Provenance checked at the last hop is
        provenance the hops before it can lose.

        **The estimator behind this contract is replaced and the contract is not.** Today
        it is the deterministic rule engine of L.2
        ([#106](https://github.com/NobuData/ouroboros/issues/106)) — `heuristic-v0`, which
        reads an issue's labels, its title and the shape of its body and nothing else. Two
        consequences a caller should read from the example below rather than discover:
        `breakdown.files` is **always empty**, because a rule engine cannot know which
        files an issue touches and an empty list is the honest answer rather than a
        missing key; and `trace.tokens_used` is **always `0`**, because nothing was
        invoked. `trace.signals` names the rules that produced the answer, so an estimate
        can be argued with rather than only accepted. The LLM estimator
        ([#123](https://github.com/NobuData/ouroboros/issues/123)) answers this same shape,
        with the heuristic retained behind it as the fallback path.

        **A low confidence is an answer, not a failure.** The heuristic reports how much
        its rules agreed; L.3 ([#107](https://github.com/NobuData/ouroboros/issues/107))
        compares that against its own floor and moves the issue to `needs_human` rather
        than `sized`. The engine publishes the value it is calibrated against —
        `ouroboros_engine.estimation.heuristic.NEEDS_HUMAN_CONFIDENCE_FLOOR`, currently
        `70` — and the estimate's trace carries a `needs-human:` line when it falls under
        it.

        **v0 answers synchronously.** A rule engine has nothing to wait for. The
        `202`-plus-poll escalation an LLM estimator will need is specified in
        `x-async-escalation` below rather than left to be invented then: it adds a status
        and a route and changes no field, so a caller written against this operation today
        needs only to treat `202` as possible.
      operationId: estimateIssue
      # Specified, not served. O.2's estimator calls a model through the control plane, and
      # a model call is not something to hold a gateway's socket open for — so the shape of
      # that escalation is written down now, while there is nothing depending on it, rather
      # than when rewriting it would ripple through L.3, M.1 and N.3.
      #
      # An extension rather than a documented `202` response, deliberately: this service
      # cannot answer 202 today, and a `responses` entry is a promise a caller may hold it
      # to. `src/ouroboros_engine/api/estimate.py` holds the same four values as constants
      # and `tests/test_api_estimate.py` asserts the two agree, so this block is checked
      # rather than merely written.
      x-async-escalation:
        status: 202
        accepted-body: "{estimation_id, status: \"accepted\"}"
        retry-after-header: Retry-After
        poll: /v0/estimate/{estimation_id}
        description: |-
          When an estimator cannot answer inside the caller's deadline, this operation
          answers `202` with `{estimation_id, status: "accepted"}` and a `Retry-After`
          header. The caller then polls `GET /v0/estimate/{estimation_id}`, which answers
          `202` again while the estimate is in flight and **the same `Estimate` body,
          unchanged**, when it is done. An estimate that failed is the error envelope on
          the poll route, never a `200` carrying half an answer. Adding a status and a
          route to `/v0` takes nothing away, so it is compatible with the version rule
          rather than a `/v1`.
        introduced-by: https://github.com/NobuData/ouroboros/issues/123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
            example:
              issue:
                number: 485
                title: I2C bus lockup after IMU sleep/wake cycle
                body: |-
                  After entering low-power sleep and waking the BMI270, the I2C bus
                  intermittently locks up. Recovery requires a full bus reset.
                labels: [bug, i2c, watchdog]
                repo: acme-robotics/helios-firmware
              context:
                workflow_tags: [standard-fix, docs-loop, feature-loop, deps-refresh]
                model_defaults:
                  default: claude-fable-5
                  docs: claude-haiku-4-5
      responses:
        "200":
          description: |-
            The estimate — one version of K.2's row, as the *AI Work Breakdown* panel
            renders it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
              example:
                effort: m
                confidence: 77
                suggested_workflow: standard-fix
                routed_model: claude-fable-5
                breakdown:
                  files: []
                  est_tokens: 180000
                  cycle_min: 12
                  cycle_max: 32
                  est_minutes: 23
                risk: medium
                risk_note: >-
                  M-sized work starts at medium regression risk. heuristic-v0 reads an
                  issue's labels and text only — not the code, its tests, or how much
                  depends on it — so this is where a reviewer starts rather than what the
                  change measures.
                trace:
                  estimator: heuristic-v0
                  tokens_used: 0
                  signals:
                    - 'label-effort: the "bug" label -> m'
                    - "body-length: 126 characters -> s"
                    - "effort: strongest of 2 signals -> m"
                    - "confidence: 1 of 2 agree, spread 1 -> 77"
                    - "workflow: no docs, dependency or feature signal -> standard-fix"
                    - 'routed-model: model_defaults["default"] -> resolved, not invoked'
                    - "risk: m effort -> medium"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/workflows/validate:
    post:
      tags: [v0]
      summary: Validate a workflow definition
      description: |-
        The engine's opinion on a workflow definition — R.2
        ([#144](https://github.com/NobuData/ouroboros/issues/144)), and the second half of the
        publish gate ([#134](https://github.com/NobuData/ouroboros/issues/134)).

        `ouroboros-rest` validates with zod before it asks, so the question this answers is
        whether **the component that will execute a definition reads it the same way**. Both
        validators implement the published DSL (`schemas/workflow-dsl/v1.json`) and both are
        held to the same golden verdicts in CI, so the first disagreement between them is a red
        pipeline rather than a run that fails months after publishing.

        **Every finding is anchored.** `path` is an RFC 6901 JSON Pointer into the document, and
        `node_id` or `edge` names the stage or the connection when there is one, so the studio
        can select what a finding is about. An absent anchor is omitted, never `null`.

        **An invalid definition is a `200`.** The request carried a definition and the findings
        are the answer; `findings` empty is the green verdict. A `422` is reserved for a request
        that is not one — no `definition`, or a property this operation does not declare.

        **Warnings are not findings.** Decision **P7**'s unknown-reference warnings need a
        catalogue this operation does not take, so `findings` is the verdict's errors and
        nothing else.
      operationId: validateWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowValidateRequest"
            example:
              definition:
                dsl_version: '1.0'
                trigger:
                  event: ticket_queued
                  conditions: {}
                nodes:
                  - id: start
                    type: trigger
                    title: Issue queued
                    position:
                      x: 0
                      y: 0
                    config: {}
                  - id: done
                    type: term
                    title: Needs review
                    position:
                      x: 240
                      y: 0
                    config:
                      action: needs_review
                      options: {}
                  - id: orphan
                    type: term
                    title: Back to queue
                    position:
                      x: 240
                      y: 120
                    config:
                      action: back_to_queue
                      options: {}
                edges:
                  - from: start
                    to: done
                    kind: default
      responses:
        "200":
          description: |-
            The findings — here, a terminal nothing leads to, anchored to the node the canvas
            selects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowValidation"
              example:
                findings:
                  - code: node.unreachable
                    message: No path of edges reaches this stage from the trigger.
                    path: /nodes/2
                    node_id: orphan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/workflows/dry-run:
    post:
      tags: [v0]
      summary: Simulate a workflow for one ticket
      description: |-
        The studio's **Dry run with issue #485** — a real simulator rather than a preview
        animation ([#144](https://github.com/NobuData/ouroboros/issues/144)). The definition is
        validated first; a valid one is walked for the ticket, with the trigger tested against
        the ticket and its estimate and every routing decision explained.

        **Zero model calls, zero provider calls.** The simulator explains structure and routing;
        it does not do work. Nothing is fetched either — the ticket is what the caller sends.

        How the walk goes, exactly:

        1. **The trigger's conditions are tested**, every present one ANDed. When they do not
           hold no run starts, and the trigger is the only step.
        2. **Stages are visited breadth-first, each stage's edges in document order.** The same
           definition and ticket produce the same walk, every time.
        3. **A `default` edge is always taken; a `branch` edge is taken when its condition
           holds.** A stage two taken edges reach is walked once, and both edges are
           highlighted.
        4. **A fork reports every branch**, taken or not, with the reason — a dry run shows the
           road not taken. **A gate is annotated** with what it requires.
        5. **A loop is reported, never walked**, with `max_retries`: the retry bound of the model
           stage it returns to, or `null` when that stage declares none.
        6. **Check results are assumed green.** They are produced by a run, so a `checks`
           condition is evaluated as though every check passed, and marked `assumed: true`.

        A definition that does not validate is answered with its `findings` — the ones
        `POST /v0/workflows/validate` answers — and `steps`, `verdicts` and `highlight_path`
        empty.
      operationId: dryRunWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDryRunRequest"
            example:
              definition:
                dsl_version: '1.0'
                trigger:
                  event: ticket_queued
                  conditions:
                    effort_lte: m
                nodes:
                  - id: issue-queued
                    type: trigger
                    title: Issue queued
                    position:
                      x: 24
                      y: 40
                    config: {}
                  - id: effort-recheck
                    type: flow
                    title: Effort re-check
                    position:
                      x: 306
                      y: 40
                    config:
                      kind: decision
                      predicate:
                        kind: effort
                        op: lte
                        value: m
                  - id: implement
                    type: llm
                    title: Code the change
                    position:
                      x: 588
                      y: 230
                    config:
                      mode: skill
                      skill: zephyr-conventions
                      prompt_template: 'Implement the fix.

                        Issue: {{issue.title}}'
                      routing:
                        inherit_task: implement
                      limits:
                        max_retries: 2
                        token_budget: 400000
                      permissions:
                        push_fixup: true
                        touch_ci: false
                  - id: back-to-queue
                    type: term
                    title: Back to queue
                    position:
                      x: 306
                      y: 230
                    config:
                      action: back_to_queue
                      options: {}
                  - id: checks-green
                    type: flow
                    title: Checks green?
                    position:
                      x: 306
                      y: 420
                    config:
                      kind: gate
                      predicate:
                        kind: checks
                        op: all_passed
                  - id: open-pr
                    type: term
                    title: Open PR & auto-merge
                    position:
                      x: 588
                      y: 420
                    config:
                      action: open_pr_automerge
                      options:
                        merge_method: squash
                        delete_branch: true
                edges:
                  - from: issue-queued
                    to: effort-recheck
                    kind: default
                  - from: effort-recheck
                    to: implement
                    kind: branch
                    label: ≤ M ↓
                    condition:
                      kind: effort
                      op: lte
                      value: m
                  - from: effort-recheck
                    to: back-to-queue
                    kind: branch
                    label: '> M ↘'
                    condition:
                      kind: effort
                      op: gt
                      value: m
                  - from: implement
                    to: checks-green
                    kind: default
                  - from: checks-green
                    to: open-pr
                    kind: branch
                    label: pass →
                    condition:
                      kind: checks
                      op: all_passed
                  - from: checks-green
                    to: implement
                    kind: loop
                    label: fail ↺
                    condition:
                      kind: checks
                      op: any_failed
              ticket:
                external_key: '#485'
                source: github
                labels:
                  - bug
                  - i2c
                  - watchdog
                  - priority-high
                estimate:
                  effort: m
      responses:
        "200":
          description: |-
            The walk — mockup 04's graph cut down to six stages, for the seeded `#485`: the trigger
            fires, the decision takes `≤ M ↓` and explains why `> M ↘` is not taken, the gate
            assumes green, and the ouroboros loop back to `implement` is reported with its bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDryRun"
              example:
                findings: []
                steps:
                  - node_id: issue-queued
                    type: trigger
                    title: Issue queued
                    verdict: matched
                    annotation: Starts a run when a ticket is queued with effort ≤ M.
                    evaluation:
                      holds: true
                      assumed: false
                      explanation: 'The trigger fires for #485: #485 is effort M, and M ≤ M.'
                    edges:
                      - from: issue-queued
                        to: effort-recheck
                        kind: default
                        label: null
                        outcome: taken
                        explanation: 'Taken: a default edge is always followed.'
                        evaluation: null
                        max_retries: null
                  - node_id: effort-recheck
                    type: flow
                    title: Effort re-check
                    verdict: reached
                    annotation: 'A decision on: effort ≤ M. Every branch out of it is reported, taken
                      or not.'
                    evaluation:
                      holds: true
                      assumed: false
                      explanation: '#485 is effort M, and M ≤ M.'
                    edges:
                      - from: effort-recheck
                        to: implement
                        kind: branch
                        label: ≤ M ↓
                        outcome: taken
                        explanation: 'Taken: #485 is effort M, and M ≤ M.'
                        evaluation:
                          holds: true
                          assumed: false
                          explanation: '#485 is effort M, and M ≤ M.'
                        max_retries: null
                      - from: effort-recheck
                        to: back-to-queue
                        kind: branch
                        label: '> M ↘'
                        outcome: not_taken
                        explanation: 'Not taken: #485 is effort M, and M is not > M.'
                        evaluation:
                          holds: false
                          assumed: false
                          explanation: '#485 is effort M, and M is not > M.'
                        max_retries: null
                  - node_id: implement
                    type: llm
                    title: Code the change
                    verdict: reached
                    annotation: 'A model stage: loads the skill `zephyr-conventions` before its prompt,
                      on the model the `implement` task routes to, with at most 2 retries and a 400000-token
                      budget. Not invoked — a dry run makes no model call.'
                    evaluation: null
                    edges:
                      - from: implement
                        to: checks-green
                        kind: default
                        label: null
                        outcome: taken
                        explanation: 'Taken: a default edge is always followed.'
                        evaluation: null
                        max_retries: null
                  - node_id: checks-green
                    type: flow
                    title: Checks green?
                    verdict: reached
                    annotation: 'A gate. Requires: every check passing.'
                    evaluation:
                      holds: true
                      assumed: true
                      explanation: A dry run has no check results, so it assumes every check passes.
                    edges:
                      - from: checks-green
                        to: open-pr
                        kind: branch
                        label: pass →
                        outcome: taken
                        explanation: 'Taken: a dry run has no check results, so it assumes every check
                          passes.'
                        evaluation:
                          holds: true
                          assumed: true
                          explanation: A dry run has no check results, so it assumes every check passes.
                        max_retries: null
                      - from: checks-green
                        to: implement
                        kind: loop
                        label: fail ↺
                        outcome: loop
                        explanation: 'Loops back to `implement`; it is bounded by the 2 retries `implement`
                          allows. It would not be followed: a dry run has no check results, so it
                          assumes no check fails. A dry run reports a loop and never walks it.'
                        evaluation:
                          holds: false
                          assumed: true
                          explanation: A dry run has no check results, so it assumes no check fails.
                        max_retries: 2
                  - node_id: open-pr
                    type: term
                    title: Open PR & auto-merge
                    verdict: ended
                    annotation: Ends the run by opening a pull request and auto-merging it with a
                      `squash` merge, deleting the branch. Not performed — a dry run opens nothing.
                    evaluation: null
                    edges: []
                verdicts:
                  - node_id: issue-queued
                    verdict: matched
                    explanation: 'The trigger fires for #485: #485 is effort M, and M ≤ M.'
                  - node_id: effort-recheck
                    verdict: reached
                    explanation: Reached from `issue-queued`.
                  - node_id: implement
                    verdict: reached
                    explanation: Reached from `effort-recheck`.
                  - node_id: back-to-queue
                    verdict: not_reached
                    explanation: 'Not reached: the branch from `effort-recheck` is not taken, because
                      #485 is effort M, and M is not > M.'
                  - node_id: checks-green
                    verdict: reached
                    explanation: Reached from `implement`.
                  - node_id: open-pr
                    verdict: ended
                    explanation: Reached from `checks-green`; the simulated run ends here.
                highlight_path:
                  - from: issue-queued
                    to: effort-recheck
                  - from: effort-recheck
                    to: implement
                  - from: implement
                    to: checks-green
                  - from: checks-green
                    to: open-pr
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

components:
  securitySchemes:
    InternalKey:
      type: apiKey
      in: header
      name: X-Ouro-Internal-Key
      description: |-
        The shared secret both sides of the internal boundary hold: `ouroboros-engine`
        reads it from `OURO_ENGINE_SHARED_SECRET`, `ouroboros-rest` sends it. There is no
        other credential and no other scheme — no bearer token, no user identity. This
        is a service-to-service header, and it is generated per environment.

  responses:
    Unauthorized:
      description: |-
        The `X-Ouro-Internal-Key` header was missing or wrong. The body is constant: it
        names no path, echoes no header and offers no hint about what the key should look
        like. What an operator needs is in the engine's log instead, which stays inside
        the cluster.

        `ouroboros-rest` never forwards this to a browser. A key its own deployment holds
        wrongly is its problem and not the caller's, so it logs the mismatch and answers
        `502` — never `401`, which would invite a browser to try signing in again against
        a boundary it cannot reach at all.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: Unauthorized.
            details: {}

    UnprocessableEntity:
      description: |-
        The request was understood and its content is not acceptable — a missing field, a
        `task_kind` that is not a well-formed kind, a property the operation does not
        declare. `details` carries one entry per field, keyed the way the caller wrote it,
        so each message can be shown against the input that produced it.

        `422` rather than `400`: the body parsed, so a caller can tell *I sent the wrong
        value* from *I sent something that is not a request*. It is the status
        `ouroboros-rest` answers its own validation failures with, and the code is the
        same one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: The request is not valid. See `details` for each field.
            details:
              task_kind:
                - String should match pattern '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'

  schemas:
    Liveness:
      type: object
      title: Liveness
      description: The body of a `GET /healthz` response.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
          description: |-
            Always `ok`. A probe reads the status code; this is for the human who runs
            the same request by hand.
          examples: [ok]

    ServiceIdentity:
      type: object
      title: ServiceIdentity
      description: The body of a `GET /` response.
      additionalProperties: false
      required: [service, version]
      properties:
        service:
          type: string
          const: ouroboros-engine
          description: Distribution name of this service, constant across deployments.
          examples: [ouroboros-engine]
        version:
          type: string
          description: Installed version, from package metadata.
          examples: ["0.2.0"]

    ServiceStatus:
      type: object
      title: ServiceStatus
      description: The body of a `GET /v0/status` response.
      additionalProperties: false
      required: [service, version, uptime_seconds]
      properties:
        service:
          type: string
          const: ouroboros-engine
          description: Distribution name of this service, constant across deployments.
          examples: [ouroboros-engine]
        version:
          type: string
          description: |-
            Installed version, read from package metadata — the same string `GET /`
            reports, so there is one source for "which build is this".
          examples: ["0.2.0"]
        uptime_seconds:
          type: number
          minimum: 0
          description: |-
            Seconds since this process built its application, rounded to milliseconds.
            Small and shrinking across calls means something is restarting the container.
          examples: [1234.567]

    EchoRequest:
      type: object
      title: EchoRequest
      description: |-
        The body of a `POST /v0/tasks/echo` request, and the shape that comes back under
        `echo`. Closed: a property not listed here is refused rather than dropped.
      additionalProperties: false
      required: [task_kind, payload]
      properties:
        task_kind:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"
          description: |-
            Which kind of task this is, as a registry would name it. Lower-case, starting
            with a letter, with single `.`, `_` or `-` separators — narrow on purpose,
            because this is what a future handler is looked up by and it has to survive
            being a dictionary key, a log field and a metric label without quoting.
          examples: [echo]
        payload:
          type: object
          description: |-
            The task's own arguments. Open, because what a task takes is the task's
            business; what the contract requires is that it is an object rather than a
            string somebody has to parse twice.
          examples: [{ note: hello from ouroboros-rest }]

    EchoResponse:
      type: object
      title: EchoResponse
      description: The body of a `POST /v0/tasks/echo` response.
      additionalProperties: false
      required: [accepted, echo, engine_version]
      properties:
        accepted:
          type: boolean
          const: true
          description: |-
            Always `true`. This route has exactly one success: a request that validates is
            accepted, and one that does not is a `422` rather than a `200` carrying
            `false`. A task that can be refused while being well-formed is
            [#54](https://github.com/NobuData/ouroboros/issues/54)'s, and will say so on a
            different route.
          examples: [true]
        echo:
          $ref: "#/components/schemas/EchoRequest"
          description: |-
            The request, as received and after validation — so a caller sees what the
            engine actually parsed rather than what it believes it sent.
        engine_version:
          type: string
          description: |-
            Installed version of the build that answered — the same string `GET /` and
            `GET /v0/status` report. In the body rather than only on `/v0/status` because
            the gateway logs a round trip it made, and the build that served it belongs in
            that line without a second call.
          examples: ["0.3.0"]

    IssueContext:
      type: object
      title: IssueContext
      description: |-
        The issue being sized, as much of it as an estimator reads. Mirrors K.1's
        `github_issues` row ([#99](https://github.com/NobuData/ouroboros/issues/99)) for the
        five fields sizing depends on and nothing else from it — an estimator has no
        business with `sizing_status` or the row's identifiers, and a field it cannot use is
        a field the gateway would have to keep sending.
      additionalProperties: false
      required: [number, title, body, labels, repo]
      properties:
        number:
          type: integer
          minimum: 1
          description: |-
            The issue's number within its repository — GitHub's number and the mockup's,
            not a database id, so a payload can be read against the page it came from.
          examples: [485]
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: The issue title, as GitHub holds it.
          examples: [I2C bus lockup after IMU sleep/wake cycle]
        body:
          type: [string, "null"]
          maxLength: 65536
          description: |-
            The issue description in full, or `null` for an issue opened without one.
            Nullable rather than defaulted to `""` because K.1's column is nullable for the
            same reason: GitHub makes no distinction between an empty description and no
            description, and this contract does not invent one. Required rather than
            optional, so "this issue has no body" is something the caller states rather
            than something a missing key implies.
          examples:
            - After entering low-power sleep and waking the BMI270, the I2C bus intermittently locks up.
        labels:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: |-
            GitHub's label *names*, the way K.1 stores them. The heuristic estimator's
            strongest signal, and empty for most issues.
          examples: [[bug, i2c, watchdog]]
        repo:
          type: string
          pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"
          maxLength: 140
          description: |-
            `owner/name` — GitHub's own `full_name`, and what the mockup's head shows. The
            pattern is there so a caller that sent only the repository name is refused
            rather than having an estimator read an owner out of nothing.
          examples: [acme-robotics/helios-firmware]

    EstimationContext:
      type: object
      title: EstimationContext
      description: |-
        The vocabularies that exist, told to the engine rather than assumed by it — roadmap
        decisions **K5** and **K6**. A workflow tag and a routed model are opaque strings
        this service ascribes no meaning to, and the set of them belongs to the
        installation, so the caller sends them and an answer naming anything outside them is
        refused before it leaves the engine.

        Both are required and non-empty. A request offering no tags has no answer this
        contract can give — `suggested_workflow` is required — so it is a `422` rather than
        an estimate carrying a field the caller cannot use.
      additionalProperties: false
      required: [workflow_tags, model_defaults]
      properties:
        workflow_tags:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: |-
            Every workflow tag the installation has, as the mockup's tag chip shows one.
            Opaque, so only their number and length are constrained — a bound is not a
            meaning.
          examples: [[standard-fix, docs-loop, feature-loop, deps-refresh]]
        model_defaults:
          type: object
          minProperties: 1
          maxProperties: 64
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
          description: |-
            The models an estimate may route to, keyed by the caller's own name for the
            class of work each is the default for. A map rather than a list because that is
            what the caller has, and its *values* are what `routed_model` must be one of.
          examples: [{ default: claude-fable-5, docs: claude-haiku-4-5 }]

    EstimateRequest:
      type: object
      title: EstimateRequest
      description: |-
        The body of a `POST /v0/estimate` request. Two blocks, and the split is the
        contract's argument about who knows what: the issue is the *problem*, and the
        context is what the installation happens to be configured with. An estimator reads
        both and invents neither. Closed — a property not listed here is refused rather than
        dropped.
      additionalProperties: false
      required: [issue, context]
      properties:
        issue:
          $ref: "#/components/schemas/IssueContext"
          description: The issue to size.
        context:
          $ref: "#/components/schemas/EstimationContext"
          description: The vocabularies an answer may use.

    Breakdown:
      type: object
      title: Breakdown
      description: |-
        The *AI Work Breakdown* panel as data — K.2's `breakdown` jsonb exactly, five keys
        and no more. The panel renders four of them; the fifth, `est_minutes`, is what M.3's
        queue write reads, which is why it is a stored number rather than something a reader
        recomputes from the cycle range.
      additionalProperties: false
      required: [files, est_tokens, cycle_min, cycle_max, est_minutes]
      properties:
        files:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 4096
          description: |-
            The paths an estimator believes the work touches, as the panel's *Estimated
            files touched* list. **Empty is a real answer, and the one `heuristic-v0`
            always gives**: a rule engine reading labels and body length cannot know which
            files an issue touches, and the mockup renders that absence rather than
            guessing. The key is always present — an empty list, never a missing field —
            because the two mean different things to a reader. The example below is the
            LLM estimator's shape; today's answers carry `[]`.
          examples: [[drivers/i2c_recovery.c, tests/unit/test_i2c_lockup.c]]
        est_tokens:
          type: integer
          minimum: 0
          maximum: 100000000
          description: |-
            How many model tokens the *work* is expected to cost. Not what the estimate
            cost — that is `trace.tokens_used`, and confusing the two makes a sizing look a
            thousand times more expensive than it was.
          examples: [180000]
        cycle_min:
          type: integer
          minimum: 0
          maximum: 100000
          description: The optimistic end of the wall-clock range, in minutes.
          examples: [12]
        cycle_max:
          type: integer
          minimum: 0
          maximum: 100000
          description: The pessimistic end of the wall-clock range, in minutes. Never below `cycle_min`.
          examples: [18]
        est_minutes:
          type: integer
          minimum: 0
          maximum: 100000
          description: |-
            The single number the queue plans with, in minutes. Deliberately *not*
            constrained to the cycle range: K.2's own example carries a 12–18 minute cycle
            beside 23 estimated minutes, because a job's wall clock includes what happens
            either side of the model's part of it.
          examples: [23]

    Trace:
      type: object
      title: Trace
      description: |-
        Where the estimate came from — K.2's `trace` jsonb, minus its clock. The collapsible
        *Estimation trace* under the panel, and the reason re-estimation is auditable at
        all: an estimate that cannot say what produced it is one nobody can compare against
        the next.

        `sized_at` is K.2's and not this contract's. The estimator does not own the clock —
        the row's writer does — and a timestamp in a response body is one two services can
        disagree about.
      additionalProperties: false
      required: [estimator, tokens_used, signals]
      properties:
        estimator:
          type: string
          minLength: 1
          maxLength: 64
          description: |-
            What produced this — `heuristic-v0` for the rule engine installed today, and a
            model identifier for the LLM estimator that replaces it. **Decision K10**:
            required and non-empty here as well as `not null` there, so provenance cannot be
            lost on the way to the row. It is never a model this estimate did not use.
          examples: [heuristic-v0]
        tokens_used:
          type: integer
          minimum: 0
          maximum: 100000000
          description: |-
            What producing *this estimate* cost, in model tokens. `0` for an estimator that
            called no model, which is the honest answer for a rule engine rather than a
            missing field — and what `heuristic-v0` always reports.
          examples: [0]
        signals:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
          description: |-
            What the answer was reached from, one line each — a rule name for the heuristic,
            a retrieved neighbour for the LLM estimator. Empty rather than absent when an
            estimator has nothing to show.
          examples: [[3 similar closed issues, driver map, HIL test index]]

    Estimate:
      type: object
      title: Estimate
      description: |-
        The body of a `POST /v0/estimate` response — one version of K.2's `issue_estimates`
        row. Every field is a column or a jsonb key of that table; the five columns with no
        field here belong to whoever writes the row. Closed, so an estimator cannot smuggle
        a field this document does not describe: `/v0` allows a field to be *added* to a
        response, and adding one is an edit to this document and to the model together.
      additionalProperties: false
      required:
        [
          effort,
          confidence,
          suggested_workflow,
          routed_model,
          breakdown,
          risk,
          risk_note,
          trace,
        ]
      properties:
        effort:
          type: string
          enum: [xs, s, m, l, xl]
          description: |-
            How much work this is — the mockup's *Effort* column and K.2's CHECK
            constraint, lower case because it is a stored value and a filter key. The
            table's `XS` is a presentation decision the UI makes.
          examples: [m]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: |-
            How much the estimator trusts its own answer. The caller reads it against a
            floor and routes a low one to `needs_human`, so a hedge is expressed here
            rather than by refusing to answer.
          examples: [92]
        suggested_workflow:
          type: string
          minLength: 1
          maxLength: 64
          description: |-
            Which workflow tag should run it — always one of the request's
            `context.workflow_tags` (decision **K5**).
          examples: [standard-fix]
        routed_model:
          type: string
          minLength: 1
          maxLength: 128
          description: |-
            Which model it should run on — always one of the request's
            `context.model_defaults` values (decision **K6**).
          examples: [claude-fable-5]
        breakdown:
          $ref: "#/components/schemas/Breakdown"
          description: The *AI Work Breakdown* panel's numbers.
        risk:
          type: string
          enum: [low, medium, high]
          description: |-
            How likely the change is to break something — the regression-risk meter's
            level, and K.2's other CHECK constraint.
          examples: [low]
        risk_note:
          type: string
          minLength: 1
          maxLength: 1024
          description: |-
            The sentence under the meter, saying why. Required and non-empty: a risk level
            with no rationale is a colour nobody can argue with, and this is the field a
            reviewer reads before overriding an estimate.
          examples: [Isolated to the I²C driver path; full HIL coverage exists for bus recovery.]
        trace:
          $ref: "#/components/schemas/Trace"
          description: What produced the estimate, and from what.

    EdgeRef:
      type: object
      title: EdgeRef
      description: |-
        An edge, named the way the document names one — by its ordered pair. A document allows
        at most one edge per pair, so the pair is an edge's identity and what the canvas keys it
        by.
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          description: The id of the node the edge leaves.
          examples: [effort-recheck]
        to:
          type: string
          description: The id of the node the edge arrives at.
          examples: [plan]

    WorkflowFinding:
      type: object
      title: WorkflowFinding
      description: |-
        One thing wrong with a definition, anchored where the canvas can select it — the DSL's
        own diagnostic (`docs/WORKFLOW_DSL.md` § 8) with its node anchor spelled `node_id`.
        `node_id` and `edge` are omitted, never `null`, when a finding has no such anchor: a
        finding about the document as a whole and one whose anchor failed to resolve are not
        the same payload.
      additionalProperties: false
      required: [code, message, path]
      properties:
        code:
          type: string
          minLength: 1
          description: |-
            Which rule broke — one of the DSL's error codes, the vocabulary both validators
            share. What a caller branches on.
          examples: [node.unreachable]
        message:
          type: string
          minLength: 1
          description: What a person should read. Presentation, never contract.
          examples: [No path of edges reaches this stage from the trigger.]
        path:
          type: string
          description: An RFC 6901 JSON Pointer to the offending value; `""` is the document itself.
          examples: [/nodes/2]
        node_id:
          type: string
          description: The id of the node the finding anchors to.
          examples: [orphan]
        edge:
          $ref: "#/components/schemas/EdgeRef"
          description: The edge the finding anchors to.

    WorkflowValidateRequest:
      type: object
      title: WorkflowValidateRequest
      description: |-
        The body of a `POST /v0/workflows/validate` request. Closed — a property not listed here
        is refused rather than dropped.
      additionalProperties: false
      required: [definition]
      properties:
        definition:
          description: |-
            The definition exactly as it is stored — a P.2 document
            (`schemas/workflow-dsl/v1.json`). Any JSON value is accepted here, because whether it
            is a workflow is the validator's question: a value that is not one is answered with a
            `document.malformed` finding rather than refused.

    WorkflowValidation:
      type: object
      title: WorkflowValidation
      description: The body of a `POST /v0/workflows/validate` response.
      additionalProperties: false
      required: [findings]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFinding"
          description: |-
            Every error, in document order — by path, numeric segments compared as numbers.
            Empty is the green verdict; there is no separate flag.

    TicketEstimate:
      type: object
      title: TicketEstimate
      description: The part of a ticket's latest estimate a predicate reads.
      additionalProperties: false
      required: [effort]
      properties:
        effort:
          type: string
          enum: [xs, s, m, l, xl]
          description: How much work it is, in `issue_estimates.effort`'s vocabulary.
          examples: [m]

    DryRunTicket:
      type: object
      title: DryRunTicket
      description: |-
        The ticket a dry run is about, and as much of it as a predicate can test: the three
        things the trigger's conditions and the DSL's predicates read, plus the key every
        explanation names the ticket by. Nothing is fetched — the engine holds no tickets, and a
        simulator that went looking for one would be making provider calls.
      additionalProperties: false
      required: [external_key, source, labels, estimate]
      properties:
        external_key:
          type: string
          minLength: 1
          maxLength: 255
          description: The display form, as V030's `tickets.external_key` holds it.
          examples: ["#485"]
        source:
          type: string
          enum: [github, gitlab, jira, linear]
          description: Which kind of tracker the ticket came from, as `ticket_sources.kind` spells it.
          examples: [github]
        labels:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: |-
            The tracker's label names — V030's bounds — compared exactly as the tracker spells
            them.
          examples: [[bug, i2c, watchdog, priority-high]]
        estimate:
          oneOf:
            - $ref: "#/components/schemas/TicketEstimate"
            - type: "null"
          description: |-
            The latest estimate, or `null` for a ticket nobody has sized. Required rather than
            optional, so *unsized* is something the caller states. An unsized ticket satisfies
            no effort comparison.

    WorkflowDryRunRequest:
      type: object
      title: WorkflowDryRunRequest
      description: The body of a `POST /v0/workflows/dry-run` request. Closed.
      additionalProperties: false
      required: [definition, ticket]
      properties:
        definition:
          description: |-
            The definition to walk, exactly as it is stored. Validated first, by the same
            validator `POST /v0/workflows/validate` answers with.
        ticket:
          $ref: "#/components/schemas/DryRunTicket"
          description: The ticket to walk it for.

    PredicateEvaluation:
      type: object
      title: PredicateEvaluation
      description: One predicate — a trigger's conditions, a fork's test, an edge's condition — tested against the ticket.
      additionalProperties: false
      required: [holds, assumed, explanation]
      properties:
        holds:
          type: boolean
          description: Whether it holds.
          examples: [true]
        assumed:
          type: boolean
          description: |-
            `true` when the predicate reads what only a run produces — check results — and
            `holds` is the simulator's stated green-path assumption rather than a fact about the
            ticket.
          examples: [false]
        explanation:
          type: string
          minLength: 1
          description: Why, in one sentence.
          examples: ["#485 is effort M, and M ≤ M."]

    DryRunEdge:
      type: object
      title: DryRunEdge
      description: One edge out of a stage on the walk, and what the walk did with it.
      additionalProperties: false
      required: [from, to, kind, label, outcome, explanation, evaluation, max_retries]
      properties:
        from:
          type: string
          description: The id of the stage the edge leaves.
          examples: [effort-recheck]
        to:
          type: string
          description: The id of the stage it arrives at.
          examples: [back-to-queue]
        kind:
          type: string
          enum: [default, branch, loop]
          description: The edge's kind, as the document says.
          examples: [branch]
        label:
          type: [string, "null"]
          description: What the canvas prints beside it, or `null`.
          examples: ["> M ↘"]
        outcome:
          type: string
          enum: [taken, not_taken, loop]
          description: |-
            Whether the walk followed it. `loop` is its own outcome: a loop is reported with its
            retry bound and never walked, which is a different statement from *this branch's
            condition does not hold*.
          examples: [not_taken]
        explanation:
          type: string
          minLength: 1
          description: |-
            Why, in a sentence or two. For a branch that is not taken, this is the road not
            taken, explained.
          examples: ["Not taken: #485 is effort M, and M is not > M."]
        evaluation:
          oneOf:
            - $ref: "#/components/schemas/PredicateEvaluation"
            - type: "null"
          description: The edge's condition tested against the ticket, or `null` when it has none.
        max_retries:
          type: [integer, "null"]
          minimum: 0
          description: |-
            For a loop, the retry bound — the `limits.max_retries` of the model stage it returns
            to. `null` for every other edge, and for a loop into a stage that declares no limit.
          examples: [2]

    DryRunStep:
      type: object
      title: DryRunStep
      description: One stage the walk reached, in the order it reached them.
      additionalProperties: false
      required: [node_id, type, title, verdict, annotation, evaluation, edges]
      properties:
        node_id:
          type: string
          description: The stage's id.
          examples: [effort-recheck]
        type:
          type: string
          enum: [trigger, llm, infra, flow, term]
          description: Which of the DSL's five node types it is.
          examples: [flow]
        title:
          type: string
          description: What the canvas prints as its name.
          examples: [Effort re-check]
        verdict:
          type: string
          enum: [matched, not_matched, reached, halted, ended]
          description: |-
            What the walk concluded: `matched` or `not_matched` for the trigger, `ended` for a
            terminal, `reached` for a stage the walk left, and `halted` for one no edge out of
            which is taken.
          examples: [reached]
        annotation:
          type: string
          minLength: 1
          description: |-
            What the stage would do or require — a gate's requirements, a model stage's routing
            and limits — always said without doing it.
          examples: ["A decision on: effort ≤ M. Every branch out of it is reported, taken or not."]
        evaluation:
          oneOf:
            - $ref: "#/components/schemas/PredicateEvaluation"
            - type: "null"
          description: The trigger's conditions or a fork's predicate, tested; `null` for any other stage.
        edges:
          type: array
          items:
            $ref: "#/components/schemas/DryRunEdge"
          description: Every edge out of the stage, in document order, each with its outcome.

    NodeVerdict:
      type: object
      title: NodeVerdict
      description: What the walk concluded about one stage, walked or not.
      additionalProperties: false
      required: [node_id, verdict, explanation]
      properties:
        node_id:
          type: string
          description: The stage's id.
          examples: [back-to-queue]
        verdict:
          type: string
          enum: [matched, not_matched, reached, halted, ended, not_reached]
          description: A step's verdict for a stage the walk reached, and `not_reached` for one it did not.
          examples: [not_reached]
        explanation:
          type: string
          minLength: 1
          description: Why — naming the stage that reached it, or the edge that did not.
          examples: ["Reached from `issue-queued`."]

    WorkflowDryRun:
      type: object
      title: WorkflowDryRun
      description: The body of a `POST /v0/workflows/dry-run` response.
      additionalProperties: false
      required: [findings, steps, verdicts, highlight_path]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFinding"
          description: |-
            The definition's errors. Non-empty means it did not validate and nothing was walked,
            so the three lists beside it are empty.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/DryRunStep"
          description: The ordered walk.
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/NodeVerdict"
          description: One verdict per stage, in document order.
        highlight_path:
          type: array
          items:
            $ref: "#/components/schemas/EdgeRef"
          description: |-
            Every edge the walk took, in the order it took them — the segments the canvas draws
            in the accent treatment.

    Error:
      type: object
      title: Error
      description: |-
        The shape every error in this service is reported in — the same envelope
        `ouroboros-rest` answers a browser with (`docs/ARCHITECTURE.md` § 5.3), so a
        failure crossing the gateway does not change form on the way out.
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: |-
            Stable, machine-readable, and the thing a caller branches on. Derived from the
            status rather than invented per call site, so a failure this service has never
            answered with still carries an honest code.
          examples: [validation_failed]
        message:
          type: string
          description: |-
            Written for a person. Never an exception's text and never a stack: anything
            `5xx` carries one constant sentence, because the real diagnosis names the
            inside of this process and belongs in a log an operator reads.
          examples: [The request is not valid. See `details` for each field.]
        details:
          type: object
          description: |-
            Whatever is specific to this failure — for a `422`, one entry per field that
            was refused, keyed the way the caller wrote it and carrying every message about
            it. Empty rather than absent when there is none, so reading `details.task_kind`
            never has to check `details` first.
          examples: [{}]
