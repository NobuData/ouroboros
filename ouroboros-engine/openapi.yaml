    DryRunSubject:
      type: object
      title: DryRunSubject
      description: 'The ticket a dry run is about: what a predicate tests, and what a stage reads.'
      additionalProperties: false
      required:
      - external_key
      - source
      - labels
      - estimate
      - title
      properties:
        external_key:
          description: The display form, as V030's `external_key` holds it — `#485`.
          examples:
          - '#485'
          maxLength: 255
          minLength: 1
          type: string
        source:
          description: Which kind of tracker it came from, as `ticket_sources.kind` spells it.
          enum:
          - github
          - gitlab
          - jira
          - linear
          examples:
          - github
          type: string
        labels:
          description: The tracker's label names, compared exactly as the tracker spells them.
          examples:
          - - bug
            - i2c
            - watchdog
          items:
            maxLength: 255
            minLength: 1
            type: string
          maxItems: 100
          type: array
        estimate:
          description: The latest estimate, or `null` for a ticket nobody has sized. Required rather than
            optional, so *unsized* is something the caller states.
          oneOf:
          - $ref: '#/components/schemas/TicketEstimate'
          - type: 'null'
        title:
          description: The ticket's title, as the tracker holds it.
          maxLength: 500
          minLength: 1
          type: string
        body:
          description: Its description, or `""`. Cut to `MAX_TICKET_BODY` by the sender.
          maxLength: 20000
          type: string
    DryRunRepository:
      type: object
      title: DryRunRepository
      description: Where the virtual workspace reads from.
      additionalProperties: false
      required:
      - slug
      - pinned_sha
      properties:
        slug:
          description: '`owner/name`.'
          pattern: ^[A-Za-z0-9_.-]{1,100}/[A-Za-z0-9_.-]{1,100}$
          type: string
        pinned_sha:
          description: The commit every read resolves at — `dry_runs.pinned_sha`.
          pattern: ^[0-9a-f]{40}$
          type: string
        api_url:
          description: The provider API's origin. GitHub's, or a GitHub Enterprise `/api/v3`.
          maxLength: 500
          pattern: ^https://[A-Za-z0-9.-]+(:[0-9]{1,5})?(/[A-Za-z0-9._~/-]*)?$
          type: string
        token:
          description: A read credential for this request, or `null` for a public repository.
          maxLength: 1024
          minLength: 1
          type:
          - string
          - 'null'
    DryRunStagePlan:
      type: object
      title: DryRunStagePlan
      description: What routing and context assembly resolved for one model stage.
      additionalProperties: false
      required: []
      properties:
        alias:
          description: The alias the stage's routing resolves to, or `null` when nothing resolves — a
            task kind the catalog does not have, an alias the registry lacks. A stage without one is skipped
            with its warning, never run.
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          type:
          - string
          - 'null'
        resolution_version:
          description: The resolution the alias came from.
          maxLength: 200
          type:
          - string
          - 'null'
        manifest:
          description: The knowledge assembled for the stage (BF.5), as text. `""` for none.
          maxLength: 200000
          type: string
        skill_resolved:
          description: Whether the skill the stage names exists. `false` runs the stage without it and
            says so in the row's note.
          type: boolean
        warnings:
          description: Decision W7's unresolved-reference warnings for this stage, as sentences.
          items:
            maxLength: 500
            minLength: 1
            type: string
          maxItems: 8
          type: array
    DryRunBudget:
      type: object
      title: DryRunBudget
      description: The caps a dry run stops at. `null` is *no cap of this kind*.
      additionalProperties: false
      required: []
      properties:
        run_cost_cents:
          description: The most the whole run may spend.
          maximum: 1000000000
          minimum: 0
          type:
          - integer
          - 'null'
        stage_cost_cents:
          description: The most one stage may spend.
          maximum: 1000000000
          minimum: 0
          type:
          - integer
          - 'null'
        run_tokens:
          description: The most tokens the whole run may use.
          maximum: 1000000000
          minimum: 0
          type:
          - integer
          - 'null'
        stage_tokens:
          description: The most tokens one stage may use. A stage's own `limits.token_budget` applies
            as well; the lower wins.
          maximum: 1000000000
          minimum: 0
          type:
          - integer
          - 'null'
    DryRunRequest:
      type: object
      title: DryRunRequest
      description: The body of `POST /v0/dry-runs`.
      additionalProperties: false
      required:
      - dry_run
      - definition
      - ticket
      - repository
      properties:
        dry_run:
          description: '`dry_runs.id` — what every model call and replay estimate is attributed to.'
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          type: string
        definition:
          description: The draft's document, exactly as stored. Validated first.
        ticket:
          $ref: '#/components/schemas/DryRunSubject'
        repository:
          $ref: '#/components/schemas/DryRunRepository'
        stages:
          description: What was resolved for each model stage, by node id. A model stage with no entry
            is treated as unresolved.
          maxProperties: 200
          patternProperties:
            ^[a-z0-9](?:[a-z0-9-]{0,62}[a-z0-9])?$:
              $ref: '#/components/schemas/DryRunStagePlan'
          type: object
        budget:
          $ref: '#/components/schemas/DryRunBudget'
    DryRunStageResult:
      type: object
      title: DryRunStageResult
      description: One row of the dry-run card — a `dry_run_stages` row, less its ids.
      additionalProperties: false
      required:
      - seq
      - stage_key
      - display_name
      - nodes
      - verdict
      - how
      - note
      properties:
        seq:
          description: The row's position, from 1.
          minimum: 1
          type: integer
        stage_key:
          description: The stage's slug. Parallel stages sharing a title share a row and a key.
          maxLength: 64
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          type: string
        display_name:
          description: What the card prints — the title, with a multiplication sign and a count when the
            row stands for several parallel stages.
          minLength: 1
          type: string
        nodes:
          description: The DSL node ids the row stands for.
          items:
            type: string
          type: array
        verdict:
          description: What happened.
          enum:
          - ok
          - skipped
          - failed
          - not_reached
          type: string
        how:
          description: 'How the result was produced. `replayed` is an estimate from history; `skipped`
            goes with `verdict: skipped` and only with it.'
          enum:
          - llm
          - replayed
          - deterministic
          - skipped
          type: string
        note:
          description: The row's note line, composed by the harness from the stage's outputs.
          type: string
        metrics:
          description: '`tokens`, `cost_cents` (absent when unpriced), `files_touched`, `simulated_writes`,
            `lines_added`, `lines_removed`; a replayed row''s estimate fields are the estimator''s own.'
          additionalProperties: true
          type: object
        skip_reason:
          description: Why it was skipped; set exactly when `verdict` is `skipped`.
          type:
          - string
          - 'null'
        started_at:
          description: When work on it began, or `null` when none did.
          format: date-time
          type:
          - string
          - 'null'
        finished_at:
          description: When it ended.
          format: date-time
          type:
          - string
          - 'null'
