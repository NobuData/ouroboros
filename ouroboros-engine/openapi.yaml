# ouroboros-engine — the API specification, and the thing that is true.
#
# This file is authoritative. The service does not generate a document from its routes;
# it loads this one and serves it verbatim (src/ouroboros_engine/openapi.py), so what a
# catalogue holds and what the process answers with are the same bytes.
#
# Edit this file, then run `uv run openapi` to re-render openapi.json beside it — that
# is the copy the process reads and the copy a JSON-only tool wants. `uv run pytest`
# refuses a pair that has drifted apart, a version that disagrees with pyproject.toml,
# and a path or a response field that the code serves but this document does not
# describe (tests/test_openapi.py).

openapi: 3.1.0

info:
  title: ouroboros-engine
  version: 0.7.25
  summary: Internal backend for Ouroboros — executes the work ouroboros-rest brokers.
  description: |-
    The **Python backend** of [Ouroboros](https://github.com/NobuData/ouroboros): the
    service that executes the work `ouroboros-rest` brokers.

    It is **internal only**. Every request arrives from `ouroboros-rest`, inside the
    cluster, carrying a shared secret on the `X-Ouro-Internal-Key` header; a browser
    never reaches it. That is a deployment claim, so the service enforces it itself
    rather than trusting it — **every path but `/healthz` requires the key**, the
    comparison is constant time, and a request without one is refused before routing.

    A rejection is therefore one constant body whether the path exists or not: status
    codes are how a surface gets mapped from outside, and an unauthenticated caller cannot
    tell `/v0/status` from `/v0/anything-else`. Read the `401` documented on each operation
    below as the answer to *anything* unauthenticated, including paths this document does
    not list.

    **Every error has one shape** — `{code, message, details}`, the same envelope
    `ouroboros-rest` answers a browser with (`docs/ARCHITECTURE.md` § 5.3), so a failure
    crossing the gateway does not change form on the way out. `code` is stable and
    machine-readable and is what a caller branches on; `message` is written for a person
    and is a constant for anything `5xx`, because the real diagnosis names the inside of
    this process and belongs in a log; `details` carries what is specific to the failure,
    which for a `422` is one entry per field that was refused. That covers the answers no
    route produced too — a path nothing claims, a method a path does not allow, a body
    that could not be parsed.

    `/v0` is the versioned internal prefix. It is unstable by definition — it changes
    with the two services that share it, which deploy together — and a stable `/v1` is a
    later promise, not this one. A field may be added to a response and a route may be
    added to the prefix; a field that disappears, changes type or changes meaning is a
    `/v1` served alongside this one, not an edit to it.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Ouroboros
    url: https://github.com/NobuData/ouroboros

servers:
  - url: http://localhost:8000
    description: |-
      `uv run dev`, which binds the loopback interface only. In a deployment the engine
      has no public origin at all: it is addressed by its service name from inside the
      cluster, and the port comes from `PORT`.

tags:
  - name: service
    description: Identity and liveness — what answers before any contract does.
  - name: v0
    description: |-
      The versioned internal contract — what `ouroboros-rest` calls, and the only surface
      it mirrors in a typed client
      ([#35](https://github.com/NobuData/ouroboros/issues/35)). `POST /v0/tasks/echo` is
      the exemplar the rest of it is written to: a closed request body, a `422` in the
      envelope when it does not validate, and the answering build named in the response.

# Applies to every operation. `/healthz` opts out with an empty requirement of its own,
# and it is the only operation that may — a container platform probes liveness before it
# has any credential to probe with.
security:
  - InternalKey: []

paths:
  /healthz:
    get:
      tags: [service]
      summary: Liveness probe
      description: |-
        Report that the process is up and serving HTTP.

        Deliberately shallow: it opens no connection, reads no configuration and calls
        nothing downstream, so it cannot fail for a reason that restarting the container
        will not fix. *Readiness* — whether the dependencies a request needs are
        reachable — is the REST layer's probe, which asks `/v0/status` with the key.
      operationId: readHealth
      # The one public path in the service. Written here and in `_PUBLIC_PATHS` in
      # main.py, and a test asserts the two lists are the same one.
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
              example:
                status: ok

  /:
    get:
      tags: [service]
      summary: Identify the service
      description: |-
        Report which service and which build is answering. Carries no state, reads no
        configuration, and says nothing about health — liveness is `/healthz`.
      operationId: readRoot
      responses:
        "200":
          description: The service and its installed version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceIdentity"
              example:
                service: ouroboros-engine
                version: 0.7.15
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v0/status:
    get:
      tags: [v0]
      summary: Report version and uptime
      description: |-
        Answer the two questions that come up when the engine is suspected: *which
        version of it is this*, and *is this the same process as a minute ago*.

        `ouroboros-rest`'s readiness probe is the intended caller. A `401` here means the
        two sides hold different secrets, and REST reports that to a client as a `502` —
        never a `401`, because the internal boundary is not something a browser gets to
        probe.
      operationId: readStatus
      responses:
        "200":
          description: The running build and how long it has been running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceStatus"
              example:
                service: ouroboros-engine
                version: 0.7.15
                uptime_seconds: 1234.567
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v0/tasks/echo:
    post:
      tags: [v0]
      summary: Echo a task back
      description: |-
        Accept a task and hand it straight back. The engine has no real work to do yet —
        the task registry, the queue and the worker model are
        [#54](https://github.com/NobuData/ouroboros/issues/54) — and this route exists to
        settle, with one working round trip, what every later operation would otherwise
        settle again: how a request body is described, how it is validated, what a
        refusal looks like, and where the version of the answering build is reported.

        **The request body is closed.** A property this document does not describe is
        refused rather than dropped, so a caller that misspells `payload` is told so
        instead of having the field silently ignored.

        **The echo is the request.** What comes back under `echo` is the body as the
        engine parsed it, so a caller sees what was actually understood rather than what
        it believes it sent.
      operationId: echoTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EchoRequest"
            example:
              task_kind: echo
              payload:
                note: hello from ouroboros-rest
      responses:
        "200":
          description: The task, as received, and the build that received it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EchoResponse"
              example:
                accepted: true
                echo:
                  task_kind: echo
                  payload:
                    note: hello from ouroboros-rest
                engine_version: 0.7.15
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/estimate:
    post:
      tags: [v0]
      summary: Estimate the work in one issue
      description: |-
        Size one issue: how much work it is, how sure the estimator is, which workflow
        should run it, which model it should run on, what the work is expected to cost, and
        what any of that was reached from.

        **The response is one version of `issue_estimates`**
        ([#100](https://github.com/NobuData/ouroboros/issues/100)) field for field, so the
        caller persists an answer rather than translating one. The five columns with no
        field here are the persister's: the row's id, the issue it belongs to, its version,
        when it was written, and `trace.sized_at`. An estimator does not know which issue
        row it was called for, cannot know which version its answer will become, and must
        not be the thing that decides when the answer was written.

        **The caller supplies the vocabularies.** `context.workflow_tags` and
        `context.model_defaults` are what the installation has, and `suggested_workflow`
        and `routed_model` are always drawn from them — roadmap decisions **K5** and
        **K6**. This service holds no list of workflow tags and no list of models, so it
        cannot invent one; an estimator that names something outside the offer is a `500`
        here rather than a value that reaches a row.

        **`trace.estimator` is required** — decision **K10**, enforced at this boundary and
        not only by the database's `not null`. Provenance checked at the last hop is
        provenance the hops before it can lose.

        **The estimator behind this contract is replaced and the contract is not.** Today
        it is the deterministic rule engine of L.2
        ([#106](https://github.com/NobuData/ouroboros/issues/106)) — `heuristic-v0`, which
        reads an issue's labels, its title and the shape of its body and nothing else. Two
        consequences a caller should read from the example below rather than discover:
        `breakdown.files` is **always empty**, because a rule engine cannot know which
        files an issue touches and an empty list is the honest answer rather than a
        missing key; and `trace.tokens_used` is **always `0`**, because nothing was
        invoked. `trace.signals` names the rules that produced the answer, so an estimate
        can be argued with rather than only accepted. The LLM estimator
        ([#123](https://github.com/NobuData/ouroboros/issues/123)) answers this same shape,
        with the heuristic retained behind it as the fallback path.

        **A low confidence is an answer, not a failure.** The heuristic reports how much
        its rules agreed; L.3 ([#107](https://github.com/NobuData/ouroboros/issues/107))
        compares that against its own floor and moves the issue to `needs_human` rather
        than `sized`. The engine publishes the value it is calibrated against —
        `ouroboros_engine.estimation.heuristic.NEEDS_HUMAN_CONFIDENCE_FLOOR`, currently
        `70` — and the estimate's trace carries a `needs-human:` line when it falls under
        it.

        **v0 answers synchronously.** A rule engine has nothing to wait for. The
        `202`-plus-poll escalation an LLM estimator will need is specified in
        `x-async-escalation` below rather than left to be invented then: it adds a status
        and a route and changes no field, so a caller written against this operation today
        needs only to treat `202` as possible.
      operationId: estimateIssue
      # Specified, not served. O.2's estimator calls a model through the control plane, and
      # a model call is not something to hold a gateway's socket open for — so the shape of
      # that escalation is written down now, while there is nothing depending on it, rather
      # than when rewriting it would ripple through L.3, M.1 and N.3.
      #
      # An extension rather than a documented `202` response, deliberately: this service
      # cannot answer 202 today, and a `responses` entry is a promise a caller may hold it
      # to. `src/ouroboros_engine/api/estimate.py` holds the same four values as constants
      # and `tests/test_api_estimate.py` asserts the two agree, so this block is checked
      # rather than merely written.
      x-async-escalation:
        status: 202
        accepted-body: "{estimation_id, status: \"accepted\"}"
        retry-after-header: Retry-After
        poll: /v0/estimate/{estimation_id}
        description: |-
          When an estimator cannot answer inside the caller's deadline, this operation
          answers `202` with `{estimation_id, status: "accepted"}` and a `Retry-After`
          header. The caller then polls `GET /v0/estimate/{estimation_id}`, which answers
          `202` again while the estimate is in flight and **the same `Estimate` body,
          unchanged**, when it is done. An estimate that failed is the error envelope on
          the poll route, never a `200` carrying half an answer. Adding a status and a
          route to `/v0` takes nothing away, so it is compatible with the version rule
          rather than a `/v1`.
        introduced-by: https://github.com/NobuData/ouroboros/issues/123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstimateRequest"
            example:
              issue:
                number: 485
                title: I2C bus lockup after IMU sleep/wake cycle
                body: |-
                  After entering low-power sleep and waking the BMI270, the I2C bus
                  intermittently locks up. Recovery requires a full bus reset.
                labels: [bug, i2c, watchdog]
                repo: acme-robotics/helios-firmware
              context:
                workflow_tags: [standard-fix, docs-loop, feature-loop, deps-refresh]
                model_defaults:
                  default: claude-fable-5
                  docs: claude-haiku-4-5
      responses:
        "200":
          description: |-
            The estimate — one version of K.2's row, as the *AI Work Breakdown* panel
            renders it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estimate"
              example:
                effort: m
                confidence: 77
                suggested_workflow: standard-fix
                routed_model: claude-fable-5
                breakdown:
                  files: []
                  est_tokens: 180000
                  cycle_min: 12
                  cycle_max: 32
                  est_minutes: 23
                risk: medium
                risk_note: >-
                  M-sized work starts at medium regression risk. heuristic-v0 reads an
                  issue's labels and text only — not the code, its tests, or how much
                  depends on it — so this is where a reviewer starts rather than what the
                  change measures.
                trace:
                  estimator: heuristic-v0
                  tokens_used: 0
                  signals:
                    - 'label-effort: the "bug" label -> m'
                    - "body-length: 126 characters -> s"
                    - "effort: strongest of 2 signals -> m"
                    - "confidence: 1 of 2 agree, spread 1 -> 77"
                    - "workflow: no docs, dependency or feature signal -> standard-fix"
                    - 'routed-model: model_defaults["default"] -> resolved, not invoked'
                    - "risk: m effort -> medium"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/workflows/validate:
    post:
      tags: [v0]
      summary: Validate a workflow definition
      description: |-
        The engine's opinion on a workflow definition — R.2
        ([#144](https://github.com/NobuData/ouroboros/issues/144)), and the second half of the
        publish gate ([#134](https://github.com/NobuData/ouroboros/issues/134)).

        `ouroboros-rest` validates with zod before it asks, so the question this answers is
        whether **the component that will execute a definition reads it the same way**. Both
        validators implement the published DSL (`schemas/workflow-dsl/v1.json`) and both are
        held to the same golden verdicts in CI, so the first disagreement between them is a red
        pipeline rather than a run that fails months after publishing.

        **Every finding is anchored.** `path` is an RFC 6901 JSON Pointer into the document, and
        `node_id` or `edge` names the stage or the connection when there is one, so the studio
        can select what a finding is about. An absent anchor is omitted, never `null`.

        **An invalid definition is a `200`.** The request carried a definition and the findings
        are the answer; `findings` empty is the green verdict. A `422` is reserved for a request
        that is not one — no `definition`, or a property this operation does not declare.

        **Warnings are not findings.** Decision **P7**'s unknown-reference warnings need a
        catalogue this operation does not take, so `findings` is the verdict's errors and
        nothing else.
      operationId: validateWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowValidateRequest"
            example:
              definition:
                dsl_version: '1.0'
                trigger:
                  event: ticket_queued
                  conditions: {}
                nodes:
                  - id: start
                    type: trigger
                    title: Issue queued
                    position:
                      x: 0
                      y: 0
                    config: {}
                  - id: done
                    type: term
                    title: Needs review
                    position:
                      x: 240
                      y: 0
                    config:
                      action: needs_review
                      options: {}
                  - id: orphan
                    type: term
                    title: Back to queue
                    position:
                      x: 240
                      y: 120
                    config:
                      action: back_to_queue
                      options: {}
                edges:
                  - from: start
                    to: done
                    kind: default
      responses:
        "200":
          description: |-
            The findings — here, a terminal nothing leads to, anchored to the node the canvas
            selects.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowValidation"
              example:
                findings:
                  - code: node.unreachable
                    message: No path of edges reaches this stage from the trigger.
                    path: /nodes/2
                    node_id: orphan
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/workflows/dry-run:
    post:
      tags: [v0]
      summary: Simulate a workflow for one ticket
      description: |-
        The studio's **Dry run with issue #485** — a real simulator rather than a preview
        animation ([#144](https://github.com/NobuData/ouroboros/issues/144)). The definition is
        validated first; a valid one is walked for the ticket, with the trigger tested against
        the ticket and its estimate and every routing decision explained.

        **Zero model calls, zero provider calls.** The simulator explains structure and routing;
        it does not do work. Nothing is fetched either — the ticket is what the caller sends.

        How the walk goes, exactly:

        1. **The trigger's conditions are tested**, every present one ANDed. When they do not
           hold no run starts, and the trigger is the only step.
        2. **Stages are visited breadth-first, each stage's edges in document order.** The same
           definition and ticket produce the same walk, every time.
        3. **A `default` edge is always taken; a `branch` edge is taken when its condition
           holds.** A stage two taken edges reach is walked once, and both edges are
           highlighted.
        4. **A fork reports every branch**, taken or not, with the reason — a dry run shows the
           road not taken. **A gate is annotated** with what it requires.
        5. **A loop is reported, never walked**, with `max_retries`: the retry bound of the model
           stage it returns to, or `null` when that stage declares none.
        6. **Check results are assumed green.** They are produced by a run, so a `checks`
           condition is evaluated as though every check passed, and marked `assumed: true`.
        7. **The change is assumed to touch nothing.** A dry run has no changed paths, so a
           `paths` condition is evaluated as though no changed path matched — `any` does not
           hold and `none` does — and marked `assumed: true`.

        A definition that does not validate is answered with its `findings` — the ones
        `POST /v0/workflows/validate` answers — and `steps`, `verdicts` and `highlight_path`
        empty.
      operationId: dryRunWorkflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDryRunRequest"
            example:
              definition:
                dsl_version: '1.0'
                trigger:
                  event: ticket_queued
                  conditions:
                    effort_lte: m
                nodes:
                  - id: issue-queued
                    type: trigger
                    title: Issue queued
                    position:
                      x: 24
                      y: 40
                    config: {}
                  - id: effort-recheck
                    type: flow
                    title: Effort re-check
                    position:
                      x: 306
                      y: 40
                    config:
                      kind: decision
                      predicate:
                        kind: effort
                        op: lte
                        value: m
                  - id: implement
                    type: llm
                    title: Code the change
                    position:
                      x: 588
                      y: 230
                    config:
                      mode: skill
                      skill: zephyr-conventions
                      prompt_template: 'Implement the fix.

                        Issue: {{issue.title}}'
                      routing:
                        inherit_task: implement
                      limits:
                        max_retries: 2
                        token_budget: 400000
                      permissions:
                        push_fixup: true
                        touch_ci: false
                  - id: back-to-queue
                    type: term
                    title: Back to queue
                    position:
                      x: 306
                      y: 230
                    config:
                      action: back_to_queue
                      options: {}
                  - id: checks-green
                    type: flow
                    title: Checks green?
                    position:
                      x: 306
                      y: 420
                    config:
                      kind: gate
                      predicate:
                        kind: checks
                        op: all_passed
                  - id: open-pr
                    type: term
                    title: Open PR & auto-merge
                    position:
                      x: 588
                      y: 420
                    config:
                      action: open_pr_automerge
                      options:
                        merge_method: squash
                        delete_branch: true
                edges:
                  - from: issue-queued
                    to: effort-recheck
                    kind: default
                  - from: effort-recheck
                    to: implement
                    kind: branch
                    label: ≤ M ↓
                    condition:
                      kind: effort
                      op: lte
                      value: m
                  - from: effort-recheck
                    to: back-to-queue
                    kind: branch
                    label: '> M ↘'
                    condition:
                      kind: effort
                      op: gt
                      value: m
                  - from: implement
                    to: checks-green
                    kind: default
                  - from: checks-green
                    to: open-pr
                    kind: branch
                    label: pass →
                    condition:
                      kind: checks
                      op: all_passed
                  - from: checks-green
                    to: implement
                    kind: loop
                    label: fail ↺
                    condition:
                      kind: checks
                      op: any_failed
              ticket:
                external_key: '#485'
                source: github
                labels:
                  - bug
                  - i2c
                  - watchdog
                  - priority-high
                estimate:
                  effort: m
      responses:
        "200":
          description: |-
            The walk — mockup 04's graph cut down to six stages, for the seeded `#485`: the trigger
            fires, the decision takes `≤ M ↓` and explains why `> M ↘` is not taken, the gate
            assumes green, and the ouroboros loop back to `implement` is reported with its bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDryRun"
              example:
                findings: []
                steps:
                  - node_id: issue-queued
                    type: trigger
                    title: Issue queued
                    verdict: matched
                    annotation: Starts a run when a ticket is queued with effort ≤ M.
                    evaluation:
                      holds: true
                      assumed: false
                      explanation: 'The trigger fires for #485: #485 is effort M, and M ≤ M.'
                    edges:
                      - from: issue-queued
                        to: effort-recheck
                        kind: default
                        label: null
                        outcome: taken
                        explanation: 'Taken: a default edge is always followed.'
                        evaluation: null
                        max_retries: null
                  - node_id: effort-recheck
                    type: flow
                    title: Effort re-check
                    verdict: reached
                    annotation: 'A decision on: effort ≤ M. Every branch out of it is reported, taken
                      or not.'
                    evaluation:
                      holds: true
                      assumed: false
                      explanation: '#485 is effort M, and M ≤ M.'
                    edges:
                      - from: effort-recheck
                        to: implement
                        kind: branch
                        label: ≤ M ↓
                        outcome: taken
                        explanation: 'Taken: #485 is effort M, and M ≤ M.'
                        evaluation:
                          holds: true
                          assumed: false
                          explanation: '#485 is effort M, and M ≤ M.'
                        max_retries: null
                      - from: effort-recheck
                        to: back-to-queue
                        kind: branch
                        label: '> M ↘'
                        outcome: not_taken
                        explanation: 'Not taken: #485 is effort M, and M is not > M.'
                        evaluation:
                          holds: false
                          assumed: false
                          explanation: '#485 is effort M, and M is not > M.'
                        max_retries: null
                  - node_id: implement
                    type: llm
                    title: Code the change
                    verdict: reached
                    annotation: 'A model stage: loads the skill `zephyr-conventions` before its prompt,
                      on the model the `implement` task routes to, with at most 2 retries and a 400000-token
                      budget. Not invoked — a dry run makes no model call.'
                    evaluation: null
                    edges:
                      - from: implement
                        to: checks-green
                        kind: default
                        label: null
                        outcome: taken
                        explanation: 'Taken: a default edge is always followed.'
                        evaluation: null
                        max_retries: null
                  - node_id: checks-green
                    type: flow
                    title: Checks green?
                    verdict: reached
                    annotation: 'A gate. Requires: every check passing.'
                    evaluation:
                      holds: true
                      assumed: true
                      explanation: A dry run has no check results, so it assumes every check passes.
                    edges:
                      - from: checks-green
                        to: open-pr
                        kind: branch
                        label: pass →
                        outcome: taken
                        explanation: 'Taken: a dry run has no check results, so it assumes every check
                          passes.'
                        evaluation:
                          holds: true
                          assumed: true
                          explanation: A dry run has no check results, so it assumes every check passes.
                        max_retries: null
                      - from: checks-green
                        to: implement
                        kind: loop
                        label: fail ↺
                        outcome: loop
                        explanation: 'Loops back to `implement`; it is bounded by the 2 retries `implement`
                          allows. It would not be followed: a dry run has no check results, so it
                          assumes no check fails. A dry run reports a loop and never walks it.'
                        evaluation:
                          holds: false
                          assumed: true
                          explanation: A dry run has no check results, so it assumes no check fails.
                        max_retries: 2
                  - node_id: open-pr
                    type: term
                    title: Open PR & auto-merge
                    verdict: ended
                    annotation: Ends the run by opening a pull request and auto-merging it with a
                      `squash` merge, deleting the branch. Not performed — a dry run opens nothing.
                    evaluation: null
                    edges: []
                verdicts:
                  - node_id: issue-queued
                    verdict: matched
                    explanation: 'The trigger fires for #485: #485 is effort M, and M ≤ M.'
                  - node_id: effort-recheck
                    verdict: reached
                    explanation: Reached from `issue-queued`.
                  - node_id: implement
                    verdict: reached
                    explanation: Reached from `effort-recheck`.
                  - node_id: back-to-queue
                    verdict: not_reached
                    explanation: 'Not reached: the branch from `effort-recheck` is not taken, because
                      #485 is effort M, and M is not > M.'
                  - node_id: checks-green
                    verdict: reached
                    explanation: Reached from `implement`.
                  - node_id: open-pr
                    verdict: ended
                    explanation: Reached from `checks-green`; the simulated run ends here.
                highlight_path:
                  - from: issue-queued
                    to: effort-recheck
                  - from: effort-recheck
                    to: implement
                  - from: implement
                    to: checks-green
                  - from: checks-green
                    to: open-pr
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/plan:
    post:
      tags: [v0]
      summary: Draft a batch of tickets from an outcome
      description: |-
        Turn an outcome — and, when there is one, the outline somebody was willing to commit
        to — into a batch of drafted tickets with their dependencies, their suggested
        workflows, and the provenance of whatever produced them.

        **This contract is implemented twice, on purpose.** Roadmap decision **N2**: the
        planning page's promise needs a model, a model needs the invocation gateway
        ([#235](https://github.com/NobuData/ouroboros/issues/235)), and that is v2. Rather
        than block the page or fake the magic, the operation is specified once and
        implemented twice. Today it is a deterministic outline parser — `outline-v0`, AL.1
        ([#277](https://github.com/NobuData/ouroboros/issues/277)). AN.1
        ([#289](https://github.com/NobuData/ouroboros/issues/289)) answers **this same
        shape** with a real planner, and nothing upstream changes: not this document, not the
        page, not the sizing pipeline, not the push path. `schemas/plan/v0.json` is that
        promise written down where both implementations can be held to it.

        **Narrative-only input degrades honestly, and that is the point.** Without an outline
        the v0 parser cannot decompose anything, so it answers with **one** draft carrying
        the narrative and a `notes` entry recommending an outline. It does not invent five
        plausible-sounding tickets — output that looks like planning and is actually a guess
        is the exact failure this staging exists to avoid. A caller renders `notes` as
        guidance beside the draft, not as an error: this is a `200`.

        **What the parser reads.** A top-level markdown bullet is a ticket; anything indented
        under it is that ticket's body; `blocks: KEY` and `after: KEY` are dependency edges;
        a bracketed `[marker]` is a workflow-tag hint matched against the tags the caller
        offered; and a **numbered** list is read as a sequence, each item depending on the one
        before it. An unordered list gets no edges it was not given — the order somebody typed
        their bullets in is not a claim that one blocks another — and the one place sequencing
        *is* inferred says so in `notes`.

        **Nothing is silently dropped.** An annotation naming a key that is not in the batch,
        a marker matching no workflow, a `blocks:` written on an indented line, prose before
        the first bullet, a bullet with no text: each is ignored rather than guessed at, and
        each produces a `notes` entry naming it. A parser that quietly discards half its input
        is one nobody can debug.

        **`planner` is always recorded** — decision **K10**. A batch that cannot say what
        produced it does not get past the contract boundary, so a deployment that believes it
        has the LLM planner can find out from a response which one it actually has.

        **The caller supplies the vocabulary.** `context.workflow_tags` is what the
        installation has and every `suggested_workflow` is drawn from it — decision **K5**.
        This service holds no list of workflow tags, so it cannot invent one; a planner that
        names something outside the offer is a `500` here rather than a draft that reaches a
        row. The same holds for `context.local_key_prefix`, which is what the batch's own keys
        carry.

        **Nothing here is sized.** Decision **N3**: drafts go through the same estimation
        pipeline every other ticket does (`POST /v0/estimate`), so there is one sizer in the
        product and the page's `✓ all sized` means what it says. A draft carries no effort, no
        confidence and no cost.

        **Deterministic.** The same request produces the same batch, the same local keys and
        the same notes in the same order, every time — which is what makes a *regenerate* that
        changed something meaningful rather than noise.
      operationId: planWork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
            example:
              narrative: >-
                We need OTA updates to survive power loss mid-flash: staged A/B partitions,
                checksum verification before swap, automatic rollback, and a recovery beacon
                over BLE if both slots are bad.
              outline: |-
                - Partition table & bootloader slot flag for A/B scheme  blocks: OTA-3
                  - two slots, with the active one named in the bootloader header
                  - fall back to the previous slot when the flag is unset
                - SHA-256 checksum verification before slot swap  blocks: OTA-3
                  - verify the staged image before the swap, never after it
                - Rollback state machine on failed boot confirmation  blocks: OTA-5
                  - restore the previous slot
                  - emit a telemetry event
                - BLE recovery beacon when both slots fail checksum  blocks: OTA-5
                  - advertise a recovery service when neither slot verifies
                - Power-loss integration tests on HIL rig (kill power mid-flash)  [hil-verify]
                  - cut power during erase, during write, and during the swap
                - Operator docs: recovery procedure & beacon pairing  [docs]
              context:
                workflow_tags: [feature-loop, hil-verify, docs-loop, standard-fix]
                milestone: Helios 2.1
                local_key_prefix: OTA
      responses:
        "200":
          description: |-
            The batch — mockup 09's own six draft rows, carrying its dependency notes
            (`blocks OTA-3` read from the other end) and its workflow tags. `notes` is empty
            because this outline is one the parser could read completely.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plan"
              example:
                drafts:
                  - local_key: OTA-1
                    title: "Partition table & bootloader slot flag for A/B scheme"
                    body: |-
                      - two slots, with the active one named in the bootloader header
                      - fall back to the previous slot when the flag is unset
                    suggested_workflow: feature-loop
                    dependencies: []
                  - local_key: OTA-2
                    title: "SHA-256 checksum verification before slot swap"
                    body: "- verify the staged image before the swap, never after it"
                    suggested_workflow: feature-loop
                    dependencies: []
                  - local_key: OTA-3
                    title: "Rollback state machine on failed boot confirmation"
                    body: |-
                      - restore the previous slot
                      - emit a telemetry event
                    suggested_workflow: feature-loop
                    dependencies: [OTA-1, OTA-2]
                  - local_key: OTA-4
                    title: "BLE recovery beacon when both slots fail checksum"
                    body: "- advertise a recovery service when neither slot verifies"
                    suggested_workflow: feature-loop
                    dependencies: []
                  - local_key: OTA-5
                    title: "Power-loss integration tests on HIL rig (kill power mid-flash)"
                    body: "- cut power during erase, during write, and during the swap"
                    suggested_workflow: hil-verify
                    dependencies: [OTA-3, OTA-4]
                  - local_key: OTA-6
                    title: "Operator docs: recovery procedure & beacon pairing"
                    body: ""
                    suggested_workflow: docs-loop
                    dependencies: []
                planner: outline-v0
                notes: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/learn:
    post:
      tags: [v0]
      summary: Learn candidate facts from a source bundle
      description: |-
        Turn what the loop wrote — a PR's review cycle, a run's observations, a correction note,
        a waiver reason, a remembered steer — into candidate facts, each with a confidence and
        the typed provenance it will be stored with.

        **The contract is committed before its implementation**, BF.3
        ([#412](https://github.com/NobuData/ouroboros/issues/412)), decision **K5**. Facts are
        learned deterministically in the MVP by `ouroboros-rest`'s proposer registry, which
        needs no model. BH.1 ([#423](https://github.com/NobuData/ouroboros/issues/423)) answers
        **this same shape** with an LLM extractor, and `ouroboros-rest` plugs it into that
        registry as the `llm` proposer without a reshape. Until then the installed extractor,
        `unavailable-v0`, answers every bundle with **no candidates** and a note saying why: an
        answer that looked like extraction with no model behind it would be the overclaiming
        K5 rules out. The example below is the shape BH.1 answers.

        **Provenance is drawn from the sources, never invented.** A candidate names the source
        it came from by index, and every ref it cites is one of that source's own refs — an
        answer that cites anything else is a `500` here rather than provenance that reaches a
        row. The display line may be as rich as the extraction was (*"from PR #498 review
        cycle"*).

        **There is no status in this contract.** Every candidate lands `proposed` in
        `ouroboros-rest` (decision **K3**); a person confirms or rejects it. `ouroboros-rest`
        dedupes each candidate against every fact it holds — rejected ones included — whatever
        `context.existing_facts` led the extractor to do.

        **`extractor` is always recorded** — decision **K10**.
      operationId: learnFacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearnRequest"
            example:
              sources:
                - kind: pr_review_cycle
                  label: "PR #498 review cycle"
                  text: >-
                    Reviewer: tests under tests/hil/ touched the rig without reserving it again.
                    Please always `rig claim` before any HIL test — we lost a morning to this.
                  refs:
                    - kind: pull_request
                      id: a7150000-0000-0000-0000-000000000498
              context:
                repo: acme-robotics/helios-firmware
                existing_facts: ["CI needs `west update` before first build of the day"]
      responses:
        "200":
          description: |-
            The candidates — here the mockup's *"Tests under `tests/hil/` require rig
            reservation via `rig claim`"*, as BH.1 would extract it. `unavailable-v0` answers
            `candidates: []` with its note instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Learned"
              example:
                candidates:
                  - text: "Tests under `tests/hil/` require rig reservation via `rig claim`"
                    category: environment
                    confidence: 0.82
                    source_index: 0
                    provenance:
                      line: "from PR #498 review cycle"
                      refs:
                        - kind: pull_request
                          id: a7150000-0000-0000-0000-000000000498
                extractor: llm-v1
                notes: []
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/copilot-workflow:
    post:
      tags: [v0]
      summary: Run one turn of the Workflow Copilot, streaming the reply
      description: |-
        One model turn of the conversational author — CD.1
        ([#559](https://github.com/NobuData/ouroboros/issues/559)), mockup 20. The engine
        assembles the system context from what it is sent (the shared draft, the stage catalog,
        the skills and task routes that exist, the guard vocabulary the enforcement planes
        honour), invokes the routed model through the invocation gateway
        (`POST /internal/llm/invoke` — AD.3's contract, AF.2's executor) and parses the reply
        into text and **structured tool calls** as it streams.

        **The only write path is the typed operation vocabulary.** The manifest's write tools
        are exactly `add_stage`, `set_stage`, `remove_stage`, `add_edge`, `remove_edge`,
        `set_trigger` and `set_guard`; `ask_user` asks a question whose options render as chips;
        `read_draft`, `read_catalog`, `read_skills` and `lookup_tickets` ground a proposal; and
        `propose_dry_run` names a ticket worth trying. Nothing here applies anything:
        `ouroboros-rest` runs the loop — it validates each operation against the DSL before
        applying it under the draft's etag with `copilot` provenance, bounces an invalid one back
        as a `tool` transcript entry carrying the validator's message, and sends the next turn.

        The answer is `application/x-ndjson`, one event per line, written as the model writes:

        * `delta` — a fragment of reply text;
        * `tool_call` — a call the parser recovered, validated against the manifest, or carrying
          `error` and no `arguments` when it did not validate (bounced like any invalid
          operation);
        * `usage` — what the gateway metered, per hop; `cost_cents` is `null` when nothing
          prices the model, never `0`;
        * `error` — the turn could not be made: `gateway_unavailable` until AF.2
          ([#235](https://github.com/NobuData/ouroboros/issues/235)) lands, `gateway_unreachable`,
          `gateway_refused`, or one of the gateway's own per-hop codes;
        * `done` — always last on a turn that was made.

        A turn ends with exactly one `error` or one `done`.
      operationId: copilotWorkflowTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopilotTurnRequest"
            example:
              alias: coder-max
              session: 5eed008a-0000-4000-8000-000000000001
              resolution_version: z1-v1
              cost_cap_cents: 500
              context:
                draft: null
                draft_label: v0.0
                catalog:
                  - type: llm
                    label: Model stage
                    summary: A prompt or skill run by a routed model.
                  - type: infra
                    label: Build / test
                    summary: A build-farm job.
                skills: [pr-etiquette, zephyr-conventions]
                tasks: [analyze, plan, implement, review]
                guards:
                  - name: spend_guard
                    description: A per-run and monthly spend cap the executor checks.
              transcript:
                - role: user
                  text: >-
                    security patches: always a second model's review, never auto-merge,
                    prove the CVE is actually fixed
      responses:
        "200":
          description: |-
            The turn, streamed. For the example: the model drafts a first stage, asks what
            triggers the workflow, and the gateway meters the exchange.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CopilotDelta"
                  - $ref: "#/components/schemas/CopilotToolCall"
                  - $ref: "#/components/schemas/CopilotUsage"
                  - $ref: "#/components/schemas/CopilotError"
                  - $ref: "#/components/schemas/CopilotDone"
                discriminator:
                  propertyName: kind
                  mapping:
                    delta: "#/components/schemas/CopilotDelta"
                    tool_call: "#/components/schemas/CopilotToolCall"
                    usage: "#/components/schemas/CopilotUsage"
                    error: "#/components/schemas/CopilotError"
                    done: "#/components/schemas/CopilotDone"
              example: |
                {"kind":"delta","text":"Drafted security-patch. I added an exploit-verify stage — that task kind does not exist yet, so the draft will carry a warning until it does.\n"}
                {"kind":"tool_call","id":"call-1","tool":"add_stage","arguments":{"node":{"id":"exploit-verify","type":"llm","title":"Exploit verify","position":{"x":640,"y":200},"config":{"mode":"prompt","prompt_template":"Re-run the CVE proof of concept against the patched build.","routing":{"inherit_task":"exploit-verify"},"limits":{"max_retries":1,"token_budget":200000},"permissions":{"push_fixup":false,"touch_ci":false}}}},"error":null}
                {"kind":"tool_call","id":"call-2","tool":"ask_user","arguments":{"prompt":"What triggers it?","options":["label:security","CVE pattern in title"]},"error":null}
                {"kind":"usage","input_tokens":18400,"output_tokens":2100,"cost_cents":12.0,"model":"claude-fable-5","connection":"5eed0009-0000-4000-8000-000000000001"}
                {"kind":"done","finish_reason":"stop"}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /v0/dry-runs:
    post:
      tags: [v0]
      summary: Run a deep dry run of a workflow draft, streaming its progress
      description: |-
        The deep dry-run harness — CD.2
        ([#560](https://github.com/NobuData/ouroboros/issues/560)), mockup 20's card. One request
        walks one draft for one ticket: **real models over a virtual workspace**.

        * **Simulated writes.** Reads resolve lazily from the git host at `repository.pinned_sha`
          and are cached per repository and commit, so a file is fetched once. Writes land in an
          in-memory overlay that later stages read through — a reviewer sees the implementer's
          draft — and the overlay becomes the `overlay_diff` artifact. Nothing is written to the
          repository.
        * **Replayed infra.** A build or test stage, and the `build` and `run_tests` tools, ask
          `ouroboros-rest`'s estimator (`POST /internal/dry-runs/{id}/replay-estimates`) and pass
          its answer on untouched. No model produces a duration; without enough history the row
          says so and carries no number.
        * **Real models.** A model stage runs its own prompt through the invocation gateway
          (`POST /internal/llm/invoke`) with the alias in `stages[<node id>].alias` and the
          knowledge in `stages[<node id>].manifest`.

        **The tool boundary is an allow-list.** A stage has `read_file`, `search`, `list_dir`,
        `edit_file`, `build` and `run_tests`, and nothing else exists: no network, no shell, no
        repository write, no farm dispatch, no pull request or merge, no ticket-source write, no
        credential. A call to anything else is not run; it is reported as `guard_blocked`,
        listed in `guard_audit`, and the run ends `failed` — a dry run whose guards had to hold
        is not trusted.

        **Skipping is a result.** A stage behind a branch whose condition is false is `skipped`
        with the clause that decided it; conditions over changed paths are tested against the
        simulated diff as it stands. A model stage with no `alias` — a task kind the catalog
        does not have yet — is `skipped` with its warning, and the walk goes on past it. A
        terminal is `not_reached`: a dry run opens nothing.

        **Caps.** `budget` holds per-stage and per-run token and spend caps; a stage's own
        `limits.token_budget` applies too. Reaching one ends the run `budget_stopped` with every
        row so far kept and the rest `not_reached`.

        **Note lines are composed, not written by a model**, from what the stage did: the same
        outputs give the same text.

        The answer is `application/x-ndjson`, one event per line:

        * `stage_started` — a row has begun;
        * `stage_finished` — a row, in the shape `dry_run_stages` stores;
        * `guard_blocked` — the tool boundary refused a call;
        * `done` — always last, exactly once: the whole result, with its artifacts, guard audit,
          totals and `status` (`complete`, `failed` or `budget_stopped`).

        A definition that does not validate answers one `done` with `status: failed` and its
        `findings`. Until AF.2 ([#235](https://github.com/NobuData/ouroboros/issues/235)) lands
        the gateway answers `501`, so the first model stage fails with `gateway_unavailable`.

        This service persists nothing and dispatches nothing; the caller stores the result.
        `repository.token` is used to read the pinned commit and is never logged, echoed or
        shown to a model.
      operationId: runDryRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DryRunRequest"
            example:
              dry_run: 5eed008b-0000-4000-8000-000000000001
              definition:
                dsl_version: '1.0'
                trigger:
                  event: ticket_queued
                  conditions:
                    labels:
                    - security
                nodes:
                - id: trigger
                  type: trigger
                  title: trigger
                  position:
                    x: 0
                    y: 0
                  config: {}
                - id: analyze
                  type: llm
                  title: analyze
                  position:
                    x: 0
                    y: 0
                  config:
                    mode: skill
                    prompt_template: Map the code paths {{issue.title}} touches.
                    routing:
                      pinned_model:
                        alias: coder-std
                    limits:
                      max_retries: 1
                      token_budget: 200000
                    permissions:
                      push_fixup: false
                      touch_ci: false
                    skill: advisory-db
                - id: plan
                  type: llm
                  title: plan
                  position:
                    x: 0
                    y: 0
                  config:
                    mode: prompt
                    prompt_template: Plan the fix for {{ issue.key }}.
                    routing:
                      pinned_model:
                        alias: coder-std
                    limits:
                      max_retries: 1
                      token_budget: 200000
                    permissions:
                      push_fixup: false
                      touch_ci: false
                - id: implement
                  type: llm
                  title: implement
                  position:
                    x: 0
                    y: 0
                  config:
                    mode: prompt
                    prompt_template: Implement the plan.
                    routing:
                      inherit_task: code
                    limits:
                      max_retries: 1
                      token_budget: 200000
                    permissions:
                      push_fixup: false
                      touch_ci: false
                - id: build
                  type: infra
                  title: build
                  position:
                    x: 0
                    y: 0
                  config:
                    runner_pool: pool-a
                - id: test
                  type: infra
                  title: test
                  position:
                    x: 0
                    y: 0
                  config:
                    command: west twister -T tests
                - id: review-primary
                  type: llm
                  title: review
                  position:
                    x: 0
                    y: 0
                  config:
                    mode: prompt
                    prompt_template: Review the change.
                    routing:
                      inherit_task: review
                    limits:
                      max_retries: 1
                      token_budget: 200000
                    permissions:
                      push_fixup: false
                      touch_ci: false
                - id: review-second
                  type: llm
                  title: review
                  position:
                    x: 0
                    y: 0
                  config:
                    mode: prompt
                    prompt_template: Review the change again.
                    routing:
                      pinned_model:
                        alias: coder-std
                    limits:
                      max_retries: 1
                      token_budget: 200000
                    permissions:
                      push_fixup: false
                      touch_ci: false
                - id: open-pr
                  type: term
                  title: open PR
                  position:
                    x: 0
                    y: 0
                  config:
                    action: needs_review
                    options: {}
                - id: exploit-verify
                  type: llm
                  title: exploit-verify
                  position:
                    x: 0
                    y: 0
                  config:
                    mode: prompt
                    prompt_template: Re-run the CVE proof-of-concept against the patched build.
                    routing:
                      inherit_task: exploit-verify
                    limits:
                      max_retries: 1
                      token_budget: 200000
                    permissions:
                      push_fixup: false
                      touch_ci: false
                edges:
                - from: trigger
                  to: analyze
                  kind: default
                - from: analyze
                  to: plan
                  kind: default
                - from: plan
                  to: implement
                  kind: default
                - from: implement
                  to: build
                  kind: default
                - from: build
                  to: test
                  kind: default
                - from: test
                  to: exploit-verify
                  kind: default
                - from: exploit-verify
                  to: review-primary
                  kind: default
                - from: review-primary
                  to: open-pr
                  kind: default
                - from: exploit-verify
                  to: review-second
                  kind: default
                - from: review-second
                  to: open-pr
                  kind: default
              ticket:
                external_key: '#489'
                source: github
                labels:
                - security
                - can
                estimate:
                  effort: m
                title: CAN arbitration retries flood the bus
                body: Lost-arbitration frames are retried at once.
              repository:
                slug: acme-robotics/helios-firmware
                pinned_sha: 8c1b2e40d6a5f3c19b7e2a4d8f0c6b13e5a7d9f2
                api_url: https://api.github.com
                token: <a read token for this request>
              stages:
                analyze:
                  alias: coder-std
                  manifest: ''
                  skill_resolved: false
                  warnings:
                  - No skill named `advisory-db` is defined in this workspace yet.
                plan:
                  alias: coder-std
                  manifest: 'Repo profile: Zephyr RTOS, C17.'
                  skill_resolved: true
                  warnings: []
                implement:
                  alias: coder-max
                  resolution_version: z1-v7
                  manifest: ''
                  skill_resolved: true
                  warnings: []
                review-primary:
                  alias: reviewer
                  manifest: ''
                  skill_resolved: true
                  warnings: []
                review-second:
                  alias: coder-std
                  manifest: ''
                  skill_resolved: true
                  warnings: []
                exploit-verify:
                  manifest: ''
                  skill_resolved: true
                  warnings:
                  - No routing task named `exploit-verify` exists in this workspace yet.
              budget: {}
      responses:
        "200":
          description: |-
            The dry run, streamed. For the example: five model stages, two replayed
            infrastructure stages, one stage skipped as unresolved, and a terminal not reached.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DryRunStageStarted"
                  - $ref: "#/components/schemas/DryRunStageFinished"
                  - $ref: "#/components/schemas/DryRunGuardBlocked"
                  - $ref: "#/components/schemas/DryRunDone"
                discriminator:
                  propertyName: kind
                  mapping:
                    stage_started: "#/components/schemas/DryRunStageStarted"
                    stage_finished: "#/components/schemas/DryRunStageFinished"
                    guard_blocked: "#/components/schemas/DryRunGuardBlocked"
                    done: "#/components/schemas/DryRunDone"
