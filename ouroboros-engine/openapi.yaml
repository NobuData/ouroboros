            $ref: '#/components/schemas/DryRunStageResult'
          type: array
        artifacts:
          description: The overlay diff and the excerpts.
          items:
            $ref: '#/components/schemas/DryRunArtifact'
          type: array
        guard_audit:
          description: Every blocked call. Empty on a clean run.
          items:
            $ref: '#/components/schemas/DryRunGuardEntry'
          type: array
        guards_clean:
          description: Whether the audit is empty.
          type: boolean
        tokens:
          description: Tokens used by every model call.
          minimum: 0
          type: integer
        cost_cents:
          description: What they cost, or `null` when no call was priced — never a zero that was not measured.
          minimum: 0
          type:
          - integer
          - 'null'
        duration_ms:
          description: Wall time of the harness.
          minimum: 0
          type: integer
        workspace_notes:
          description: What the virtual workspace could not do in full — a tree the provider truncated,
            a search that stopped at its file bound.
          items:
            type: string
          type: array
        fetches:
          description: How many reads went to the provider (cache hits are not counted).
          minimum: 0
          type: integer
    DryRunStageStarted:
      type: object
      title: DryRunStageStarted
      description: A stage has begun — the card's live row.
      additionalProperties: false
      required:
      - seq
      - stage_key
      - display_name
      properties:
        kind:
          description: '`stage_started`.'
          const: stage_started
          type: string
        seq:
          description: The row's position.
          type: integer
        stage_key:
          description: Its slug.
          type: string
        display_name:
          description: What the card prints.
          type: string
    DryRunStageFinished:
      type: object
      title: DryRunStageFinished
      description: A stage has its result.
      additionalProperties: false
      required:
      - stage
      properties:
        kind:
          description: '`stage_finished`.'
          const: stage_finished
          type: string
        stage:
          $ref: '#/components/schemas/DryRunStageResult'
    DryRunGuardBlocked:
      type: object
      title: DryRunGuardBlocked
      description: The tool boundary refused a call, as it happened.
      additionalProperties: false
      required:
      - guard
      - call
      - stage_key
      properties:
        kind:
          description: '`guard_blocked`.'
          const: guard_blocked
          type: string
        guard:
          description: Which guard held.
          type: string
        call:
          description: What was attempted.
          type: string
        stage_key:
          description: The stage that attempted it.
          type: string
    DryRunDone:
      type: object
      title: DryRunDone
      description: The run has ended. Always the last event, and there is always exactly one.
      additionalProperties: false
      required:
      - result
      properties:
        kind:
          description: '`done`.'
          const: done
          type: string
        result:
          $ref: '#/components/schemas/DryRunResult'

    SkillRef:
      type: object
      title: SkillRef
      description: The skill version to follow. Closed.
      additionalProperties: false
      required:
      - slug
      - version
      - body
      properties:
        slug:
          maxLength: 64
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          type: string
        version:
          minimum: 1
          type: integer
        body:
          maxLength: 200000
          minLength: 1
          type: string
    SkillRunRequest:
      type: object
      title: SkillRunRequest
      description: One run of one skill. Closed.
      additionalProperties: false
      required:
      - run
      - skill
      - output
      - input
      - alias
      properties:
        run:
          maxLength: 200
          minLength: 1
          type: string
        skill:
          $ref: '#/components/schemas/SkillRef'
        output:
          enum:
          - roadmap
          - issue_bodies
          type: string
        input:
          additionalProperties: true
          type: object
        alias:
          maxLength: 200
          minLength: 1
          type: string
        resolution_version:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
        cost_cap_cents:
          anyOf:
          - minimum: 0
            type: integer
          - type: 'null'
    RoadmapItem:
      type: object
      title: RoadmapItem
      description: One item of a milestone. Closed.
      additionalProperties: false
      required:
      - key
      - title
      - mvp
      properties:
        key:
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          type: string
        title:
          maxLength: 512
          minLength: 1
          type: string
        mvp:
          type: boolean
        effort:
          anyOf:
          - enum:
            - xs
            - s
            - m
            - l
            - xl
            type: string
          - type: 'null'
    RoadmapMilestone:
      type: object
      title: RoadmapMilestone
      description: One milestone. Closed.
      additionalProperties: false
      required:
      - key
      - name
      - items
      properties:
        key:
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          type: string
        name:
          maxLength: 200
          minLength: 1
          type: string
        target_date:
          anyOf:
          - format: date
            type: string
          - type: 'null'
        items:
          items:
            $ref: '#/components/schemas/RoadmapItem'
          maxItems: 500
          type: array
    Roadmap:
      type: object
      title: Roadmap
      description: A roadmap, as ``create-roadmap`` answers it. Closed.
      additionalProperties: false
      required:
      - title
      - milestones
      properties:
        title:
          maxLength: 200
          minLength: 1
          type: string
        milestones:
          items:
            $ref: '#/components/schemas/RoadmapMilestone'
          maxItems: 50
          minItems: 1
          type: array
    IssueBody:
      type: object
      title: IssueBody
      description: The description of one item's issue. Closed.
      additionalProperties: false
      required:
      - key
      - body
      properties:
        key:
          pattern: ^[a-z0-9][a-z0-9_-]{0,31}$
          type: string
        body:
          maxLength: 60000
          minLength: 1
          type: string
    SkillUsage:
      type: object
      title: SkillUsage
      description: What one hop of one model call consumed. Closed.
      additionalProperties: false
      required:
      - hop
      - connection
      - model
      - input_tokens
      - output_tokens
      properties:
        hop:
          type: integer
        connection:
          type: string
        model:
          type: string
        input_tokens:
          type: integer
        output_tokens:
          type: integer
        cost_cents:
          anyOf:
          - type: number
          - type: 'null'
    SkillRunResult:
      type: object
      title: SkillRunResult
      description: What a run produced. Closed.
      additionalProperties: false
      required:
      - skill
      - version
      - output
      - attempts
      properties:
        skill:
          type: string
        version:
          type: integer
        output:
          enum:
          - roadmap
          - issue_bodies
          type: string
        roadmap:
          anyOf:
          - $ref: '#/components/schemas/Roadmap'
          - type: 'null'
        issues:
          anyOf:
          - items:
              $ref: '#/components/schemas/IssueBody'
            type: array
          - type: 'null'
        attempts:
          minimum: 1
          type: integer
        usage:
          items:
            $ref: '#/components/schemas/SkillUsage'
          type: array
