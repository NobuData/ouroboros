  /v0/analysis/analyzers:
    get:
      tags: [v0]
      summary: The installed analyzer set
      description: |-
        The analyzers a run would execute, in `analysis_runs.analyzer_set`'s shape (`V080`) —
        BV.1 ([#510](https://github.com/NobuData/ouroboros/issues/510)). `ouroboros-rest` records
        it on the run before it assembles a corpus, so a run's provenance is known from its first
        row. `label` is what *Analyzed by* renders: `deterministic analyzers v1` until BX.1's LLM
        pass exists (decision **A3**). Analyzers are in id order — the order a run executes them.
      operationId: analyzerSet
      responses:
