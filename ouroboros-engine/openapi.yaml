                module: src/dock
                stack: c
                status: ok
                reason: null
                nodes:
                - src/dock/dock_ctrl.c
                - src/dock/dock_ctrl.h
                edges:
                - source: src/dock/dock_ctrl.c
                  target: include/app/motor.h
                  weight: 1
                - source: src/dock/dock_ctrl.c
                  target: src/dock/dock_ctrl.h
                  weight: 1
                - source: src/dock/dock_ctrl.h
                  target: src/motor/pid.h
                  weight: 1
                module_edges:
                - source: src/dock
                  target: include/app
                  weight: 1
                - source: src/dock
                  target: src/motor
                  weight: 1
                external:
                - <zephyr/kernel.h>
                truncated: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '422':
          $ref: '#/components/responses/CodeUnprocessable'
        '502':
          $ref: '#/components/responses/CodeFetchFailed'
  /v0/code/bisect-commits:
    post:
      tags:
      - v0
      summary: The commits a bisect between two refs walks
      description: 'The first-parent line after `good` up to and including `bad` — the candidates a bisect
        binary-searches — and its bound, `⌊log₂ n⌋ + 1` build-farm jobs. The bisect itself (one farm job
        per step, checkpointed, cancellable) is orchestrated by `ouroboros-rest`; a `good` that is not on
        `bad`''s first-parent line is `409 code_not_ancestor`.


        Part of the **code & git mining tool** — CL.4 ([#617](https://github.com/NobuData/ouroboros/issues/617)),
        mockup 22''s *⌥ Codebase & git mining* row. `ouroboros-rest`''s `code` research adapter calls it
        with the repository, the workspace it is read for and, **for this call only**, the workspace''s
        GitHub token; the token fetches the clone and is never stored or echoed. Clones are bare mirrors
        under `OURO_ENGINE_CLONE_DIR`, one per workspace and repository, refreshed when older than `OURO_ENGINE_CLONE_REFRESH_SECONDS`;
        a ref the clone lacks forces one fetch before it is a `404`. Nothing here writes to a repository.


        Every answer names the 40-hex commit it was read at (`sha`), so the citation `ouroboros-rest` builds
        from it — `git://owner/name@sha/path#Lnn` — re-runs to the same answer.'
      operationId: codeBisectCommits
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BisectCommitsRequest'
            example:
              repository:
                workspace: a7150000-0000-4000-8000-000000000617
                slug: acme-robotics/helios-firmware
                remote: https://github.com/acme-robotics/helios-firmware.git
                token: ghs_example-installation-token
              good: v2.0.4
              bad: nightly
      responses:
        '200':
          description: The answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BisectCommits'
              example:
                clone:
                  repository: acme-robotics/helios-firmware
                  fetched_at: '2026-10-09T06:00:00Z'
                  stale: false
                good: v2.0.4
                bad: nightly
                good_sha: f37e8886147061e46a3d448f2cffe491d57b7aaf
                bad_sha: 5d610dcd6024306c6ada2831742a31522688badc
                bad_ref_name: refs/heads/nightly
                commits:
                - ecd512b0fd6bb45f7b54f4dc14148963247c9dc8
                - ec09cf6422bf42736baf00df475c9ded667a1afc
                - 47cb090e9f655c09fddc53c6614f215381db90d5
                - 4f1fe54910885c92250b1a2e47709c7b2250eba6
                - c196da80fcbec673f61da0fd13b950a1b9ec09fd
                - 5d610dcd6024306c6ada2831742a31522688badc
                max_steps: 3
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/CodeNotFound'
        '409':
          $ref: '#/components/responses/CodeNotAncestor'
        '422':
          $ref: '#/components/responses/CodeUnprocessable'
        '502':
          $ref: '#/components/responses/CodeFetchFailed'
  /v0/investigate:
    post:
      tags:
      - v0
      summary: Run or resume an investigation in the background
      description: |-
        Accepts an investigation and answers `202` at once; the **investigation loop**
        (`loop-v1`) then runs in the background — CM.1
        ([#620](https://github.com/NobuData/ouroboros/issues/620)), mockup 22's
        *Start investigation*:

        ```
        plan        decompose the question into research questions
        iterate     choose tool operations, run each, digest what it archived
        synthesize  candidate claims, each held to the citation gate
        deliver     the brief and the playbook's deliverable inputs
        ```

        Everything durable is `ouroboros-rest`'s: the loop claims the run, calls research
        tools, saves a checkpoint after every step, and delivers through
        `/internal/research/*`. Nothing comes back through this response.

        **One loop, every kind.** The request carries the kind's playbook — its synthesis
        template and deliverables — and the loop branches on nothing else (decision V10).

        **Every finding is cited.** A candidate claim whose cite keys name no record of the
        investigation's ledger is delivered as an open question, never as a finding
        (decision V3).

        **Submitting is idempotent.** A process already working on the investigation
        answers `already_running` and starts nothing; any other starts an attempt that
        continues from the stored checkpoint. `ouroboros-rest` submits a `running`
        investigation again when its checkpoint stops moving, which is how one survives an
        engine restart.

        **Depth and budget.** `quick`, `standard` and `deep_dive` run 1, 2 and 4 iterations
        and synthesis passes; `budget` bounds tool operations, ledger sources and model
        spend. Reaching the spend ceiling ends the investigation as `failed` with
        `budget_breach`; the other designed failures are `tool_exhaustion`,
        `synthesis_failure` and `engine_error`. Each keeps the ledger and the checkpoint.

        Models are called through `ouroboros-rest`'s invocation gateway on the aliases the
        request names. Until that gateway is implemented (AF.2,
        [#235](https://github.com/NobuData/ouroboros/issues/235)) an investigation ends as
        `failed: synthesis_failure`.
      operationId: investigate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvestigateRequest'
            example:
              investigation: 5eed0091-0000-4000-8000-000000000127
              kind:
                slug: gap_analysis
                playbook:
                  version: 1
                  default_tools:
                  - web
                  - competitor
                  - code
                  - tickets
                  - telemetry
                  synthesis_template: gap_analysis@1
                  deliverables:
                  - brief
                  - matrix
              question: Why do rivals dock reliably in wind and we do not?
              tools:
              - slug: web
                operations:
                - search
                - fetch
                description: Web search and page reader
              - slug: code
                operations:
                - query
                description: blame, bisect, dependency graph over helios-firmware
              depth: deep_dive
              budget:
                operations: 40
                sources: 60
                spend_cents: 1031
              alias: researcher-long-ctx
              plan_alias: sizer
              resolution_version: r1
      responses:
        '202':
          description: Accepted. The loop runs after this answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvestigationAccepted'
              example:
                investigation: 5eed0091-0000-4000-8000-000000000127
                task: investigate:5eed0091-0000-4000-8000-000000000127
                state: accepted
                loop_version: loop-v1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvestigationUnprocessable'
        '503':
          $ref: '#/components/responses/InvestigationCapacity'
  /v0/skills/run:
    post:
      tags:
      - v0
      summary: Run a registry skill over an input
      description: |-
        Follows one **skill** — a procedure kept in the Knowledge registry (BE.1,
        [#405](https://github.com/NobuData/ouroboros/issues/405)) — over an input, and answers
        with a validated result. CM.5
        ([#624](https://github.com/NobuData/ouroboros/issues/624)): the roadmap pipeline's
        `create-roadmap` and `create-issues`.

        `ouroboros-rest` sends the body of the version it resolved for the workspace, so a
        workspace that edits its copy of a skill changes what runs. The procedure is the
        system prompt; a rule for the output's shape is appended to it, so an edit cannot
        change what the control plane stores.

        * `output: roadmap` — milestones with target dates and items with an MVP flag and an
          effort. A re-run carries the version before it as `input.previous` and keeps the
          key of everything that survives; `input.suggestions` are applied.
        * `output: issue_bodies` — one description for every item of `input.items`, keyed by
          the item; an answer that skips or invents an item is refused.

        **The answer is validated, and re-asked once.** A model that answers outside the
        contract is told what was wrong and asked again; a second miss is
        `422 skill_output_invalid`. Nothing is repaired here.

        **Models.** Calls go through the control plane's invocation gateway under the alias
        the request names. Until that gateway is implemented (AF.2,
        [#235](https://github.com/NobuData/ouroboros/issues/235)) a run answers
        `502 skill_model_failed` with `details.reason: gateway_unavailable`.
      operationId: runSkill
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SkillRunRequest'
            example:
              run: 5eed0097-0000-4000-8000-000000000124
              skill:
                slug: create-roadmap
                version: 1
                body: Turn the brief into a roadmap of dated milestones.
              output: roadmap
              input:
                brief: '# RS-124 — Q4 product improvements'
                suggestions:
                - text: Pull the gust estimator into the M1 MVP set.
              alias: research
              resolution_version: r1
      responses:
        '200':
          description: The validated result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillRunResult'
              example:
                skill: create-roadmap
                version: 1
                output: roadmap
                roadmap:
                  title: Helios — Q4 Improvement Roadmap
                  milestones:
                  - key: m1
                    name: Docking parity
                    target_date: '2026-10-15'
                    items:
                    - key: dock-mpc
                      title: Wind-feedforward MPC in final approach
                      mvp: true
                      effort: l
                issues: null
                attempts: 1
                usage: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/SkillUnprocessable'
        '502':
          $ref: '#/components/responses/SkillModelFailed'

components:
  securitySchemes:
    InternalKey:
      type: apiKey
      in: header
      name: X-Ouro-Internal-Key
      description: |-
        The shared secret both sides of the internal boundary hold: `ouroboros-engine`
        reads it from `OURO_ENGINE_SHARED_SECRET`, `ouroboros-rest` sends it. There is no
        other credential and no other scheme — no bearer token, no user identity. This
        is a service-to-service header, and it is generated per environment.

  responses:
    Unauthorized:
      description: |-
        The `X-Ouro-Internal-Key` header was missing or wrong. The body is constant: it
        names no path, echoes no header and offers no hint about what the key should look
        like. What an operator needs is in the engine's log instead, which stays inside
        the cluster.

        `ouroboros-rest` never forwards this to a browser. A key its own deployment holds
        wrongly is its problem and not the caller's, so it logs the mismatch and answers
        `502` — never `401`, which would invite a browser to try signing in again against
        a boundary it cannot reach at all.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: unauthenticated
            message: Unauthorized.
            details: {}

    UnprocessableEntity:
      description: |-
        The request was understood and its content is not acceptable — a missing field, a
        `task_kind` that is not a well-formed kind, a property the operation does not
        declare. `details` carries one entry per field, keyed the way the caller wrote it,
        so each message can be shown against the input that produced it.

        `422` rather than `400`: the body parsed, so a caller can tell *I sent the wrong
        value* from *I sent something that is not a request*. It is the status
        `ouroboros-rest` answers its own validation failures with, and the code is the
        same one.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: validation_failed
            message: The request is not valid. See `details` for each field.
            details:
              task_kind:
                - String should match pattern '^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$'

    CodeNotFound:
      description: '`code_ref_not_found` — the ref names no commit even after a fresh fetch (or is an ambiguous
        abbreviation); `code_path_not_found` — the path, file or module is not in the tree at that commit.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: code_path_not_found
            message: There is no file src/dock/dock_ctl.c at 5d610dcd6024.
            details:
              path: src/dock/dock_ctl.c
              sha: 5d610dcd6024306c6ada2831742a31522688badc
    CodeNotAncestor:
      description: '`code_not_ancestor` — `good` is `bad`, or is not on `bad`''s first-parent line, so there
        is no line to bisect.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: code_not_ancestor
            message: good is not on bad's first-parent line
            details: {}
    CodeUnprocessable:
      description: '`validation_failed` — the body is malformed (a ref with revision syntax, a path with `..`,
        a range that ends before it starts), with one entry per field; or a `code_*` refusal of a well-formed
        request: `code_remote_refused` (the remote is not `https://host/owner/name`), `code_range_outside_file`,
        `code_range_too_wide` (over 500 lines), `code_bisect_too_long` (over 10 000 candidates).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: code_range_outside_file
            message: VERSION has 1 lines; line 9 does not exist
            details:
              path: VERSION
              start: 9
              length: 1
    CodeFetchFailed:
      description: 'The clone could not be made: `code_remote_auth` (the remote refused the token) or `code_remote_unreachable`
        (anything else). The message is constant. A clone that exists is read as it was when only its refresh
        fails — `clone.stale` says so — so this answers only a repository never fetched.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: code_remote_auth
            message: The repository could not be fetched.
            details: {}
    InvestigationUnprocessable:
      description: '`validation_failed` — the body is malformed, with one entry per field; or `investigation_playbook_unsupported`
        — the playbook names a synthesis template, or a deliverable, this build cannot produce. Refused before
        any work starts.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: investigation_playbook_unsupported
            message: this engine has no synthesis template "gap_analysis@2"
            details:
              synthesis_template: gap_analysis@2
    InvestigationCapacity:
      description: '`investigation_capacity` — every investigation worker of this process is busy. Nothing was
        started; submit it again later.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: investigation_capacity
            message: Every investigation worker is busy. Submit it again in a moment.
            details: {}
    SkillUnprocessable:
      description: '`validation_failed` — the body is malformed, with one entry per field; `skill_input_invalid`
        — the input cannot produce the output asked for (no model was called); or `skill_output_invalid`
        — the model answered outside the contract twice.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: skill_output_invalid
            message: The model did not answer in the shape the skill's output requires.
            details:
              problem: 'milestones.0.items.1.key: String should match pattern'
    SkillModelFailed:
      description: '`skill_model_failed` — a model call produced no answer. `details.reason` is the gateway''s
        code: `gateway_unavailable`, `chain_exhausted` or `cost_cap_exceeded`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: skill_model_failed
            message: The invocation gateway is not available.
            details:
              reason: gateway_unavailable

  schemas:
    Liveness:
      type: object
      title: Liveness
      description: The body of a `GET /healthz` response.
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: ok
          description: |-
            Always `ok`. A probe reads the status code; this is for the human who runs
            the same request by hand.
          examples: [ok]

    ServiceIdentity:
      type: object
      title: ServiceIdentity
      description: The body of a `GET /` response.
      additionalProperties: false
      required: [service, version]
      properties:
        service:
          type: string
          const: ouroboros-engine
          description: Distribution name of this service, constant across deployments.
          examples: [ouroboros-engine]
        version:
          type: string
          description: Installed version, from package metadata.
          examples: ["0.2.0"]

    ServiceStatus:
      type: object
      title: ServiceStatus
      description: The body of a `GET /v0/status` response.
      additionalProperties: false
      required: [service, version, uptime_seconds]
      properties:
        service:
          type: string
          const: ouroboros-engine
          description: Distribution name of this service, constant across deployments.
          examples: [ouroboros-engine]
        version:
          type: string
          description: |-
            Installed version, read from package metadata — the same string `GET /`
            reports, so there is one source for "which build is this".
          examples: ["0.2.0"]
        uptime_seconds:
          type: number
          minimum: 0
          description: |-
            Seconds since this process built its application, rounded to milliseconds.
            Small and shrinking across calls means something is restarting the container.
          examples: [1234.567]

    EchoRequest:
      type: object
      title: EchoRequest
      description: |-
        The body of a `POST /v0/tasks/echo` request, and the shape that comes back under
        `echo`. Closed: a property not listed here is refused rather than dropped.
      additionalProperties: false
      required: [task_kind, payload]
      properties:
        task_kind:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-z][a-z0-9]*(?:[._-][a-z0-9]+)*$"
          description: |-
            Which kind of task this is, as a registry would name it. Lower-case, starting
            with a letter, with single `.`, `_` or `-` separators — narrow on purpose,
            because this is what a future handler is looked up by and it has to survive
            being a dictionary key, a log field and a metric label without quoting.
          examples: [echo]
        payload:
          type: object
          description: |-
            The task's own arguments. Open, because what a task takes is the task's
            business; what the contract requires is that it is an object rather than a
            string somebody has to parse twice.
          examples: [{ note: hello from ouroboros-rest }]

    EchoResponse:
      type: object
      title: EchoResponse
      description: The body of a `POST /v0/tasks/echo` response.
      additionalProperties: false
      required: [accepted, echo, engine_version]
      properties:
        accepted:
          type: boolean
          const: true
          description: |-
            Always `true`. This route has exactly one success: a request that validates is
            accepted, and one that does not is a `422` rather than a `200` carrying
            `false`. A task that can be refused while being well-formed is
            [#54](https://github.com/NobuData/ouroboros/issues/54)'s, and will say so on a
            different route.
          examples: [true]
        echo:
          $ref: "#/components/schemas/EchoRequest"
          description: |-
            The request, as received and after validation — so a caller sees what the
            engine actually parsed rather than what it believes it sent.
        engine_version:
          type: string
          description: |-
            Installed version of the build that answered — the same string `GET /` and
            `GET /v0/status` report. In the body rather than only on `/v0/status` because
            the gateway logs a round trip it made, and the build that served it belongs in
            that line without a second call.
          examples: ["0.3.0"]

    IssueContext:
      type: object
      title: IssueContext
      description: |-
        The issue being sized, as much of it as an estimator reads. Mirrors K.1's
        `github_issues` row ([#99](https://github.com/NobuData/ouroboros/issues/99)) for the
        five fields sizing depends on and nothing else from it — an estimator has no
        business with `sizing_status` or the row's identifiers, and a field it cannot use is
        a field the gateway would have to keep sending.
      additionalProperties: false
      required: [number, title, body, labels, repo]
      properties:
        number:
          type: integer
          minimum: 1
          description: |-
            The issue's number within its repository — GitHub's number and the mockup's,
            not a database id, so a payload can be read against the page it came from.
          examples: [485]
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: The issue title, as GitHub holds it.
          examples: [I2C bus lockup after IMU sleep/wake cycle]
        body:
          type: [string, "null"]
          maxLength: 65536
          description: |-
            The issue description in full, or `null` for an issue opened without one.
            Nullable rather than defaulted to `""` because K.1's column is nullable for the
            same reason: GitHub makes no distinction between an empty description and no
            description, and this contract does not invent one. Required rather than
            optional, so "this issue has no body" is something the caller states rather
            than something a missing key implies.
          examples:
            - After entering low-power sleep and waking the BMI270, the I2C bus intermittently locks up.
        labels:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 50
          description: |-
            GitHub's label *names*, the way K.1 stores them. The heuristic estimator's
            strongest signal, and empty for most issues.
          examples: [[bug, i2c, watchdog]]
        repo:
          type: string
          pattern: "^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$"
          maxLength: 140
          description: |-
            `owner/name` — GitHub's own `full_name`, and what the mockup's head shows. The
            pattern is there so a caller that sent only the repository name is refused
            rather than having an estimator read an owner out of nothing.
          examples: [acme-robotics/helios-firmware]

    EstimationContext:
      type: object
      title: EstimationContext
      description: |-
        The vocabularies that exist, told to the engine rather than assumed by it — roadmap
        decisions **K5** and **K6**. A workflow tag and a routed model are opaque strings
        this service ascribes no meaning to, and the set of them belongs to the
        installation, so the caller sends them and an answer naming anything outside them is
        refused before it leaves the engine.

        Both are required and non-empty. A request offering no tags has no answer this
        contract can give — `suggested_workflow` is required — so it is a `422` rather than
        an estimate carrying a field the caller cannot use.
      additionalProperties: false
      required: [workflow_tags, model_defaults]
      properties:
        workflow_tags:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: |-
            Every workflow tag the installation has, as the mockup's tag chip shows one.
            Opaque, so only their number and length are constrained — a bound is not a
            meaning.
          examples: [[standard-fix, docs-loop, feature-loop, deps-refresh]]
        model_defaults:
          type: object
          minProperties: 1
          maxProperties: 64
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 128
          description: |-
            The models an estimate may route to, keyed by the caller's own name for the
            class of work each is the default for. A map rather than a list because that is
            what the caller has, and its *values* are what `routed_model` must be one of.
          examples: [{ default: claude-fable-5, docs: claude-haiku-4-5 }]
        facts:
          type: array
          maxItems: 64
          default: []
          items:
            $ref: "#/components/schemas/ContextFact"
          description: |-
            The confirmed facts the caller's context assembly resolved for the issue's
            repository (BF.5, #414) — knowledge rather than vocabulary, so nothing in an answer
            is held to it. Optional and empty by default; `heuristic-v0` reads none of it.

    ContextFact:
      type: object
      title: ContextFact
      description: |-
        One confirmed fact from the caller's context manifest (BF.5, #414). The caller decides
        which facts apply — confirmed only, scope-filtered, trimmed to a budget — and records
        what it sent; the engine only reads them. Closed.
      additionalProperties: false
      required: [id, text]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The fact's id in ouroboros-db — a canonical lower-case uuid.
          examples: [5eed0044-0000-4000-8000-000000000001]
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: The fact as a person confirmed it, inline-code spans and all.
          examples: ["CI needs `west update` before first build of the day"]

    EstimateRequest:
      type: object
      title: EstimateRequest
      description: |-
        The body of a `POST /v0/estimate` request. Two blocks, and the split is the
        contract's argument about who knows what: the issue is the *problem*, and the
        context is what the installation happens to be configured with. An estimator reads
        both and invents neither. Closed — a property not listed here is refused rather than
        dropped.
      additionalProperties: false
      required: [issue, context]
      properties:
        issue:
          $ref: "#/components/schemas/IssueContext"
          description: The issue to size.
        context:
          $ref: "#/components/schemas/EstimationContext"
          description: The vocabularies an answer may use.

    Breakdown:
      type: object
      title: Breakdown
      description: |-
        The *AI Work Breakdown* panel as data — K.2's `breakdown` jsonb exactly, five keys
        and no more. The panel renders four of them; the fifth, `est_minutes`, is what M.3's
        queue write reads, which is why it is a stored number rather than something a reader
        recomputes from the cycle range.
      additionalProperties: false
      required: [files, est_tokens, cycle_min, cycle_max, est_minutes]
      properties:
        files:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 4096
          description: |-
            The paths an estimator believes the work touches, as the panel's *Estimated
            files touched* list. **Empty is a real answer, and the one `heuristic-v0`
            always gives**: a rule engine reading labels and body length cannot know which
            files an issue touches, and the mockup renders that absence rather than
            guessing. The key is always present — an empty list, never a missing field —
            because the two mean different things to a reader. The example below is the
            LLM estimator's shape; today's answers carry `[]`.
          examples: [[drivers/i2c_recovery.c, tests/unit/test_i2c_lockup.c]]
        est_tokens:
          type: integer
          minimum: 0
          maximum: 100000000
          description: |-
            How many model tokens the *work* is expected to cost. Not what the estimate
            cost — that is `trace.tokens_used`, and confusing the two makes a sizing look a
            thousand times more expensive than it was.
          examples: [180000]
        cycle_min:
          type: integer
          minimum: 0
          maximum: 100000
          description: The optimistic end of the wall-clock range, in minutes.
          examples: [12]
        cycle_max:
          type: integer
          minimum: 0
          maximum: 100000
          description: The pessimistic end of the wall-clock range, in minutes. Never below `cycle_min`.
          examples: [18]
        est_minutes:
          type: integer
          minimum: 0
          maximum: 100000
          description: |-
            The single number the queue plans with, in minutes. Deliberately *not*
            constrained to the cycle range: K.2's own example carries a 12–18 minute cycle
            beside 23 estimated minutes, because a job's wall clock includes what happens
            either side of the model's part of it.
          examples: [23]

    Trace:
      type: object
      title: Trace
      description: |-
        Where the estimate came from — K.2's `trace` jsonb, minus its clock. The collapsible
        *Estimation trace* under the panel, and the reason re-estimation is auditable at
        all: an estimate that cannot say what produced it is one nobody can compare against
        the next.

        `sized_at` is K.2's and not this contract's. The estimator does not own the clock —
        the row's writer does — and a timestamp in a response body is one two services can
        disagree about.
      additionalProperties: false
      required: [estimator, tokens_used, signals]
      properties:
        estimator:
          type: string
          minLength: 1
          maxLength: 64
          description: |-
            What produced this — `heuristic-v0` for the rule engine installed today, and a
            model identifier for the LLM estimator that replaces it. **Decision K10**:
            required and non-empty here as well as `not null` there, so provenance cannot be
            lost on the way to the row. It is never a model this estimate did not use.
          examples: [heuristic-v0]
        tokens_used:
          type: integer
          minimum: 0
          maximum: 100000000
          description: |-
            What producing *this estimate* cost, in model tokens. `0` for an estimator that
            called no model, which is the honest answer for a rule engine rather than a
            missing field — and what `heuristic-v0` always reports.
          examples: [0]
        signals:
          type: array
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 256
          description: |-
            What the answer was reached from, one line each — a rule name for the heuristic,
            a retrieved neighbour for the LLM estimator. Empty rather than absent when an
            estimator has nothing to show.
          examples: [[3 similar closed issues, driver map, HIL test index]]

    Estimate:
      type: object
      title: Estimate
      description: |-
        The body of a `POST /v0/estimate` response — one version of K.2's `issue_estimates`
        row. Every field is a column or a jsonb key of that table; the five columns with no
        field here belong to whoever writes the row. Closed, so an estimator cannot smuggle
        a field this document does not describe: `/v0` allows a field to be *added* to a
        response, and adding one is an edit to this document and to the model together.
      additionalProperties: false
      required:
        [
          effort,
          confidence,
          suggested_workflow,
          routed_model,
          breakdown,
          risk,
          risk_note,
          trace,
        ]
      properties:
        effort:
          type: string
          enum: [xs, s, m, l, xl]
          description: |-
            How much work this is — the mockup's *Effort* column and K.2's CHECK
            constraint, lower case because it is a stored value and a filter key. The
            table's `XS` is a presentation decision the UI makes.
          examples: [m]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
          description: |-
            How much the estimator trusts its own answer. The caller reads it against a
            floor and routes a low one to `needs_human`, so a hedge is expressed here
            rather than by refusing to answer.
          examples: [92]
        suggested_workflow:
          type: string
          minLength: 1
          maxLength: 64
          description: |-
            Which workflow tag should run it — always one of the request's
            `context.workflow_tags` (decision **K5**).
          examples: [standard-fix]
        routed_model:
          type: string
          minLength: 1
          maxLength: 128
          description: |-
            Which model it should run on — always one of the request's
            `context.model_defaults` values (decision **K6**).
          examples: [claude-fable-5]
        breakdown:
          $ref: "#/components/schemas/Breakdown"
          description: The *AI Work Breakdown* panel's numbers.
        risk:
          type: string
          enum: [low, medium, high]
          description: |-
            How likely the change is to break something — the regression-risk meter's
            level, and K.2's other CHECK constraint.
          examples: [low]
        risk_note:
          type: string
          minLength: 1
          maxLength: 1024
          description: |-
            The sentence under the meter, saying why. Required and non-empty: a risk level
            with no rationale is a colour nobody can argue with, and this is the field a
            reviewer reads before overriding an estimate.
          examples: [Isolated to the I²C driver path; full HIL coverage exists for bus recovery.]
        trace:
          $ref: "#/components/schemas/Trace"
          description: What produced the estimate, and from what.

    EdgeRef:
      type: object
      title: EdgeRef
      description: |-
        An edge, named the way the document names one — by its ordered pair. A document allows
        at most one edge per pair, so the pair is an edge's identity and what the canvas keys it
        by.
      additionalProperties: false
      required: [from, to]
      properties:
        from:
          type: string
          description: The id of the node the edge leaves.
          examples: [effort-recheck]
        to:
          type: string
          description: The id of the node the edge arrives at.
          examples: [plan]

    WorkflowFinding:
      type: object
      title: WorkflowFinding
      description: |-
        One thing wrong with a definition, anchored where the canvas can select it — the DSL's
        own diagnostic (`docs/WORKFLOW_DSL.md` § 8) with its node anchor spelled `node_id`.
        `node_id` and `edge` are omitted, never `null`, when a finding has no such anchor: a
        finding about the document as a whole and one whose anchor failed to resolve are not
        the same payload.
      additionalProperties: false
      required: [code, message, path]
      properties:
        code:
          type: string
          minLength: 1
          description: |-
            Which rule broke — one of the DSL's error codes, the vocabulary both validators
            share. What a caller branches on.
          examples: [node.unreachable]
        message:
          type: string
          minLength: 1
          description: What a person should read. Presentation, never contract.
          examples: [No path of edges reaches this stage from the trigger.]
        path:
          type: string
          description: An RFC 6901 JSON Pointer to the offending value; `""` is the document itself.
          examples: [/nodes/2]
        node_id:
          type: string
          description: The id of the node the finding anchors to.
          examples: [orphan]
        edge:
          $ref: "#/components/schemas/EdgeRef"
          description: The edge the finding anchors to.

    WorkflowValidateRequest:
      type: object
      title: WorkflowValidateRequest
      description: |-
        The body of a `POST /v0/workflows/validate` request. Closed — a property not listed here
        is refused rather than dropped.
      additionalProperties: false
      required: [definition]
      properties:
        definition:
          description: |-
            The definition exactly as it is stored — a P.2 document
            (`schemas/workflow-dsl/v1.json`). Any JSON value is accepted here, because whether it
            is a workflow is the validator's question: a value that is not one is answered with a
            `document.malformed` finding rather than refused.

    WorkflowValidation:
      type: object
      title: WorkflowValidation
      description: The body of a `POST /v0/workflows/validate` response.
      additionalProperties: false
      required: [findings]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFinding"
          description: |-
            Every error, in document order — by path, numeric segments compared as numbers.
            Empty is the green verdict; there is no separate flag.

    TicketEstimate:
      type: object
      title: TicketEstimate
      description: The part of a ticket's latest estimate a predicate reads.
      additionalProperties: false
      required: [effort]
      properties:
        effort:
          type: string
          enum: [xs, s, m, l, xl]
          description: How much work it is, in `issue_estimates.effort`'s vocabulary.
          examples: [m]

    DryRunTicket:
      type: object
      title: DryRunTicket
      description: |-
        The ticket a dry run is about, and as much of it as a predicate can test: the three
        things the trigger's conditions and the DSL's predicates read, plus the key every
        explanation names the ticket by. Nothing is fetched — the engine holds no tickets, and a
        simulator that went looking for one would be making provider calls.
      additionalProperties: false
      required: [external_key, source, labels, estimate]
      properties:
        external_key:
          type: string
          minLength: 1
          maxLength: 255
          description: The display form, as V030's `tickets.external_key` holds it.
          examples: ["#485"]
        source:
          type: string
          enum: [github, gitlab, jira, linear]
          description: Which kind of tracker the ticket came from, as `ticket_sources.kind` spells it.
          examples: [github]
        labels:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 255
          description: |-
            The tracker's label names — V030's bounds — compared exactly as the tracker spells
            them.
          examples: [[bug, i2c, watchdog, priority-high]]
        estimate:
          oneOf:
            - $ref: "#/components/schemas/TicketEstimate"
            - type: "null"
          description: |-
            The latest estimate, or `null` for a ticket nobody has sized. Required rather than
            optional, so *unsized* is something the caller states. An unsized ticket satisfies
            no effort comparison.

    WorkflowDryRunRequest:
      type: object
      title: WorkflowDryRunRequest
      description: The body of a `POST /v0/workflows/dry-run` request. Closed.
      additionalProperties: false
      required: [definition, ticket]
      properties:
        definition:
          description: |-
            The definition to walk, exactly as it is stored. Validated first, by the same
            validator `POST /v0/workflows/validate` answers with.
        ticket:
          $ref: "#/components/schemas/DryRunTicket"
          description: The ticket to walk it for.

    PredicateEvaluation:
      type: object
      title: PredicateEvaluation
      description: One predicate — a trigger's conditions, a fork's test, an edge's condition — tested against the ticket.
      additionalProperties: false
      required: [holds, assumed, explanation]
      properties:
        holds:
          type: boolean
          description: Whether it holds.
          examples: [true]
        assumed:
          type: boolean
          description: |-
            `true` when the predicate reads what only a run produces — check results — and
            `holds` is the simulator's stated green-path assumption rather than a fact about the
            ticket.
          examples: [false]
        explanation:
          type: string
          minLength: 1
          description: Why, in one sentence.
          examples: ["#485 is effort M, and M ≤ M."]

    DryRunEdge:
      type: object
      title: DryRunEdge
      description: One edge out of a stage on the walk, and what the walk did with it.
      additionalProperties: false
      required: [from, to, kind, label, outcome, explanation, evaluation, max_retries]
      properties:
        from:
          type: string
          description: The id of the stage the edge leaves.
          examples: [effort-recheck]
        to:
          type: string
          description: The id of the stage it arrives at.
          examples: [back-to-queue]
        kind:
          type: string
          enum: [default, branch, loop]
          description: The edge's kind, as the document says.
          examples: [branch]
        label:
          type: [string, "null"]
          description: What the canvas prints beside it, or `null`.
          examples: ["> M ↘"]
        outcome:
          type: string
          enum: [taken, not_taken, loop]
          description: |-
            Whether the walk followed it. `loop` is its own outcome: a loop is reported with its
            retry bound and never walked, which is a different statement from *this branch's
            condition does not hold*.
          examples: [not_taken]
        explanation:
          type: string
          minLength: 1
          description: |-
            Why, in a sentence or two. For a branch that is not taken, this is the road not
            taken, explained.
          examples: ["Not taken: #485 is effort M, and M is not > M."]
        evaluation:
          oneOf:
            - $ref: "#/components/schemas/PredicateEvaluation"
            - type: "null"
          description: The edge's condition tested against the ticket, or `null` when it has none.
        max_retries:
          type: [integer, "null"]
          minimum: 0
          description: |-
            For a loop, the retry bound — the `limits.max_retries` of the model stage it returns
            to. `null` for every other edge, and for a loop into a stage that declares no limit.
          examples: [2]

    DryRunStep:
      type: object
      title: DryRunStep
      description: One stage the walk reached, in the order it reached them.
      additionalProperties: false
      required: [node_id, type, title, verdict, annotation, evaluation, edges]
      properties:
        node_id:
          type: string
          description: The stage's id.
          examples: [effort-recheck]
        type:
          type: string
          enum: [trigger, llm, infra, flow, term]
          description: Which of the DSL's five node types it is.
          examples: [flow]
        title:
          type: string
          description: What the canvas prints as its name.
          examples: [Effort re-check]
        verdict:
          type: string
          enum: [matched, not_matched, reached, halted, ended]
          description: |-
            What the walk concluded: `matched` or `not_matched` for the trigger, `ended` for a
            terminal, `reached` for a stage the walk left, and `halted` for one no edge out of
            which is taken.
          examples: [reached]
        annotation:
          type: string
          minLength: 1
          description: |-
            What the stage would do or require — a gate's requirements, a model stage's routing
            and limits — always said without doing it.
          examples: ["A decision on: effort ≤ M. Every branch out of it is reported, taken or not."]
        evaluation:
          oneOf:
            - $ref: "#/components/schemas/PredicateEvaluation"
            - type: "null"
          description: The trigger's conditions or a fork's predicate, tested; `null` for any other stage.
        edges:
          type: array
          items:
            $ref: "#/components/schemas/DryRunEdge"
          description: Every edge out of the stage, in document order, each with its outcome.

    NodeVerdict:
      type: object
      title: NodeVerdict
      description: What the walk concluded about one stage, walked or not.
      additionalProperties: false
      required: [node_id, verdict, explanation]
      properties:
        node_id:
          type: string
          description: The stage's id.
          examples: [back-to-queue]
        verdict:
          type: string
          enum: [matched, not_matched, reached, halted, ended, not_reached]
          description: A step's verdict for a stage the walk reached, and `not_reached` for one it did not.
          examples: [not_reached]
        explanation:
          type: string
          minLength: 1
          description: Why — naming the stage that reached it, or the edge that did not.
          examples: ["Reached from `issue-queued`."]

    WorkflowDryRun:
      type: object
      title: WorkflowDryRun
      description: The body of a `POST /v0/workflows/dry-run` response.
      additionalProperties: false
      required: [findings, steps, verdicts, highlight_path]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowFinding"
          description: |-
            The definition's errors. Non-empty means it did not validate and nothing was walked,
            so the three lists beside it are empty.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/DryRunStep"
          description: The ordered walk.
        verdicts:
          type: array
          items:
            $ref: "#/components/schemas/NodeVerdict"
          description: One verdict per stage, in document order.
        highlight_path:
          type: array
          items:
            $ref: "#/components/schemas/EdgeRef"
          description: |-
            Every edge the walk took, in the order it took them — the segments the canvas draws
            in the accent treatment.

    PlanningContext:
      type: object
      title: PlanningContext
      description: |-
        What the installation has, told to the engine rather than assumed by it — decision
        **K5**, the same shape `EstimationContext` states it in. A workflow tag is an opaque
        string this service ascribes no meaning to, and the set of them belongs to the
        installation, so the caller sends them and a batch naming anything outside them is
        refused before it leaves the engine.
      additionalProperties: false
      required: [workflow_tags, milestone, local_key_prefix]
      properties:
        workflow_tags:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: |-
            Every workflow tag the installation has, as the mockup's draft rows show one.
            Required and non-empty: `suggested_workflow` is required, so a request offering no
            tags has no batch this contract can answer with. **The order matters** and it is
            the caller's — the first tag is what a draft with no marker of its own takes,
            because a service that ascribes a tag no meaning has no other way to rank them.
          examples: [[feature-loop, hil-verify, docs-loop, standard-fix]]
        milestone:
          type: [string, "null"]
          maxLength: 255
          description: |-
            Which milestone the batch is for — the mockup's *Milestone: Helios 2.1*. Opaque:
            this service neither resolves it nor checks that it exists. `null` for a batch
            drafted without one, which the caller states rather than implies by omitting it.
          examples: [Helios 2.1]
        local_key_prefix:
          type: string
          pattern: "^[A-Z][A-Z0-9]{0,11}$"
          description: |-
            What the batch's own keys are prefixed with — `OTA` for the mockup's `OTA-1…6`.
            The caller's choice, because a local key is a name inside one batch and this
            service has no basis for inventing one.
          examples: [OTA]

    PlanRequest:
      type: object
      title: PlanRequest
      description: |-
        The body of a `POST /v0/plan` request. The split between the first two fields is the
        whole of decision **N2**: the narrative is the outcome somebody described, and the
        outline is the structure they were willing to commit to. A planner with both can
        decompose the work deterministically; a planner with only the first **cannot**, and
        the honest answer to that is one draft and a note. Closed — a property not listed here
        is refused rather than dropped.
      additionalProperties: false
      required: [narrative, outline, context]
      properties:
        narrative:
          type: string
          minLength: 1
          maxLength: 16384
          description: |-
            The outcome, in the author's own words — the page's *Describe the outcome, not the
            tasks*. Required and non-empty: it is the thing being planned, and an outline
            without one is a list of tasks nobody stated a reason for.
          examples:
            - "We need OTA updates to survive power loss mid-flash: staged A/B partitions, checksum verification before swap, automatic rollback, and a recovery beacon over BLE if both slots are bad."
        outline:
          type: [string, "null"]
          maxLength: 32768
          description: |-
            The structure, as a markdown outline. `null` for a request that offers none, which
            is a supported request rather than a malformed one — see the operation's
            description for what that answers with. A top-level bullet is a ticket, anything
            indented under it is that ticket's body, `blocks:`/`after:` are dependency edges, a
            numbered list is a sequence, and a `[marker]` is a workflow hint.
          examples:
            - "- Partition table for A/B slots  blocks: OTA-3\n- Checksum verification before commit  [hil-verify]"
        context:
          $ref: "#/components/schemas/PlanningContext"
          description: The vocabulary a batch may use, and the prefix its keys carry.

    Draft:
      type: object
      title: Draft
      description: |-
        One drafted ticket — a row of the mockup's *DRAFT — 6 TICKETS* list. Deliberately
        **not** a ticket: nothing has been created anywhere, and a draft exists before any
        tracker knows about it (decision **N1**). It carries no size, because decision **N3**
        sends drafts through the same estimation pipeline every other ticket uses.
      additionalProperties: false
      required: [local_key, title, body, suggested_workflow, dependencies]
      properties:
        local_key:
          type: string
          pattern: "^[A-Z][A-Z0-9]{0,11}-[1-9][0-9]{0,3}$"
          description: |-
            The batch's own name for this draft. Unique within the batch and the only thing
            `dependencies` may name. It means nothing outside the batch it was drafted in —
            the tracker's number does not exist until the batch is pushed — and it is assigned
            by position rather than by content, so the same input re-keys identically.
          examples: [OTA-3]
        title:
          type: string
          minLength: 1
          maxLength: 256
          description: |-
            One line — the mockup's `ttl` column, and what becomes the issue title on push.
          examples: [Rollback state machine on failed boot confirmation]
        body:
          type: string
          maxLength: 65536
          description: |-
            What becomes the issue body. **Empty is a real answer**: an outline bullet with no
            detail under it has nothing more to say, and an empty body is honest where an
            invented paragraph would not be. Present as `""` rather than omitted, for the
            reason `breakdown.files` is `[]` rather than absent — a missing key reads as an
            older schema.
          examples: ["- restore the previous slot\n- emit a telemetry event"]
        suggested_workflow:
          type: string
          minLength: 1
          maxLength: 64
          description: |-
            Which workflow should run it — the mockup's `tag` chip. Always one of the
            `workflow_tags` the request offered.
          examples: [feature-loop]
        dependencies:
          type: array
          maxItems: 64
          items:
            type: string
            pattern: "^[A-Z][A-Z0-9]{0,11}-[1-9][0-9]{0,3}$"
          description: |-
            The local keys this draft is **blocked by**, in batch order. The mockup's
            `blocks OTA-3` note on `OTA-1` is this list on `OTA-3` — the direction the
            dependency table stores and the direction GitHub's own `dependencies/blocked_by`
            takes. Every key is one of the batch's own; an edge pointing outside it is refused
            rather than returned.
          examples: [[OTA-1, OTA-2]]

    Plan:
      type: object
      title: Plan
      description: |-
        The body of a `POST /v0/plan` response — one draft batch, and what produced it. The
        shape AN.1 ([#289](https://github.com/NobuData/ouroboros/issues/289)) answers with
        too, unchanged, which is what `schemas/plan/v0.json` exists to keep checkable.
      additionalProperties: false
      required: [drafts, planner, notes]
      properties:
        drafts:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/Draft"
          description: |-
            The batch, in the order the page lists it. At least one: a planner that could not
            decompose the work answers with the whole of it as a single draft, never with an
            empty batch.
        planner:
          type: string
          minLength: 1
          maxLength: 64
          description: |-
            What produced this batch — `outline-v0` for the parser, `llm-v1 · <model>` when
            AN.1 lands. **Decision K10**: required and non-empty, so a batch that cannot say
            what produced it does not get past the contract boundary. A reader branches on
            this rather than on which build answered, and the page renders it rather than a
            hard-coded estimator version.
          examples: [outline-v0]
        notes:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 512
          description: |-
            Sentences for the person who asked, rendered as designed guidance rather than as
            an error. This is where a planner says what it did **not** do: a narrative it
            could not split, an annotation naming a key that is not in the batch, a marker
            matching no workflow, an edge it inferred from a numbered list. Empty when there
            is nothing to say.
          examples:
            - ["Add a structured outline to split this into multiple tickets, or wait for the full planner."]

    LearnRef:
      type: object
      title: LearnRef
      description: |-
        One typed provenance reference — a row a fact was learned from. The vocabulary is
        `ouroboros-db`'s `fact_provenance_typed` (V071, widened by V074 for #412) minus `import`,
        which names a file and is the rule-file import's alone. Closed.
      additionalProperties: false
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [run, pull_request, ticket, classification, waiver, steer, run_stage, gate, person]
          examples: [pull_request]
        id:
          type: string
          minLength: 1
          maxLength: 255
          description: The row's canonical uuid, or a person's user id for `person`.
          examples: [a7150000-0000-0000-0000-000000000498]

    LearnSource:
      type: object
      title: LearnSource
      description: One thing the loop wrote, offered for extraction. Closed.
      additionalProperties: false
      required: [kind, label, text, refs]
      properties:
        kind:
          type: string
          enum: [pr_review_cycle, run_observation, correction_note, waiver, steer]
          description: |-
            What it is. The first two are BH.1's sources; the last three are the deterministic
            proposers' own, carried so an extractor may read them too.
          examples: [pr_review_cycle]
        label:
          type: string
          minLength: 1
          maxLength: 200
          description: How a provenance line names it.
          examples: ["PR #498 review cycle"]
        text:
          type: string
          minLength: 1
          maxLength: 16384
          description: The source's text, as people wrote it.
        refs:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/LearnRef"
          description: The rows it stands for. Every ref a candidate cites comes from here.

    LearnContext:
      type: object
      title: LearnContext
      description: What the candidates are for, and what already exists. Closed.
      additionalProperties: false
      required: []
      properties:
        repo:
          type: [string, "null"]
          maxLength: 255
          default: null
          description: "`owner/name` the facts would be scoped to, or `null` for the workspace."
          examples: [acme-robotics/helios-firmware]
        existing_facts:
          type: array
          maxItems: 500
          default: []
          items:
            type: string
            minLength: 1
            maxLength: 500
          description: |-
            Facts the caller already holds, in any status — a hint an extractor may use to
            avoid restating them. The caller dedupes again regardless.

    LearnRequest:
      type: object
      title: LearnRequest
      description: The body of a `POST /v0/learn` request — a source bundle. Closed.
      additionalProperties: false
      required: [sources, context]
      properties:
        sources:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: "#/components/schemas/LearnSource"
        context:
          $ref: "#/components/schemas/LearnContext"

    LearnProvenance:
      type: object
      title: LearnProvenance
      description: What a candidate's fact will be stored with. Closed.
      additionalProperties: false
      required: [line, refs]
      properties:
        line:
          type: string
          minLength: 1
          maxLength: 200
          description: The card's line — honest about the extraction that produced it.
          examples: ["from PR #498 review cycle"]
        refs:
          type: array
          maxItems: 16
          items:
            $ref: "#/components/schemas/LearnRef"
          description: The rows it learned from — each one of its source's refs.

    LearnCandidate:
      type: object
      title: LearnCandidate
      description: |-
        One fact an extractor offers. It lands `proposed` in `ouroboros-rest` — there is no
        field to say otherwise (decision **K3**). Closed.
      additionalProperties: false
      required: [text, category, confidence, source_index, provenance]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 200
          description: The fact, inline-code spans verbatim.
        category:
          type: string
          enum: [convention, environment, limitation, instruction]
          examples: [convention]
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: The extractor's confidence.
          examples: [0.82]
        source_index:
          type: integer
          minimum: 0
          maximum: 31
          description: Which of the request's sources it came from, 0-based.
          examples: [0]
        provenance:
          $ref: "#/components/schemas/LearnProvenance"

    Learned:
      type: object
      title: Learned
      description: The body of a `POST /v0/learn` response — candidates, and what produced them. Closed.
      additionalProperties: false
      required: [candidates, extractor, notes]
      properties:
        candidates:
          type: array
          maxItems: 64
          items:
            $ref: "#/components/schemas/LearnCandidate"
          description: What was learned. Empty is a real answer.
        extractor:
          type: string
          minLength: 1
          maxLength: 64
          description: |-
            What produced the candidates — `unavailable-v0` today, BH.1's `llm-v1` later.
            Decision **K10**: required and non-empty.
          examples: [unavailable-v0]
        notes:
          type: array
          maxItems: 16
          items:
            type: string
            minLength: 1
            maxLength: 512
          description: Sentences for an operator — why nothing was extracted, say.
          examples: [[]]

    Error:
      type: object
      title: Error
      description: |-
        The shape every error in this service is reported in — the same envelope
        `ouroboros-rest` answers a browser with (`docs/ARCHITECTURE.md` § 5.3), so a
        failure crossing the gateway does not change form on the way out.
      additionalProperties: false
      required: [code, message, details]
      properties:
        code:
          type: string
          description: |-
            Stable, machine-readable, and the thing a caller branches on. Derived from the
            status rather than invented per call site, so a failure this service has never
            answered with still carries an honest code.
          examples: [validation_failed]
        message:
          type: string
          description: |-
            Written for a person. Never an exception's text and never a stack: anything
            `5xx` carries one constant sentence, because the real diagnosis names the
            inside of this process and belongs in a log an operator reads.
          examples: [The request is not valid. See `details` for each field.]
        details:
          type: object
          description: |-
            Whatever is specific to this failure — for a `422`, one entry per field that
            was refused, keyed the way the caller wrote it and carrying every message about
            it. Empty rather than absent when there is none, so reading `details.task_kind`
            never has to check `details` first.
          examples: [{}]

    CatalogEntry:
      type: object
      title: CatalogEntry
      description: One stage type of the catalog (R.3), as the copilot is told about it.
      additionalProperties: false
      required: [type, label]
      properties:
        type:
          type: string
          enum: [trigger, llm, infra, flow, term]
        label:
          type: string
          minLength: 1
          maxLength: 80
        summary:
          type: string
          maxLength: 400
          default: ""

    GuardEntry:
      type: object
      title: GuardEntry
      description: One guard the workspace's enforcement planes honour — an org-policy rule id.
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          examples: [spend_guard]
        description:
          type: string
          maxLength: 400
          default: ""

    CopilotContext:
      type: object
      title: CopilotContext
      description: |-
        What grounds a turn: the shared draft as stored, and the names that exist. A skill or
        task the copilot names outside these lists does not resolve (decision W7), and the
        prompt tells it to say so.
      additionalProperties: false
      required: []
      properties:
        draft:
          type: [object, "null"]
          default: null
          description: The draft document (WF-P.3), or null before the first operation.
        draft_label:
          type: string
          minLength: 1
          maxLength: 32
          default: v0.0
          description: The draft's revision as the head prints it — `v0.3`.
        catalog:
          type: array
          maxItems: 32
          default: []
          items:
            $ref: "#/components/schemas/CatalogEntry"
        skills:
          type: array
          maxItems: 500
          default: []
          items: {type: string}
          description: Every skill slug the registry holds (BF.1).
        tasks:
          type: array
          maxItems: 200
          default: []
          items: {type: string}
          description: Every task kind the routing table has a route for (Z.1).
        guards:
          type: array
          maxItems: 32
          default: []
          items:
            $ref: "#/components/schemas/GuardEntry"

    ToolCall:
      type: object
      title: ToolCall
      description: One call a previous copilot reply made, as the transcript records it.
      additionalProperties: false
      required: [id, tool]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 32
          examples: [call-1]
        tool:
          type: string
          minLength: 1
          maxLength: 64
        arguments:
          type: object
          default: {}

    UserTurn:
      type: object
      title: UserTurn
      description: Something the person said — a typed message, or a chip they chose.
      additionalProperties: false
      required: [role, text]
      properties:
        role:
          type: string
          const: user
        text:
          type: string
          minLength: 1
          maxLength: 20000

    CopilotTurn:
      type: object
      title: CopilotTurn
      description: A reply the copilot already gave, with the calls it made.
      additionalProperties: false
      required: [role]
      properties:
        role:
          type: string
          const: copilot
        text:
          type: string
          maxLength: 200000
          default: ""
        tool_calls:
          type: array
          maxItems: 64
          default: []
          items:
            $ref: "#/components/schemas/ToolCall"

    ToolResultTurn:
      type: object
      title: ToolResultTurn
      description: |-
        What `ouroboros-rest` answered one call with. A bounced operation is `ok: false` with
        the validator's message as `content` — the self-correction loop's whole feedback.
      additionalProperties: false
      required: [role, call_id, ok, content]
      properties:
        role:
          type: string
          const: tool
        call_id:
          type: string
          minLength: 1
          maxLength: 32
        ok:
          type: boolean
        content:
          type: string
          maxLength: 200000

    CopilotTurnRequest:
      type: object
      title: CopilotTurnRequest
      description: The body of a `POST /v0/copilot-workflow` request. Closed.
      additionalProperties: false
      required: [alias, session, context, transcript]
      properties:
        alias:
          type: string
          minLength: 1
          maxLength: 64
          description: The routing alias the `copilot-workflow` task kind resolved to.
          examples: [coder-max]
        session:
          type: string
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: The copilot session the invocation is attributed to.
        resolution_version:
          type: [string, "null"]
          minLength: 1
          maxLength: 32
          default: null
        cost_cap_cents:
          type: [integer, "null"]
          minimum: 0
          default: null
        context:
          $ref: "#/components/schemas/CopilotContext"
        transcript:
          type: array
          minItems: 1
          maxItems: 400
          description: The conversation so far, oldest first.
          items:
            oneOf:
              - $ref: "#/components/schemas/UserTurn"
              - $ref: "#/components/schemas/CopilotTurn"
              - $ref: "#/components/schemas/ToolResultTurn"
            discriminator:
              propertyName: role
              mapping:
                user: "#/components/schemas/UserTurn"
                copilot: "#/components/schemas/CopilotTurn"
                tool: "#/components/schemas/ToolResultTurn"

    CopilotDelta:
      type: object
      title: CopilotDelta
      description: A fragment of reply text, as the model wrote it.
      additionalProperties: false
      required: [kind, text]
      properties:
        kind:
          type: string
          const: delta
        text:
          type: string

    CopilotToolCall:
      type: object
      title: CopilotToolCall
      description: |-
        A structured call the parser recovered from the reply — validated against the
        manifest, or carrying `error` (written for the model) and no `arguments` when it did
        not validate.
      additionalProperties: false
      required: [kind, id, tool]
      properties:
        kind:
          type: string
          const: tool_call
        id:
          type: string
          examples: [call-1]
        tool:
          type: string
          examples: [add_stage]
        arguments:
          type: [object, "null"]
          default: null
        error:
          type: [string, "null"]
          default: null

    CopilotUsage:
      type: object
      title: CopilotUsage
      description: What one hop of the invocation metered — the gateway's `usage`, forwarded.
      additionalProperties: false
      required: [kind, input_tokens, output_tokens, model, connection]
      properties:
        kind:
          type: string
          const: usage
        input_tokens:
          type: integer
          minimum: 0
        output_tokens:
          type: integer
          minimum: 0
        cost_cents:
          type: [number, "null"]
          minimum: 0
          default: null
          description: Null when nothing prices the model — unpriced, never free.
        model:
          type: string
        connection:
          type: string

    CopilotError:
      type: object
      title: CopilotError
      description: A turn that could not be completed.
      additionalProperties: false
      required: [kind, code, message]
      properties:
        kind:
          type: string
          const: error
        code:
          type: string
          examples: [gateway_unavailable]
        message:
          type: string

    CopilotDone:
      type: object
      title: CopilotDone
      description: The turn finished.
      additionalProperties: false
      required: [kind, finish_reason]
      properties:
        kind:
          type: string
          const: done
        finish_reason:
          type: string
          examples: [stop]

    AnalyzerSetEntry:
      type: object
      title: AnalyzerSetEntry
      description: One installed analyzer. Closed.
      additionalProperties: false
      required: [id, version, kind]
      properties:
        id:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,62}$"
          examples: [change_point]
        version:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [deterministic, llm]

    AnalyzerSet:
      type: object
      title: AnalyzerSet
      description: |-
        The installed analyzers — `analysis_runs.analyzer_set` exactly (`V080`). Closed.
      additionalProperties: false
      required: [label, analyzers]
      properties:
        label:
          type: string
          minLength: 1
          description: What *Analyzed by* renders.
          examples: [deterministic analyzers v1]
        analyzers:
          type: array
          items:
            $ref: "#/components/schemas/AnalyzerSetEntry"

    Corpus:
      type: object
      title: Corpus
      description: |-
        One repository's snapshotted history, as an analysis run reads it. Every source but
        `repo_ref` and `window` is optional, and **absent (`null` or missing) is not empty
        (`[]`)**: an analyzer whose required source is absent is `skipped`, never run on
        nothing. Every dated record must lie inside `window`; unknown keys are refused at
        every level. `rig_telemetry` is the read shape AJ.4
        ([#266](https://github.com/NobuData/ouroboros/issues/266)) must produce, and is absent
        until it does.
      additionalProperties: false
      required: [repo_ref, window]
      properties:
        repo_ref:
          type: string
          minLength: 1
          maxLength: 255
          examples: [acme-robotics/helios-firmware]
        window:
          type: object
          description: The corpus bounds, UTC dates, inclusive; `from` ≤ `to`.
          additionalProperties: false
          required: [from, to]
          properties:
            from: {type: string, format: date}
            to: {type: string, format: date}
        builds:
          type: [array, "null"]
          description: "The duration series — `{build_id, day, duration_seconds}` per succeeded build."
          items: {type: object}
        events:
          type: [array, "null"]
          description: "Attribution candidates — `{kind, day, label, ref: {kind, id}}`."
          items: {type: object}
        log_tails:
          type: [array, "null"]
          description: |-
            `{build_id, day, label, status, line_count, lines}` — each build's stored line count
            and only the tail of its log.
          items: {type: object}
        tests:
          type: [array, "null"]
          description: |-
            `{test_run_id, build_id, day, suite, platform, case_key, status, failure}` per case
            result; `status` is `passed`, `failed`, `flaky` or `skipped`.
          items: {type: object}
        flakes:
          type: [array, "null"]
          description: "`{case_key, score, state}` — current flake scores, not dated."
          items: {type: object}
        loops:
          type: [array, "null"]
          description: |-
            `{run_id, day, status, stages: [{key, attempts, seconds, outcome?}], events,
            event_bytes, workflow?, workflow_version_id?, merge_sha?, paths_touched?}` — stage
            timings and transcript statistics, never transcript bodies. The optional fields (#512)
            are `null` when the corpus does not carry them; a stage `outcome` is `passed`,
            `failed` or `flagged`.
          items: {type: object}
        cache:
          type: [array, "null"]
          description: "`{build_id, day, hits, misses}` — each build's ccache counters."
          items: {type: object}
        waivers:
          type: [array, "null"]
          description: "`{waiver_id, run_id, day, case_keys, reason}`."
          items: {type: object}
        series:
          type: [object, "null"]
          description: |-
            BI rollup rows by metric id — `{"build_duration": [{day, dimension, value, samples}]}`.
          additionalProperties:
            type: array
            items: {type: object}
        rig_telemetry:
          type: [array, "null"]
          description: "`{runner_id, day, metric, value}` — absent until AJ.4 lands."
          items: {type: object}
        jobs:
          type: [array, "null"]
          description: |-
            BV.3 ([#512](https://github.com/NobuData/ouroboros/issues/512)) — every finished farm
            job: `{build_id, day, label, status, commit_sha, git_ref, title, pool_id, queued_at,
            started_at, finished_at, config}`. Instants are timezone-aware, `queued_at` ≤
            `started_at` ≤ `finished_at`, and `day` is `finished_at`'s UTC date. `config` maps each
            option the build set to its value; `null` is unknown, `{}` is known and empty. Read by
            `config_usage`, `cache_window`, `queue_correlation` and `workflow_outcome`.
          items: {type: object}
        pools:
          type: [array, "null"]
          description: "BV.3 — `{pool_id, name, runner_ids}` — the runner pools and their runners now."
          items: {type: object}
        config_options:
          type: [array, "null"]
          description: |-
            BV.3 — `{name}` per configuration option the repository declares (a Kconfig symbol):
            what lets `config_usage` say *never set*.
          items: {type: object}
        sampling:
          type: [object, "null"]
          description: |-
            BV.3 — BV.1's per-source sampling record, keyed by source name:
            `{"log_tails": {sampled, rate, cap}}`. `rate` is 1 for a full read and in (0, 1) when
            `cap` (`max_builds`, `max_log_lines` or `compute_ceiling_seconds`) bound it. A source
            missing from it — or `sampling` itself absent — is *unknown*, and an absence claim
            over it is qualified (`config_usage`).
          additionalProperties:
            type: object

    AnalysisRequest:
      type: object
      title: AnalysisRequest
      description: The body of a `POST /v0/analysis/runs` request. Closed.
      additionalProperties: false
      required: [run_id, corpus]
      properties:
        run_id:
          type: string
          format: uuid
          description: The `analysis_runs` row this run is — logged, nothing else.
        corpus:
          $ref: "#/components/schemas/Corpus"
        compute_ceiling_seconds:
          type: [number, "null"]
          exclusiveMinimum: 0
          description: |-
            What is left of the run's compute ceiling after assembly, or `null` for none. Once
            the analyzers' summed time reaches it the rest are `not_run` and the report says
            `budget_exceeded`.

    AnalyzerStarted:
      type: object
      title: AnalyzerStarted
      description: An analyzer's sandbox is starting.
      additionalProperties: false
      required: [analyzer, version]
      properties:
        event:
          type: string
          const: started
        analyzer:
          type: string
        version:
          type: integer

    AnalyzerFinished:
      type: object
      title: AnalyzerFinished
      description: |-
        One analyzer's outcome, as soon as it is known: `{analyzer, version, status, findings,
        reason, error, elapsed_seconds}`. Each finding is one `analysis_findings` row (`V081`):
        `{analyzer, analyzer_version, finding_type, subject_key, data, evidence_refs, confidence,
        confidence_basis}`.
      additionalProperties: false
      required: [outcome]
      properties:
        event:
          type: string
          const: outcome
        outcome:
          type: object
          required: [analyzer, version, status]
          properties:
            analyzer: {type: string}
            version: {type: integer}
            status:
              type: string
              enum: [completed, skipped, failed, timed_out, memory_exceeded, not_run]
            findings:
              type: array
              items: {type: object}
            reason: {type: [string, "null"]}
            error: {type: [object, "null"]}
            elapsed_seconds: {type: number}

    AnalysisFinished:
      type: object
      title: AnalysisFinished
      description: The run's report — always the last line of a run that was not cut short.
      additionalProperties: false
      required: [budget_exceeded, failed]
      properties:
        event:
          type: string
          const: report
        budget_exceeded:
          type: boolean
        failed:
          type: array
          items: {type: string}

    CodeRepository:
      type: object
      title: CodeRepository
      description: Which repository, for which workspace, from where. Closed.
      additionalProperties: false
      required:
      - workspace
      - slug
      - remote
      properties:
        workspace:
          pattern: ^[A-Za-z0-9_-]{1,64}$
          type: string
        slug:
          maxLength: 201
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          type: string
        remote:
          maxLength: 2048
          minLength: 1
          type: string
        token:
          maxLength: 1024
          minLength: 1
          type:
          - string
          - 'null'
          default: null
    CloneInfo:
      type: object
      title: CloneInfo
      description: The clone an answer was read from. Closed.
      additionalProperties: false
      required:
      - repository
      - fetched_at
      - stale
      properties:
        repository:
          type: string
        fetched_at:
          format: date-time
          type: string
        stale:
          type: boolean
    CommitInfo:
      type: object
      title: CommitInfo
      description: The citable facts of one commit. Closed.
      additionalProperties: false
      required:
      - sha
      - committed_at
      - author
      - summary
      properties:
        sha:
          pattern: ^[0-9a-f]{40}$
          type: string
        committed_at:
          format: date-time
          type: string
        author:
          type: string
        summary:
          type: string
    Age:
      type: object
      title: Age
      description: How long something has gone unchanged, as the brief says it. Closed.
      additionalProperties: false
      required:
      - months
      - days
      - phrase
      properties:
        months:
          minimum: 0
          type: integer
        days:
          minimum: 0
          type: integer
        phrase:
          type: string
    BlameRequest:
      type: object
      title: BlameRequest
      description: '``blame(path, range)`` at a ref. Closed.'
      additionalProperties: false
      required:
      - repository
      - ref
      - path
      - start
      - end
      properties:
        repository:
          $ref: '#/components/schemas/CodeRepository'
        ref:
          maxLength: 255
          pattern: ^(?![-/.])(?!.*\.\.)(?!.*//)[A-Za-z0-9._/-]{1,255}(?<![/.])$
          type: string
        path:
          maxLength: 1024
          pattern: ^(?!.*(^|/)\.\.?(/|$))[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$
          type: string
        start:
          minimum: 1
          type: integer
        end:
          minimum: 1
          type: integer
    BlameHunk:
      type: object
      title: BlameHunk
      description: Consecutive lines last changed by one commit. Closed.
      additionalProperties: false
      required:
      - start
      - end
      - commit
      properties:
        start:
          type: integer
        end:
          type: integer
        commit:
