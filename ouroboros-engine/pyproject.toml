# ouroboros-engine — the Python backend.
#
# One manifest holds the dependencies, the task names, and the configuration for both
# tools (docs/CONVENTIONS.md § 3). uv resolves it into the committed uv.lock; CI runs
# `uv sync --locked`, so a lockfile that has drifted from this file fails the run
# instead of being silently refreshed.

[project]
name = "ouroboros-engine"
version = "0.3.1"
description = "Ouroboros backend — executes the work ouroboros-rest brokers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.52.1",
]

# `uv run dev` — the dev verb every module exposes (docs/CONVENTIONS.md § 3). uv
# installs this project into its environment, so the console script below is what that
# command resolves to. Production runs uvicorn against `ouroboros_engine.main:app`
# directly, without the reloader; the container that does so is #53.
#
# `uv run openapi` re-renders openapi.json from the authoritative openapi.yaml beside it
# (docs are spec-first — src/ouroboros_engine/openapi.py). `--check` reports drift
# without writing, which is what a hook or a pipeline wants; `uv run pytest` asserts the
# same thing, so CI already covers it.
[project.scripts]
dev = "ouroboros_engine.dev:main"
openapi = "ouroboros_engine.openapi:main"

[dependency-groups]
# Installed by a plain `uv sync` (PEP 735 default group), which is what CI and a
# developer both run. Nothing here reaches a production image.
dev = [
    # The HTTP client behind fastapi.testclient.TestClient. httpx2 rather than httpx:
    # starlette 1.x warns that the httpx backend is deprecated, and this suite treats a
    # warning as a failure.
    "httpx2>=2.10.0",
    # Asserts that openapi.yaml is a valid OpenAPI 3.1 document rather than merely valid
    # YAML. The specification is written by hand and published to a catalogue, so the
    # thing that would otherwise catch a malformed one is the upload.
    "openapi-spec-validator>=0.7.2",
    "pytest>=9.1.1",
    # Reads the authoritative openapi.yaml so `uv run openapi` can render the JSON the
    # service loads. Development-only on purpose: the served application parses JSON
    # with the standard library and never imports this.
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# src layout: the package is importable in tests only because it is installed, never
# because pytest happened to start in this directory.
[tool.hatch.build.targets.wheel]
packages = ["src/ouroboros_engine"]

# The API specification travels with the code. The service serves the committed document
# rather than generating one (src/ouroboros_engine/openapi.py), so a wheel without these
# two files is a service that cannot answer /openapi.json — they are put beside the
# module, which is the first place its loader looks. Both are committed at the module
# root, where a catalogue, a linter or a human expects to find them.
[tool.hatch.build.targets.wheel.force-include]
"openapi.yaml" = "ouroboros_engine/openapi.yaml"
"openapi.json" = "ouroboros_engine/openapi.json"

# ---------------------------------------------------------------------------
# ruff — lint and format, the Python half of docs/CONVENTIONS.md § 6
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py312"
# 88 columns and 4-space indent are what .editorconfig declares for *.py; the formatter
# has to agree with it rather than override it.
line-length = 88
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins — no shadowing a builtin
  "ARG", # flake8-unused-arguments
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle — every module, class and function carries a docstring
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort — import order
  "N",   # pep8-naming
  "PTH", # flake8-use-pathlib
  "RUF", # ruff's own rules
  "S",   # flake8-bandit — the security rules that do not need type inference
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
ignore = [
  # The formatter owns line breaks; a long URL or table in a docstring is not a defect.
  "E501",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests document themselves in their names and their assert messages; a docstring on
# every case is noise. `assert` is the point of a test, so S101 does not apply either,
# and S105/S106 flag the throwaway strings a test of the internal key is made of — a
# secret no deployment ever holds is not a hardcoded credential.
"tests/**/*.py" = ["D100", "D103", "S101", "S105", "S106"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers and --strict-config turn a typo in a marker or in this table into a
# failure rather than a silent no-op; -ra reports every non-passing outcome, so a skip
# that creeps in is visible in the CI log rather than folded into the dot line.
addopts = "-ra --strict-markers --strict-config"
# A warning is a failure. Deprecations in a dependency are the earliest signal that an
# upgrade will break this module, and the only way to keep them is to not let them pass.
filterwarnings = ["error"]
